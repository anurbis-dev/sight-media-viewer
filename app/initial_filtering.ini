# Sight - built-in scan filter (the default list under your own Ignore list).
# Same syntax as Settings > Scan Filtering > Ignore:
#   Thumbs.db, *.tmp   a file or folder name anywhere (* ? [..] globs)
#   .git/              folders only (trailing slash)
#   Library/Cache      that run of folders anywhere
#   # comment          case-insensitive, relative to each source folder
# Files are only skipped, never deleted; they come back when a pattern is removed.
# Deliberately NOT listed, because Sight can show them: *.log, *.ini, *.cfg, *.json, *.xml, *.txt,
# *.bin / *.obj / *.ply and every other image, video, audio, 3D, font, document and design extension.
# Without a trailing slash a pattern also matches FOLDER names, so only patterns that no media folder would be
# called are listed (no *.temp, *.bak, *.lock, *.download, *.o, *~: "Shots.bak/" must keep its images).
# When in doubt a pattern is left out.

# --- OS junk -------------------------------------------------------------------------------------
Thumbs.db
ehthumbs.db
desktop.ini
.DS_Store
._*
$RECYCLE.BIN/
System Volume Information/
.Trash*/
.Spotlight-V100/
.fseventsd/
.TemporaryItems/
.AppleDouble/

# --- Temporary / partial files -------------------------------------------------------------------
*.tmp
*.part
*.partial
*.crdownload
*.swp
*.swo

# --- Databases and shortcuts (nothing a viewer can show) -----------------------------------------
*.db
*.db-wal
*.db-shm
*.sqlite
*.sqlite3
*.lnk
*.url

# --- Dev / VCS / build folders and artifacts -----------------------------------------------------
.git/
.svn/
.hg/
node_modules/
__pycache__/
.idea/
.vscode/
*.pyc

# --- Sight's own data ----------------------------------------------------------------------------
.sight/

# --- Examples (off by default; copy to your own Ignore list) -------------------------------------
# Unity: *.meta is safe, but "Library/" is too broad for a generic media library.
# *.meta
# Library/
# Library/PackageCache
