      sub: `${n(e.tris)} tris` + (e.meshes.size > 1 ? ` · ${e.meshes.size} meshes` : "") + (texCount ? ` · ${texCount} tex` : "") };
  });
  const textures = texList.map((t, i) => {
    const img = t.tex.image || {};
    const w = img.width || img.videoWidth || 0, h = img.height || img.videoHeight || 0;
    const src = typeof img.src === "string" && !img.src.startsWith("blob:") && !img.src.startsWith("data:") ? decodeURIComponent(img.src.split(/[?#]/)[0].split("/").pop()) : "";

    return { tex: t.tex, mats: t.mats, name: t.tex.name || src || `${slots} ${i + 1}`, w, h,
      sub: (w && h ? `${w}×${h} · ` : "") + slots };

  const meshes = meshList;
  let maxTex = 0;
  for (const t of textures) maxTex = Math.max(maxTex, t.w, t.h);
  const box = new THREE.Box3().setFromObject(obj);
  const d = box.isEmpty() ? null : box.getSize(new THREE.Vector3());
  const f = (x) => Number(x.toPrecision(4)).toString();
  const summary = { id: aid, title: "Scene", rows: [
    ["Meshes", n(meshes.length)],
    ["Vertices", n(verts)],
    ["Triangles", n(tris)],
    ["Points", points ? n(points) : null],
    ["Materials", n(materials.length)],
    ["Textures", textures.length ? `${textures.length}` + (maxTex ? ` (largest ${maxTex}px)` : "") : "None"],
    ["UVs", hasUV ? (uv2 ? "Yes (2 sets)" : "Yes") : "None"],
    ["Vertex colors", vcol ? "Yes" : null],
    ["Skinned meshes", skinned || null],
    ["Morph targets", morphs || null],
    ["Animations", (obj.animations || []).length || null],
    ["Bounds", d ? `${f(d.x)} × ${f(d.y)} × ${f(d.z)}` : null],
  ] };

  // --- render-target readback (thumbnails, UV picture) ---
  const lut = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++){ const c = i / 255; lut[i] = Math.round(255 * (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055)); }

        out[di + 1] = encode ? lut[px[si + 1]] : px[si + 1];
        out[di + 2] = encode ? lut[px[si + 2]] : px[si + 2];

    }
    ctx.putImageData(data, 0, 0);
    return cv;
  }
  const quadFor = (tex, W, H) => {
    const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    const ar = W / H, iar = tex.image && tex.image.width && tex.image.height ? tex.image.width / tex.image.height : ar;
    q.scale.set(Math.min(1, iar / ar), Math.min(1, ar / iar) * (tex.flipY ? 1 : -1), 1);
    return q;
  };
  const camQ = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
  camQ.position.z = 1;

  // --- thumbnails ---
  const SIZE = 72;
  const thumbs = new Map();
  let queue = null, disposed = false, rt = null, env = null, ballScene = null, ball = null;
  const cam3 = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
  cam3.position.set(0, 0, 4.1);
  function setup(){
    rt = new THREE.WebGLRenderTarget(SIZE, SIZE, { samples: 4 });
    env = buildEnvTexture(THREE, renderer, ENV_PRESETS.studio);
    ballScene = new THREE.Scene();
    ballScene.environment = env;
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(-2, 2.5, 3);
    ballScene.add(key, new THREE.AmbientLight(0xffffff, env ? 0.15 : 0.8));
    ball = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24));
    ballScene.add(ball);
  }
  function renderOne(kind, i){
    if (kind === "mat"){
      const m = materials[i].rep;
      const use = m.vertexColors ? Object.assign(m.clone(), { vertexColors: false }) : m;
      ball.material = use;
      const url = renderToCanvas(ballScene, cam3, rt, SIZE, SIZE, true).toDataURL("image/png");
      if (use !== m) use.dispose();
      return url;
    }
    const t = textures[i].tex;
    const sc = new THREE.Scene(), q = quadFor(t, SIZE, SIZE);
    sc.add(q);
    const url = renderToCanvas(sc, camQ, rt, SIZE, SIZE, t.colorSpace === THREE.SRGBColorSpace).toDataURL("image/png");
    q.geometry.dispose();
    q.material.dispose();
    return url;
  }
  function makeThumbs(onEach){
    ins.onThumb = onEach;
    if (queue) return;
    queue = [...materials.map((_, i) => ["mat", i]), ...textures.map((_, i) => ["tex", i])].slice(0, 200);
    const step = () => {
      if (disposed || !queue.length) return;
      const [kind, i] = queue.shift();
      try {
        if (!rt) setup();
        const url = renderOne(kind, i);
        thumbs.set(kind + ":" + i, url);
        ins.onThumb?.(kind + ":" + i, url);
      } catch (err) { console.warn("inspector thumbnail failed", err); }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // --- selection -> affected meshes ---
  // [{ c, mats }]: mats = the material instances whose groups count, null = the whole mesh.
  function targets(sel){
    if (!sel) return meshes.map((m) => ({ c: m.c, om: m.om, mats: null }));
    if (sel.kind === "mesh"){ const m = meshes[sel.i]; return m ? [{ c: m.c, om: m.om, mats: null }] : []; }
    const set = sel.kind === "mat" ? materials[sel.i]?.mats : textures[sel.i]?.mats;
    if (!set) return [];
    return meshes.filter((m) => m.arr.some((x) => set.has(x))).map((m) => ({ c: m.c, om: m.om, mats: set }));
  }
  // World-space bounds as the model is right now (explode, turns and hidden meshes included),
  // null if empty. selBox: the selection's visible meshes; modelBox: every visible mesh. Either
  // falls back to all of its meshes when they are all hidden.
  function boxOf(list){
    const box = new THREE.Box3();
    for (const c of list) box.union(new THREE.Box3().setFromObject(c));
    return box.isEmpty() ? null : box;
  }
  const shown = (list) => (list.some((c) => c.visible) ? list.filter((c) => c.visible) : list);
  function selBox(){ return ins.sel ? boxOf(shown(targets(ins.sel).map((t) => t.c))) : null; }
  function modelBox(){ return boxOf(shown(meshes.map((m) => m.c))); }
  // Mesh visibility (H / Ctrl+H / Alt+H): "sel" hides the selected meshes, "others" hides every
  // mesh but the selected ones (and shows those), "none" shows everything. Whole meshes only — a
  // material selected on a multi-material mesh hides the mesh. Returns how many changed.
  function hide(mode){
    const sel = ins.sel ? new Set(targets(ins.sel).map((t) => t.c)) : null;
    if (mode !== "none" && !sel) return 0;
    let n = 0;
    for (const m of meshes){
      const vis = mode === "none" ? true : mode === "sel" ? m.c.visible && !sel.has(m.c) : sel.has(m.c);
      if (m.c.visible !== vis){ m.c.visible = vis; n++; }
    }
    return n;
  }
  const pick = (om, mats, layer, hiddenMat) => Array.isArray(om) ? om.map((m) => (!mats || mats.has(m) ? layer : hiddenMat)) : layer;

  // --- highlight ---
  // Blender's selection orange: the theme accent can be near-white and vanish on light textures.
  const accent = 0xff8a1f;
  const hlMat = new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: 0.5, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 });
  const hlWire = new THREE.MeshBasicMaterial({ color: accent, wireframe: true, transparent: true, opacity: 0.18, depthWrite: false });
  const hidden = new THREE.MeshBasicMaterial({ visible: false });
  let overlays = [];
  function clearHighlight(){
    for (const h of overlays) h.removeFromParent();
    overlays = [];
  }
  function select(sel){
    ins.sel = sel;
    clearHighlight();
    if (!sel || disposed) return;
    for (const { c, om, mats } of targets(sel)){
      for (const layer of [hlMat, hlWire]){
        const mat = pick(om, mats, layer, hidden);
        const h = c.isSkinnedMesh ? new THREE.SkinnedMesh(c.geometry, mat) : new THREE.Mesh(c.geometry, mat);
        if (c.isSkinnedMesh){ h.bind(c.skeleton, c.bindMatrix); h.bindMode = c.bindMode; }
        if (c.morphTargetInfluences){ h.morphTargetInfluences = c.morphTargetInfluences; h.morphTargetDictionary = c.morphTargetDictionary; }
        h.matrixAutoUpdate = false;
        h.frustumCulled = false;
        h.renderOrder = 10;
        h.updateMatrixWorld = () => {
          h.matrixWorld.copy(c.matrixWorld);
          if (h.isSkinnedMesh) h.bindMatrixInverse.copy(c.bindMatrixInverse);
        };
        h.updateWorldMatrix = h.updateMatrixWorld;
        scene.add(h);
        overlays.push(h);
      }
    }
  }

  // --- UV picture ---
  const uvShader = (color, alpha, wire) => new THREE.ShaderMaterial({
    wireframe: wire, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uFlip: { value: 1 }, uColor: { value: new THREE.Color(color) }, uAlpha: { value: alpha } },
    vertexShader: "attribute vec2 uvSel; uniform float uFlip; void main(){ vec2 p = uvSel * 2.0 - 1.0; p.y *= uFlip; gl_Position = vec4(p, 0.0, 1.0); }",
    fragmentShader: "uniform vec3 uColor; uniform float uAlpha; void main(){ gl_FragColor = vec4(uColor, uAlpha); }",
  });
  // Texture under the UVs, one channel at a time. sRGB textures arrive linear from the sampler and
  // the readback encodes back to sRGB, so R/G/B show the stored values; alpha is not colour-managed,
  // so it is pre-decoded here to survive that encode. RGBA composites over a checker.
  const CHAN = { rgb: 0, rgba: 1, r: 2, g: 3, b: 4, a: 5 };
  const bgShader = (tex, chan, srgb, W) => new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false,
    uniforms: { map: { value: tex }, uChan: { value: CHAN[chan] ?? 0 }, uSrgb: { value: srgb ? 1 : 0 }, uCell: { value: Math.max(8, Math.round(W / 32)) } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform sampler2D map; uniform int uChan; uniform float uSrgb; uniform float uCell; varying vec2 vUv;
      float lin(float c){ return c <= 0.04045 ? c / 12.92 : pow((c + 0.055) / 1.055, 2.4); }
      void main(){
        vec4 t = texture2D(map, vUv);
        float a = uSrgb > 0.5 ? lin(t.a) : t.a;
        vec2 q = floor(gl_FragCoord.xy / uCell);
        float ck = mod(q.x + q.y, 2.0) > 0.5 ? 0.18 : 0.06;
        vec3 c = t.rgb;
        if (uChan == 1) c = mix(vec3(uSrgb > 0.5 ? ck : sqrt(ck)), t.rgb, t.a);
        else if (uChan == 2) c = vec3(t.r);
        else if (uChan == 3) c = vec3(t.g);
        else if (uChan == 4) c = vec3(t.b);
        else if (uChan == 5) c = vec3(a);
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  // A light geometry per (mesh, UV set) that shares the mesh's buffers but exposes the chosen set as
  // "uvSel". Cached for the viewer's lifetime and never disposed: disposing a geometry frees the GL
  // buffers of its attributes, which the model itself still uses (the context goes with the viewer).
  const UV_NAMES = ["uv", "uv1", "uv2", "uv3"];
  const uvCount = (g) => { let k = 0; while (k < UV_NAMES.length && g.attributes[UV_NAMES[k]]) k++; return k; };
  const uvGeo = new Map();
  function uvGeometry(c, set){
    const key = c.uuid + ":" + set;
    let g = uvGeo.get(key);
    if (!g){
      const src = c.geometry;
      g = new THREE.BufferGeometry();
      if (src.index) g.setIndex(src.index);
      g.setAttribute("position", src.attributes.position);
      g.setAttribute("uvSel", src.attributes[UV_NAMES[set]]);
      for (const gr of src.groups) g.addGroup(gr.start, gr.count, gr.materialIndex);
      uvGeo.set(key, g);
    }
    return g;
  }
  const gltf = [".glb", ".gltf"].includes((assetById(aid)?.ext || "").toLowerCase());
  async function renderUV(sel, chan){
    if (disposed || !hasUV) return null;
    const list = targets(sel).filter((t) => t.c.geometry.attributes.uv);
    if (!list.length) return null;
    const sets = Math.max(...list.map((t) => uvCount(t.c.geometry)));
    const set = Math.min(ins.uvSet || 0, sets - 1);
    // Background: the selection's base color (or the texture itself); with nothing selected, the
    // model's base color only if it has exactly one material.
    let bg = null;
    if (sel?.kind === "tex") bg = textures[sel.i]?.tex;
    else if (sel?.kind === "mat") bg = materials[sel.i]?.rep.map;
    else if (sel?.kind === "mesh") bg = meshes[sel.i]?.arr.find((m) => m.map)?.map;
    else if (materials.length === 1) bg = materials[0].rep.map;
    bg = bg || null;
    const iw = bg?.image?.width || 0, ih = bg?.image?.height || 0;
    const big = Math.min(4096, Math.max(2048, iw, ih));
    const W = iw && ih ? Math.round(iw >= ih ? big : big * iw / ih) : big;
    const H = iw && ih ? Math.round(ih >= iw ? big : big * ih / iw) : big;
    const target = new THREE.WebGLRenderTarget(W, H);
    const sc = new THREE.Scene();
    sc.background = null;
    const tmp = [];
    const srgb = !bg || bg.colorSpace === THREE.SRGBColorSpace;
    if (bg){
      const q = quadFor(bg, W, H);
      q.material.dispose();
      q.material = bgShader(bg, chan, srgb, W);
      q.renderOrder = 0;
      sc.add(q);
      tmp.push(q);
    } else {
      const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: 0x2a2a30 }));
      sc.add(q);
      tmp.push(q);
    }
    const vTop = bg ? !bg.flipY : gltf;
    const color = sel ? accent : 0xffffff;
    const fill = uvShader(color, sel ? 0.14 : 0.06, false), wire = uvShader(color, sel ? 0.9 : 0.55, true);
    for (const m of [fill, wire]) m.uniforms.uFlip.value = vTop ? -1 : 1;
    const hiddenUV = new THREE.MeshBasicMaterial({ visible: false });
    for (const { c, om, mats } of list){
      if (uvCount(c.geometry) <= set) continue; // this mesh has no such set
      for (const [layer, order] of [[fill, 1], [wire, 2]]){
        const me = new THREE.Mesh(uvGeometry(c, set), pick(om, mats, layer, hiddenUV));
        me.frustumCulled = false;
        me.renderOrder = order;
        sc.add(me);
      }
    }
    const cv = renderToCanvas(sc, camQ, target, W, H, srgb);
    target.dispose();
    fill.dispose(); wire.dispose(); hiddenUV.dispose();
    for (const q of tmp){ q.geometry.dispose(); q.material.dispose(); }
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    if (!blob || disposed) return null;
    return { url: URL.createObjectURL(blob), w: W, h: H, sets, set, hasBg: !!bg };
  }

  function dispose(){
    disposed = true;
    clearHighlight();
    hlMat.dispose(); hlWire.dispose(); hidden.dispose();
    rt?.dispose(); env?.dispose();
    ball?.geometry.dispose();
  }
  const ins = { aid, summary, materials, textures, meshes, thumbs, sel: null, uvSet: 0, onThumb: null, makeThumbs, select, selBox, modelBox, hide, renderUV, dispose };
  return ins;
}

// Lightbox PSD layers panel — the button (D) shows the layer list; clicking a layer swaps the
// lightbox picture for that layer's render, "Composite" goes back to the flattened image.
// attachViewer() re-fits on the image's load event, so a layer of a different size frames itself.
function togglePsdPanel(){
  const btn = $("psdBtn"), panel = $("psdPanel");
  if (!btn || btn.hidden) return;
  panel.hidden = !panel.hidden;
  btn.classList.toggle("on", !panel.hidden);
}
async function loadPsdLayers(id){
  const panel = $("psdPanel");
  if (!panel) return;
  panel.innerHTML = `<div class="v3d-help">Loading layers…</div>`;
  let layers = [];
  try { layers = await api("/api/psd/" + id + "/layers"); } catch { layers = []; }
  if (!light || light.id !== id) return; // moved on to another asset meanwhile
  if (!layers.length){ panel.innerHTML = `<div class="v3d-help">No layers</div>`; return; }
  panel.innerHTML = `<h3>Layers</h3>
    <button type="button" class="layer on" data-i=""><span>Composite</span></button>` +
    layers.map(l => l.kind === "group"
      ? `<div class="layer group"><span>▾ ${esc(l.name)}</span></div>`
      : `<button type="button" class="layer" data-i="${l.index}"><span>${esc(l.name)}</span><em class="badge">${l.width}×${l.height}</em></button>`
    ).join("");
  panel.querySelectorAll("button.layer").forEach((b) => {
    b.onclick = () => {
      panel.querySelectorAll(".layer").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      const img = light && light.id === id ? light.el.querySelector(".light-frame img.view-media") : null;
      if (img) img.src = b.dataset.i === "" ? previewSrc(assetById(id) || { id, ext: ".psd" }) : `/api/psd/${id}/layer/${b.dataset.i}`;
    };
  });
}

  el.querySelectorAll("[data-v3d-check]").forEach((inp) => {

  $("v3dEnvFileBtn").onclick = () => $("v3dEnvFile").click();
  $("v3dEnvFile").onchange = () => {

  };
  bindSliders(el, state.v3d, RUNTIME_DEFAULT_V3D, () => saveV3D());
}

// ---- Base auto-close for every popup / menu / widget -----------------------------------------------
// ONE rule for all of them: a popup closes when the cursor moves more than AUTO_CLOSE_MARGIN px away
// from every edge of it. Any new menu or popover gets it by calling registerAutoClose() once — no
// per-widget listeners. Details:
//  - `anchor` (optional): the button that opened it. The cursor over the anchor counts as "near", so
//    a popup that opens beside its button doesn't vanish before the cursor gets to it.
//  - The rule arms once the cursor has been near the popup (or its anchor) and only then can close
//    it, so a popup opened from the keyboard, or away from the cursor, is left alone.
//  - Nothing closes while a mouse button is held: dragging a slider or colour handle inside a popup
//    can wander far outside it.
//  - Entries whose element has been removed from the page are dropped automatically.
//  - Nesting: a popup opened from a control inside another popup (the color picker from the icon
//    picker) keeps its parent open while the cursor is near it, and closes itself once its anchor
//    is no longer on screen (the parent closed).
const AUTO_CLOSE_MARGIN = 25;
const autoCloseEntries = [];
let autoClosePaused = false;  // set while the screen eyedropper is picking, when the cursor is expected far away
function registerAutoClose(el, close, anchor){
  let entry = autoCloseEntries.find((r) => r.el === el);
  if (!entry) autoCloseEntries.push(entry = { el, close, anchor: anchor || null, armed: false });
  return entry;
}
const nearRect = (r, x, y, m) => x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m;
const autoCloseVisible = (r) => r.el.isConnected && !r.el.hidden && r.el.getClientRects().length > 0;
const nearAutoClose = (r, x, y) => nearRect(r.el.getBoundingClientRect(), x, y, AUTO_CLOSE_MARGIN)
  || (r.anchor && r.anchor.isConnected && nearRect(r.anchor.getBoundingClientRect(), x, y, 0));
document.addEventListener("pointermove", (e) => {
  if (e.buttons || autoClosePaused) return;
  const x = e.clientX, y = e.clientY;
  for (let i = autoCloseEntries.length - 1; i >= 0; i--){
    const r = autoCloseEntries[i];
    if (!r.el.isConnected){ autoCloseEntries.splice(i, 1); continue; }
    if (!autoCloseVisible(r)){ r.armed = false; continue; }
    if (r.anchor && !r.anchor.getClientRects().length){ r.armed = false; r.close(); continue; }
    const near = nearAutoClose(r, x, y) || autoCloseEntries.some((o) => o !== r && o.anchor
      && r.el.contains(o.anchor) && autoCloseVisible(o) && nearAutoClose(o, x, y));
    if (near) r.armed = true;
    else if (r.armed){ r.armed = false; r.close(); }
  }
}, { passive: true });

// ---- Color picker ---------------------------------------------------------------------------------
// Every <input type="color"> in the app opens this in-page picker instead of the browser's native
// popup: the native one lives outside the page, so it can't obey the auto-close rule above and
// stayed open after the cursor left it. The input stays the source of truth — the picker writes
// its value and fires "input" while it changes and one "change" when the picker closes (like the
// native dialog), so existing oninput/onchange handlers work unchanged.
const colorPop = $("colorPop");
let cpInput = null, cpStart = "", cpH = 0, cpS = 0, cpV = 0;
const cpEntry = registerAutoClose(colorPop, () => closeColorPop());
function hsvToHex(h, s, v){
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return "#" + [f(5), f(3), f(1)].map((c) => Math.round(c * 255).toString(16).padStart(2, "0")).join("");
}
function hexToHsv(hex){
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  let h = 0;
  if (d) h = 60 * (mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4);
  return [h, mx ? d / mx : 0, mx];
}
function cpRender(){
  const hex = hsvToHex(cpH, cpS, cpV);
  colorPop.querySelector(".cp-sv").style.backgroundColor = `hsl(${cpH} 100% 50%)`;
  colorPop.querySelector(".cp-sv-dot").style.cssText = `left:${cpS * 100}%;top:${(1 - cpV) * 100}%;background:${hex}`;
  colorPop.querySelector(".cp-hue-dot").style.left = (cpH / 360 * 100) + "%";
  colorPop.querySelector(".cp-swatch").style.background = hex;
  const hexInp = colorPop.querySelector(".cp-hex");
  if (document.activeElement !== hexInp) hexInp.value = hex;
}
function cpApply(hex){
  if (!cpInput || cpInput.value === hex) return;
  cpInput.value = hex;
  cpInput.dispatchEvent(new Event("input", { bubbles: true }));
}
function openColorPicker(inp){
  cpInput = inp;
  cpStart = inp.value;
  [cpH, cpS, cpV] = hexToHsv(/^#[0-9a-f]{6}$/i.test(inp.value) ? inp.value : "#000000");
  cpEntry.anchor = inp;
  cpEntry.armed = false;
  colorPop.hidden = false;
  cpRender();
  // Beside the swatch (the swatch counts as "near", so the rule arms as soon as the cursor moves).
  const a = inp.getBoundingClientRect(), w = colorPop.offsetWidth, h = colorPop.offsetHeight;
  let left = a.right + 6;
  if (left + w > window.innerWidth - 8) left = Math.max(8, a.left - w - 6);
  colorPop.style.left = left + "px";
  colorPop.style.top = Math.max(8, Math.min(a.top, window.innerHeight - h - 8)) + "px";
}
function closeColorPop(){
  if (colorPop.hidden) return;
  colorPop.hidden = true;
  const inp = cpInput;
  cpInput = null;
  cpEntry.anchor = null;
  if (inp && inp.value !== cpStart) inp.dispatchEvent(new Event("change", { bubbles: true }));
}
colorPop.innerHTML = `
  <div class="cp-sv"><div class="cp-sv-dot"></div></div>
  <div class="cp-hue"><div class="cp-hue-dot"></div></div>
  <div class="cp-row">
    <span class="cp-swatch"></span>
    <input class="cp-hex" maxlength="7" spellcheck="false">
    ${window.EyeDropper ? `<button type="button" class="btn ghost cp-eye" title="Pick a color from the screen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>` : ""}
  </div>`;
function cpDrag(el, onPos){
  const at = (e) => { const r = el.getBoundingClientRect(); onPos(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))); cpRender(); cpApply(hsvToHex(cpH, cpS, cpV)); };
  el.addEventListener("pointerdown", (e) => { if (e.button) return; e.preventDefault(); el.setPointerCapture(e.pointerId); at(e); });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) at(e); });
}
cpDrag(colorPop.querySelector(".cp-sv"), (x, y) => { cpS = x; cpV = 1 - y; });
cpDrag(colorPop.querySelector(".cp-hue"), (x) => { cpH = x * 360; });
colorPop.querySelector(".cp-hex").addEventListener("input", (e) => {
  let v = e.target.value.trim();
  if (!v.startsWith("#")) v = "#" + v;
  if (!/^#[0-9a-f]{6}$/i.test(v)) return;
  [cpH, cpS, cpV] = hexToHsv(v.toLowerCase());
  cpRender();
  cpApply(v.toLowerCase());
});
colorPop.querySelector(".cp-hex").addEventListener("keydown", (e) => {
  if (hotkey(e, "Enter")){ e.preventDefault(); closeColorPop(); }
});
colorPop.querySelector(".cp-eye")?.addEventListener("click", async () => {
  autoClosePaused = true;
  try {
    const { sRGBHex } = await new EyeDropper().open();
    [cpH, cpS, cpV] = hexToHsv(sRGBHex.toLowerCase());
    cpRender();
    cpApply(sRGBHex.toLowerCase());
  } catch {} finally { autoClosePaused = false; }
});
// Capture phase: runs before the input's own activation, so the native popup never opens.
document.addEventListener("click", (e) => {
  const inp = e.target.closest?.('input[type="color"]');
  if (!inp) return;
  e.preventDefault();
  if (cpInput === inp) closeColorPop();
  else { closeColorPop(); openColorPicker(inp); }
}, true);
document.addEventListener("pointerdown", (e) => {
  if (!colorPop.hidden && !colorPop.contains(e.target) && e.target !== cpInput) closeColorPop();
}, true);

// ---- Select dropdowns --------------------------------------------------------------------------------
// Every <select> opens this in-page list instead of the browser's native one: the native list is an
// OS popup that opens below the control even when that runs past the bottom of the window (the UV
// channel picker sits at the window's bottom edge). This one always stays inside the window — below
// the control when it fits, above it otherwise, scrolling when neither side has room. The <select>
// stays the source of truth: picking sets its value and fires "input" + "change", so existing
// handlers work unchanged. Keyboard use of a focused <select> (arrows) is left native.
const selPop = $("selPop");
let spSelect = null;
const spEntry = registerAutoClose(selPop, () => closeSelectPop());
function closeSelectPop(){
  if (selPop.hidden) return;
  selPop.hidden = true;
  spEntry.anchor = null;
  const sel = spSelect;
  spSelect = null;
  sel?.blur(); // a focused <select> would swallow single-key shortcuts (WASD / F in the 3D view)
}
function openSelectPop(sel){
  spSelect = sel;
  spEntry.anchor = sel;
  spEntry.armed = false;
  selPop.innerHTML = [...sel.options].map((o, i) =>
    `<button type="button" data-i="${i}"${o.selected ? ' class="on"' : ""}${o.disabled ? " disabled" : ""}>${esc(o.textContent)}</button>`).join("");
  selPop.style.maxHeight = "";
  selPop.style.minWidth = "";
  selPop.hidden = false;
  const a = sel.getBoundingClientRect(), M = 8, GAP = 4;
  selPop.style.minWidth = a.width + "px";
  const below = window.innerHeight - a.bottom - GAP - M, above = a.top - GAP - M;
  const h = selPop.offsetHeight, w = selPop.offsetWidth;
  let top;
  if (h <= below) top = a.bottom + GAP;
  else if (h <= above) top = a.top - GAP - h;
  else if (below >= above){ top = a.bottom + GAP; selPop.style.maxHeight = below + "px"; }
  else { top = M; selPop.style.maxHeight = above + "px"; }
  selPop.style.top = top + "px";
  selPop.style.left = Math.max(M, Math.min(a.left, window.innerWidth - w - M)) + "px";
  selPop.querySelector("button.on")?.scrollIntoView({ block: "nearest" });
}
selPop.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b || !spSelect) return;
  const sel = spSelect, i = Number(b.dataset.i);
  closeSelectPop();
  if (sel.selectedIndex === i) return;
  sel.selectedIndex = i;
  sel.dispatchEvent(new Event("input", { bubbles: true }));
  sel.dispatchEvent(new Event("change", { bubbles: true }));
});
// Capture phase + preventDefault on mousedown: that is what opens the native list.
document.addEventListener("mousedown", (e) => {
  const sel = e.target.closest?.("select");
  if (!sel || sel.multiple || sel.size > 1 || sel.disabled || e.button !== 0) return;
  e.preventDefault();
  if (spSelect === sel){ closeSelectPop(); return; }
  closeSelectPop();
  openSelectPop(sel);
}, true);
document.addEventListener("pointerdown", (e) => {
  if (!selPop.hidden && !selPop.contains(e.target) && e.target !== spSelect) closeSelectPop();
}, true);
window.addEventListener("resize", closeSelectPop);
document.addEventListener("scroll", (e) => { if (!selPop.contains(e.target)) closeSelectPop(); }, true);

const pathParts = (p) => p.replace(/[\\/]+$/, "").split(/[\\/]/);
const pathSep = (p) => (p.match(/[\\/]/) || ["/"])[0];
const parentDir = (p) => { const parts = pathParts(p); parts.pop(); return parts.join(pathSep(p)); };
// Deepest folder containing every path in `dirs` ("" if they share nothing, e.g. two drives).
function commonDir(dirs){
  let parts = pathParts(dirs[0]);
  for (const d of dirs.slice(1)){
    const q = pathParts(d);
    let i = 0;
    while (i < parts.length && i < q.length && parts[i] === q[i]) i++;
    parts = parts.slice(0, i);
  }
  return parts.join(pathSep(dirs[0]));
}

// Opens the source's folder tree in the sidebar down to `dir` so its row shows (highlighted).
// Returns the tree's own spelling of `dir` — the row's "on" check compares it to state.filter.folder.
async function expandTreeTo(src, dir){
  const want = pathParts(dir);
  let cur = src.path;
  state.sourceTree.expandedSources.add(src.id);
  for (let depth = pathParts(src.path).length; depth < want.length; depth++){
    await loadFolderTree(src.id, cur);
    const next = (state.sourceTree.dirsCache.get(src.id + "|" + cur) || []).find((d) => pathParts(d.path)[depth] === want[depth]);
    if (!next) return dir;
    if (depth < want.length - 1) state.sourceTree.expandedPaths.add(src.id + "|" + next.path);
    cur = next.path;
  }
  return cur;
}

// Waits until the grid has loaded every wanted item (pull() pages in 400 at a time) or the list ended.
async function waitForItems(want, ms = 10000){
  const t0 = performance.now();
  while (performance.now() - t0 < ms){
    const have = state.items.reduce((n, a) => n + (want.has(a.id) ? 1 : 0), 0);
    if (have === want.size) return;
    if (!state.pulling && !wantReset && state.total != null && state.items.length >= state.total) return;
    await new Promise((r) => setTimeout(r, 50));
  }
}

function scrollGridToIndex(i){
  const L = layout();
  let top, h;
  if (L.mode === "masonry"){
    const p = computeMasonry(L).positions[i];
    if (!p) return;
    top = p.y; h = p.h;
  } else {
    top = Math.floor(i / L.cols) * L.rowH; h = L.rowH;
  }
  grid.scrollTop = Math.max(0, L.pad + top + h / 2 - grid.clientHeight / 2);
  scheduleRender();
}

// Jumps the library grid to where the given assets live and selects them. They can come from
// different folders, depths and sources (a board mixes anything), so the view narrows to the
// deepest folder holding all of them — the folder filter is recursive: one folder -> that folder;
// several under one source -> their common ancestor (the source row if that is the source root);
// several sources -> All. Search and type filters are cleared so nothing hides the files.
async function findInFolder(assetIds){
  const recs = (await Promise.all(assetIds.map((id) => api("/api/assets/" + id).catch(() => null)))).filter(Boolean);
  const found = recs.filter((a) => a.status !== "excluded");
  if (!found.length){
    alert(recs.length ? "These files are in folders excluded from the library." : "These files are no longer in the library.");
    return;
  }
  let patch = {};
  const sids = [...new Set(found.map((a) => a.source_id))];
  const src = sids.length === 1 ? (state.meta.sources || []).find((s) => s.id === sids[0]) : null;
  if (src){
    const dir = commonDir(found.map((a) => parentDir(a.path)));
    if (pathParts(dir).length <= pathParts(src.path).length) patch = { source: src.id };
    else patch = { folder: await expandTreeTo(src, dir) };
  }
  $("q").value = "";
  state.filter.q = "";
  if (state.view === "canvas" && !state.canvasSplit) toggleCanvasSplit();
  applyFilter(patch);
  nav.querySelector(".src-folder.on, .src-row.on")?.scrollIntoView({ block: "nearest" });
  const want = new Set(found.map((a) => a.id));
  await waitForItems(want);
  const hits = state.items.filter((a) => want.has(a.id)).map((a) => a.id);
  if (!hits.length) return;
  selectSet(hits, hits[0]);
  scrollGridToIndex(state.items.findIndex((a) => a.id === hits[0]));
}

    });
  };
}

// Icon shapes are drawn with `stroke="currentColor"` (see ICONS/renderIconSvg), so they're
// masks in the sense the feature was asked for: pick any tint via the color input, no separate
// "colored version" of each icon needed. `mode: "tag"` adds a "Color only" action, since a tag's
// default look is just a colored dot (see tagColor()) — no icon shape required.
//
// Closes itself one extra way, on top of the usual click-away and the base cursor-distance rule
// (registerAutoClose): letting go of the native color dialog (its "change" event fires once, on
// release — "input" fires continuously while still dragging inside it, which must NOT close this).
function showIconPicker(x, y, { icon, color, mode = "collection", onPick, onColorOnly, onClear }){
  const menu = $("ctx");
  menu.className = "ctx icon-picker";
  const curColor = /^#[0-9a-f]{6}$/i.test(color || "") ? color : "#8b8b8b";
  let selectedIcon = icon || (mode === "collection" ? "folder" : mode === "board" ? "pin" : "");
  menu.innerHTML = `
    <div class="ip-color">
      <input type="color" id="ipColor" value="${curColor}">
      ${mode === "tag" ? `<button type="button" class="btn ghost" data-act="coloronly">Color only</button>` : ""}
      <button type="button" class="btn ghost" data-act="clear">Reset</button>
    </div>
    <div class="ip-body">
      ${ICON_CATEGORIES.map((cat) => `
        <div class="sub">${esc(cat.label)}</div>
        <div class="ip-grid">
          ${cat.ids.map((id) => `<button type="button" class="ip-btn${id === icon ? " on" : ""}" data-icon="${id}" title="${id}">${renderIconSvg(id, "currentColor", 18)}</button>`).join("")}
        </div>
      `).join("")}
    </div>
  `;
  menu.hidden = false;
  menu.style.left = "0px";
  menu.style.top = "0px";
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
  const colorInp = $("ipColor");
  menu.onclick = (e) => {
    if (e.target.closest('[data-act="clear"]')){ hideCtx(); onClear(); return; }
    if (e.target.closest('[data-act="coloronly"]')){ hideCtx(); onColorOnly(colorInp.value); return; }
    const iconBtn = e.target.closest(".ip-btn");
    if (iconBtn){ selectedIcon = iconBtn.dataset.icon; hideCtx(); onPick(selectedIcon, colorInp.value); return; }
  };
  colorInp.addEventListener("change", () => {
    if (selectedIcon){ hideCtx(); onPick(selectedIcon, colorInp.value); }
    else if (mode === "tag"){ hideCtx(); onColorOnly(colorInp.value); }
  });
}

// Right-click on empty grid space (no card under the cursor, so nothing needs to be selected) —
// lets missing files be cleaned up without hunting down the sidebar row or the palette.
function showGridCtx(x, y){
  const menu = $("ctx");
  menu.className = "ctx";
  const narrowed = !isFilterEmpty(state.filter);
  menu.innerHTML = `<button type="button" data-act="purgeMissing">🧹 Remove missing files${narrowed ? " (current view)" : ""}</button>`;
  menu.hidden = false;
  menu.style.left = "0px";
  menu.style.top = "0px";

function lightStep(dir, e){
  if (!light) return;
  const i = state.items.findIndex(x => x.id === light.id);
  if (i < 0) return;
  const next = state.items[i + dir];
  if (next && !heavyKeyBlocked(e, next)) showInLight(next);
}

// Up/Down in the lightbox move one row of the thumbnail grid, keeping the column — so the
// preview follows the grid the user is looking at behind it. Off the end of a shorter last row
// it lands on the last item; already on the last row it stays put.
function lightStepRow(dir, e){
  if (!light) return;
  const n = state.items.length;
  const i = state.items.findIndex(x => x.id === light.id);
  if (i < 0) return;
  const cols = layout().cols;
  let j = i + dir * cols;
  if (j < 0) return;
  if (j >= n){
    if (Math.floor(i / cols) >= Math.floor((n - 1) / cols)) return;
    j = n - 1;
  }
  if (!heavyKeyBlocked(e, state.items[j])) showInLight(state.items[j]);
}

function isFilterEmpty(f){
  return !f.q && !f.kind && !f.source && !f.tag && !f.collection && !f.folder;
}

function filterParams(f){
  const p = new URLSearchParams();
  if (f.q) p.set("q", f.q);
  if (f.kind) p.set("kind", f.kind);
  if (f.source) p.set("source", f.source);
  if (f.tag) p.set("tag", f.tag);
  if (f.collection) p.set("collection", f.collection);
  if (f.folder) p.set("folder", f.folder);
  return p;
}

// Drops the library entries of files that were moved or deleted (the "Missing" list). Only the
// index is cleaned — nothing on disk is touched — but their tags/ratings/notes go with them.
// `scoped`: limit the drop to missing files matching the current view's filter (kind/source/tag/
// collection/folder/search) instead of the whole library — used by the grid's right-click menu,
// which works even with nothing selected, unlike the sidebar/palette's library-wide clean-up.
async function purgeMissing(scoped){
  const f = scoped ? state.filter : {};
  const narrowed = scoped && !isFilterEmpty(f);
  let n;
  if (narrowed){
    const p = filterParams(f);
    p.set("missing", "1");
    p.set("limit", "0");
    try {
      n = (await api("/api/assets?" + p)).total || 0;
    } catch (err){
      alert("Could not check missing files: " + err.message);
      return;
    }
  } else {
    n = (state.meta.counts || {}).missing || 0;
  }
  if (!n){ alert("No missing files" + (narrowed ? " in the current view." : ".")); return; }
  const scopeNote = narrowed ? " matching the current view" : "";
  if (!confirm(`Remove ${n} missing file${n === 1 ? "" : "s"}${scopeNote} from the library?\n\nOnly the library entries are removed — their tags, ratings, notes and collection membership are lost. Nothing on disk is touched.`)) return;
  let r;
  try {
    r = await api("/api/missing/purge", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(scoped ? { q: f.q, kind: f.kind, source: f.source, tag: f.tag, collection: f.collection, folder: f.folder } : {}),
    });
  } catch (err){
    alert("Could not clean up missing files: " + err.message);
    return;
  }
  const gone = new Set(r.ids || []);
  state.selectedIds = state.selectedIds.filter((id) => !gone.has(id));
  await refreshMeta();
  if (state.filter.missing && !(state.meta.counts || {}).missing) state.filter.missing = false;
  renderNav();
  resetList();
  renderInsp();
  const notes = [];
  if (r.moved) notes.push(`${r.moved} moved file${r.moved === 1 ? "" : "s"} matched to their new location — tags/rating/thumbnail carried over.`);
  if (r.skipped) notes.push(`${r.skipped} missing file${r.skipped === 1 ? " was" : "s were"} kept: their source folder can't be reached right now (offline drive?).`);
  if (notes.length) alert(notes.join("\n"));
}

// Settings → Scanning → Ignore. The list lives in the library DB (the scanner needs it before any
// page is open), so it comes with /api/state; Apply hides matches and rescans every source.
async function applyScanIgnore(){
  const ta = $("scanIgnore"), msg = $("scanIgnoreMsg");
  if (!ta) return;
  msg.textContent = "Applying…";
  try {
    const r = await api("/api/scan/ignore", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: ta.value }) });
    const parts = [];
    if (r.hidden) parts.push(`${r.hidden} hidden`);
    if (r.restored) parts.push(`${r.restored} restored`);
    msg.textContent = (parts.join(", ") || "Saved") + " · rescanning";
    delete ta.dataset.dirty;
    await refreshMeta();
    resetList();
  } catch (err) {
    msg.textContent = /404|405|Not Found|Method Not Allowed/.test(String(err)) ? "Restart Sight to load the new server code" : "Failed: " + String(err.message || err).slice(0, 120);
  }
}

async function refreshMeta(){
  state.meta = await api("/api/state");
  const ign = $("scanIgnore");
  if (ign && document.activeElement !== ign && !ign.dataset.dirty) ign.value = state.meta.scanIgnore || "";
  renderBuildTag(); // version + build stamp come with the state; the first call at boot runs before it is loaded
  renderNav();
  renderStatus();
  renderFfmpeg();
}

function params(){
  const f = state.filter;
  const p = new URLSearchParams();
  if (f.q) p.set("q", f.q);
  if (f.kind) p.set("kind", f.kind);
  if (f.source) p.set("source", f.source);
  if (f.tag) p.set("tag", f.tag);
  if (f.missing) p.set("missing", "1");
  if (f.collection) p.set("collection", f.collection);
  if (f.folder) p.set("folder", f.folder);
  if (state.sort.key){ p.set("sort", state.sort.key); p.set("order", state.sort.dir); }
  return p;
}

let wantReset = false;
async function pull(fromStart){
  if (fromStart) wantReset = true;
  if (state.pulling) return;
  state.pulling = true;
  try {
    while (true){
      const reset = wantReset;
      wantReset = false;
      if (reset) state.items = [];
      const p = params();
      p.set("offset", String(state.items.length));
      p.set("limit", "400");
      const data = await api("/api/assets?" + p);
      const items = data.items || [];
      if (data.total != null) state.total = data.total;
      if (reset) state.items = items;
      else {
        const have = new Set(state.items.map(x => x.id));
        for (const a of items) if (!have.has(a.id)) state.items.push(a);
      }
      scheduleRender();
      renderStatus();
      if (wantReset) continue;
      if (items.length === 400){
        clearTimeout(pullTimer);
        pullTimer = setTimeout(() => pull(false), 16);
      }
      break;
    }
  } finally {
    state.pulling = false;
    if (wantReset) pull(true);
  }
}

function resetList(){
  grid.scrollTop = 0;
  pull(true);
}

// pull(false) only ever fetches PAST the end of what's already loaded (offset=state.items.length)
// — it grows the list but never refreshes items already in it. So a status flip on an already-
// loaded asset (a live-watched file going missing, a reconciled move, a tag edit from elsewhere)
// never reached the grid on its own; only a full pull(true) (source/filter switch) did. This
// re-fetches the SAME window (offset 0, same length) and updates each item's fields in place —
// same array, same objects where possible, so cardPool/scroll position aren't disturbed — and
// lets renderGrid's next pass pick up the new status/thumb_v/tags on the cards already on screen.
let refreshItemsT = 0;
function scheduleRefreshItems(){
  clearTimeout(refreshItemsT);
  refreshItemsT = setTimeout(refreshItems, 150);
}
async function refreshItems(){
  if (!state.items.length) return;
  const p = params();
  p.set("offset", "0");
  p.set("limit", String(state.items.length));
  let data;
  try { data = await api("/api/assets?" + p); } catch { return; }
  const items = data.items || [];
  if (data.total != null) state.total = data.total;
  const byId = new Map(items.map(a => [a.id, a]));
  for (const x of state.items){
    const fresh = byId.get(x.id);
    // The server only sends thumb_v when has_thumb is true, so a plain Object.assign below
    // would leave a stale thumb_v (and seenThumb entry) in place when a thumbnail is dropped —
    // e.g. a watched file going missing then reappearing with different content, which resets
    // has_thumb server-side but not these client caches. thumbUrl() would then keep pointing at
    // the OLD ?v= URL, which the browser's immutable HTTP cache happily keeps serving forever.
    // Clearing them here lets the placeholder show and the normal "thumb needed" pickup
    // (reportVisible) request a fresh one under a new, uncached URL.
    if (fresh && !fresh.has_thumb && (x.has_thumb || x.thumb_v)){
      seenThumb.delete(x.id);
      delete x.thumb_v;
    }
    if (fresh) Object.assign(x, fresh);
  }
  masonryCache = null; // widths/heights may have changed — the signature alone won't catch that
  scheduleRender();
  renderStatus();
}

function applyThumb(id, hasThumb, animated, v, width, height){
  const a = assetById(id);
  if (hasThumb){
    seenThumb.add(id);
    if (a){ a.has_thumb = 1; if (v) a.thumb_v = v; }
  }
  if (animated != null && a) a.animated = animated ? 1 : 0;
  // Dimensions are usually still unknown when this asset first landed in state.items (they're
  // only discovered by thumbnailing) — masonry sizes every card off them, so learning them now
  // can shift this card and everything below it in its column, not just its own thumbnail.
  let resized = false;
  if (a && width && height && (a.width !== width || a.height !== height)){
    a.width = width;
    a.height = height;
    resized = true;
  }
  const el = cardPool.get(id);
  if (el) fillThumb(el, a || { id, has_thumb: hasThumb ? 1 : 0, thumb_v: v, kind: "image" }, true);
  // The inspector preview is the thumbnail — refresh it in place when a new one lands.
  const slot = hasThumb && a ? insp.querySelector(`[data-thumb="${id}"]`) : null;
  if (slot){
    slot.innerHTML = `<img src="${thumbSrc(a)}" alt="" />`;
    watchPixelation(slot.firstElementChild);
  }
  if (resized){ masonryCache = null; scheduleRender(); }
}

async function saveAppDefaults(){

  return items;
}

  }));

function paletteBoards(){

  }));

async function renderPalette(q){
  const query = q.trim().toLowerCase();
  const reqId = ++paletteReq;
  const filterLocal = (items) => query ? items.filter((i) => i.label.toLowerCase().includes(query)) : items;
  const sections = [];
  const actions = filterLocal(paletteActions());
  if (actions.length) sections.push(["Actions", actions]);
  const kinds = filterLocal(paletteKinds());
  if (kinds.length) sections.push(["Show", kinds]);
  const cols = filterLocal(paletteCollections());
  if (cols.length) sections.push(["Collections", cols]);
  const boards = filterLocal(paletteBoards());
  if (boards.length) sections.push(["Canvas", boards]);

  let files = [];
  if (query){
    try {
      const data = await api("/api/assets?q=" + encodeURIComponent(query) + "&limit=50");
      files = (data.items || []).map((a) => ({
        label: a.name, hint: KIND[a.kind] || a.kind, run: () => { selectOnly(a.id); toggleLight(a); },
      }));
    } catch {}
  } else {
    files = state.items.slice(0, 30).map((a) => ({
      label: a.name, hint: KIND[a.kind] || a.kind, run: () => { selectOnly(a.id); toggleLight(a); },
    }));
  }
  if (reqId !== paletteReq) return; // superseded by a newer keystroke
  if (files.length) sections.push(["Files", files]);
  paintPalette(sections);
}

function paintPalette(sections){
  const list = $("paletteList");
  paletteItems = sections.flatMap(([, items]) => items);
  if (!paletteItems.length){
    list.innerHTML = `<div class="palette-empty">No matches</div>`;
    return;
  }
  paletteSel = Math.min(paletteSel, paletteItems.length - 1);
  let i = 0;
  list.innerHTML = sections.map(([title, items]) => {
    const rows = items.map((it) => {
      const idx = i++;
      return `<button type="button" class="palette-item${idx === paletteSel ? " on" : ""}" data-i="${idx}"><span>${esc(it.label)}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ""}</button>`;
    }).join("");
    return `<div class="palette-sec">${esc(title)}</div>${rows}`;
  }).join("");
  list.querySelectorAll(".palette-item").forEach((btn) => {
    btn.onclick = () => runPaletteItem(Number(btn.dataset.i));
  });
}

function runPaletteItem(i){
  const it = paletteItems[i];
  if (!it) return;
  closePalette();
  it.run();
}

function movePaletteSel(dir){
  if (!paletteItems.length) return;
  paletteSel = (paletteSel + dir + paletteItems.length) % paletteItems.length;
  $("paletteList").querySelectorAll(".palette-item").forEach((el) => {
    el.classList.toggle("on", Number(el.dataset.i) === paletteSel);
  });
  $("paletteList").querySelector(".palette-item.on")?.scrollIntoView({ block: "nearest" });
}

$("paletteInput").oninput = () => {
  clearTimeout(paletteQTimer);
  const q = $("paletteInput").value;
  paletteQTimer = setTimeout(() => { paletteSel = 0; renderPalette(q); }, 120);
};
$("paletteInput").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown"){ e.preventDefault(); movePaletteSel(1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); movePaletteSel(-1); }
  else if (e.key === "Enter"){ e.preventDefault(); runPaletteItem(paletteSel); }
  else if (e.key === "Escape"){ e.preventDefault(); closePalette(); }
});
$("palette").addEventListener("pointerdown", (e) => { if (e.target === $("palette")) closePalette(); });

function connectEvents(){
  const es = new EventSource("/api/events");
  es.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === "thumb" && ev.id) applyThumb(ev.id, ev.hasThumb !== false, ev.animated, ev.v, ev.width, ev.height);
    if (ev.type === "batch"){ scheduleRefreshItems(); scheduleMeta(); pull(false); renderStatus(); }
    if (ev.type === "scan" || ev.type === "source"){
      scheduleMeta();
      if (ev.scanning || ev.type === "source") pull(false);
    }
  };
}

    resetList();
  }
}

// A Blender-style number slider (see interface_handlers.c's UI_BTYPE_NUM_SLIDER, and
// https://cladd.io/react/components/number-scrubber/ for a web recreation of the same
// interaction): a click that doesn't move the pointer opens text-edit (not a double-click);
// dragging scrubs at a fixed px→value rate rather than mapping the container's width to the
// range, so there is no artificial "drag this far and you've hit the limit" — you can keep
// dragging (or just type) past the visible fill to reach any value up to `max`. Shift
// re-locks the drag anchor at the current pointer position when toggled mid-drag, so
// switching to fine precision never jumps the value. The 16px edge zones nudge by one step;
// right-click resets to the control's default.
// Hovered slider's reset callback — Backspace resets it, mirroring Blender's "hover a field,
// press Backspace to clear it" shortcut (in addition to the existing right-click reset).
let hoveredSliderReset = null;
function initSlider(container, { min, max, step = 1, value, unit = "", onChange, resetValue }){
  container.innerHTML = `<button type="button" class="arr l" tabindex="-1">‹</button><div class="fill"></div><div class="lbl"></div><button type="button" class="arr r" tabindex="-1">›</button>`;
  const fill = container.querySelector(".fill");
  const lbl = container.querySelector(".lbl");
  const arrL = container.querySelector(".arr.l");
  const arrR = container.querySelector(".arr.r");
  const places = step < 1 ? 2 : 0;
  const range = Math.max(1e-6, max - min);
  const rate = range / 300; // px → value at normal speed; Shift drops this ×~8 for precision
  function clamp(v){ return Math.min(max, Math.max(min, v)); }
  function paint(){
    const frac = (value - min) / range;
    fill.style.width = Math.min(100, Math.max(0, frac * 100)) + "%";
    lbl.textContent = value.toFixed(places) + unit;
  }
  function setValue(v, commit){
    value = clamp(Math.round(v / step) * step);
    paint();
    if (commit) onChange(value);
  }
  paint();

  const nudge = (dir) => (e) => { e.stopPropagation(); setValue(value + dir * step, true); };
  arrL.onclick = nudge(-1);
  arrR.onclick = nudge(1);
  [arrL, arrR].forEach((b) => b.addEventListener("pointerdown", (e) => e.stopPropagation()));

  let dragging = false, moved = false, startX = 0, anchorX = 0, anchorV = 0, wasShift = false;
  container.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.tagName === "INPUT" || e.target === arrL || e.target === arrR) return;
    dragging = true;
    moved = false;
    startX = anchorX = e.clientX;
    anchorV = value;
    wasShift = e.shiftKey;
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    if (Math.abs(e.clientX - startX) > 3) moved = true;
    if (!moved) return;
    const shift = e.shiftKey;
    if (shift !== wasShift){ anchorX = e.clientX; anchorV = value; wasShift = shift; }
    setValue(anchorV + (e.clientX - anchorX) * rate * (shift ? 0.12 : 1), true);
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    if (!moved) beginEdit();
  }
  container.addEventListener("pointerup", endDrag);
  container.addEventListener("pointercancel", () => { dragging = false; });
  container.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    if (resetValue != null) setValue(resetValue, true);
  });
  const myReset = () => { if (resetValue != null) setValue(resetValue, true); };
  container.addEventListener("pointerenter", () => { hoveredSliderReset = myReset; });
  container.addEventListener("pointerleave", () => { if (hoveredSliderReset === myReset) hoveredSliderReset = null; });

  function beginEdit(){
    const inp = document.createElement("input");
    inp.type = "number";
    inp.step = String(step);
    inp.value = String(value);
    container.appendChild(inp);
    inp.focus();
    inp.select();
    const done = (commit) => {
      if (commit){
        const v = Number(inp.value);
        if (Number.isFinite(v)) setValue(v, true);
      }
      inp.remove();
    };
    inp.onblur = () => done(true);
    inp.onkeydown = (ev) => {
      ev.stopPropagation();
      if (ev.key === "Enter") done(true);
      if (ev.key === "Escape") done(false);
    };
  }
}

// Generic: binds every [data-slider] under `root` to a field on `store`, resetting (on
// right-click) to the same field on `defaults`. `onSet(key, value)` persists + reacts.
// A thin strip with no draggable "dot" — click/drag anywhere along it sets the value
// proportionally to position, like a compact progress scrubber (used for the lightbox's
// explode-parts control, which lives in the tight bottom-center button row).
function initThinSlider(container, { min = 0, max = 1, value = 0, onChange }){
  const fill = container.querySelector("i");
  function clamp(v){ return Math.min(max, Math.max(min, v)); }
  function paint(){ fill.style.width = (Math.min(1, Math.max(0, (value - min) / (max - min))) * 100) + "%"; }
  function setValue(v, commit){
    value = clamp(v);
    paint();
    if (commit) onChange(value);
  }
  paint();
  function valueAt(e){
    const r = container.getBoundingClientRect();
    const pad = 6;
    const t = (e.clientX - r.left - pad) / Math.max(1, r.width - pad * 2);
    return min + Math.min(1, Math.max(0, t)) * (max - min);
  }
  let dragging = false;
  container.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    dragging = true;
    container.setPointerCapture(e.pointerId);
    setValue(valueAt(e), true);
  });
  container.addEventListener("pointermove", (e) => { if (dragging) setValue(valueAt(e), true); });
  const end = () => { dragging = false; };
  container.addEventListener("pointerup", end);
  container.addEventListener("pointercancel", end);
  container.addEventListener("contextmenu", (e) => { e.preventDefault(); setValue(min, true); });
  return { set: (v) => setValue(v, false) };
}

function bindSliders(root, store, defaults, onSet){
  root.querySelectorAll("[data-slider]").forEach((el) => {
    const key = el.dataset.slider;
    initSlider(el, {
      min: Number(el.dataset.min), max: Number(el.dataset.max), step: Number(el.dataset.step) || 1,
      value: Number(store[key]), unit: el.dataset.unit || "",
      resetValue: defaults ? defaults[key] : undefined,
      onChange: (v) => { store[key] = v; onSet(key, v); },
    });
  });
}

function sliderRow(label, key, min, max, step, unit){
  // A plain div, not a <label> — wrapping the custom .bslider widget in a <label> made the

  return `<div class="opt"><span>${esc(label)}</span><div class="bslider" data-slider="${key}" data-min="${min}" data-max="${max}" data-step="${step}" data-unit="${unit || ""}"></div></div>`;
}

// Shared middle-click-drag-to-scroll behavior — every scrollable menu/panel gets it, not just
// the sidebar (feedback: "any menu should work like the base one").
function attachPanScroll(el){
  if (!el) return;
  let drag = null;
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 1 || e._panScroll) return; // a nested scroller (list inside a panel) already took it
    e._panScroll = true;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, sl: el.scrollLeft, st: el.scrollTop };
    el.classList.add("panning");
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!drag) return;
    el.scrollTop = drag.st - (e.clientY - drag.y);
    el.scrollLeft = drag.sl - (e.clientX - drag.x);
  });
  const end = () => { drag = null; el.classList.remove("panning"); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
}

// In-app folder browser — replaces the native OS folder-picker dialog (feedback #1): the
// server already has unrestricted local filesystem access (no browser permission prompt is
// involved), so we can just list directories ourselves and skin the picker like the rest of
// the app instead of shelling out to PowerShell's FolderBrowserDialog.
let fbState = null, fbRootsCache = null, fbLastPath = "";
function fbCrumbs(path){
  const isWin = path.includes("\\") || /^[A-Za-z]:/.test(path);
  const sep = isWin ? "\\" : "/";
  const parts = path.split(sep).filter(Boolean);
  if (!parts.length) return isWin ? [] : [{ name: "/", path: "/" }];
  return parts.map((name, i) => {
    let p = parts.slice(0, i + 1).join(sep);
    if (!isWin) p = "/" + p;
    else if (i === 0) p += sep;
    return { name, path: p };
  });
}
async function fbNavigate(path){
  try {
    const data = await api("/api/fs/list?path=" + encodeURIComponent(path || ""));
    fbState = data;
    fbLastPath = data.path;
    fbRender();
  } catch {
    $("fbList").innerHTML = `<div class="fb-empty">Can't open this folder.</div>`;
  }
}
function fbRender(){
  if (!fbState) return;
  $("fbPath").textContent = fbState.path;
  $("fbPath").title = fbState.path;
  const crumbs = fbCrumbs(fbState.path);
  $("fbCrumbs").innerHTML = crumbs.map((c, i) => `<button type="button" class="fb-crumb${i === crumbs.length - 1 ? " cur" : ""}" data-path="${esc(c.path)}">${esc(c.name)}</button>${i < crumbs.length - 1 ? '<span class="fb-sep">›</span>' : ""}`).join("");
  $("fbCrumbs").querySelectorAll(".fb-crumb").forEach((b) => { b.onclick = () => fbNavigate(b.dataset.path); });
  const dirs = fbState.dirs || [];
  $("fbList").innerHTML = dirs.length
    ? dirs.map((d) => `<button type="button" class="fb-item" data-path="${esc(d.path)}"><span>📁</span><span>${esc(d.name)}</span></button>`).join("")
    : `<div class="fb-empty">No subfolders here.</div>`;
  $("fbList").querySelectorAll(".fb-item").forEach((b) => { b.onclick = () => fbNavigate(b.dataset.path); });
}

}
let qTimer;
$("q").oninput = () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.filter.q = $("q").value; resetList(); }, 120);
};
// Guard for the keys that start loading a heavy asset: Space (open/close) and the arrows (step
// onto the next one). Opening a heavy asset starts a fetch + a parse that can't be cancelled and
// that blocks the main thread, so presses made meanwhile queue up and replay back-to-back
// afterwards, each starting another load. Hence, for a heavy target: auto-repeat is ignored, so
// is anything inside the cooldown after the last accepted press, and so is a press that sat in the
// queue (typed while the UI was frozen) — those are dropped rather than replayed. Light assets
// (images, …) are never throttled, so holding an arrow still flies through a folder of pictures.
const HEAVY_BYTES = 100 * 1024 * 1024;
const HEAVY_COOLDOWN_MS = 700;
const HEAVY_STALE_MS = 250;
let heavyLockUntil = 0;
function isHeavyAsset(a){
  return !!a && (a.kind === "model3d" || a.ext === ".psd" || a.size >= HEAVY_BYTES);
}
// The grid is virtualised and cards are recycled, so :hover state can't be trusted (it goes stale
// after a scroll without mouse movement) — remember the last pointer position and hit-test it
// when Space is pressed instead.
let lastPtr = null;
const setCtrlDown = (on) => document.documentElement.classList.toggle("ctrl-down", on);
window.addEventListener("keydown", (e) => { if (e.key === "Control" || e.key === "Meta") setCtrlDown(true); });
window.addEventListener("keyup", (e) => { if (e.key === "Control" || e.key === "Meta") setCtrlDown(false); });
window.addEventListener("blur", () => setCtrlDown(false));
window.addEventListener("pointermove", (e) => {
  lastPtr = { x: e.clientX, y: e.clientY };
  setCtrlDown(e.ctrlKey || e.metaKey);
  // Moving onto a thumbnail / board item takes focus off the search field, so Space previews the
  // hovered result instead of typing a space into the query.
  if (document.activeElement === $("q") && e.target.closest?.(".card[data-id], .citem[data-asset-id]")) $("q").blur();
}, { passive: true });
document.documentElement.addEventListener("pointerleave", () => { lastPtr = null; });
function assetUnderPointer(){
  if (!lastPtr) return null;
  const hit = document.elementFromPoint(lastPtr.x, lastPtr.y);
  const card = hit?.closest(".card[data-id]");
  if (card && grid.contains(card)) return assetById(card.dataset.id);
  // Canvas board items preview the same way (their asset may not be in the current library list).
  const item = hit?.closest(".citem[data-asset-id]");
  if (item && canvasView.contains(item)) return assetById(item.dataset.assetId) || canvasCtl?.assetOf(item.dataset.assetId) || null;
  return null;
}
function heavyKeyBlocked(e, asset){
  if (!isHeavyAsset(asset)) return false;
  if (e.repeat) return true;
  const now = performance.now();
  if (now < heavyLockUntil || now - e.timeStamp > HEAVY_STALE_MS) return true;
  heavyLockUntil = now + HEAVY_COOLDOWN_MS;
  return false;
}
document.addEventListener("keydown", (e) => {
  const tag = e.target.tagName;
  const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  // Shortcut rule (keys.js): a combo fires only with EXACTLY its modifiers — use hotkey(e, "KeyD"),
  // never a bare e.key/e.code test, so Shift+D / Ctrl+D / Alt+D can't trigger the plain-D command.
  if (hotkey(e, "Ctrl+KeyK")){ e.preventDefault(); togglePalette(); return; }
  if (paletteOpen && hotkey(e, "Escape")){ e.preventDefault(); closePalette(); return; }
  if (paletteOpen) return;
  if (!colorPop.hidden && hotkey(e, "Escape")){ e.preventDefault(); closeColorPop(); return; }
  if (!selPop.hidden && hotkey(e, "Escape")){ e.preventDefault(); closeSelectPop(); return; }
  if (!$("fbOverlay").hidden && hotkey(e, "Escape")){ e.preventDefault(); fbClose(); return; }
  if (!$("fbOverlay").hidden) return;
  if (hotkey(e, "Backspace") && !typing && hoveredSliderReset){ e.preventDefault(); hoveredSliderReset(); return; }
  // "/" may need Shift on some layouts, so it is matched by the character, not through hotkey().
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !typing){ e.preventDefault(); $("q").focus(); return; }
  // Ctrl+A selects items (of whichever pane was last used), not the interface text.
  if (hotkey(e, "Ctrl+KeyA") && !typing && !light){
    e.preventDefault();
    selectAllInActivePane();
    return;
  }
  // X / Delete: remove the selection from the collection currently open (same as the inspector's
  // "Remove From Folder" button). On a canvas board, Delete belongs to the board's own handler.
  if ((hotkey(e, "KeyX") || hotkey(e, "Delete")) && !typing && !light
      && !canvasPaneActive() && canRemoveFromFolder()){
    e.preventDefault();
    if (!e.repeat) removeFromFolder();
    return;
  }
  if (hotkey(e, "Escape")){
    if (light){ closeLight(); return; }
    if (document.activeElement === $("q") || state.filter.q){ clearSearch(); $("q").blur(); return; }
    if (!typing && state.selectedIds.length) selectOnly(null);
    $("side").classList.remove("open");
    insp.classList.remove("open");
    return;
  }
  if (hotkey(e, "Space") && !typing){
    e.preventDefault();
    if (e.repeat) return; // holding Space must not flip the lightbox 30 times a second
    const media = light && (light.video || light.audio);
    if (media){
      if (media.paused) media.play();
      else media.pause();
      return;
    }
    if (light){ closeLight(); return; }
    // Space previews the thumbnail under the cursor; what is selected doesn't matter.
    const a = assetUnderPointer();
    if (!a || heavyKeyBlocked(e, a)) return;
    toggleLight(a);
    return;
  }
  if (light && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !typing){
    e.preventDefault();
    lightStep(e.key === "ArrowRight" ? 1 : -1, e);
    return;
  }
  if (light && (e.key === "ArrowDown" || e.key === "ArrowUp") && !typing){
    e.preventDefault();
    lightStepRow(e.key === "ArrowDown" ? 1 : -1, e);
    return;
  }
  // 3D model open in the lightbox. Keys go by e.code (physical key) rather than e.key so they
  // work on any keyboard layout and aren't turned into other characters by Alt/Shift.
  //   WASD          fly the camera (held keys are tracked in camKeys; the viewer's loop moves it)
  //   F             frame all — back to the view the model opened with
  //   1–9           recall the saved camera view; Alt+1–9 saves the current one
  //   Shift+1–4     base shading (solid / vertex / textured / normal)
  //   Shift+5 / 6   wireframe / x-ray overlays (combine with any base and each other)
  //   Shift+7       turn the model 90°
  //   G             view-settings panel (the gear button)
  // Shading moved to Shift+digit and the panel from D to G so the plain digits and WASD could be
  // used by the camera. The main inspector's D toggle below is skipped while a 3D model is open.
  const in3d = light && !$("v3dGear").hidden;
  // Only real text entry blocks these — a checkbox/slider/colour input keeps focus after a click in
  // the settings panel, and that shouldn't stop WASD from flying the camera.
  const typing3d = tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && !["checkbox", "radio", "range", "color", "button"].includes(e.target.type));
  // Digit keys 1–9 in the lightbox jump the open image/video/text to that multiple of its native
  // size (1 = 100%) — same digits the 3D viewer uses for camera views, so this only fires when
  // no 3D model is open (in3d) and the current stage actually exposes a zoom setter.
  if (light && !in3d && !typing && light.setZoom && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey){
    const zoomDigit = /^Digit([1-9])$/.exec(e.code);
    if (zoomDigit){ e.preventDefault(); light.setZoom(Number(zoomDigit[1])); return; }
  }
  // Mesh visibility: H hides the selection, Ctrl+H hides everything else, Alt+H shows all.
  if (in3d && !typing3d && v3dInspect && v3dInspect.aid === light.id && (hotkey(e, "KeyH") || hotkey(e, "Ctrl+KeyH") || hotkey(e, "Alt+KeyH"))){
    e.preventDefault();
    const ins = v3dInspect, mode = hotkey(e, "KeyH") ? "sel" : hotkey(e, "Ctrl+KeyH") ? "others" : "none";
    if (mode !== "none" && !ins.sel){ flashV3DToast("Nothing selected — Ctrl+click a mesh first"); return; }
    const n = ins.hide(mode);
    if (mode === "sel") setInspectSel(null);
    flashV3DToast(mode === "none" ? (n ? `${n} hidden mesh${n > 1 ? "es" : ""} shown` : "Nothing hidden")
      : mode === "sel" ? "Hidden" : "Hid the rest");
    renderLightInfo();
    return;
  }
  if (in3d && !typing3d && !e.ctrlKey && !e.metaKey){
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (v3dCam){
      if (CAM_MOVE_KEYS.has(e.code) && !e.altKey){ e.preventDefault(); camKeys.add(e.code); return; }
      if (e.code === "KeyF" && !e.altKey && !e.shiftKey){
        e.preventDefault();
        // Meshes: fit the selection (Ctrl+click / info panel) or else the whole model, measured as it
        // is now (explode, hidden meshes), keeping the camera's viewing direction — F only moves
        // and zooms, never turns the view. Splats have no inspector and go back to the opening view.
        const ins = v3dInspect && v3dInspect.aid === light.id ? v3dInspect : null;
        const box = ins ? (ins.sel ? ins.selBox() : ins.modelBox()) : null;
        if (uvView && lightPane === "uv") uvView.fit();
        else if (box) v3dCam.frameBox(box, ins.sel ? "Frame selection" : "Frame all");
        else v3dCam.frame();
        return;
      }
      if (digit && !e.shiftKey){
        e.preventDefault();
        if (uvView && lightPane === "uv" && !e.altKey){ uvView.zoom(Number(digit[1])); return; }
        if (e.altKey) v3dCam.save(Number(digit[1])); else v3dCam.recall(Number(digit[1]));
        return;
      }
    }
    if (!light.el.classList.contains("v3d-loading") && !e.altKey){
      if (digit && e.shiftKey){
        const n = Number(digit[1]);
        if (n <= 4){ e.preventDefault(); setShadeBase(["solid", "vertex", "textured", "normal"][n - 1]); return; }
        if (n === 5){ e.preventDefault(); toggleShadeFlag("wireOn"); return; }
        if (n === 6){ e.preventDefault(); toggleShadeFlag("xrayOn"); return; }
        if (n === 7){ e.preventDefault(); onV3DRotate?.(); return; }
      }
      if (e.code === "KeyG"){ e.preventDefault(); toggleV3DPanel(); return; }
      if (hotkey(e, "KeyU") && !currentAssetIsSplat){ e.preventDefault(); toggleUV(); return; }
    }
  }
  if (light && hotkey(e, "KeyI") && !typing3d){ e.preventDefault(); toggleLightInfo(); return; }
  // D in the lightbox of a PSD opens its layers panel; everywhere else it toggles Details.
  if (hotkey(e, "KeyD") && !typing && !in3d){
    if (light && !$("psdBtn").hidden) togglePsdPanel(); else toggleDetails();
  }
});
// Held-key tracking for the WASD camera — released keys are dropped regardless of what else is
// going on, and losing window focus drops everything (a keyup would never arrive, leaving the
// camera drifting).
document.addEventListener("keyup", (e) => { camKeys.delete(e.code); });
window.addEventListener("blur", () => camKeys.clear());

// --- Window geometry --------------------------------------------------------------------------
// In its own app window (the launcher adds ?app=1 — a plain browser tab must not be tracked) the
// page reports the window's position/size to the server; Sight.py turns the saved w/h into
// --window-size on the next launch, and launches the window off-screen on purpose (see
// reveal_when_ready() in Sight.py) rather than at the saved position, so its blank/white first
// frame is never visible.
//
// moveIntoView() below is what brings it to the saved (or, first run, a centered) position —
// called once real content is actually on screen (see __signalReady() near the top of this file),
// so this is also the moment the window first becomes visible to the user. It runs here, in the
// browser's own coordinate space, rather than as a cross-process move from Sight.py, because that
// space is always correct: Sight.py's own view of monitor positions can be thrown off by DPI
// scaling (confirmed by testing — even explicitly requesting DPI-awareness there didn't make it
// reliable), while outerWidth/screen.availWidth/moveTo() here never are. Size is not corrected here
// on purpose: Sight.py already launched the window at the saved (or a sensible default) size, so
// only its position — where off-screen deliberately left it wrong — needs fixing. This still runs
// even when the saved state is maximized: maximizing itself has no in-browser equivalent, so
// Sight.py's reveal_when_ready() applies that part, but it needs the window on the *right monitor*
// first (maximizing straight from off-screen would maximize onto whichever one Windows considers
// nearest to that off-screen point, not necessarily the right one on a multi-monitor setup) — this
// still moves it to the saved normal bounds first, so that's correct regardless.
function moveIntoView(saved){
  if (!new URLSearchParams(location.search).has("app")) return;
  try {
    if (saved && "x" in saved) moveTo(saved.x, saved.y);
    else moveTo(Math.round((screen.availWidth - outerWidth) / 2), Math.round((screen.availHeight - outerHeight) / 2));
  } catch {}
}

function startWindowTracker(saved){
  if (!new URLSearchParams(location.search).has("app")) return;
  let normal = saved ? { x: saved.x, y: saved.y, w: saved.w, h: saved.h } : null;
  let sent = saved ? { ...normal, max: !!saved.max } : null;
  // resizeTo()/moveTo() can land a pixel off at fractional display scaling; without a tolerance
  // that would be saved and re-applied on every launch, creeping a pixel at a time.
  const same = (a, b) => a && b && a.max === b.max && ["x", "y", "w", "h"].every((k) => Math.abs(a[k] - b[k]) <= 2);
  const report = (unloading) => {
    // Minimized or hidden windows report nonsense (Windows parks them at -32000).
    if (!unloading && document.visibilityState === "hidden") return;
    if (outerWidth < 320 || outerHeight < 240 || screenX < -20000 || screenY < -20000) return;
    const maxed = outerWidth >= screen.availWidth - 4 && outerHeight >= screen.availHeight - 4;
    if (!maxed) normal = { x: screenX, y: screenY, w: outerWidth, h: outerHeight };
    if (!normal) return;
    const geo = { ...normal, max: maxed };
    if (same(geo, sent)) return;
    sent = geo;
    fetch("/api/settings/window", {
      method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(geo), keepalive: true,
    }).catch(() => {});
  };
  setInterval(() => report(false), 400); // there is no "window moved" event — poll for it
  window.addEventListener("resize", () => report(false));
  window.addEventListener("pagehide", () => report(true));
}

applyUi();
insp.style.display = state.details ? "" : "none";
startWindowTracker(serverSettings?.window);
applyViewDom();
renderOptions();
renderSortBtn();
renderNav();
renderStatus();
// Reveal the shell now — sources/tags/counts and the asset grid still show their empty state and
// fill in a moment later. Waiting for that data before showing anything just makes the tab sit
// blank for longer; showing the chrome immediately gives the user something to get their bearings
// on while refreshMeta/pull come back.
window.__revealApp?.();
renderBuildTag();
await refreshMeta();
await pull(true);
connectEvents();
startHeartbeat();
// Only now, with real sources/tags/counts and the asset grid actually on screen: move the
// off-screen-launched window into view (see moveIntoView() above) and tell Sight.py's launcher it
// may maximize/focus it — see __signalReady() near the top of this file for why that's a separate,
// later signal than __revealApp().
moveIntoView(serverSettings?.window);
window.__signalReady?.();
</script>
</body>
</html>
