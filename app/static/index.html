function assetById(id){ return state.items.find(x => x.id === id); }

function selectedAssets(){
  return state.selectedIds.map(assetById).filter(Boolean);
}

function shared(vals){
  if (!vals.length) return { multi: true, value: "Multiple values" };
  const a = vals[0];
  return vals.every(v => v === a) ? { multi: false, value: a } : { multi: true, value: "Multiple values" };
}

// The server serves thumbnails as immutable, so a regenerated one only shows up under a new URL:
// thumb_v (the cached file's mtime, from the asset list / the "thumb" event) is the cache-buster.
function thumbUrl(a){
  return "/api/thumb/" + a.id + (a.thumb_v ? "?v=" + a.thumb_v : "");
}
function thumbSrc(a){
  if (a.has_thumb || seenThumb.has(a.id)) return thumbUrl(a);
  return "";
}

// Force-regenerates the thumbnails of the current selection (fixes stale ones — e.g. a black
// backdrop from before models were rendered transparent). Cards go back to their placeholder
// first, so a "thumb" event that races the request can't be wiped afterwards.
async function refreshThumbs(){
  const ids = state.selectedIds.slice();
  if (!ids.length) return;
  for (const id of ids){
    const a = assetById(id);
    seenThumb.delete(id);
    if (!a) continue;
    a.has_thumb = 0;
    delete a.thumb_v;
    const el = cardPool.get(id);
    if (el) fillThumb(el, a, false);
  }
  let done = [];
  try {
    const r = await api("/api/thumbs/refresh", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ids }),
    });
    done = r.ids || [];
  } catch (err) {
    console.warn("thumbnail refresh failed", err);
  }
  // The server can't render 3D models (no headless GL) — re-render those here.
  for (const id of done){
    const a = assetById(id);
    if (a && a.kind === "model3d") ensureModelThumb(a, true);
  }
}

function renderInsp(){
  const sel = selectedAssets();
  if (!sel.length){
    clearTimeout(inspBoot3dTimer);
    if (!light) dispose3d("v3d");
    insp.innerHTML = `<div class="sub" style="padding:24px 8px">Select a file</div>`;
    return;
  }
  if (sel.length > 1){
    renderInspMany(sel);
    return;
  }
  const a = sel[0];
  const thumb = thumbSrc(a);
  const file = `/api/file/${a.id}`;
  let preview = `<div class="ph">${KIND[a.kind]||a.kind}</div>`;
  if (a.status === "missing") preview = `<div style="color:var(--danger)">File not found</div>`;
  else if (a.ext === ".psd") preview = `<img id="psdPrev" src="/api/psd/${a.id}/preview" alt="" />`;
  else if (a.kind === "image") preview = `<img src="${thumb || file}" alt="" />`;
  else if (a.kind === "video") preview = `<video src="${file}" controls preload="auto"></video>`;
  else if (a.kind === "audio") preview = `<div class="wave" id="waveInsp"></div>`;
  else if (a.kind === "model3d") preview = `<div class="view3d" id="v3d"></div>`;
  else if (a.kind === "font") preview = `<div id="fontInsp" style="width:100%;height:100%"></div>`;
  else if (a.kind === "document") preview = `<div id="docInsp" style="width:100%;height:100%"></div>`;
  const st = a.status === "missing" ? "missing" : "on disk";
  insp.innerHTML = `
    <div class="preview">${preview}</div>
    <h2 style="font-family:var(--display);font-weight:400;font-size:18px;margin:12px 0 4px">${esc(a.name)}</h2>
    <div class="sub" style="word-break:break-all">${esc(a.path)}</div>
    <dl>
      <dt>Type</dt><dd>${KIND[a.kind]||a.kind} ${a.ext}</dd>
      <dt>Size</dt><dd>${bytes(a.size)}</dd>
      <dt>Frame</dt><dd>${a.width && a.height ? a.width+"×"+a.height : "—"}</dd>
      <dt>Status</dt><dd>${st}</dd>
    </dl>
    <label class="field">Rating
      <select id="rating">${[0,1,2,3,4,5].map(n => `<option value="${n}" ${a.rating===n?"selected":""}>${n ? n : "—"}</option>`).join("")}</select>
    </label>
    <label class="field">Tags
      <div class="chips" id="tagChips"></div>
      <input id="tags" value="" autocomplete="off" />
      <div class="suggest" id="tagSuggest" hidden></div>
    </label>
    <label class="field">Note
      <textarea id="note">${esc(a.note||"")}</textarea>
    </label>
    <div id="layerBox"></div>
    ${actionButtons()}
  `;
  paintTagChips(sel);
  $("rating").onchange = () => patchMany(sel.map(x => x.id), { rating: Number($("rating").value) });
  bindTagInput(sel);
  $("note").onblur = () => patchMany(sel.map(x => x.id), { note: $("note").value });
  bindActions(sel);
  clearTimeout(inspBoot3dTimer);
  if (a.kind === "model3d" && a.status !== "missing"){
    // Loading a model is a full fetch + synchronous parse that can't be cancelled once
    // started — clicking through several 3D thumbnails in a row used to fire one of these
    // per click and pile them up on the main thread until the UI stopped responding.
    // Debounce so only the selection the user actually settles on triggers a load.
    // While the lightbox is open the inspector is hidden behind it — booting a second copy of
    // the same model there doubled the fetch + parse and made the lightbox load slower;
    // closeLight() boots it once the lightbox is gone.
    if (light) dispose3d("v3d");
    else scheduleInspBoot3d(a);
  } else if (!light){
    // Selection moved off a 3D asset — tear down its still-running viewer/render loop instead
    // of leaving it rendering forever in the background (skip while the lightbox owns it).
    dispose3d("v3d");
  }
  if (a.kind === "audio" && a.status !== "missing") mountWave("waveInsp", a.id, file);
  if (a.kind === "font" && a.status !== "missing") mountFontStage($("fontInsp"), a);
  if (a.kind === "document" && a.status !== "missing") mountDocStage($("docInsp"), a);
  if (a.ext === ".psd") loadPsdLayers(a.id);
}

function scheduleInspBoot3d(a){
  clearTimeout(inspBoot3dTimer);
  inspBoot3dTimer = setTimeout(() => {
    if (state.selected === a.id && !light && $("v3d")) boot3d("v3d", a.id, `/api/file/${a.id}`, a.ext, thumbSrc(a));
  }, 150);
}

function renderInspMany(sel){
  const show = sel.slice(0, 5);
  const n = show.length;
  const stack = show.map((a, i) => {
    const t = (n - 1) / 2;
    const rot = (i - t) * 8;
    const x = (i - t) * 12;
    const y = Math.abs(i - t) * 3;
    const src = thumbSrc(a);
    const inner = src ? `<img src="${src}" alt="" onload="markSmallSrc(this);syncPixelation(this,this.parentElement)">` : `<div class="ph">${(KIND[a.kind]||"?")[0]}</div>`;
    return `<i style="transform:translate(${x}px,${y}px) rotate(${rot}deg);z-index:${i}">${inner}</i>`;
  }).join("");
  const type = shared(sel.map(a => (KIND[a.kind]||a.kind) + " " + a.ext));
  const size = shared(sel.map(a => bytes(a.size)));
  const frame = shared(sel.map(a => a.width && a.height ? a.width+"×"+a.height : "—"));
  const status = shared(sel.map(a => a.status === "missing" ? "missing" : "on disk"));
  const rating = shared(sel.map(a => String(a.rating || 0)));
  const note = shared(sel.map(a => a.note || ""));
  const dd = (s) => s.multi ? `<dd class="dd-multi">Multiple values</dd>` : `<dd>${esc(s.value)}</dd>`;
  insp.innerHTML = `
    <div class="preview"><div class="stack">${stack}${sel.length>5?`<span class="more">${sel.length} files</span>`:""}</div></div>
    <h2 style="font-family:var(--display);font-weight:400;font-size:18px;margin:12px 0 4px">${sel.length} selected</h2>
    <dl>
      <dt>Type</dt>${dd(type)}
      <dt>Size</dt>${dd(size)}
      <dt>Frame</dt>${dd(frame)}
      <dt>Status</dt>${dd(status)}
    </dl>
    <label class="field">Rating
      <select id="rating">
        ${rating.multi ? `<option value="" selected>Multiple values</option>` : ""}
        ${[0,1,2,3,4,5].map(n => `<option value="${n}" ${!rating.multi && rating.value===String(n)?"selected":""}>${n ? n : "—"}</option>`).join("")}
      </select>
    </label>
    <label class="field">Tags
      <div class="chips" id="tagChips"></div>
      <input id="tags" value="" autocomplete="off" />
      <div class="suggest" id="tagSuggest" hidden></div>
    </label>
    <label class="field">Note
      <textarea id="note" placeholder="${note.multi ? "Multiple values" : ""}">${note.multi ? "" : esc(note.value)}</textarea>
    </label>
    ${actionButtons()}
  `;
  paintTagChips(sel);
  $("rating").onchange = () => {
    const v = $("rating").value;
    if (v === "") return;
    patchMany(sel.map(x => x.id), { rating: Number(v) });
  };
  bindTagInput(sel);
  $("note").onblur = () => {
    const v = $("note").value;
    if (note.multi && !v) return;
    patchMany(sel.map(x => x.id), { note: v });
  };
  bindActions(sel);
}

function canRemoveFromFolder(){
  const cid = state.filter.collection;
  if (!cid || !state.selectedIds.length) return false;
  const col = (state.meta.collections || []).find((c) => c.id === cid);
  return !!(col && col.count > 0);
}

function actionButtons(){
  let html = `<div class="actions">
      <button class="btn ghost" id="reveal">Locate</button>
      <button class="btn ghost" id="open">Open</button>
      <button class="btn ghost" id="refreshThumbs" type="button" style="flex:none;width:40px;padding:0" title="Refresh thumbnails of the selection" aria-label="Refresh thumbnails">⟳</button>`;
  if (canRemoveFromFolder()) html += `<button class="btn ghost" id="unfolder">Remove From Folder</button>`;
  return html + `</div>`;
}

function bindActions(sel){
  $("open").onclick = () => api(`/api/assets/${sel[0].id}/open`, { method: "POST" });
  $("reveal").onclick = () => api(`/api/assets/${sel[0].id}/reveal`, { method: "POST" });
  $("refreshThumbs").onclick = refreshThumbs;
  $("unfolder")?.addEventListener("click", removeFromFolder);
}

async function removeFromFolder(){
  const cid = state.filter.collection;
  const ids = state.selectedIds.slice();
  if (!cid || !ids.length) return;
  await api("/api/collections/" + cid + "/assets", {
    method: "DELETE",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ ids }),
  });
  hideCtx();
  await refreshMeta();
  resetList();
}

function paintTagChips(sel){
  const box = $("tagChips");
  if (!box) return;
  const counts = new Map();
  for (const a of sel) for (const t of a.tags || []) counts.set(t, (counts.get(t) || 0) + 1);
  const names = [...counts.keys()].sort((a, b) => a.localeCompare(b, "en"));
  box.innerHTML = names.map(t => {
    const partial = counts.get(t) < sel.length;
    return `<span class="chip${partial ? " partial" : ""}">${esc(t)}<button type="button" class="chip-x" data-tag="${esc(t)}" title="Remove tag from selection">×</button></span>`;
  }).join("");
  box.querySelectorAll(".chip-x").forEach((b) => {
    b.onclick = () => removeTagFromSelected(b.dataset.tag, sel);
  });
}

function bindTagInput(sel){
  const input = $("tags");
  const box = $("tagSuggest");
  if (!input) return;
  input.oninput = () => suggestTags(input, box, sel);
  input.onkeydown = (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      const t = input.value.trim().replace(/,$/, "");
      if (t) addTagToSelected(t, sel);
      input.value = "";
      box.hidden = true;
    }
  };
}

function suggestTags(input, box, sel){
  const cur = input.value.trim().toLowerCase();
  if (cur.length < 1){ box.hidden = true; return; }
  const have = new Set();
  for (const a of sel) for (const t of a.tags || []) have.add(t.toLowerCase());
  const hits = (state.meta.tags || []).filter(t => t.name.toLowerCase().includes(cur) && !have.has(t.name.toLowerCase())).slice(0, 8);
  if (!hits.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = hits.map(t => `<button type="button">${esc(t.name)}</button>`).join("");
  box.querySelectorAll("button").forEach((b) => {
    b.onmousedown = (e) => e.preventDefault();
    b.onclick = () => {
      addTagToSelected(b.textContent, sel);
      input.value = "";
      box.hidden = true;
      input.focus();
    };
  });
}

async function addTagToSelected(tag, sel){
  const t = tag.trim();
  if (!t) return;
  await Promise.all(sel.map((a) => {
    const tags = [...new Set([...(a.tags || []), t])];
    a.tags = tags;
    return patch(a.id, { tags }, true);
  }));
  renderInsp();
  scheduleMeta();
}

async function removeTagFromSelected(tag, sel){
  const low = tag.toLowerCase();
  await Promise.all(sel.filter((a) => (a.tags || []).some((x) => x.toLowerCase() === low)).map((a) => {
    const tags = a.tags.filter((x) => x.toLowerCase() !== low);
    a.tags = tags;
    return patch(a.id, { tags }, true);
  }));
  renderInsp();
  scheduleMeta();
}

async function loadPsdLayers(id){
  const box = $("layerBox");
  if (!box) return;
  let layers = [];
  try { layers = await api("/api/psd/" + id + "/layers"); } catch { layers = []; }
  if (!layers.length) return;
  box.className = "layers";
  box.innerHTML = `<h3>Layers</h3>` + layers.map(l =>
    `<button type="button" class="layer" data-i="${l.index}"><span>${esc(l.name)}</span><em class="badge">${l.kind === "group" ? "group" : (l.width+"×"+l.height)}</em></button>`
  ).join("");
  box.querySelectorAll(".layer").forEach((b) => {
    b.onclick = () => {
      box.querySelectorAll(".layer").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      const img = $("psdPrev");
      if (img) img.src = `/api/psd/${id}/layer/${b.dataset.i}`;
    };
  });
}

async function patch(id, body, silent){
  const a = await api("/api/assets/"+id, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  const i = state.items.findIndex(x => x.id === id);
  if (i >= 0) state.items[i] = { ...state.items[i], ...a };
  if (!silent){
    renderInsp();
    scheduleMeta();
  }
}

async function patchMany(ids, body){
  await Promise.all(ids.map((id) => patch(id, body, true)));
  renderInsp();
  scheduleMeta();
}

let metaT = 0;
function scheduleMeta(){
  clearTimeout(metaT);
  metaT = setTimeout(refreshMeta, 200);
}

// With `defer`, the render loop stops now but the GL context is kept alive and a release function
// is returned for the caller to run later — closeLight() uses it so the canvas isn't torn down
// while it's still visible during the fade-out.
function dispose3d(elId, defer){
  // onV3DEnvPresetChange/onV3DEnvFile are lightbox-only (the settings panel's environment
  // picker) — only clear them when it's the lightbox's own viewer being torn down, not the
  // inspector's, or closing the inspector preview would break the still-open lightbox's picker.
  if (elId === "light3d"){ onV3DEnvPresetChange = null; onV3DEnvFile = null; onV3DRotate = null; v3dCam = null; camKeys.clear(); }
  const ctl = threeCtls.get(elId);
  if (!ctl) return null;
  try { ctl.stop(); } catch {}
  threeCtls.delete(elId);
  if (defer) return () => releaseRenderer(ctl.renderer);
  releaseRenderer(ctl.renderer);
  return null;
}

// renderer.dispose() only frees three.js's own bookkeeping — the canvas keeps its WebGL context
// until the garbage collector gets to it. Browsers cap live contexts (~16) and, past that, silently
// kill the *oldest* ones, so opening/closing 3D previews in quick succession could take the context
// out from under a viewer that was still on screen (it just goes black). Release it explicitly.
function releaseRenderer(renderer){
  try { renderer.dispose(); } catch {}
  try { renderer.forceContextLoss(); } catch {}
}

const MODEL_EXT_LOADERS = new Set([".glb", ".gltf", ".obj", ".fbx", ".stl", ".ply", ".usdz", ".splat", ".spz", ".ksplat", ".sog"]);
// Formats that are unambiguously Gaussian splats. .ply is NOT here — it's also the standard mesh
// PLY extension, so splat .ply files are told apart by sniffing the header (see isSplatAsset()).
const SPLAT_EXT = new Set([".splat", ".spz", ".ksplat", ".sog"]);
// Our file URLs (/api/file/{id}) carry no extension, so Spark can't infer the format from the
// path like its own examples do — pass it the SplatFileType explicitly instead.
const SPLAT_FILE_TYPE_BY_EXT = { ".ply": "ply", ".spz": "spz", ".splat": "splat", ".ksplat": "ksplat", ".sog": "pcsogszip" };

// Shared by the interactive viewer (boot3d) and the offscreen thumbnailer (ensureModelThumb) —
// dispatches by extension, returns an Object3D, or null for a format three.js has no loader for
// (the caller shows an honest "not supported" placeholder instead of faking a shape).
let _gltfDraco = null, _gltfMeshopt = null;
// Some glTF exporters (e.g. Tripo3D) compress geometry with EXT_meshopt_compression or
// Draco; without wiring a decoder, GLTFLoader throws instead of just skipping the extension.
async function gltfLoaderWithDecoders(manager){
  const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
  const loader = new GLTFLoader(manager);
  if (!_gltfDraco){
    const { DRACOLoader } = await import("three/addons/loaders/DRACOLoader.js");
    _gltfDraco = new DRACOLoader();
    _gltfDraco.setDecoderPath("/static/vendor/jsm/libs/draco/gltf/");
  }
  if (!_gltfMeshopt){
    const mod = await import("three/addons/libs/meshopt_decoder.module.js");
    _gltfMeshopt = mod.MeshoptDecoder;
  }
  loader.setDRACOLoader(_gltfDraco);
  loader.setMeshoptDecoder(_gltfMeshopt);
  return loader;
}

// Relative files a model asks for (an FBX's textures, a .gltf's .bin) resolve against our
// extension-less /api/file/{id} URL and would all 404 — reroute them to the server, which looks
// beside the model, in the usual texture folders and among the indexed images. `idle` settles
// once every sub-resource the loaders kicked off has loaded or failed.
const FILE_URL_RE = /^(?:https?:\/\/[^/]+)?\/api\/file\/([^?#]+)$/;
function makeModelManager(THREE, aid){
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((u) => {
    const m = FILE_URL_RE.exec(u);
    if (!m) return u;
    let rest = m[1];
    try { rest = decodeURIComponent(rest); } catch {}
    return /^[0-9a-f]{16}$/.test(rest) ? u : `/api/model-res/${aid}?name=${encodeURIComponent(rest)}`;
  });
  const idle = new Promise((resolve) => { manager.onLoad = resolve; });
  return { manager, idle };
}

// A texture whose file could not be found stays image-less — sampled as black, which paints the
// model solid black (map) or fully invisible (alphaMap). Drop those slots so the flat material
// colour shows instead (and applyCompanions() may still fill them from a sibling file).
const TEXTURE_SLOTS = ["map", "normalMap", "roughnessMap", "metalnessMap", "aoMap", "emissiveMap", "alphaMap", "bumpMap", "specularMap", "lightMap", "displacementMap"];
function dropDeadTextures(obj){
  obj.traverse((c) => {
    const mats = Array.isArray(c.material) ? c.material : (c.material ? [c.material] : []);
    for (const m of mats){
      for (const slot of TEXTURE_SLOTS){
        const t = m[slot];
        if (t && t.isTexture && !t.image){ m[slot] = null; m.needsUpdate = true; }
      }
    }
  });
}

// fetch() with byte-count progress, for the responses no three.js loader is in charge of.
async function fetchBufferWithProgress(url, onProgress){
  const res = await fetch(url);
  if (!res.ok) return null;
  const total = Number(res.headers.get("Content-Length")) || 0;
  if (!res.body || !total || !onProgress) return await res.arrayBuffer();
  const reader = res.body.getReader();
  const buf = new Uint8Array(total);
  let loaded = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    if (loaded + value.length > total) return await (await fetch(url)).arrayBuffer(); // length lied
    buf.set(value, loaded);
    loaded += value.length;
    onProgress({ lengthComputable: true, loaded, total });
  }
  return buf.buffer;
}

async function loadModel(THREE, url, ext, onProgress, aid){
  const low = (ext || "").toLowerCase();
  if (low === ".glb" || low === ".gltf"){
    const { manager } = makeModelManager(THREE, aid);
    const loader = await gltfLoaderWithDecoders(manager);
    return (await loader.loadAsync(url, onProgress)).scene;
  }
  if (low === ".usdz"){
    // three.js has no USD loader — the server converts once (via the optional
    // `pxr` USD library) into a plain .glb, which GLTFLoader then renders
    // exactly like any other glTF asset. A 404 here means the server-side
    // conversion isn't available or failed; the caller's null check then
    // falls back to the "open in an external viewer" placeholder.
    const data = await fetchBufferWithProgress(`/api/model-glb/${aid}`, onProgress);
    if (!data) return null;
    const loader = await gltfLoaderWithDecoders();
    return (await loader.parseAsync(data, "")).scene;
  }
  if (low === ".obj"){
    const { OBJLoader } = await import("three/addons/loaders/OBJLoader.js");
    return await new OBJLoader().loadAsync(url, onProgress);
  }
  if (low === ".fbx"){
    const { FBXLoader } = await import("three/addons/loaders/FBXLoader.js");
    const { manager, idle } = makeModelManager(THREE, aid);
    const obj = await new FBXLoader(manager).loadAsync(url, onProgress);
    // Textures load after the mesh parses; wait for them (bounded) so a thumbnail — or the first
    // frame — isn't taken untextured, then discard the ones that never arrived.
    await Promise.race([idle, new Promise((r) => setTimeout(r, 20000))]);
    dropDeadTextures(obj);
    return obj;
  }
  if (low === ".stl"){
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    const geometry = await new STLLoader().loadAsync(url, onProgress);
    return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xc5cdd8, metalness: 0.25, roughness: 0.55 }));
  }
  if (low === ".ply"){
    const { PLYLoader } = await import("three/addons/loaders/PLYLoader.js");
    const geometry = await new PLYLoader().loadAsync(url, onProgress);
    geometry.computeVertexNormals();
    const hasColor = !!geometry.getAttribute("color");
    return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xc5cdd8, vertexColors: hasColor, metalness: 0.2, roughness: 0.6 }));
  }
  return null;
}

// A splat .ply's header carries per-splat opacity + spherical-harmonic/scale/rotation properties
// that a mesh PLY never has — sniff just the header (a Range request) instead of guessing from
// the extension alone, since .ply is shared between the two file families.
const PLY_SNIFF_BYTES = 8192;
async function sniffPlyIsSplat(url){
  try {
    const res = await fetch(url, { headers: { Range: `bytes=0-${PLY_SNIFF_BYTES - 1}` } });
    // Read only the first PLY_SNIFF_BYTES off the stream and stop — a mesh PLY can be small, but
    // a splat PLY is routinely hundreds of MB, and not every static file server honors Range
    // (in which case res.body still starts with the same header bytes; reading .arrayBuffer()
    // instead would pull the whole file into memory just to look at its header).
    const reader = res.body.getReader();
    const chunks = [];
    let total = 0;
    while (total < PLY_SNIFF_BYTES){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      total += value.length;
    }
    reader.cancel().catch(() => {});
    const buf = new Uint8Array(total);
    let off = 0;
    for (const c of chunks){ buf.set(c, off); off += c.length; }
    const header = new TextDecoder("ascii").decode(buf).split("end_header")[0];
    const hasOpacity = /^property\s+\S+\s+opacity\s*$/m.test(header);
    const hasSplatField = /^property\s+\S+\s+(f_dc_0|scale_0|rot_0)\s*$/m.test(header);
    return hasOpacity && hasSplatField;
  } catch {
    return false;
  }
}

const _plySplatCache = new Map(); // asset id -> Promise<boolean>, sniffed at most once per session
async function isSplatAsset(aid, ext){
  const low = (ext || "").toLowerCase();
  if (SPLAT_EXT.has(low)) return true;
  if (low !== ".ply") return false;
  if (!_plySplatCache.has(aid)) _plySplatCache.set(aid, sniffPlyIsSplat(`/api/file/${aid}`));
  return await _plySplatCache.get(aid);
}

// Manual "which way is up" for formats that don't say (STL/OBJ/FBX from Z-up tools lie on their
// side): each click turns the model a quarter turn about X (first click = Z-up -> Y-up). Remembered
// per asset; thumbnails follow it too (see flushRotatedThumb). USDZ declares its up axis and is
// already corrected server-side, so this is just the fallback there.
function getModelTurns(aid){
  try { return (Number(JSON.parse(localStorage.getItem("sight.v3dRot") || "{}")[aid]) || 0) & 3; } catch { return 0; }
}
function setModelTurns(aid, n){
  try {
    const m = JSON.parse(localStorage.getItem("sight.v3dRot") || "{}");
    if (n) m[aid] = n; else delete m[aid];
    putSetting("sight.v3dRot", JSON.stringify(m));
  } catch {}
}

function frameObject3d(THREE, obj, scene, camera, target){
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const center = box.getCenter(new THREE.Vector3());
  target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size*0.7, size*0.45, size*0.7));
  camera.near = size/100; camera.far = size*20; camera.updateProjectionMatrix();
  return size;
}

// Saved camera views, per model: { [assetId]: { "1": { p, t, turns }, … } } — Alt+1…9 stores the
// current view under that digit (overwriting), plain 1…9 recalls it. `p`/`t` are the camera
// position and orbit target; `turns` is the model's manual 90° turn count at save time, since a
// turn re-frames the model and a view saved before it would otherwise point at the wrong place.
const V3D_CAMS_KEY = "sight.v3dCams";
function readAllCams(){
  try { return JSON.parse(localStorage.getItem(V3D_CAMS_KEY) || "{}") || {}; } catch { return {}; }
}
function getModelCam(aid, slot){ return (readAllCams()[aid] || {})[slot] || null; }
function setModelCam(aid, slot, cam){
  try {
    const all = readAllCams();
    (all[aid] ||= {})[slot] = cam;
    putSetting(V3D_CAMS_KEY, JSON.stringify(all));
  } catch {}
}

let v3dToastTimer = 0;
function flashV3DToast(text){
  const el = $("v3dToast");
  if (!el) return;
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(v3dToastTimer);
  v3dToastTimer = setTimeout(() => el.classList.remove("on"), 1400);
}

// Camera behaviour that's the same for meshes and splats in the lightbox: WASD fly (moves the
// camera and the orbit target together, so orbiting keeps working from the new spot), frame-all
// (F) back to the framing the model opened with, and the Alt+1…9 / 1…9 saved views. The caller
// calls setHome() after every (re)framing and step() once per frame. `turns` is only passed by
// the mesh viewer, which can be turned in 90° steps.
function makeCameraRig(THREE, camera, controls, aid, turns){
  const home = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
  const fwd = new THREE.Vector3(), right = new THREE.Vector3();
  let extent = 1, last = 0;
  const view = (pos, target) => { camera.position.copy(pos); controls.target.copy(target); controls.update(); };
  return {
    setHome(size){
      extent = size || 1;
      home.pos.copy(camera.position);
      home.target.copy(controls.target);
    },
    frame(){ view(home.pos, home.target); flashV3DToast("Frame all"); },
    step(now){
      const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      if (!dt || !camKeys.size) return;
      camera.getWorldDirection(fwd);
      right.setFromMatrixColumn(camera.matrixWorld, 0);
      let f = 0, r = 0;
      if (camKeys.has("KeyW")) f++;
      if (camKeys.has("KeyS")) f--;
      if (camKeys.has("KeyD")) r++;
      if (camKeys.has("KeyA")) r--;
      if (!f && !r) return;
      fwd.multiplyScalar(f).addScaledVector(right, r).normalize().multiplyScalar(extent * 0.6 * state.v3d.camSpeed * dt);
      camera.position.add(fwd);
      controls.target.add(fwd);
    },
    save(slot){
      const t = turns ? turns.get() : 0;
      setModelCam(aid, slot, { p: camera.position.toArray(), t: controls.target.toArray(), turns: t });
      flashV3DToast(`View ${slot} saved`);
    },
    recall(slot){
      const cam = getModelCam(aid, slot);
      if (!cam){ flashV3DToast(`View ${slot} is empty — Alt+${slot} saves the current view`); return; }
      if (turns && (cam.turns || 0) !== turns.get()) turns.set(cam.turns || 0); // re-frames → resets `home` too
      view(new THREE.Vector3().fromArray(cam.p), new THREE.Vector3().fromArray(cam.t));
      flashV3DToast(`View ${slot}`);
    },
  };
}

// A few built-in procedural "sky" presets (no bundled HDRI, so nothing to fetch) plus support
// for loading any image from disk as an equirectangular environment map.
const ENV_PRESETS = {
  studio:   { top: 0xcfe0ff, horizon: 0x8a8f9a, bottom: 0x1c1c20 },
  sunset:   { top: 0xffb37a, horizon: 0xff8a5c, bottom: 0x1a1420 },
  overcast: { top: 0xc7cdd6, horizon: 0xaeb4bd, bottom: 0x6b7078 },
  night:    { top: 0x0c1830, horizon: 0x101828, bottom: 0x02050c },
};
// Bakes a simple vertical gradient "sky" through PMREMGenerator into a proper prefiltered env
// map, used for the lightbox 3D panel's "Environment light". Returns null (env toggle becomes
// a no-op) if anything about this fails, rather than breaking the viewer.
function buildEnvTexture(THREE, renderer, colors){
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    const geo = new THREE.SphereGeometry(50, 32, 16);
    const pos = geo.attributes.position;
    const buf = new Float32Array(pos.count * 3);
    const top = new THREE.Color(colors.top), horizon = new THREE.Color(colors.horizon), bottom = new THREE.Color(colors.bottom);
    const tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const y = pos.getY(i) / 50;
      tmp.copy(horizon).lerp(y >= 0 ? top : bottom, Math.min(1, Math.abs(y) * 1.6));
      buf[i * 3] = tmp.r; buf[i * 3 + 1] = tmp.g; buf[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(buf, 3));
    const mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true });
    envScene.add(new THREE.Mesh(geo, mat));
    const rt = pmrem.fromScene(envScene, 0.02);
    pmrem.dispose();
    geo.dispose();
    mat.dispose();
    return rt.texture;
  } catch (err) {
    console.warn("environment map build failed", err);
    return null;
  }
}
// "Load any [image] from disk" — a regular equirectangular photo/render works fine through
// PMREMGenerator's fromEquirectangular; no .hdr-specific loader needed.
async function buildEnvTextureFromImage(THREE, renderer, url){
  try {
    const loader = new THREE.TextureLoader();
    const tex = await new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const rt = pmrem.fromEquirectangular(tex);
    pmrem.dispose();
    tex.dispose();
    return rt.texture;
  } catch (err) {
    console.warn("environment image load failed", err);
    return null;
  }
}

// Base shading swap (Blender-style: solid / vertex color / textured / normal), always starting
// from `origMats` (the materials the model actually loaded with) so repeated switches never
// compound. Wireframe and x-ray are separate overlay passes below — they layer on top of
// whichever base is active instead of being mutually exclusive with it.
function applyBaseMaterial(THREE, obj, origMats, mode){
  if (!obj || !origMats) return;
  obj.traverse((c) => {
    if (!c.isMesh) return;
    const cur = c.material;
    if (cur && cur.userData && cur.userData._v3dTemp) cur.dispose();
    let mat;
    if (mode === "solid") mat = new THREE.MeshStandardMaterial({ color: 0xb7bdc7, roughness: 0.85, metalness: 0.05 });
    else if (mode === "vertex"){
      const hasColor = !!c.geometry.attributes.color;
      mat = new THREE.MeshBasicMaterial({ vertexColors: hasColor, color: hasColor ? 0xffffff : 0x555555 });
    } else if (mode === "normal") mat = new THREE.MeshNormalMaterial();
    else mat = origMats.get(c); // "textured"
    if (mat !== origMats.get(c)) mat.userData._v3dTemp = true;
    c.material = mat;
  });
}
// Mutates the *current* material's transparency in place (instead of swapping to a dedicated
// x-ray material) so it layers over whatever base mode is active; the original opacity is
// stashed on first use and restored when toggled back off.
function applyXray(obj, on){
  if (!obj) return;
  obj.traverse((c) => {
    if (!c.isMesh || !c.material) return;
    const m = c.material;
    if (on){
      if (m.userData._xraySaved === undefined){
        m.userData._xraySaved = { opacity: m.opacity, transparent: m.transparent, depthWrite: m.depthWrite };
      }
      m.transparent = true;
      m.opacity = 0.3;
      m.depthWrite = false;
    } else if (m.userData._xraySaved !== undefined){
      Object.assign(m, m.userData._xraySaved);
      delete m.userData._xraySaved;
    }
    m.needsUpdate = true;
  });
}
// A sibling LineSegments per mesh — toggling `.wireframe` on the base material would *replace*
// its solid fill instead of drawing edges on top of it, so this adds a real overlay mesh.
function setWireOverlay(THREE, obj, on){
  if (!obj) return;
  obj.traverse((c) => {
    if (!c.isMesh) return;
    let ov = c.userData._wireOverlay;
    if (on){
      if (!ov){
        const wg = new THREE.WireframeGeometry(c.geometry);
        ov = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0x9fb4c7, transparent: true, opacity: 0.55 }));
        ov.raycast = () => {};
        c.add(ov);
        c.userData._wireOverlay = ov;
      }
      ov.visible = true;
    } else if (ov) ov.visible = false;
  });
}
// Pushes each direct child of the loaded object outward from the object's own local center,
// along that child's own center direction — a quick way to see how a multi-part model is put
// together. `map` (child -> {pos, dir}) is built once per load, right after framing.
function applyExplode(map, scale, t){
  if (!map) return;
  for (const [child, info] of map) child.position.copy(info.pos).addScaledVector(info.dir, t * scale);
}

// Applies filename-heuristic companion textures (§4) to materials that loaded without a map —
// mainly OBJ/FBX files that reference external textures three.js can't resolve on its own here.
async function applyCompanions(THREE, obj, aid){
  let list = [];
  try { list = await api(`/api/assets/${aid}/companions`); } catch { return; }
  if (!list.length) return;
  const loader = new THREE.TextureLoader();
  // Awaited (bounded), so a thumbnail rendered right after isn't taken before these arrive.
  const pending = [];
  obj.traverse((child) => {
    const mats = Array.isArray(child.material) ? child.material : (child.material ? [child.material] : []);
    for (const mat of mats){
      for (const c of list){
        if (mat[c.slot]) continue;
        pending.push(loader.loadAsync(`/api/file/${c.id}`).then((tex) => {
          if (c.slot === "map" || c.slot === "emissiveMap") tex.colorSpace = THREE.SRGBColorSpace;
          mat[c.slot] = tex;
          mat.needsUpdate = true;
        }, () => {}));
      }
    }
  });
  if (pending.length) await Promise.race([Promise.all(pending), new Promise((r) => setTimeout(r, 15000))]);
}

async function boot3d(elId, aid, url, ext, thumbUrl, hostEl){
  dispose3d(elId);
  const el = hostEl || document.getElementById(elId);
  if (!el) return;
  // Paint the loading state — the asset's existing 2D thumbnail as a backdrop, a loading plate
  // on top — and yield a real frame *before* touching THREE/the model parser. Large models
  // parse synchronously on the main thread; without this yield the lightbox's own fade-in and
  // this placeholder both stay queued behind that parse instead of appearing first (the freeze
  // reported in feedback: the whole window hangs, then the lightbox pops in already loaded).
  el.replaceChildren();
  const loadingEl = document.createElement("div");
  loadingEl.className = "model-loading" + (elId === "light3d" ? " in-bar" : "");
  // Lightbox: the toolbar/gear stay hidden (CSS, .v3d-loading) until endLoading() — see showInLight.
  const lightEl = elId === "light3d" ? el.closest(".light") : null;
  // Cross-fades to the live canvas underneath instead of cutting to it.
  const endLoading = () => {
    lightEl?.classList.remove("v3d-loading");
    loadingEl.classList.add("done");
    setTimeout(() => loadingEl.remove(), 250);
  };
  // The thumbnail is rendered on a transparent background; paint the viewer's own background
  // behind it so the backdrop matches what the canvas will show once the model is up.
  loadingEl.style.backgroundColor = elId === "light3d" ? state.v3d.bg : "#0a0a0b";
  if (thumbUrl) loadingEl.style.backgroundImage = `url("${thumbUrl}")`;
  loadingEl.innerHTML = `<div class="plate"><div class="mprog-label">Loading model…</div><div class="mprog indeterminate"><i></i></div></div>`;
  el.appendChild(loadingEl);
  // Real download progress where the loader reports it (byte counts — our own /api/file/ always
  // sends Content-Length, so this is almost always computable) instead of a plate that just sits
  // there with no way to tell "still working" from "hung" on a large model or a slow disk.
  function onModelProgress(evt){
    if (!el.isConnected || !el.contains(loadingEl)) return; // stage moved on
    const bar = loadingEl.querySelector(".mprog"), fill = bar && bar.querySelector("i");
    const lbl = loadingEl.querySelector(".mprog-label");
    if (!bar || !fill) return;
    if (evt && evt.lengthComputable && evt.total){
      bar.classList.remove("indeterminate");
      const pct = Math.round(Math.min(1, evt.loaded / evt.total) * 100);
      fill.style.width = pct + "%";
      if (lbl) lbl.textContent = `Loading model… ${pct}%`;
    } else {
      bar.classList.add("indeterminate");
      if (lbl) lbl.textContent = "Loading model…";
    }
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (!el.isConnected || !el.contains(loadingEl)) return; // stage moved on while we yielded
  const isLightbox = elId === "light3d"; // the inspector's small preview keeps the old fixed lighting
  try {
    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const scene = new THREE.Scene();
    const bgColor = new THREE.Color(isLightbox ? state.v3d.bg : 0x0a0a0b);
    scene.background = bgColor;
    const w = Math.max(el.clientWidth, 16), h = Math.max(el.clientHeight, 16);
    const camera = new THREE.PerspectiveCamera(50, w / h, 0.01, 2000);
    camera.position.set(2, 1.4, 2.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h);
    // The viewport can change under a live viewer (window resize, a lightbox mask/aspect change) —
    // both render loops call this each frame; it only does work when the host's size actually changed.
    let sizeW = w, sizeH = h;
    const syncSize = () => {
      const cw = el.clientWidth, ch = el.clientHeight;
      if (cw < 16 || ch < 16 || (cw === sizeW && ch === sizeH)) return;
      sizeW = cw; sizeH = ch;
      renderer.setSize(cw, ch);
      camera.aspect = cw / ch;
      camera.updateProjectionMatrix();
    };
    el.insertBefore(renderer.domElement, loadingEl);
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

    const low = (ext || "").toLowerCase();
    const splat = MODEL_EXT_LOADERS.has(low) ? await isSplatAsset(aid, low) : false;
    if (!el.isConnected || !el.contains(loadingEl)){ // stage moved on during the (possible) header sniff
      releaseRenderer(renderer); // not registered in threeCtls yet, so dispose3d() can't reach it
      return;
    }
    // The Shade toolbar (wireframe/x-ray/base-material/explode) only makes sense for lit
    // meshes — splats are pre-lit, baked spherical-harmonic color with no such controls. The
    // gear/settings panel stays available for both, with different content (see renderV3DPanel).
    if (isLightbox){
      $("v3dShade").hidden = splat;
      if (currentAssetIsSplat !== splat){
        currentAssetIsSplat = splat; // corrects showInLight()'s extension-only guess for .ply
        renderV3DPanel();
      }
    }
    if (splat){
      const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
      controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
      controls.zoomToCursor = true;
      let live = true, mesh = null, camRig = null;
      const loop = () => {
        if (!live) return;
        requestAnimationFrame(loop);
        syncSize();
        camRig?.step(performance.now());
        controls.update();
        // Live-applied from the Splat settings panel (tint/opacity are shader uniforms — free to
        // update every frame) — lightbox only, same convention the mesh rig uses for state.v3d.
        if (mesh && isLightbox){
          const v = state.v3d;
          bgColor.set(v.bg);
          mesh.recolor.r = v.splatR; mesh.recolor.g = v.splatG; mesh.recolor.b = v.splatB;
          mesh.opacity = v.splatOpacity;
        }
        renderer.render(scene, camera);
      };
      loop();
      threeCtls.set(elId, { renderer, stop(){ live = false; } });
      const { SparkRenderer, SplatMesh } = await import("@sparkjsdev/spark");
      scene.add(new SparkRenderer({ renderer }));
      mesh = new SplatMesh({ url, fileType: SPLAT_FILE_TYPE_BY_EXT[low], onProgress: onModelProgress });
      scene.add(mesh);
      await mesh.initialized;
      if (!live) return; // viewer was torn down (asset switched / lightbox closed) mid-load
      // Most splat exporters (COLMAP/3DGS convention) use a Y-down, Z-forward frame — flip to
      // three.js's Y-up, matching the orientation correction Spark's own examples always apply.
      mesh.quaternion.set(1, 0, 0, 0);
      mesh.updateMatrixWorld(true);
      const box = mesh.getBoundingBox(true).applyMatrix4(mesh.matrixWorld);
      const size = box.getSize(new THREE.Vector3()).length() || 1;
      const center = box.getCenter(new THREE.Vector3());
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(size*0.7, size*0.45, size*0.7));
      camera.near = size/100; camera.far = size*20; camera.updateProjectionMatrix();
      if (isLightbox){
        camRig = makeCameraRig(THREE, camera, controls, aid);
        camRig.setHome(size);
        v3dCam = camRig;
      }
      endLoading();
      return;
    }

    // --- lighting / floor / environment rig (lightbox only — driven live by state.v3d,
    // see syncRig() below and the settings panel in renderV3DPanel()) -------------------
    let ambientLight, rigLights = [], floor = null, grid = null, floorMatSolid, floorMatShadow, envTex = null;
    let lightDrag = null; // Alt+left-drag on the canvas — rotates all lights + the env map (see below)
    if (isLightbox){
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      ambientLight = new THREE.AmbientLight(0xffffff, state.v3d.ambient);
      scene.add(ambientLight);
      for (let i = 0; i < 3; i++){
        const l = new THREE.DirectionalLight(0xffffff, 1);
        l.castShadow = true;
        l.shadow.mapSize.set(1024, 1024);
        scene.add(l, l.target);
        rigLights.push(l);
      }
      floorMatSolid = new THREE.MeshStandardMaterial({ color: 0x17171b, roughness: 1 });
      floorMatShadow = new THREE.ShadowMaterial({ opacity: state.v3d.shadowStrength });
      floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), floorMatSolid);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      floor.visible = false;
      scene.add(floor);
      grid = new THREE.GridHelper(1, 20, 0x4a4a54, 0x26262c);
      grid.visible = false;
      scene.add(grid);
      envTex = buildEnvTexture(THREE, renderer, ENV_PRESETS[state.v3d.envPreset] || ENV_PRESETS.studio);
      // The settings panel's environment picker (renderV3DPanel) calls through these — it has
      // no direct access to the renderer/scene living in this closure.
      onV3DEnvPresetChange = (name) => {
        if (!live) return;
        const tex = buildEnvTexture(THREE, renderer, ENV_PRESETS[name] || ENV_PRESETS.studio);
        if (envTex) envTex.dispose();
        envTex = tex;
      };
      onV3DEnvFile = async (file) => {
        const url = URL.createObjectURL(file);
        try {
          const tex = await buildEnvTextureFromImage(THREE, renderer, url);
          if (!live || !tex) return;
          if (envTex) envTex.dispose();
          envTex = tex;
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      // Alt+left-click-drag rotates all lights + the environment map around the vertical axis.
      // Registered before OrbitControls binds its own pointerdown below, so on the shared
      // canvas element this handler runs first and can stopImmediatePropagation() to keep
      // OrbitControls from also starting an orbit drag for the same gesture.
      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (!e.altKey || e.button !== 0) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        lightDrag = { x: e.clientX, yaw0: state.v3d.lightYaw };
        renderer.domElement.setPointerCapture(e.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (e) => {
        if (!lightDrag) return;
        let yaw = (lightDrag.yaw0 + (e.clientX - lightDrag.x) * 0.5) % 360;
        if (yaw > 180) yaw -= 360; else if (yaw < -180) yaw += 360;
        state.v3d.lightYaw = yaw;
        saveV3D();
      });
      renderer.domElement.addEventListener("pointerup", () => { lightDrag = null; });
      renderer.domElement.addEventListener("pointercancel", () => { lightDrag = null; });
    } else {
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(3,5,2); scene.add(dir);
    }

    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
    // Match the pan/zoom convention every other viewer here uses (middle-drag pan, right-drag
    // + wheel zoom) — left stays orbit/rotate since 2D viewers have no equivalent for that.
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
    controls.zoomToCursor = true; // zoom toward the pointer, not the orbit target

    let obj = null, origMats = null, rigRadius = 5;
    let explodeMap = null, explodeScale = 1;
    let shadeApplied = { base: null, wire: null, xray: null, explode: null };
    const D2R = Math.PI / 180;
    function syncRig(){
      const v = state.v3d;
      bgColor.set(v.bg);
      for (let i = 0; i < 3; i++){
        const l = rigLights[i], n = i + 1;
        const on = v["l" + n + "on"];
        l.visible = on;
        if (!on) continue;
        l.intensity = v["l" + n + "i"];
        l.color.set(v["l" + n + "color"]);
        const az = (v["l" + n + "az"] + v.lightYaw) * D2R, el2 = v["l" + n + "el"] * D2R;
        const dir = new THREE.Vector3(Math.cos(el2) * Math.sin(az), Math.sin(el2), Math.cos(el2) * Math.cos(az));
        if (v.anchor === "camera") dir.applyQuaternion(camera.quaternion);
        l.position.copy(controls.target).addScaledVector(dir, rigRadius);
        l.target.position.copy(controls.target);
      }
      ambientLight.intensity = v.ambient;
      floor.visible = v.floor;
      grid.visible = v.grid;
      const wantMat = v.shadowOnly ? floorMatShadow : floorMatSolid;
      if (floor.material !== wantMat) floor.material = wantMat;
      floorMatShadow.opacity = v.shadowStrength;
      scene.environment = (v.env && envTex) ? envTex : null;
      scene.environmentIntensity = v.envStrength;
      scene.environmentRotation.y = v.lightYaw * D2R;
      if (obj){
        if (shadeApplied.base !== v.shadeBase){
          applyBaseMaterial(THREE, obj, origMats, v.shadeBase);
          shadeApplied.base = v.shadeBase;
          shadeApplied.xray = null; // materials were just swapped — force xray to reapply onto them
        }
        if (shadeApplied.xray !== v.xrayOn){
          applyXray(obj, v.xrayOn);
          shadeApplied.xray = v.xrayOn;
        }
        if (shadeApplied.wire !== v.wireOn){
          setWireOverlay(THREE, obj, v.wireOn);
          shadeApplied.wire = v.wireOn;
        }
        if (explodeMap && shadeApplied.explode !== v.explode){
          applyExplode(explodeMap, explodeScale, v.explode);
          shadeApplied.explode = v.explode;
        }
      }
    }

    let live = true, camRig = null;
    const loop = () => {
      if (!live) return;
      requestAnimationFrame(loop);
      syncSize();
      if (isLightbox) syncRig();
      camRig?.step(performance.now());
      controls.update();
      renderer.render(scene, camera);
    };
    loop();
    threeCtls.set(elId, { renderer, stop(){ live = false; } });
    if (!MODEL_EXT_LOADERS.has(low)){
      el.innerHTML = `<div class="ph">${low.slice(1) || "3D"} — open in an external viewer</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    obj = await loadModel(THREE, url, ext, onModelProgress, aid);
    if (!live) return; // viewer was torn down (asset switched / lightbox closed) mid-load
    if (!obj){
      el.innerHTML = `<div class="ph">${low.slice(1) || "3D"} — open in an external viewer</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    await applyCompanions(THREE, obj, aid);
    if (!live) return;
    endLoading();
    const baseQuat = obj.quaternion.clone(), basePos = obj.position.clone();
    const qTurn = new THREE.Quaternion(), xAxis = new THREE.Vector3(1, 0, 0);
    const applyTurns = (n) => {
      qTurn.setFromAxisAngle(xAxis, -n * Math.PI / 2);
      obj.quaternion.copy(baseQuat).premultiply(qTurn);
      obj.position.copy(basePos).applyQuaternion(qTurn);
      obj.updateMatrixWorld(true);
    };
    applyTurns(getModelTurns(aid));
    frameObject3d(THREE, obj, scene, camera, controls.target);
    // Floor / grid / shadow frustum all depend on the model's bounds, so a turn re-runs this.
    const fitRig = () => {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3()).length() || 1;
      rigRadius = size * 1.6;
      floor.geometry.dispose();
      floor.geometry = new THREE.PlaneGeometry(size * 3, size * 3);
      floor.position.y = box.min.y;
      scene.remove(grid);
      grid.geometry.dispose();
      grid.material.dispose();
      grid = new THREE.GridHelper(size * 3, 20, 0x4a4a54, 0x26262c);
      grid.visible = state.v3d.grid;
      grid.position.y = box.min.y + Math.max(0.001, size * 0.002);
      scene.add(grid);
      rigLights.forEach((l) => {
        l.shadow.camera.left = -size; l.shadow.camera.right = size;
        l.shadow.camera.top = size; l.shadow.camera.bottom = -size;
        l.shadow.camera.near = 0.1; l.shadow.camera.far = rigRadius * 3;
        l.shadow.camera.updateProjectionMatrix();
      });
      return { box, size };
    };
    if (isLightbox){
      const { box, size } = fitRig();
      // A turn re-frames the model, so it also moves the camera rig's "frame all" home. Saved
      // views that were taken at a different turn call this to put the model back that way first.
      const turnTo = (n) => {
        if (!live || !light) return;
        setModelTurns(aid, n);
        light.rotated = aid;
        applyTurns(n);
        camRig.setHome(frameObject3d(THREE, obj, scene, camera, controls.target));
        fitRig();
      };
      camRig = makeCameraRig(THREE, camera, controls, aid, { get: () => getModelTurns(aid), set: turnTo });
      camRig.setHome(size);
      v3dCam = camRig;
      onV3DRotate = () => turnTo((getModelTurns(aid) + 1) & 3);
      obj.traverse((c) => { if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; } });
      origMats = new Map();
      obj.traverse((c) => { if (c.isMesh) origMats.set(c, c.material); });
      // Explode rig: each direct child of the parts root gets pushed outward from the root's own
      // local center along that child's own center direction (see applyExplode above). Exporters
      // often wrap everything in a single root node, which would leave exactly one "part" that
      // can't move away from itself — so descend through such single-child wrappers first.
      let partsRoot = obj;
      while (partsRoot.children.length === 1 && !partsRoot.children[0].isMesh) partsRoot = partsRoot.children[0];
      obj.updateMatrixWorld(true);
      const centerLocal = partsRoot.worldToLocal(box.getCenter(new THREE.Vector3()));
      explodeMap = new Map();
      partsRoot.children.forEach((child) => {
        const cb = new THREE.Box3().setFromObject(child);
        if (cb.isEmpty()) return;
        const cLocal = partsRoot.worldToLocal(cb.getCenter(new THREE.Vector3()));
        const dir = cLocal.clone().sub(centerLocal);
        if (dir.lengthSq() < 1e-8) dir.set(0, 0, 0); else dir.normalize();
        explodeMap.set(child, { pos: child.position.clone(), dir });
      });
      explodeScale = size * 0.6;
      // A single-mesh model has nothing to pull apart — hide the slider (and its separator) rather
      // than offer a control that does nothing.
      const hasParts = explodeMap.size > 1;
      $("v3dExplode").hidden = !hasParts;
      $("v3dExplodeSep").hidden = !hasParts;
      if (!hasParts) explodeMap = null;
      shadeApplied = { base: null, wire: null, xray: null, explode: null }; // force the next syncRig() to (re)apply everything
      syncRig();
    }
  } catch (err) {
    el.innerHTML = `<div class="ph">3D failed to load</div>`;
    if (el.isConnected) lightEl?.classList.remove("v3d-loading");
    console.warn(err);
  }
}

function previewSrc(a){
  if (a.ext === ".psd") return `/api/psd/${a.id}/preview`;
  if (a.kind === "image" || a.kind === "video") return `/api/file/${a.id}`;
  return "";
}

const TEXT_EXT = new Set([
  ".txt", ".md", ".markdown", ".csv", ".tsv", ".json", ".xml", ".yaml", ".yml",
  ".log", ".ini", ".cfg", ".toml",
]);

function fillStage(stage, a){
  dispose3d("light3d");
  const src = previewSrc(a);
  if (a.kind === "video" || a.kind === "image" || a.ext === ".psd"){
    attachViewer(stage, a, src);
  } else if (a.kind === "model3d"){
    stage.innerHTML = `<div class="view3d" id="light3d"></div>`;
    boot3d("light3d", a.id, `/api/file/${a.id}`, a.ext, thumbSrc(a), stage.firstElementChild);
  } else if (a.kind === "audio"){
    stage.innerHTML = `<div class="wave wave-light" id="waveLight"></div>`;
    mountWave("waveLight", a.id, `/api/file/${a.id}`, true);
  } else if (a.kind === "font"){
    mountFontStage(stage, a);
  } else if (a.kind === "document"){
    mountDocStage(stage, a);
  } else {
    stage.innerHTML = `<p>${esc(a.name)}</p>`;
  }
}

async function mountFontStage(stage, a){
  // A font opened in the lightbox is *also* showing in the Inspector sidebar preview at the
  // same time (renderInsp runs for the selected asset regardless), so this can be mid-flight
  // in two places at once for the same asset id — an id-based lookup would find whichever
  // one's div happens to match first. Keep a direct element reference instead.
  const family = "sight-font-" + a.id;
  stage.innerHTML = `<div class="font-view"><div class="font-loading">Loading font…</div></div>`;
  const host = stage.querySelector(".font-view");
  try {
    const face = new FontFace(family, `url("/api/file/${a.id}")`);
    await face.load();
    document.fonts.add(face);
    if (!host.isConnected) return; // this stage moved on to a different asset meanwhile
    host.innerHTML = `
      <div class="font-sample" style="font-family:'${family}';font-size:64px;">Aa Bb Cc</div>
      <div class="font-sample" style="font-family:'${family}';font-size:26px;">The quick brown fox jumps over the lazy dog — 0123456789</div>
      <div class="font-sample" style="font-family:'${family}';font-size:15px;">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789 !@#$%^&amp;*()</div>
      <div class="font-name">${esc(a.name)}</div>
    `;
  } catch (err) {
    if (host.isConnected) host.innerHTML = `<div class="ph">font failed to load</div>`;
    console.warn(err);
  }
}

async function mountDocStage(stage, a){
  if (a.ext === ".pdf"){
    stage.innerHTML = `<embed class="doc-pdf" src="/api/file/${a.id}" type="application/pdf" />`;
    return;
  }
  if (TEXT_EXT.has(a.ext)){
    // Same simultaneous inspector+lightbox mount concern as mountFontStage above — use a
    // direct element reference rather than an id lookup.
    stage.innerHTML = `<div class="doc-text-wrap"><pre class="doc-text">Loading…</pre><div class="view-hud"></div></div>`;
    const wrap = stage.querySelector(".doc-text-wrap");
    const pre = stage.querySelector(".doc-text");
    const hud = stage.querySelector(".view-hud");
    const BASE_FONT = 13; // matches the .doc-text default in the stylesheet — scale is relative to it
    const ts = { scale: 1, zoomD: null };
    function applyTextZoom(){
      pre.style.fontSize = (BASE_FONT * ts.scale) + "px";
      hud.textContent = Math.abs(ts.scale - 1) < 0.012 ? "100%" : Math.round(ts.scale * 100) + "%";
    }
    function setTextScale(n){
      ts.scale = Math.min(12, Math.max(0.2, n));
      applyTextZoom();
    }
    // Right-click-drag resizes the text the same way it zooms images/video (same axis/speed/invert
    // settings); middle-click-drag scrolls it, same as MMB pan there — both use pointer capture
    // instead of the browser's own middle-click autoscroll, so it's a held drag, not a click-toggle.
    // Left-button drag is untouched either way, so selecting text still works as normal, and the
    // wheel is left alone too — it scrolls the text natively, exactly as it did before this.
    let panD = null;
    wrap.addEventListener("pointerdown", (e) => {
      if (e.button === 1){
        e.preventDefault();
        wrap.setPointerCapture(e.pointerId);
        panD = { x: e.clientX, y: e.clientY, sl: pre.scrollLeft, st: pre.scrollTop };
        return;
      }
      if (e.button !== 2) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      ts.zoomD = { x: e.clientX, y: e.clientY, scale: ts.scale };
    });
    wrap.addEventListener("pointermove", (e) => {
      if (panD){
        pre.scrollLeft = panD.sl - (e.clientX - panD.x);
        pre.scrollTop = panD.st - (e.clientY - panD.y);
        return;
      }
      if (!ts.zoomD) return;
      const t = state.theme;
      const raw = t.zoomAxis === "x" ? (e.clientX - ts.zoomD.x) : (ts.zoomD.y - e.clientY);
      const d = (t.zoomInvert ? -raw : raw) * 0.012 * (t.zoomSpeed ?? 1);
      setTextScale(ts.zoomD.scale * Math.exp(d));
    });
    const endDrag = () => { ts.zoomD = null; panD = null; };
    wrap.addEventListener("pointerup", endDrag);
    wrap.addEventListener("pointercancel", endDrag);
    wrap.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
    wrap.addEventListener("contextmenu", (e) => e.preventDefault());
    applyTextZoom();
    // Only claim the lightbox's digit-key zoom if this mount IS the open lightbox (this function
    // also renders the Inspector sidebar's document preview independently of the lightbox).
    if (light && light.id === a.id) light.setZoom = (n) => setTextScale(n);
    try {
      const data = await api(`/api/text/${a.id}`);
      if (!pre.isConnected) return;
      pre.textContent = data.text + (data.truncated ? "\n\n… (truncated)" : "");
    } catch {
      if (pre.isConnected) pre.textContent = "Failed to load preview.";
    }
    return;
  }
  stage.innerHTML = `<div class="ph">${esc((a.ext || "").slice(1) || "document")} — open in an external viewer</div>`;
}

function fmtTime(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}

// Waveform audio player — a hidden <audio> for playback, bars for visualization + click/drag
// seek. Peaks come from /api/waveform/{id} (ffmpeg-decoded server-side, cached to disk).
async function mountWave(hostId, aid, src, autoplay){
  const host = document.getElementById(hostId);
  if (!host) return;
  const stale = host.querySelector(".wave-audio");
  if (stale){ try { stale.pause(); } catch {} } // a still-playing previous track would keep going in the background otherwise
  host.innerHTML = `
    <div class="wave-body">
      <div class="wave-bars"><span class="wave-loading">decoding…</span></div>
      <div class="wave-time"><span data-cur>0:00</span><span data-dur>0:00</span></div>
    </div>
    <button type="button" class="wave-play" aria-label="Play">▶</button>
    <audio class="wave-audio" src="${src}" preload="metadata"${autoplay ? " autoplay" : ""}></audio>
  `;
  const audio = host.querySelector(".wave-audio");
  const btn = host.querySelector(".wave-play");
  const barsEl = host.querySelector(".wave-bars");
  barsEl.classList.toggle("mode-vertical", state.theme.waveMode === "vertical");
  const curEl = host.querySelector("[data-cur]");
  const durEl = host.querySelector("[data-dur]");
  let peaks = null, duration = 0, dragging = false, rafId = 0;
  if (light) light.audio = audio;

  function isCurrent(){ return host.querySelector(".wave-audio") === audio; }
  function paint(){
    if (!peaks) return;
    const ratio = duration ? Math.min(1, audio.currentTime / duration) : 0;
    barsEl.querySelectorAll(".wb").forEach((el, i) => {
      el.classList.toggle("on", peaks.length > 1 ? i / (peaks.length - 1) <= ratio : ratio >= 1);
    });
    curEl.textContent = fmtTime(audio.currentTime);
  }
  // A plain "paint on timeupdate" was the cause of the reported jumpy playback — timeupdate
  // fires only a few times a second, so bars advanced in visible batches. Driving the same
  // paint() from requestAnimationFrame while playing sweeps through bars smoothly instead.
  function tick(){
    if (!isCurrent()){ rafId = 0; return; }
    paint();
    rafId = requestAnimationFrame(tick);
  }
  function startTick(){ if (!rafId) rafId = requestAnimationFrame(tick); }
  function stopTick(){ if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

  btn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
  audio.onplay = () => { btn.textContent = "⏸"; startTick(); };
  audio.onpause = () => { btn.textContent = "▶"; stopTick(); paint(); };
  audio.onended = () => { stopTick(); paint(); };
  audio.onloadedmetadata = () => { if (audio.duration) duration = audio.duration; durEl.textContent = fmtTime(duration); };
  audio.ontimeupdate = () => { if (audio.paused) paint(); };

  function seekFromEvent(e){
    if (!duration) return;
    const rect = barsEl.getBoundingClientRect();
    const ratio = rect.width ? Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) : 0;
    audio.currentTime = ratio * duration;
    curEl.textContent = fmtTime(audio.currentTime);
    paint();
  }
  barsEl.addEventListener("pointerdown", (e) => { dragging = true; barsEl.setPointerCapture(e.pointerId); seekFromEvent(e); });
  barsEl.addEventListener("pointermove", (e) => { if (dragging) seekFromEvent(e); });
  barsEl.addEventListener("pointerup", () => { dragging = false; });
  barsEl.addEventListener("pointercancel", () => { dragging = false; });

  try {
    const data = await api("/api/waveform/" + aid);
    if (host.querySelector(".wave-audio") !== audio) return; // host was re-mounted meanwhile
    peaks = data.peaks || [];
    if (data.durationMs) duration = data.durationMs / 1000;
    durEl.textContent = fmtTime(duration);
    barsEl.innerHTML = peaks.map((p) => `<i class="wb" style="height:${Math.max(6, Math.round(p / 255 * 100))}%"></i>`).join("");
    paint();
  } catch {
    barsEl.innerHTML = `<span class="wave-loading">no waveform</span>`;
  }
}
// The video's RAM cache lives on the server (SlidingVideoCache): the player tells it where the
// playhead is and how much RAM the settings allow, it keeps a window of the file filled around that
// spot (sliding with the playhead) and reports the window back — that is the green strip on the
// timeline. The <video> itself just streams /api/file/<id>, which is served through that window,
// so playback starts at once instead of after the whole file has been downloaded.
function applyCacheSnap(snap){
  if (!light || !snap) return;
  light.snap = snap;
  paintVBar();
}
function paintVBar(){
  if (!light?.bar) return;
  const el = light.video;
  const dur = el && Number.isFinite(el.duration) ? el.duration : 0;
  const cur = light.scrubT != null ? light.scrubT : (el ? el.currentTime : 0);
  light.bar.querySelector("[data-cur]").textContent = fmtTime(cur);
  light.bar.querySelector("[data-dur]").textContent = fmtTime(dur);
  const play = light.bar.querySelector(".vplay");
  play.style.left = (dur > 0 ? (cur / dur) * 100 : 0) + "%";
  const cache = light.bar.querySelector(".vcache");
  const snap = light.snap;
  if (snap && snap.size > 0 && (snap.end > snap.start)){
    const a = (snap.start / snap.size) * 100;
    const b = (snap.end / snap.size) * 100;
    cache.style.left = a + "%";
    cache.style.width = Math.max(0, b - a) + "%";
  } else {
    cache.style.left = "0%";
    cache.style.width = "0%";
  }
  light.bar.querySelector("[data-mem]").textContent = snap ? `RAM ${Math.round(snap.bytes / 1048576)} / ${snap.mb} MB` : "";
}
// Tell the server where the playhead is (throttled: minGap ms between posts, with a trailing post
// so the last position always gets through). Every post carries the RAM budget from the settings,
// so the saved value applies from the first video after a restart, not only after the slider moves.
function pushVideoFocus(el, a, minGap){
  if (!light || light.video !== el) return;
  clearTimeout(light.focusTimer);
  const wait = minGap - (performance.now() - light.focusAt);
  if (wait > 0){ light.focusTimer = setTimeout(() => pushVideoFocus(el, a, 0), wait); return; }
  light.focusAt = performance.now();
  const t = light.scrubT != null ? light.scrubT : el.currentTime;
  fetch("/api/video/focus", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: a.id, t: t || 0, duration: Number.isFinite(el.duration) ? el.duration : 0, mb: clampCache(state.theme.videoCache) }),
  }).then((r) => r.json()).then((snap) => { if (light && light.video === el) applyCacheSnap(snap); }).catch(() => {});
}
function startVideoCache(el, a){
  releaseMedia(false);
  el.src = `/api/file/${a.id}`;
  pushVideoFocus(el, a, 0);
  // The window keeps filling after the focus reply, so poll to keep the strip honest.
  light.cacheTimer = setInterval(() => {
    if (!light || light.video !== el) return;
    fetch(`/api/video/cache?aid=${a.id}`).then((r) => r.json()).then((snap) => { if (light && light.video === el) applyCacheSnap(snap); }).catch(() => {});
  }, 500);
}
// free: also drop the server-side window (player closed / moved to a non-video) so a big RAM budget
// doesn't stay resident with nothing playing.
function releaseMedia(free){
  if (!light) return;
  clearInterval(light.cacheTimer);
  clearTimeout(light.focusTimer);
  light.cacheTimer = light.focusTimer = 0;
  if (free) fetch("/api/video/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ release: true }) }).catch(() => {});
}

function attachViewer(stage, a, src){
  const isVid = a.kind === "video";
  stage.innerHTML = `<div class="view" id="view"><${isVid ? "video" : "img"} class="view-media" ${isVid ? 'autoplay playsinline preload="auto"' : `alt="" src="${src}"`} draggable="false" /><div class="view-hud" id="viewHud"></div></div>`;
  const wrap = stage.querySelector(".view");
  const el = stage.querySelector(".view-media");
  const hud = stage.querySelector(".view-hud");
  const vs = { scale: 1, pan: { x: 0, y: 0 }, nat: { w: a.width || 0, h: a.height || 0 }, mode: "fit", panD: null, zoomD: null };
  if (light){ light.video = isVid ? el : null; light.setZoom = (n) => toScale(n); }
  // Scrubbing sets currentTime far faster than a long-GOP clip can decode. Firing a seek per
  // pointer event piles them up and the picture freezes until the pointer stops, so only the latest
  // wanted time is kept and the next seek goes out once the previous one has landed ("seeked").
  // The playhead (scrubT) still follows the pointer instantly.
  let seekWant = null;
  function pumpSeek(){
    if (seekWant == null || el.seeking) return;
    const t = seekWant;
    seekWant = null;
    if (Math.abs(t - el.currentTime) > 0.001) el.currentTime = t;
  }
  function seekVideo(t){
    const dur = el.duration || 0;
    if (!dur) return null;
    t = Math.min(dur, Math.max(0, t));
    if (light) light.scrubT = t;
    paintVBar();
    seekWant = t;
    pumpSeek();
    pushVideoFocus(el, a, 200); // keep the RAM window under the playhead while scrubbing
    return t;
  }
  // Hand the playhead back to the element once the last seek has landed.
  function settleScrub(){
    if (light && !light.scrubbing && seekWant == null && !el.seeking){ light.scrubT = null; paintVBar(); }
  }
  function beginScrub(){
    if (!light) return;
    light.scrubbing = true;
    el.pause();
  }
  function endScrub(){
    if (!light || !light.scrubbing) return;
    light.scrubbing = false;
    pushVideoFocus(el, a, 0);
    settleScrub();
  }
  function fitS(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!vs.nat.w || !w) return 1;
    return Math.min(w / vs.nat.w, h / vs.nat.h);
  }
  function apply(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const x = (w - vs.nat.w * vs.scale) / 2 + vs.pan.x;
    const y = (h - vs.nat.h * vs.scale) / 2 + vs.pan.y;
    el.style.width = vs.nat.w + "px";
    el.style.height = vs.nat.h + "px";
    el.style.transform = `translate(${x}px,${y}px) scale(${vs.scale})`;
    // Same icon/pixel-art heuristic as thumbnails: only go crisp once we're actually magnifying
    // a small source past its native pixels, so ordinary photos keep smooth upscaling.
    if (!isVid) el.classList.toggle("pixelated", vs.scale > 1.001 && vs.nat.w > 0 && (vs.nat.w <= 768 || vs.nat.h <= 768));
    const f = fitS();
    hud.textContent = Math.abs(vs.scale - f) < 0.012 ? "Frame" : Math.abs(vs.scale - 1) < 0.012 ? "100%" : Math.round(vs.scale * 100) + "%";
  }
  // Zoom toward a screen point (mx,my, relative to `wrap`) instead of the viewport center —
  // keeps whatever content is under the cursor/anchor fixed in place as scale changes.
  function zoomAt(newScale, mx, my){
    newScale = Math.min(16, Math.max(0.05, newScale));
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const xOld = (w - vs.nat.w * vs.scale) / 2 + vs.pan.x;
    const yOld = (h - vs.nat.h * vs.scale) / 2 + vs.pan.y;
    const cx = (mx - xOld) / vs.scale, cy = (my - yOld) / vs.scale;
    vs.scale = newScale;
    vs.pan.x = mx - cx * newScale - (w - vs.nat.w * newScale) / 2;
    vs.pan.y = my - cy * newScale - (h - vs.nat.h * newScale) / 2;
    vs.mode = "free";
    apply();
  }
  function toFit(){
    vs.scale = fitS();
    vs.pan = { x: 0, y: 0 };
    vs.mode = "fit";
    apply();
  }
  function toOne(){
    toScale(1);
  }
  // Digit keys 1–9 in the lightbox jump straight to that multiple of native size (1 = 100%).
  function toScale(n){
    vs.scale = n;
    vs.pan = { x: 0, y: 0 };
    vs.mode = n === 1 ? "one" : "free";
    apply();
  }
  function openMode(){
    const f = fitS();
    if (f < 0.999) toFit();
    else toOne();
  }
  function onReady(){
    const nw = isVid ? el.videoWidth : el.naturalWidth;
    const nh = isVid ? el.videoHeight : el.naturalHeight;
    if (nw && nh) vs.nat = { w: nw, h: nh };
    openMode();
    if (isVid) paintVBar();
  }
  el.addEventListener(isVid ? "loadedmetadata" : "load", onReady);
  if ((isVid && el.readyState >= 1) || (!isVid && el.complete)) onReady();
  // Keep the picture framed when the viewport changes underneath it (window resize, or the
  // lightbox mask / corner-radius popover reshaping the frame). The first callback is just the
  // initial observation, so it is skipped.
  let sized = false;
  new ResizeObserver(() => {
    if (!sized){ sized = true; return; }
    if (vs.mode === "fit") toFit(); else apply();
  }).observe(wrap);
  if (isVid){
    // timeupdate alone (a few ticks/sec) is what made the playhead visibly jump — a rAF
    // loop while playing sweeps it smoothly instead, same fix as the audio waveform.
    let vRaf = 0;
    const vTick = () => {
      if (!light || light.video !== el){ vRaf = 0; return; }
      paintVBar();
      vRaf = requestAnimationFrame(vTick);
    };
    el.addEventListener("play", () => { if (!vRaf) vRaf = requestAnimationFrame(vTick); });
    const stopVTick = () => { if (vRaf) cancelAnimationFrame(vRaf); vRaf = 0; };
    el.addEventListener("pause", stopVTick);
    el.addEventListener("ended", stopVTick);
    el.addEventListener("timeupdate", () => {
      if (light?.scrubbing || el.seeking || seekWant != null) return;
      if (light) light.scrubT = null;
      paintVBar();
      pushVideoFocus(el, a, 1000); // playback: slide the RAM window about once a second
    });
    el.addEventListener("seeked", () => { pumpSeek(); settleScrub(); });
    bindVBar(el, seekVideo, beginScrub, endScrub);
    startVideoCache(el, a);
  }
  // A single click toggles play/pause; a double click still frames/100%s the picture. Both start
  // as "click" events, so the first one is held back briefly — long enough for a second to arrive
  // and cancel it as a dblclick, short enough not to feel laggy.
  let clickTimer = 0;
  let justScrubbed = false;
  wrap.addEventListener("click", (e) => {
    if (!isVid || e.button !== 0) return;
    if (justScrubbed){ justScrubbed = false; return; }
    if (e.detail > 1) return; // second click of a dblclick — let dblclick handle it
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { if (el.paused) el.play(); else el.pause(); }, 250);
  });
  wrap.addEventListener("dblclick", (e) => {
    e.preventDefault();
    e.stopPropagation();
    clearTimeout(clickTimer);
    if (vs.mode === "fit") toOne();
    else toFit();
  });
  wrap.addEventListener("pointerdown", (e) => {
    if (isVid && e.button === 0){
      // Click-drag on the picture scrubs the video, same as dragging the timeline. Nothing happens
      // until the pointer has moved a few px, so a plain click / double-click is untouched.
      wrap.setPointerCapture(e.pointerId);
      vs.scrubD = { x: e.clientX, t0: el.currentTime, t: el.currentTime, fine: e.shiftKey, on: false };
      return;
    }
    if (e.button === 1){
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      vs.panD = { x: e.clientX, y: e.clientY, px: vs.pan.x, py: vs.pan.y };
      return;
    }
    if (e.button === 2){
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      const r = wrap.getBoundingClientRect();
      vs.zoomD = { x: e.clientX, y: e.clientY, mx: e.clientX - r.left, my: e.clientY - r.top, scale: vs.scale };
    }
  });
  wrap.addEventListener("pointermove", (e) => {
    if (vs.panD){
      vs.pan = { x: vs.panD.px + (e.clientX - vs.panD.x), y: vs.panD.py + (e.clientY - vs.panD.y) };
      vs.mode = "free";
      apply();
      return;
    }
    if (vs.zoomD){
      // Right-drag zoom: axis/speed/invert are user-configurable (feedback: expose zoom speed,
      // a vertical/horizontal axis toggle, and an invert option), anchored to where the drag
      // started so that point stays under the cursor as the scale changes.
      const t = state.theme;
      const raw = t.zoomAxis === "x" ? (e.clientX - vs.zoomD.x) : (vs.zoomD.y - e.clientY);
      const d = (t.zoomInvert ? -raw : raw) * 0.012 * (t.zoomSpeed ?? 1);
      zoomAt(vs.zoomD.scale * Math.exp(d), vs.zoomD.mx, vs.zoomD.my);
      return;
    }
    if (vs.scrubD){
      const sd = vs.scrubD;
      if (!sd.on){
        if (Math.abs(e.clientX - sd.x) < 4) return;
        sd.on = true;
        sd.x = e.clientX; // rebase on the pointer's current spot so the picture doesn't jump
        sd.t0 = sd.t = el.currentTime;
        wrap.style.cursor = "ew-resize";
        beginScrub();
      }
      if (e.shiftKey !== sd.fine){ sd.fine = e.shiftKey; sd.x = e.clientX; sd.t0 = sd.t; } // Shift = fine, without a jump
      // Dragging across the whole window covers the whole clip (Shift: a tenth of it).
      const t = seekVideo(sd.t0 + ((e.clientX - sd.x) / Math.max(wrap.clientWidth, 1)) * (el.duration || 0) * (sd.fine ? 0.1 : 1));
      if (t != null) sd.t = t;
    }
  });
  const end = () => {
    const scrubbed = vs.scrubD && vs.scrubD.on;
    vs.panD = vs.zoomD = vs.scrubD = null;
    if (scrubbed){ wrap.style.cursor = ""; endScrub(); justScrubbed = true; }
  };
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
  wrap.addEventListener("contextmenu", (e) => e.preventDefault());
  wrap.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const t = state.theme;
    const r = wrap.getBoundingClientRect();
    const d = (t.zoomInvert ? e.deltaY : -e.deltaY) * 0.0016 * (t.zoomSpeed ?? 1);
    zoomAt(vs.scale * Math.exp(d), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
}

function bindVBar(el, seekVideo, beginScrub, endScrub){
  const bar = light?.bar;
  if (!bar) return;
  const track = bar.querySelector(".vtrack");
  const tAt = (e) => {
    const r = track.getBoundingClientRect();
    const dur = el.duration || 0;
    return Math.min(dur, Math.max(0, ((e.clientX - r.left) / Math.max(r.width, 1)) * dur));
  };
  const onMove = (e) => seekVideo(tAt(e));
  const onUp = (e) => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    if (e.type === "pointerup") seekVideo(tAt(e));
    endScrub();
  };
  track.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    beginScrub();
    seekVideo(tAt(e));
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };
}

function toggleLight(a){
  if (!a || a.status === "missing") return;
  if (light && light.id === a.id){ closeLight(); return; }
  if (light){ showInLight(a); return; }
  // A lightbox that was just closed keeps living in the DOM until its fade-out ends (closeLight),
  // ids and all. Opening again inside that window put a second #light3d / #v3dGear / #v3dPanel …

  // the new model's canvas into an element that was about to be removed, leaving the new lightbox
  // black. (Easy to hit by tapping Space twice.) Finish any pending fade-out first.
  document.querySelectorAll(".light").forEach((n) => (n._finishClose ? n._finishClose() : n.remove()));

  wrap.innerHTML = `
