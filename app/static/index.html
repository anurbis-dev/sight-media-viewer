<title>Sight</title>

<meta name="theme-color" content="#151619" />
<script>
// The UI fades in (see html.booting #app / #app transition below) once the module below has
// applied the user's theme and laid out the shell — otherwise the first paint is the stock look
// and then visibly switches. The backdrop colour comes from the last theme cached in this browser
// profile so the bare window is already the right colour underneath. The timer is only a safety
// net for a stalled boot.
(() => {
  const root = document.documentElement;
  root.classList.add("booting");
  try {
    const t = JSON.parse(localStorage.getItem("sight.theme") || "null");
    if (t && /^#[0-9a-f]{6}$/i.test(t.bg)) root.style.setProperty("--bg", t.bg);
  } catch {}
  // Double rAF: the module now reveals almost immediately (no await stands between page start and
  // the reveal call any more), often within the same rendering opportunity the "booting" class was
  // set in — remove it straight away and the browser can coalesce both states into one committed
  // frame, so opacity never visibly starts at 0 and the transition doesn't play. Waiting two frames
  // guarantees the hidden state has actually been painted at least once before it animates away.
  window.__revealApp = () => {
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("booting")));
  };
  setTimeout(window.__revealApp, 2500);
  // Separate from __revealApp on purpose: Sight.py's launcher starts the browser window off-screen
  // (see reveal_when_ready() there) until this fires, so its own blank/white first frame never
  // reaches the screen — but it must fire once the UI actually has real content on screen, not just
  // the empty shell, or moving the window into view just trades the white flash for a "window pops
  // up empty and fills in a moment later" flash. The main script below calls moveIntoView() and
  // this only after refreshMeta()/pull() have populated the view; the double rAF then confirms that
  // content has actually been painted at least once before we tell the launcher it's safe to
  // maximize/focus the window (moveIntoView() already moved it, synchronously, just before this).
  // ?ready=PORT is the loopback listener it's waiting on. no-cors because that's a plain TCP
  // listener, not an HTTP server that can answer a preflight — we only care that the connection
  // went through, never read the (opaque) response. The timeout is a safety net so a stalled
  // fetch/pull doesn't leave the window off-screen forever (Sight.py has its own hard timeout too).
  window.__signalReady = () => {
    const ready = new URLSearchParams(location.search).get("ready");
    if (!ready) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fetch(`http://127.0.0.1:${ready}/`, { mode: "no-cors", cache: "no-store", keepalive: true }).catch(() => {});
    }));
  };
  setTimeout(window.__signalReady, 8000);
})();
</script>

// Every option the user tunes lives in localStorage under a "sight.*" key. localStorage is

function renderIconSvg(id, color, size = 16){
  const body = ICONS[id] || ICONS.folder;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${esc(color)}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
function iconSpan(id, color, size = 15){
  return `<span class="row-icon">${renderIconSvg(id, color || "var(--subtle)", size)}</span>`;
}
// Every new tag gets its own color for free, no picking required — hashed out of its name so
// it's deterministic (the same tag always lands on the same color) and stable across reloads.
function tagColor(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return `hsl(${h % 360} 65% 55%)`;
}

async function api(path, opts){
  const r = await fetch(path, opts);
  if (!r.ok && r.status !== 202) throw new Error(await r.text());
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r;
}

function setTile(n){
  const next = clampTile(n);
  if (Math.abs(next - state.tile) >= 0.05){
    state.tile = next;
    putSetting(TILE_KEY, String(next));
  }
  scheduleRender();
}

function layout(){
  const pad = parseFloat(getComputedStyle(grid).paddingLeft) || 16;
  const w = Math.max(120, grid.clientWidth - pad * 2);
  const gap = state.theme.gridGap;
  const compact = state.tile < COMPACT;
  if (compact) return { cols: 1, cell: w, rowH: 36 + gap, gap, compact: true, pad, meta: 0, mode: "grid" };
  const cell = state.tile;
  const cols = Math.max(1, Math.floor((w + gap) / (cell + gap)));
  const meta = metaH();
  if (state.viewMode === "masonry"){
    const cardPad = Math.max(0, Number(state.theme.cardPad) || 0);
    return { cols, cell, gap, compact: false, pad, meta, mode: "masonry", cardPad };
  }
  const inner = Math.max(24, cell - 16);
  const rowH = 16 + inner + meta + gap;
  return { cols, cell, rowH, gap, compact: false, pad, meta, mode: "grid", inner };
}

// Pinterest-style layout: each card's height follows its own image aspect ratio instead of a
// uniform square, so items are packed into columns (shortest-column-first) rather than placed by
// the browser's row-major CSS grid auto-placement. Positions are absolute (px from the top of the
// full, unvirtualized list) so visibleWindow() can slice into them without the row-height math
// grid mode relies on. Cached by a signature of everything that can change a position, since
// state.items only ever grows by appending (see pull()) — recomputing from scratch is O(n) but
// cheap, and avoided on plain scroll/selection re-renders.
let masonryCache = null;
function computeMasonry(L){
  const n = state.items.length;
  const sig = n + "|" + L.cols + "|" + L.cell + "|" + L.gap + "|" + L.meta + "|" + L.cardPad;
  if (masonryCache && masonryCache.sig === sig) return masonryCache;
  const cols = L.cols;
  const colH = new Array(cols).fill(0);
  const positions = new Array(n);
  const thumbW = Math.max(24, L.cell - 2 * L.cardPad);
  for (let i = 0; i < n; i++){
    const a = state.items[i];
    const ar = a.width && a.height ? a.width / a.height : 1;
    // Clamped so one extreme panorama/strip scan can't blow out a column (and the virtualizer's
    // overscan window) with a single absurdly tall or wide card.
    const imgH = Math.min(Math.round(thumbW * 2.5), Math.max(Math.round(thumbW * 0.4), Math.round(thumbW / ar)));
    const cardH = 2 * L.cardPad + imgH + L.meta;
    let col = 0;
    for (let c = 1; c < cols; c++) if (colH[c] < colH[col]) col = c;
    const y = colH[col];
    positions[i] = { x: col * (L.cell + L.gap), y, h: cardH, imgH };
    colH[col] = y + cardH + L.gap;
  }
  const totalHeight = n ? Math.max(...colH) - L.gap : 0;
  masonryCache = { sig, positions, totalHeight };
  return masonryCache;
}

function visibleWindow(){
  const L = layout();
  if (L.mode === "masonry"){
    const M = computeMasonry(L);
    const overscan = Math.max(600, L.cell * 2);
    return {
      ...L, positions: M.positions, totalHeight: M.totalHeight,
      viewTop: grid.scrollTop - overscan, viewBottom: grid.scrollTop + grid.clientHeight + overscan,
    };
  }
  const overscan = 4;
  const startRow = Math.max(0, Math.floor(grid.scrollTop / L.rowH) - overscan);
  const visRows = Math.ceil(grid.clientHeight / L.rowH) + overscan * 2;
  const endRow = Math.min(Math.ceil(state.items.length / L.cols), startRow + visRows);
  return { start: startRow * L.cols, end: Math.min(state.items.length, endRow * L.cols), startRow, ...L };
}

function scheduleRender(){
  if (renderRAF) return;
  renderRAF = requestAnimationFrame(() => { renderRAF = 0; renderGrid(); });
}

// Icons/pixel art are small enough that the box they're shown in is almost always bigger than
// the source — flag that once at load (cheap, no layout read) so later resizes/scrolls only pay
// for a clientWidth check on the images that could actually need it.
function markSmallSrc(img){
  img.dataset.smallSrc = (img.naturalWidth && img.naturalWidth <= 768) || (img.naturalHeight && img.naturalHeight <= 768) ? "1" : "0";
}
function syncPixelation(img, host){
  if (img.dataset.smallSrc !== "1") return;
  const cw = host.clientWidth, ch = host.clientHeight;
  if (!cw || !ch || !img.naturalWidth) return;
  img.classList.toggle("pixelated", img.naturalWidth < cw || img.naturalHeight < ch);
}

function fillThumb(el, a, first, pos){
  const host = el.querySelector(".thumb");
  host.style.height = pos ? pos.imgH + "px" : "";
  const has = a.has_thumb || seenThumb.has(a.id);
  if (has){
    const existing = host.querySelector("img");
    if (!existing){
      const img = document.createElement("img");
      img.alt = "";
      img.decoding = "async";
      img.src = thumbUrl(a);
      img.addEventListener("load", () => { markSmallSrc(img); syncPixelation(img, host); });
      if (first) { img.className = "fade"; img.onload = () => img.classList.add("on"); }
      else img.className = "on";
      host.replaceChildren(img);
    } else {
      syncPixelation(existing, host);
    }
  } else if (!host.querySelector(".ph")){
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = (KIND[a.kind] || a.kind).slice(0, 3);
    host.replaceChildren(ph);
  }
  const badge = host.querySelector(".anim-badge");
  const wantBadge = !!a.animated && !el.classList.contains("compact");
  if (wantBadge && !badge){
    const b = document.createElement("span");
    b.className = "anim-badge";
    b.title = "Animated";
    b.textContent = "GIF";
    host.appendChild(b);
  } else if (!wantBadge && badge){
    badge.remove();
  }
}

function ensureCard(a, i, L, pos){
  let el = cardPool.get(a.id);
  if (!el){
    el = document.createElement("button");
    el.type = "button";
    el.dataset.id = a.id;
    el.innerHTML = `<div class="thumb"></div><div class="meta"><div class="n"></div><div class="k"></div><div class="x c"></div><div class="x r"></div><div class="x s"></div></div>`;
    el.draggable = false;
    el.addEventListener("pointerdown", (ev) => {
      el.draggable = ev.button === 0 && !ev.ctrlKey && !ev.metaKey;
    });
    el.addEventListener("dragstart", (ev) => {
      const id = el.dataset.id;
      const ids = state.selectedIds.includes(id) ? state.selectedIds : [id];
      if (!state.selectedIds.includes(id)) selectOnly(id);
      ev.dataTransfer.setData("application/x-sight-ids", JSON.stringify(ids));
      const g = document.createElement("div");
      g.textContent = ids.length + (ids.length === 1 ? " file" : " files");
      g.style.cssText = "position:absolute;top:-999px;left:0;padding:6px 10px;background:#1a1a1e;border:1px solid #333;border-radius:8px;color:#f2f2f0;font:12px sans-serif";
      document.body.append(g);
      ev.dataTransfer.setDragImage(g, 12, 12);
      requestAnimationFrame(() => g.remove());
    });
    el.addEventListener("dragend", () => { el.draggable = false; });
    cardPool.set(a.id, el);
    fillThumb(el, a, false, pos);
  }
  el.dataset.i = String(i);
  const on = state.selectedIds.includes(a.id);
  const masonry = L.mode === "masonry";
  el.className = "card" + (on ? " on" : "") + (a.status === "missing" ? " miss" : "") + (L.compact ? " compact" : "") + (masonry ? " masonry" : "");
  if (masonry && pos){
    el.style.left = pos.x + "px";
    el.style.top = pos.y + "px";
    el.style.width = L.cell + "px";
    el.style.height = pos.h + "px";
  } else {
    el.style.left = el.style.top = el.style.width = el.style.height = "";
  }
  const o = state.theme;
  const showMeta = !L.compact && (o.name || o.kind || o.created || o.res || o.size);
  el.querySelector(".n").textContent = a.name;
  el.querySelector(".n").hidden = !o.name;
  const k = el.querySelector(".k");
  k.textContent = KIND[a.kind] || a.kind;
  k.hidden = !o.kind;
  const c = el.querySelector(".c");
  c.textContent = fmtDate(a.mtime);
  c.hidden = !o.created;
  const r = el.querySelector(".r");
  r.textContent = a.width && a.height ? `${a.width}×${a.height}` : "";
  r.hidden = !o.res;
  const s = el.querySelector(".s");
  s.textContent = bytes(a.size);
  s.hidden = !o.size;
  el.querySelector(".meta").hidden = !showMeta;
  fillThumb(el, a, false, pos);
  return el;
}

function renderGrid(){
  if (!state.items.length){
    cardPool.clear();
    sliceEl = spaceEl = null;
    grid.innerHTML = `<div class="empty">Empty. Add a folder — files stay where they are.</div>`;
    renderInsp();
    return;
  }
  if (grid.querySelector(".empty")) grid.innerHTML = "";
  if (!spaceEl){
    spaceEl = document.createElement("div");
    spaceEl.className = "space";
    sliceEl = document.createElement("div");
    sliceEl.className = "slice";
    spaceEl.append(sliceEl);
    grid.append(spaceEl);
  }
  const W = visibleWindow();
  const masonry = W.mode === "masonry";
  sliceEl.classList.toggle("masonry", masonry);
  const want = new Set();
  const visItems = [];
  const ordered = [];
  if (masonry){
    spaceEl.style.height = W.totalHeight + "px";
    sliceEl.style.top = "0px";
    sliceEl.style.gridTemplateColumns = "";
    sliceEl.style.removeProperty("--row-h");
    for (let i = 0; i < state.items.length; i++){
      const p = W.positions[i];
      const a = state.items[i];
      if (!a || !p) continue;
      if (p.y + p.h < W.viewTop || p.y > W.viewBottom) continue;
      want.add(a.id);
      visItems.push(a);
      ordered.push(ensureCard(a, i, W, p));
    }
  } else {
    const rows = Math.ceil(state.items.length / W.cols);
    spaceEl.style.height = (rows * W.rowH) + "px";
    sliceEl.style.top = (W.startRow * W.rowH) + "px";
    sliceEl.style.gridTemplateColumns = W.compact ? "1fr" : `repeat(${W.cols}, ${W.cell}px)`;
    sliceEl.style.setProperty("--row-h", (W.rowH - W.gap) + "px");
    for (let i = W.start; i < W.end; i++){
      const a = state.items[i];
      if (!a) continue;
      want.add(a.id);
      visItems.push(a);
      ordered.push(ensureCard(a, i, W, null));
    }
  }
  for (const [id, el] of cardPool){
    if (!want.has(id)){
      el.remove();
      cardPool.delete(id);
    }
  }
  let node = sliceEl.firstChild;
  for (const el of ordered){
    if (node === el){ node = node.nextSibling; continue; }
    sliceEl.insertBefore(el, node);
  }
  reportVisible(visItems);
}

function reportVisible(items){
  clearTimeout(visTimer);
  visTimer = setTimeout(() => {
    const pending = items.filter(a => !a.has_thumb && !seenThumb.has(a.id));
    // The server has no headless GL to thumbnail 3D models — render those client-side instead
    // of asking it to (it would just keep 202-ing forever).
    for (const a of pending) if (a.kind === "model3d") ensureModelThumb(a);
    const need = pending.filter(a => a.kind !== "model3d").map(a => a.id);
    if (!need.length) return;
    api("/api/visible", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ids: need }),
    }).catch(() => {});
  }, 40);
}

// One shared offscreen WebGL context, jobs strictly serial (a single GL context can't render
// in parallel) and deduped per (id, mtime) for the session — mirrors AssetsBoss's own
// client-side model thumbnailer, for the same reason: no server-side headless GL.
const modelThumbTried = new Set();
let modelThumbChain = Promise.resolve();
let thumbRenderer = null, thumbCanvas = null;

function ensureModelThumb(a, force){
  const key = a.id + ":" + a.mtime;
  if (modelThumbTried.has(key) && !force) return;
  modelThumbTried.add(key);
  modelThumbChain = modelThumbChain.then(() => renderModelThumb(a)).catch(() => {});
}

function getThumbRenderer(THREE){
  if (!thumbRenderer){
    thumbCanvas = document.createElement("canvas");
    thumbRenderer = new THREE.WebGLRenderer({ canvas: thumbCanvas, antialias: true, preserveDrawingBuffer: true, alpha: true });
    thumbRenderer.setSize(512, 512, false);
    thumbRenderer.setPixelRatio(1);
    thumbRenderer.setClearColor(0x000000, 0);
    thumbRenderer.domElement.addEventListener("webglcontextlost", () => { thumbRenderer = null; });
  }
  return thumbRenderer;
}

// A fixed, always-on 3-point rig (independent of the user's live lightbox settings — those
// tune interactive viewing, not a cached-once thumbnail) so default thumbnails are evenly lit
// instead of the old single-ambient+single-directional look. Rendered on a transparent
// background (feedback: thumbnails always looked like they had a baked-in black backdrop) so
// the card's own "Thumb block" color shows through instead.
const THUMB_RIG = [
  { az: -50, el: 55, i: 1.0 },
  { az: 130, el: 25, i: 0.55 },
  { az: 20, el: -30, i: 0.35 },
];
async function renderModelThumb(a){
  try {
    const THREE = await import("three");
    if (!MODEL_EXT_LOADERS.has((a.ext || "").toLowerCase())) return;
    const r = getThumbRenderer(THREE);
    if (await isSplatAsset(a.id, a.ext)){
      await renderSplatThumb(THREE, r, a);
      return;
    }
    const scene = new THREE.Scene();
    scene.background = null;
    const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 2000);
    camera.position.set(2, 1.4, 2.2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const D2R = Math.PI / 180;
    for (const l of THUMB_RIG){
      const dl = new THREE.DirectionalLight(0xffffff, l.i);
      const az = l.az * D2R, el = l.el * D2R;
      dl.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(5);
      scene.add(dl);
    }
    const obj = await loadModel(THREE, `/api/file/${a.id}`, a.ext, undefined, a.id);
    if (!obj) return;
    await applyCompanions(THREE, obj, a.id);
    const turns = getModelTurns(a.id);
    if (turns){
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -turns * Math.PI / 2);
      obj.quaternion.premultiply(q);
      obj.position.applyQuaternion(q);
    }
    const target = new THREE.Vector3();
    frameObject3d(THREE, obj, scene, camera, target);
    camera.lookAt(target);
    r.clear();
    r.render(scene, camera);
    const blob = await new Promise((resolve) => thumbCanvas.toBlob((b) => resolve(b), "image/png"));
    disposeObj3d(obj);
    if (!blob) return;
    // The server publishes a "thumb" SSE event on success, which applyThumb() already handles.
    await fetch("/api/thumb/" + a.id, { method: "POST", body: blob });
  } catch (err) {
    console.warn("model thumbnail failed", a.id, err);
  }
}

// Splats have no mesh/material to plug into the THUMB_RIG lighting — their color is baked in —
// and depth-sorting runs in a background worker and is view-dependent, so the very first render
// after load can catch it mid-sort. A few warm-up frames (rendered on real animation frames, so
// the worker has a chance to post back) settle that before the kept frame is captured.
async function renderSplatThumb(THREE, r, a){
  const { SparkRenderer, SplatMesh } = await import("@sparkjsdev/spark");
  const scene = new THREE.Scene();
  scene.background = null;
  const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 2000);
  const spark = new SparkRenderer({ renderer: r });
  scene.add(spark);
  const low = (a.ext || "").toLowerCase();
  const mesh = new SplatMesh({ url: `/api/file/${a.id}`, fileType: SPLAT_FILE_TYPE_BY_EXT[low] });
  scene.add(mesh);
  try {
    await mesh.initialized;
    mesh.quaternion.set(1, 0, 0, 0); // same Y-down → Y-up correction boot3d applies
    mesh.updateMatrixWorld(true);
    const box = mesh.getBoundingBox(true).applyMatrix4(mesh.matrixWorld);
    const size = box.getSize(new THREE.Vector3()).length() || 1;
    const center = box.getCenter(new THREE.Vector3());
    camera.position.copy(center).add(new THREE.Vector3(size*0.7, size*0.45, size*0.7));
    camera.near = size/100; camera.far = size*20; camera.updateProjectionMatrix();
    camera.lookAt(center);
    r.clear();
    // Depth-sorting a freshly loaded splat is a round trip through a background worker kicked
    // off by the first render() call — nothing meaningful is on screen until it posts back, which
    // a couple of warm-up frames isn't enough time for (confirmed empirically: 3 frames ≈ 30ms
    // produced a blank thumbnail every time). The interactive viewer never hits this because it
    // keeps rendering continuously for as long as the asset stays open; here we just budget real
    // wall-clock time instead of a fixed frame count.
    const warmUpUntil = performance.now() + 600;
    while (performance.now() < warmUpUntil){
      r.render(scene, camera);
      await new Promise((res) => requestAnimationFrame(res));
    }
    r.render(scene, camera);
    const blob = await new Promise((resolve) => thumbCanvas.toBlob((b) => resolve(b), "image/png"));
    if (!blob) return;
    await fetch("/api/thumb/" + a.id, { method: "POST", body: blob });
  } finally {
    mesh.dispose();
    spark.dispose();
  }
}

function disposeObj3d(obj){
  const slots = ["map", "normalMap", "roughnessMap", "metalnessMap", "aoMap", "emissiveMap", "alphaMap", "bumpMap"];
  obj.traverse((child) => {
    child.geometry?.dispose?.();
    const mats = Array.isArray(child.material) ? child.material : (child.material ? [child.material] : []);
    for (const m of mats){
      for (const slot of slots) m[slot]?.dispose?.();
      m.dispose?.();
    }
  });
}

function selectOnly(id){
  state.selected = id;
  state.selectedIds = id ? [id] : [];
  state.anchor = id;
  paintSelection();
  renderInsp();
}
function toggleSelect(id){
  const cur = state.selectedIds;
  state.selectedIds = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
  state.selected = id;
  state.anchor = id;
  paintSelection();
  renderInsp();
}
let inspT = 0;
function selectSet(ids, anchor){
  state.selectedIds = ids;
  state.selected = anchor ?? ids[ids.length - 1] ?? null;
  if (anchor) state.anchor = anchor;
  paintSelection();
  if (marquee?.active){
    clearTimeout(inspT);
    inspT = setTimeout(renderInsp, 60);
  } else renderInsp();
}
function paintSelection(){
  const set = new Set(state.selectedIds);
  for (const [id, el] of cardPool) el.classList.toggle("on", set.has(id));
  const n = state.selectedIds.length;
  $("count").textContent = n > 1 ? n + " selected" : String(state.items.length);
}

function idsInRect(rect){
  const L = layout();
  const g = grid.getBoundingClientRect();
  const hits = [];
  if (L.mode === "masonry"){
    const M = computeMasonry(L);
    for (let i = 0; i < state.items.length; i++){
      const p = M.positions[i];
      if (!p) continue;
      const x = g.left + L.pad + p.x;
      const y = g.top + L.pad - grid.scrollTop + p.y;
      if (x < rect.right && x + L.cell > rect.left && y < rect.bottom && y + p.h > rect.top) hits.push(state.items[i].id);
    }
    return hits;
  }
  for (let i = 0; i < state.items.length; i++){
    const row = Math.floor(i / L.cols);
    const col = i % L.cols;
    const x = g.left + L.pad + col * (L.cell + L.gap);
    const y = g.top + L.pad - grid.scrollTop + row * L.rowH;
    const w = L.cell;
    const h = L.compact ? 36 : L.cell;
    if (x < rect.right && x + w > rect.left && y < rect.bottom && y + h > rect.top) hits.push(state.items[i].id);
  }
  return hits;
}

function applyMarquee(rect){
  const hits = idsInRect(rect);
  if (marquee.mode === "add") selectSet([...new Set([...marquee.origin, ...hits])]);
  else if (marquee.mode === "toggle"){
    const origin = new Set(marquee.origin);
    const next = new Set(marquee.origin);
    for (const id of hits){
      if (origin.has(id)) next.delete(id);
      else next.add(id);
    }
    selectSet([...next]);
  } else selectSet(hits);
}

grid.addEventListener("scroll", () => scheduleRender(), { passive: true });

function cardFromEvent(e){
  return e.target.closest("[data-id]");
}

grid.addEventListener("dblclick", (e) => {
  if (skipClick) return;
  const card = cardFromEvent(e);
  if (!card) return;
  const a = state.items.find(x => x.id === card.dataset.id);
  if (a) toggleLight(a);
});

function bindPtr(){
  window.addEventListener("pointermove", onPtrMove);
  window.addEventListener("pointerup", onPtrUp);
  window.addEventListener("pointercancel", onPtrUp);
}
function unbindPtr(){
  window.removeEventListener("pointermove", onPtrMove);
  window.removeEventListener("pointerup", onPtrUp);
  window.removeEventListener("pointercancel", onPtrUp);
}

function clickSelect(id, e){
  if (e.shiftKey){
    const a = state.anchor || id;
    const i0 = state.items.findIndex(x => x.id === a);
    const i1 = state.items.findIndex(x => x.id === id);
    if (i0 >= 0 && i1 >= 0){
      const lo = Math.min(i0, i1), hi = Math.max(i0, i1);
      const range = state.items.slice(lo, hi + 1).map(x => x.id);
      selectSet(e.ctrlKey || e.metaKey ? [...new Set([...state.selectedIds, ...range])] : range, a);
      return;
    }
  }
  if (e.ctrlKey || e.metaKey) toggleSelect(id);
  else selectOnly(id);
  if (window.innerWidth < 1024) insp.classList.add("open");
}

grid.addEventListener("pointerdown", (e) => {
  if (e.button === 1){
    e.preventDefault();
    panDrag = { x: e.clientX, y: e.clientY, sl: grid.scrollLeft, st: grid.scrollTop };
    grid.classList.add("panning");
    bindPtr();
    return;
  }
  if (e.button === 2){
    e.preventDefault();
    const onCard = cardFromEvent(e);
    tileDrag = { y: e.clientY, size: state.tile, moved: false, x: e.clientX, cardId: onCard?.dataset.id || null };
    bindPtr();
    return;
  }
  if (e.button !== 0) return;
  const onCard = cardFromEvent(e);
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl){
    e.preventDefault();
    marquee = {
      x: e.clientX, y: e.clientY,
      mode: e.shiftKey ? "add" : "toggle",
      active: false,
      origin: state.selectedIds.slice(),
      cardId: onCard?.dataset.id || null,
    };
    bindPtr();
    return;
  }
  if (!onCard && !e.shiftKey){
    e.preventDefault();
    marquee = { x: e.clientX, y: e.clientY, mode: "replace", active: false, origin: state.selectedIds.slice(), cardId: null };
    bindPtr();
  }
});

function onPtrMove(e){
  if (panDrag){
    grid.scrollLeft = panDrag.sl - (e.clientX - panDrag.x);
    grid.scrollTop = panDrag.st - (e.clientY - panDrag.y);
    return;
  }
  if (tileDrag){
    if (Math.abs(tileDrag.y - e.clientY) > 2) tileDrag.moved = true;
    setTile(tileDrag.size + (tileDrag.y - e.clientY) * 0.9);
    return;
  }
  if (marquee){
    const w = e.clientX - marquee.x, h = e.clientY - marquee.y;
    if (!marquee.active && Math.hypot(w, h) > 4){
      marquee.active = true;
      if (!boxEl){ boxEl = document.createElement("div"); boxEl.className = "marquee"; document.body.append(boxEl); }
    }
    if (marquee.active){
      const x = Math.min(marquee.x, e.clientX), y = Math.min(marquee.y, e.clientY);
      const rect = { left: x, top: y, right: x + Math.abs(w), bottom: y + Math.abs(h), x, y, w: Math.abs(w), h: Math.abs(h) };
      boxEl.style.cssText = `left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;height:${rect.h}px`;
      applyMarquee(rect);
    }
  }
}

function onPtrUp(e){
  const m = marquee, t = tileDrag;
  if (m && !m.active && m.cardId) clickSelect(m.cardId, { shiftKey: e.shiftKey, ctrlKey: true, metaKey: e.metaKey });
  else if (m && !m.active && !m.cardId && m.mode === "replace") selectOnly(null);
  if (t && !t.moved && t.cardId) showCtx(e.clientX, e.clientY, t.cardId);
  else if (t && !t.moved && !t.cardId) showGridCtx(e.clientX, e.clientY);
  if (m?.active || t?.moved) skipClick = true;
  panDrag = tileDrag = marquee = null;
  grid.classList.remove("panning");
  boxEl?.remove();
  boxEl = null;
  unbindPtr();
}

grid.addEventListener("click", (e) => {
  if (skipClick){ skipClick = false; return; }
  if (e.ctrlKey || e.metaKey) return;
  const card = cardFromEvent(e);
  if (!card){
    if (!e.shiftKey) selectOnly(null);
    return;
  }
  clickSelect(card.dataset.id, e);
});

grid.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
// Block the native context menu everywhere (sidebar, inspector, grid, our own #ctx menu…)
// so it can never show alongside ours — text inputs/textareas keep it, for copy/paste.
// Capture phase so this always wins the race, regardless of per-element handler timing.
document.addEventListener("contextmenu", (e) => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  e.preventDefault();
}, true);

let lastGridW = 0;
new ResizeObserver(() => {
  const w = grid.clientWidth;
  if (lastGridW && Math.abs(w - lastGridW) >= 1){
    setTile(state.tile * (w / lastGridW));
  } else {
    scheduleRender();
  }
  lastGridW = w;
}).observe(grid);

function row(label, count, on, click){
  const b = document.createElement("button");
  b.className = "row" + (on ? " on" : "");
  b.innerHTML = `<span>${esc(label)}</span><em class="badge">${count ?? 0}</em>`;
  if (typeof click === "function") b.onclick = click;
  return b;
}

// Collection/tag rows apply their filter on a plain click, which rebuilds the nav (renderNav())
// and swaps the row for a fresh DOM node — so a native dblclick, which only fires when both
// clicks land on the *same* node, would never see the second click. Tracked by key (collection
// id / tag name) instead, which survives the rebuild, so we detect the double-click ourselves
// and the first click's filter still applies with no added delay.
function navDblClick(key, threshold = 400){
  const now = Date.now();
  const isDbl = navClickTrack.key === key && (now - navClickTrack.at) < threshold;
  navClickTrack = isDbl ? { key: null, at: 0 } : { key, at: now };
  return isDbl;
}

function applyFilter(patch){
  state.filter = { q: state.filter.q, kind:"", source:"", tag:"", missing:false, collection:"", folder:"", ...patch };
  renderNav();
  resetList();
}

// Collapsible "sec" header shared by Sources / Collections / Tags in the nav, and reused
// for the Settings header — clicking anywhere but a child button toggles state.navCollapse[key].
function sectionHeader(title, key, extraHtml = "", iconId = ""){
  const open = !state.navCollapse[key];
  const head = document.createElement("div");
  head.className = "sec toggle" + (open ? " open" : "");
  const iconHtml = state.showIcons && iconId ? `<span class="sec-icon">${renderIconSvg(iconId, "currentColor", 14)}</span>` : "";
  head.innerHTML = `${iconHtml}<span class="sec-title">${esc(title)}</span>${extraHtml}<span class="chev">›</span>`;
  head.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    state.navCollapse[key] = !state.navCollapse[key];
    saveLayout();
    renderNav();
  });
  return head;
}

function renderNav(){
  // Background events (scan progress, thumb batches, the debounced scheduleMeta() after any
  // patch) call refreshMeta() -> renderNav() every ~200ms-3s. Rebuilding mid-rename would tear
  // out the input the user is typing into, so skip the rebuild while one has focus; the pending
  // rename's own blur/Enter/Escape handler calls refreshMeta() again once it's done.
  if (document.activeElement instanceof HTMLInputElement && nav.contains(document.activeElement)) return;
  const y = sideScrollEl.scrollTop;
  nav.innerHTML = "";
  const set = (patch) => applyFilter(patch);
  const sectionRenderers = { types: renderTypes, sources: renderSources, collections: renderCollections, tags: renderTags };
  for (const key of state.navOrder) sectionRenderers[key]?.(set);
  sideScrollEl.scrollTop = y;
}

async function loadFolderTree(sid, path, force){
  const key = sid + "|" + path;
  if (!force && state.sourceTree.dirsCache.has(key)) return;
  const q = "?path=" + encodeURIComponent(path);
  const r = await api("/api/sources/" + sid + "/tree" + q);
  state.sourceTree.dirsCache.set(key, r.dirs || []);
}

const FOLDER_EXPAND_CAP = 400;

function isUnder(key, base){
  return key.startsWith(base + "\\") || key.startsWith(base + "/");
}

// Shift+click on "+": open every nested folder under `path` (breadth-first, capped so a huge
// tree can't fire thousands of requests) or, if already open, close the whole subtree.
async function expandAll(sid, path){
  let budget = FOLDER_EXPAND_CAP;
  let level = [path];
  while (level.length && budget > 0){
    await Promise.all(level.map((p) => loadFolderTree(sid, p)));
    const next = [];
    for (const p of level){
      for (const d of state.sourceTree.dirsCache.get(sid + "|" + p) || []){
        if (d.excluded) continue; // an excluded folder takes its whole subtree with it — nothing to open
        if (budget-- <= 0) break;
        state.sourceTree.expandedPaths.add(sid + "|" + d.path);
        next.push(d.path);
      }
    }
    level = next;
  }
}

function collapseAll(sid, path){
  const base = sid + "|" + path;
  for (const k of [...state.sourceTree.expandedPaths]){
    if (isUnder(k, base)) state.sourceTree.expandedPaths.delete(k);
  }
}

// Drag-to-reorder for a nav row, shared by Sources, Tags and the nav sections themselves — the
// only differences between them are the mime type (so a section's drop zones ignore another
// section's drag), the class marking the draggable rows, the dataset key holding each row's
// identity, and how the final order is persisted. `el.dataset[idKey]` must already be set by the
// caller. `reorderUrl` persists the order to the server; `onReorder`, used instead for
// nav-section order (a purely client-side layout preference), gets the final id list and is
// responsible for saving/re-rendering itself. Collections have their own drag handling (see
// `moveCollection`) since, being a tree rather than a flat list, they also need to support
// reparenting a row, not just reordering it among fixed siblings.
function bindRowDrag(el, { mime, rowSelector, idKey, reorderUrl, bodyKey = "ids", onReorder }){
  el.draggable = true;
  el.addEventListener("dragstart", (e) => {
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData(mime, el.dataset[idKey]);
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  el.addEventListener("dragover", (e) => {
    if (!e.dataTransfer.types.includes(mime)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const dragging = nav.querySelector(rowSelector + ".dragging");
    if (!dragging || dragging === el) return;
    const rect = el.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    el.parentElement.insertBefore(dragging, before ? el : el.nextSibling);
  });
  el.addEventListener("drop", async (e) => {
    if (!e.dataTransfer.types.includes(mime)) return;
    e.preventDefault();
    const ids = [...nav.querySelectorAll(rowSelector)].map((r) => r.dataset[idKey]);
    if (onReorder){ onReorder(ids); return; }
    await api(reorderUrl, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ [bodyKey]: ids }) });
    await refreshMeta();
  });
}

// Nav sections (Types/Sources/Collections/Tags) reorder among themselves the same way rows do —
// grabbing anywhere in a section not already claimed by one of its own draggable rows (i.e. the
// header) drags the whole section, since the nearest `draggable` ancestor wins the drag.
function bindSectionDrag(wrap, key){
  wrap.classList.add("sec-row");
  wrap.dataset.key = key;
  bindRowDrag(wrap, {
    mime: "application/x-sight-navsec",
    rowSelector: ".sec-row",
    idKey: "key",
    onReorder: (keys) => { state.navOrder = keys; saveLayout(); renderNav(); },
  });
}

// Nested subfolders of a source, indented by depth — each gets its own "+" to expand deeper
// and an "×"/"↺" to exclude/restore it from scanning, mirroring the folder tree under fbSide.
function renderFolderChildren(sid, path, depth, container){
  const dirs = state.sourceTree.dirsCache.get(sid + "|" + path) || [];
  dirs.forEach((d) => {
    const key = sid + "|" + d.path;
    const open = state.sourceTree.expandedPaths.has(key);
    const b = document.createElement("div");
    b.className = "row src-folder" + (d.excluded ? " excluded" : "") + (state.filter.folder === d.path ? " on" : "");
    b.style.paddingLeft = (8 + depth * 12) + "px";
    // Excluding a folder excludes everything under it (server-side too), so an excluded row is a
    // leaf: no "+" to expand it and none of its subfolders are listed.
    b.innerHTML = `<span>${esc(d.name)}</span>${d.excluded ? "" : `<button class="tiny" data-act="expand" type="button" aria-label="Expand">${open ? "−" : "+"}</button>`}<button class="tiny" data-act="exclude" type="button" aria-label="${d.excluded ? "Include in scan" : "Exclude from scan"}">${d.excluded ? "↺" : "×"}</button>`;
    b.onclick = (e) => {
      if (e.target.closest("button") || d.excluded) return;
      applyFilter({ folder: d.path });
    };
    b.querySelector('[data-act="expand"]')?.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (open){
        state.sourceTree.expandedPaths.delete(key);
        if (e.shiftKey) collapseAll(sid, d.path);
        renderNav();
        return;
      }
      await loadFolderTree(sid, d.path);
      state.sourceTree.expandedPaths.add(key);
      if (e.shiftKey) await expandAll(sid, d.path);
      renderNav();
    });
    b.querySelector('[data-act="exclude"]').onclick = async (e) => {
      e.stopPropagation();
      await api("/api/sources/" + sid + "/exclude", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path: d.path, excluded: !d.excluded }) });
      // The folder filter can't stay on a folder (or one of its subfolders) that just went away.
      const cur = state.filter.folder;
      if (!d.excluded && cur && (cur === d.path || isUnder(cur, d.path))) state.filter = { ...state.filter, folder: "" };
      await loadFolderTree(sid, path, true);
      await refreshMeta();
      resetList();
    };
    container.append(b);
    if (open && !d.excluded) renderFolderChildren(sid, d.path, depth + 1, container);
  });
}

// "All" + the per-kind filters (Photos/Video/.../Missing) grouped into their own collapsible,
// drag-sortable section like Sources/Collections/Tags, instead of sitting loose above them.
function renderTypes(set){
  const c = state.meta.counts || {};
  const f = state.filter;
  const wrap = document.createElement("div");
  wrap.append(sectionHeader("Types", "types", "", "image"));
  bindSectionDrag(wrap, "types");
  nav.append(wrap);
  if (state.navCollapse.types) return;
  wrap.append(row("All", c.all || 0, !f.kind && !f.source && !f.tag && !f.missing && !f.collection && !f.folder, () => set({})));
  for (const k of Object.keys(KIND)){
    wrap.append(row(KIND[k], c[k] || 0, f.kind === k, () => set({ kind: k })));
  }
  // A div (not row()'s button): it holds its own clean-up button, and buttons can't nest.
  const missRow = document.createElement("div");
  missRow.className = "row" + (f.missing ? " on" : "");
  missRow.innerHTML = `<span>Missing</span><em class="badge">${c.missing || 0}</em>${c.missing ? `<button class="tiny" type="button" title="Remove missing files from the library" aria-label="Remove missing files from the library">🧹</button>` : ""}`;
  missRow.onclick = (e) => { if (e.target.closest("button")) purgeMissing(false); else set({ missing: true }); };
  wrap.append(missRow);
}

function renderSources(set){
  const wrap = document.createElement("div");
  wrap.append(sectionHeader("Sources", "sources", "", "folder"));
  bindSectionDrag(wrap, "sources");
  nav.append(wrap);
  if (state.navCollapse.sources) return;
  (state.meta.sources || []).forEach((s) => {
    const open = state.sourceTree.expandedSources.has(s.id);
    const b = document.createElement("div");
    b.className = "row src-row" + (state.filter.source === s.id ? " on" : "");
    b.dataset.sid = s.id;
    const iconHtml = state.showIcons ? iconSpan("folder", "var(--subtle)", 15) : "";
    b.innerHTML = `${iconHtml}<span>${esc(s.name)}</span><em class="badge">${s.count || 0}</em><button class="tiny" data-act="expand" type="button" aria-label="Expand folders">${open ? "−" : "+"}</button><button class="tiny" data-act="remove" type="button" aria-label="Remove source">×</button>`;
    b.onclick = (e) => {
      if (e.target.closest("button")) return;
      set({ source: s.id });
    };
    b.querySelector('[data-act="expand"]').onclick = async (e) => {
      e.stopPropagation();
      if (open){
        state.sourceTree.expandedSources.delete(s.id);
        if (e.shiftKey) collapseAll(s.id, s.path);
        renderNav();
        return;
      }
      await loadFolderTree(s.id, s.path);
      state.sourceTree.expandedSources.add(s.id);
      if (e.shiftKey) await expandAll(s.id, s.path);
      renderNav();
    };
    b.querySelector('[data-act="remove"]').onclick = async (e) => {
      e.stopPropagation();
      await api("/api/sources/" + s.id, { method: "DELETE" });
      state.sourceTree.expandedSources.delete(s.id);
      if (state.filter.source === s.id) applyFilter({});
      else resetList();
      await refreshMeta();
    };
    b.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      showSourceCtx(e.clientX, e.clientY, s.id);
    });
    bindRowDrag(b, { mime: "application/x-sight-source", rowSelector: ".src-row", idKey: "sid", reorderUrl: "/api/sources/reorder" });
    wrap.append(b);
    if (open) renderFolderChildren(s.id, s.path, 1, wrap);
  });
}

// True if `id` is `ancestorId` itself or nested (at any depth) under it — used to keep a
// collection drag from dropping a collection into itself or one of its own children, which
// would otherwise create a cycle in the parentId chain.
function isCollectionSelfOrDescendant(cols, id, ancestorId){
  let cur = cols.find(c => c.id === id);
  while (cur){
    if (cur.id === ancestorId) return true;
    cur = cols.find(c => c.id === cur.parentId);
  }
  return false;
}

// Reparents/reorders a collection dropped on another one. `zone` is "before"/"after" (drop
// lands as a sibling of `targetId`, taking its parent) or "into" (drop nests it as the last
// child of `targetId`). Collections share one flat sort_order sequence server-side; renderCollections
// groups siblings by filtering that sequence per parentId, so it's enough to place `draggingId`
// at the right spot in the full id list — no per-parent index bookkeeping needed.
async function moveCollection(draggingId, targetId, zone){
  const cols = state.meta.collections || [];
  const dragging = cols.find(c => c.id === draggingId);
  const target = cols.find(c => c.id === targetId);
  if (!dragging || !target) return;
  const newParentId = zone === "into" ? target.id : (target.parentId || null);
  const rest = cols.filter(c => c.id !== draggingId);
  const targetIdx = rest.findIndex(c => c.id === target.id);
  let insertIdx;
  if (zone === "before") insertIdx = targetIdx;
  else if (zone === "after") insertIdx = targetIdx + 1;
  else {
    insertIdx = targetIdx + 1;
    rest.forEach((c, i) => { if (c.parentId === target.id) insertIdx = i + 1; });
  }
  rest.splice(insertIdx, 0, dragging);
  if (newParentId !== (dragging.parentId || null)){
    await api("/api/collections/" + draggingId, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ parentId: newParentId }) });
  }
  await api("/api/collections/reorder", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ ids: rest.map(c => c.id) }) });
  await refreshMeta();
}

function renderCollections(set){
  const wrap = document.createElement("div");
  const head = sectionHeader("Collections", "collections", `<button type="button" aria-label="New collection">+</button>`, "layers");
  head.querySelector("button").onclick = async (e) => {
    e.stopPropagation();
    await api("/api/collections", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name: "Untitled" }) });
    await refreshMeta();
  };
  wrap.append(head);
  bindSectionDrag(wrap, "collections");
  const cols = state.meta.collections || [];
  // Dropping a dragged collection on the section header (rather than on a row) moves it back
  // to the root level, out of whatever collection it was nested under.
  head.addEventListener("dragover", (e) => {
    if (!e.dataTransfer.types.includes("application/x-sight-collection")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    head.classList.add("drop-into");
  });
  head.addEventListener("dragleave", () => head.classList.remove("drop-into"));
  head.addEventListener("drop", async (e) => {
    if (!e.dataTransfer.types.includes("application/x-sight-collection")) return;
    e.preventDefault();
    head.classList.remove("drop-into");
    const draggingId = e.dataTransfer.getData("application/x-sight-collection");
    const dragging = cols.find(c => c.id === draggingId);
    if (dragging && dragging.parentId){
      await api("/api/collections/" + draggingId, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ parentId: null }) });
      await refreshMeta();
    }
  });
  if (state.navCollapse.collections){ nav.append(wrap); return; }
  const roots = cols.filter(c => !c.parentId);
  if (!roots.length){
    const p = document.createElement("p");
    p.className = "sub";
    p.style.padding = "0 8px";
    p.textContent = "Drop files here to sort.";
    wrap.append(p);
  }
  const addRow = (col, depth) => {
    const b = document.createElement("div");
    b.className = "row col-row" + (state.filter.collection === col.id ? " on" : "");
    b.dataset.cid = col.id;
    b.style.paddingLeft = (8 + depth * 12) + "px";
    const iconHtml = state.showIcons ? iconSpan(col.icon || "folder", col.color || "var(--subtle)", 15) : "";
    b.innerHTML = `${iconHtml}<span>${esc(col.name)}</span><em class="badge">${col.count||0}</em><button class="tiny" data-act="add">+</button><button class="tiny" data-act="del">×</button>`;
    const startRename = () => {
      const span = b.querySelector("span:not(.row-icon)");
      const inp = document.createElement("input");
      inp.value = col.name;
      inp.style.cssText = "flex:1;min-width:0;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);padding:0 6px";
      inp.onclick = (ev) => ev.stopPropagation();
      span.replaceWith(inp);
      inp.focus();
      inp.select();
      const done = () => {
        api("/api/collections/" + col.id, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name: inp.value }) }).then(refreshMeta);
      };
      inp.onblur = done;
      inp.onkeydown = (ev) => {
        if (ev.key === "Enter") inp.blur();
        if (ev.key === "Escape") { inp.onblur = null; inp.blur(); refreshMeta(); }
      };
    };
    b.onclick = (e) => {
      const act = e.target.dataset?.act;
      if (act === "add"){
        e.stopPropagation();
        api("/api/collections", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name: "Untitled", parentId: col.id }) }).then(refreshMeta);
        return;
      }
      if (act === "del"){
        e.stopPropagation();
        api("/api/collections/" + col.id, { method:"DELETE" }).then(refreshMeta);
        return;
      }
      if (navDblClick("col:" + col.id)){ startRename(); return; }
      set({ collection: col.id });
    };
    // Two independent drags land on a collection row: files/assets (application/x-sight-ids,
    // dropped anywhere on the row to file them into this collection) and another collection
    // (application/x-sight-collection, for hierarchical reorder/reparent — top/bottom quarter of
    // the row inserts as a sibling before/after, the middle half nests it inside this collection).
    b.addEventListener("dragover", (e) => {
      if (e.dataTransfer.types.includes("application/x-sight-ids")){
        e.preventDefault();
        b.style.outline = "1px solid var(--accent)";
        return;
      }
      if (e.dataTransfer.types.includes("application/x-sight-collection")){
        const draggingEl = nav.querySelector(".col-row.dragging");
        const draggingId = draggingEl?.dataset.cid;
        b.classList.remove("drop-before", "drop-after", "drop-into");
        if (!draggingId || draggingId === col.id || isCollectionSelfOrDescendant(cols, col.id, draggingId)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const rect = b.getBoundingClientRect();
        const frac = (e.clientY - rect.top) / rect.height;
        b.classList.add(frac < 0.25 ? "drop-before" : frac > 0.75 ? "drop-after" : "drop-into");
      }
    });
    b.addEventListener("dragleave", () => { b.style.outline = ""; b.classList.remove("drop-before", "drop-after", "drop-into"); });
    b.addEventListener("drop", async (e) => {
      if (e.dataTransfer.types.includes("application/x-sight-ids")){
        e.preventDefault();
        b.style.outline = "";
        let ids = [];
        try { ids = JSON.parse(e.dataTransfer.getData("application/x-sight-ids") || "[]"); } catch { ids = []; }
        if (!ids.length) ids = state.selectedIds;
        if (ids.length){
          await api("/api/collections/" + col.id + "/assets", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ ids }) });
          await refreshMeta();
        }
        return;
      }
      if (e.dataTransfer.types.includes("application/x-sight-collection")){
        e.preventDefault();
        const zone = b.classList.contains("drop-before") ? "before" : b.classList.contains("drop-after") ? "after" : "into";
        b.classList.remove("drop-before", "drop-after", "drop-into");
        const draggingId = e.dataTransfer.getData("application/x-sight-collection");
        if (draggingId && draggingId !== col.id) await moveCollection(draggingId, col.id, zone);
      }
    });
    b.draggable = true;
    b.addEventListener("dragstart", (e) => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("application/x-sight-collection", col.id);
      b.classList.add("dragging");
    });
    b.addEventListener("dragend", () => { b.classList.remove("dragging", "drop-before", "drop-after", "drop-into"); });
    b.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      showCollectionCtx(e.clientX, e.clientY, col.id);
    });
    wrap.append(b);
    cols.filter(c => c.parentId === col.id).forEach(ch => addRow(ch, depth + 1));
  };
  roots.forEach(c => addRow(c, 0));
  nav.append(wrap);
}

function renderTags(set){
  const tags = state.meta.tags || [];
  const f = state.filter;
  const wrap = document.createElement("div");
  wrap.append(sectionHeader("Tags", "tags", "", "tag"));
  bindSectionDrag(wrap, "tags");
  nav.append(wrap);
  if (state.navCollapse.tags) return;
  if (!tags.length){
    const p = document.createElement("p");
    p.className = "sub";
    p.style.padding = "0 8px";
    p.textContent = "No tags yet.";
    wrap.append(p);
    return;
  }
  tags.forEach((t) => {
    const b = row(t.name, t.count, f.tag === t.name, null);
    b.classList.add("tag-row");
    b.dataset.name = t.name;
    if (state.showIcons){
      const c = t.color || tagColor(t.name);
      const iconHtml = t.icon ? iconSpan(t.icon, c, 15) : `<span class="row-dot" style="background:${esc(c)}"></span>`;
      b.insertAdjacentHTML("afterbegin", iconHtml);
    }
    bindTagHold(b, t.name);
    bindTagRename(b, t.name, () => set({ tag: t.name }));
    b.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      showTagCtx(e.clientX, e.clientY, t);
    });
    bindRowDrag(b, { mime: "application/x-sight-tag", rowSelector: ".tag-row", idKey: "name", reorderUrl: "/api/tags/reorder", bodyKey: "names" });
    wrap.append(b);
  });
}

function bindTagRename(el, name, selectTag){
  el.onclick = () => {
    if (navDblClick("tag:" + name)){ startTagRename(); return; }
    selectTag();
  };
  const startTagRename = () => {
    const span = el.querySelector("span:not(.row-icon):not(.row-dot)");
    const inp = document.createElement("input");
    inp.value = name;
    inp.style.cssText = "flex:1;min-width:0;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);padding:0 6px";
    inp.onclick = (ev) => ev.stopPropagation();
    span.replaceWith(inp);
    inp.focus();
    inp.select();
    const done = async () => {
      const next = inp.value.trim();
      if (next && next.toLowerCase() !== name.toLowerCase()){
        await api("/api/tags/rename", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ old: name, new: next }) });
        for (const a of state.items){
          if (Array.isArray(a.tags)) a.tags = a.tags.map((x) => x.toLowerCase() === name.toLowerCase() ? next : x);
        }
        if (state.filter.tag === name) applyFilter({ tag: next });
      }
      await refreshMeta();
      renderInsp();
    };
    inp.onblur = done;
    inp.onkeydown = (ev) => {
      if (ev.key === "Enter") inp.blur();
      if (ev.key === "Escape") { inp.onblur = null; inp.blur(); refreshMeta(); }
    };
  };
}

function bindTagHold(el, name){
  let timer = 0, held = false;
  const clear = () => { clearTimeout(timer); timer = 0; };
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    held = false;
    timer = window.setTimeout(async () => {
      held = true;
      await api("/api/tags/remove", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) });
      for (const a of state.items){
        if (Array.isArray(a.tags)) a.tags = a.tags.filter((x) => x.toLowerCase() !== name.toLowerCase());
      }
      if (state.filter.tag === name) applyFilter({ tag: "" });
      await refreshMeta();
      renderInsp();
    }, 560);
  });
  el.addEventListener("pointerup", clear);
  el.addEventListener("pointerleave", clear);
  el.addEventListener("pointercancel", clear);
  el.addEventListener("click", (e) => {
    // Suppress the click the browser synthesizes after a long-press-triggered
    // delete, so it doesn't also apply the (now-removed) tag as a filter.
    if (held){ e.preventDefault(); e.stopPropagation(); held = false; }
  });
}

function renderStatus(){
  const n = state.total || state.meta.counts?.all || 0;
  if (state.meta.scanning) status.innerHTML = `<span class="shimmer">scanning · ${n}</span>`;
  else status.textContent = n + " files";
  const sel = state.selectedIds.length;

}
