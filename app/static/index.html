    restart(skyL){
      wAll = 0;
      for (let i = 0; i < N; i++){ weights[i] = Math.max(0, skyL(dirs[i])); wAll += weights[i]; }
      done = 0; wDone = 0;
      if (wAll <= 1e-6){ done = N; clearVis(); }
      return wAll / N; // mean radiance weight → the caller's sky irradiance estimate (× π)
    },
    busy(){ return done < N; },
    step(){
      if (done >= N) return;
      const prevTarget = renderer.getRenderTarget(), prevAuto = renderer.autoClear, prevBg = scene.background;
      renderer.getClearColor(prevClear);
      const prevAlpha = renderer.getClearAlpha();
      const prevShadowAuto = renderer.shadowMap.autoUpdate;
      scene.background = null;
      renderer.autoClear = false;
      if (done === 0){
        renderer.setRenderTarget(accum);
        renderer.setClearColor(0x000000, 0);
        renderer.clear(true, false, false);
      }
      const dist = radius * 3;
      const sc = light.shadow.camera;
      sc.left = -radius; sc.right = radius; sc.top = radius; sc.bottom = -radius;
      sc.near = dist - radius; sc.far = dist + radius + floorSize * 2;
      sc.updateProjectionMatrix();
      light.shadow.radius = softShadowsPatched ? pcssRadius(sc, sampleDeg) : 4;
      light.shadow.bias = -0.0005;
      light.shadow.normalBias = 0;
      for (let n = 0; n < PER_FRAME && done < N; n++, done++){
        const w = weights[done];
        if (w <= 0) continue;
        tmpDir.copy(dirs[done]);
        light.position.copy(center).addScaledVector(tmpDir, dist);
        light.target.position.copy(center);
        light.updateMatrixWorld(); light.target.updateMatrixWorld();
        recvMat.opacity = w;
        renderer.shadowMap.autoUpdate = true;
        renderer.setRenderTarget(dummy);
        renderer.render(scene, castCam);
        renderer.shadowMap.autoUpdate = false;
        renderer.shadowMap.needsUpdate = false;
        renderer.setRenderTarget(accum);
        renderer.render(scene, cam);
        wDone += w;
      }
      renderer.shadowMap.autoUpdate = prevShadowAuto;
      resolveMat.uniforms.uInv.value = wDone > 0 ? 1 / wDone : 0;
      renderer.setRenderTarget(vis);
      renderer.render(resolveScene, quadCam);
      renderer.setRenderTarget(prevTarget);
      renderer.autoClear = prevAuto;
      renderer.setClearColor(prevClear, prevAlpha);
      scene.background = prevBg;
    },
    dispose(){
      accum.dispose(); vis.dispose(); dummy.dispose(); recvMat.dispose(); resolveMat.dispose(); overlayMat.dispose();
      recv.geometry.dispose(); overlay.geometry.dispose(); light.shadow.map?.dispose();
    },
  };
}

// Applies filename-heuristic companion textures (§4) to materials that loaded without a map —
// mainly OBJ/FBX files that reference external textures three.js can't resolve on its own here.
async function applyCompanions(THREE, obj, aid){
  let list = [];
  try { list = await api(`/api/assets/${aid}/companions`); } catch { return; }
  if (!list.length) return;
  const loader = new THREE.TextureLoader();
  // Awaited (bounded), so a thumbnail rendered right after isn't taken before these arrive.
  const pending = [];
  obj.traverse((child) => {
    const mats = Array.isArray(child.material) ? child.material : (child.material ? [child.material] : []);
    for (const mat of mats){
      for (const c of list){
        if (mat[c.slot]) continue;
        pending.push(loader.loadAsync(`/api/file/${c.id}`).then((tex) => {
          if (c.slot === "map" || c.slot === "emissiveMap") tex.colorSpace = THREE.SRGBColorSpace;
          mat[c.slot] = tex;
          mat.needsUpdate = true;
        }, () => {}));
      }
    }
  });
  if (pending.length) await Promise.race([Promise.all(pending), new Promise((r) => setTimeout(r, 15000))]);
}

async function boot3d(elId, aid, url, ext, thumbUrl, hostEl){
  dispose3d(elId);
  const el = hostEl || document.getElementById(elId);
  if (!el) return;
  // Paint the loading state — the asset's existing 2D thumbnail as a backdrop, a loading plate
  // on top — and yield a real frame *before* touching THREE/the model parser. Large models
  // parse synchronously on the main thread; without this yield the lightbox's own fade-in and
  // this placeholder both stay queued behind that parse instead of appearing first (the freeze
  // reported in feedback: the whole window hangs, then the lightbox pops in already loaded).
  el.replaceChildren();
  // A model already parsed in the RAM cache (see loadModelCached) has nothing to download, so it
  // gets the thumbnail backdrop without the progress plate. The backdrop itself stays: cloning,
  // shader compilation and texture upload of a mid-size or large model still take a visible moment.
  const cached = modelCache.has(modelCacheKey(aid));
  const loadingEl = document.createElement("div");
  loadingEl.className = "model-loading" + (elId === "light3d" ? " in-bar" : "");
  // Lightbox: the toolbar/gear stay hidden (CSS, .v3d-loading) until endLoading() — see showInLight.
  const lightEl = elId === "light3d" ? el.closest(".light") : null;
  // Cross-fades to the live canvas underneath instead of cutting to it.
  const endLoading = () => {
    lightEl?.classList.remove("v3d-loading");
    loadingEl.classList.add("done");
    setTimeout(() => loadingEl.remove(), 250);
  };
  // The thumbnail is rendered on a transparent background; paint the viewer's own background
  // behind it so the backdrop matches what the canvas will show once the model is up.
  loadingEl.style.backgroundColor = elId === "light3d" ? state.v3d.bg : "#0a0a0b";
  if (thumbUrl) loadingEl.style.backgroundImage = `url("${thumbUrl}")`;
  if (!cached) loadingEl.innerHTML = `<div class="plate"><div class="mprog-label">Loading model…</div><div class="mprog indeterminate"><i></i></div></div>`;
  el.appendChild(loadingEl);
  // Real download progress where the loader reports it (byte counts — our own /api/file/ always
  // sends Content-Length, so this is almost always computable) instead of a plate that just sits
  // there with no way to tell "still working" from "hung" on a large model or a slow disk.
  function onModelProgress(evt){
    if (!el.isConnected || !el.contains(loadingEl)) return; // stage moved on
    const bar = loadingEl.querySelector(".mprog"), fill = bar && bar.querySelector("i");
    const lbl = loadingEl.querySelector(".mprog-label");
    if (!bar || !fill) return;
    if (evt && evt.lengthComputable && evt.total){
      bar.classList.remove("indeterminate");
      const pct = Math.round(Math.min(1, evt.loaded / evt.total) * 100);
      fill.style.width = pct + "%";
      if (lbl) lbl.textContent = `Loading model… ${pct}%`;
    } else {
      bar.classList.add("indeterminate");
      if (lbl) lbl.textContent = "Loading model…";
    }
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (!el.isConnected || !el.contains(loadingEl)) return; // stage moved on while we yielded
  const isLightbox = elId === "light3d"; // the inspector's small preview keeps the old fixed lighting
  try {
    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const scene = new THREE.Scene();
    const bgColor = new THREE.Color(isLightbox ? state.v3d.bg : 0x0a0a0b);
    scene.background = bgColor;
    const w = Math.max(el.clientWidth, 16), h = Math.max(el.clientHeight, 16);
    const camera = new THREE.PerspectiveCamera(50, w / h, 0.01, 2000);
    camera.position.set(2, 1.4, 2.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h);
    // The viewport can change under a live viewer (window resize, a lightbox mask/aspect change) —
    // both render loops call this each frame; it only does work when the host's size actually changed.
    let sizeW = w, sizeH = h;
    const syncSize = () => {
      const cw = el.clientWidth, ch = el.clientHeight;
      if (cw < 16 || ch < 16 || (cw === sizeW && ch === sizeH)) return;
      sizeW = cw; sizeH = ch;
      renderer.setSize(cw, ch);
      camera.aspect = cw / ch;
      camera.updateProjectionMatrix();
    };
    el.insertBefore(renderer.domElement, loadingEl);
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

    const low = (ext || "").toLowerCase();
    const splat = MODEL_EXT_LOADERS.has(low) ? await isSplatAsset(aid, low) : false;
    if (!el.isConnected || !el.contains(loadingEl)){ // stage moved on during the (possible) header sniff
      releaseRenderer(renderer); // not registered in threeCtls yet, so dispose3d() can't reach it
      return;
    }
    // The Shade toolbar (wireframe/x-ray/base-material/explode) only makes sense for lit
    // meshes — splats are pre-lit, baked spherical-harmonic color with no such controls. The
    // gear/settings panel stays available for both, with different content (see renderV3DPanel).
    if (isLightbox){
      $("v3dShade").hidden = splat;
      if (currentAssetIsSplat !== splat){
        currentAssetIsSplat = splat; // corrects showInLight()'s extension-only guess for .ply
        renderV3DPanel();
      }
    }
    if (splat){
      const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
      controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
      controls.zoomToCursor = true;
      let live = true, mesh = null, camRig = null;
      const loop = () => {
        if (!live) return;
        requestAnimationFrame(loop);
        syncSize();
        camRig?.step(performance.now());
        controls.update();
        // Live-applied from the Splat settings panel (tint/opacity are shader uniforms — free to
        // update every frame) — lightbox only, same convention the mesh rig uses for state.v3d.
        if (mesh && isLightbox){
          const v = state.v3d;
          bgColor.set(v.bg);
          mesh.recolor.r = v.splatR; mesh.recolor.g = v.splatG; mesh.recolor.b = v.splatB;
          mesh.opacity = v.splatOpacity;
        }
        renderer.render(scene, camera);
      };
      loop();
      threeCtls.set(elId, { renderer, stop(){ live = false; } });
      const { SparkRenderer, SplatMesh } = await import("@sparkjsdev/spark");
      scene.add(new SparkRenderer({ renderer }));
      mesh = new SplatMesh({ url, fileType: SPLAT_FILE_TYPE_BY_EXT[low], onProgress: onModelProgress });
      scene.add(mesh);
      await mesh.initialized;
      if (!live) return; // viewer was torn down (asset switched / lightbox closed) mid-load
      // Most splat exporters (COLMAP/3DGS convention) use a Y-down, Z-forward frame — flip to
      // three.js's Y-up, matching the orientation correction Spark's own examples always apply.
      mesh.quaternion.set(1, 0, 0, 0);
      mesh.updateMatrixWorld(true);
      const box = mesh.getBoundingBox(true).applyMatrix4(mesh.matrixWorld);
      const size = box.getSize(new THREE.Vector3()).length() || 1;
      const center = box.getCenter(new THREE.Vector3());
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(size*0.7, size*0.45, size*0.7));
      camera.near = size/100; camera.far = size*20; camera.updateProjectionMatrix();
      if (isLightbox){
        camRig = makeCameraRig(THREE, camera, controls, aid);
        camRig.setHome(size);
        v3dCam = camRig;
        const dims = box.getSize(new THREE.Vector3());
        const f = (x) => Number(x.toPrecision(4)).toString();
        setSceneInfo({ id: aid, title: "Scene", rows: [
          ["Splats", (mesh.packedSplats?.numSplats ?? mesh.numSplats ?? 0).toLocaleString("en-US")],
          ["Bounds", `${f(dims.x)} × ${f(dims.y)} × ${f(dims.z)}`],
        ] });
      }
      endLoading();
      return;
    }

    // --- lighting / floor / environment rig (lightbox only — driven live by state.v3d,
    // see syncRig() below and the settings panel in renderV3DPanel()) -------------------
    let ambientLight, rigLights = [], floor = null, grid = null, floorMatSolid, floorMatShadow, envTex = null;
    let skyOcc = null, skyLum = null, envVersion = 0; // floor shadow from ambient + environment (makeSkyOcclusion)
    let lightDrag = null; // Alt+left-drag on the canvas — rotates all lights + the env map (see below)
    if (isLightbox){
      renderer.shadowMap.enabled = true;
      // Basic = raw depth, filtered by our PCSS getShadow (patchSoftShadows); PCF if the patch can't apply.
      renderer.shadowMap.type = patchSoftShadows(THREE) ? THREE.BasicShadowMap : THREE.PCFShadowMap;
      ambientLight = new THREE.AmbientLight(0xffffff, state.v3d.ambient);
      scene.add(ambientLight);
      for (let i = 0; i < 3; i++){
        const l = new THREE.DirectionalLight(0xffffff, 1);
        l.castShadow = true;
        l.shadow.mapSize.set(2048, 2048);
        scene.add(l, l.target);
        rigLights.push(l);
      }
      // transparent: the floor fades out while explode pushes parts below it (see syncRig)
      floorMatSolid = new THREE.MeshStandardMaterial({ color: 0x17171b, roughness: 1, transparent: true });
      floorMatShadow = new THREE.ShadowMaterial({ opacity: state.v3d.shadowStrength });
      floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), floorMatSolid);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      floor.visible = false;
      scene.add(floor);
      grid = new THREE.GridHelper(1, 20, 0x4a4a54, 0x26262c);
      grid.visible = false;
      scene.add(grid);
      envTex = buildEnvTexture(THREE, renderer, ENV_PRESETS[state.v3d.envPreset] || ENV_PRESETS.studio);
      skyLum = skyLumFromPreset(THREE, ENV_PRESETS[state.v3d.envPreset] || ENV_PRESETS.studio);
      skyOcc = makeSkyOcclusion(THREE, renderer, scene);
      floorMatSolid.aoMap = skyOcc.texture; // scales only the floor's ambient + environment light
      // The settings panel's environment picker (renderV3DPanel) calls through these — it has
      // no direct access to the renderer/scene living in this closure.
      onV3DEnvPresetChange = (name) => {
        if (!live) return;
        const tex = buildEnvTexture(THREE, renderer, ENV_PRESETS[name] || ENV_PRESETS.studio);
        if (envTex) envTex.dispose();
        envTex = tex;
        skyLum = skyLumFromPreset(THREE, ENV_PRESETS[name] || ENV_PRESETS.studio);
        envVersion++;
      };
      onV3DEnvFile = async (file) => {
        const url = URL.createObjectURL(file);
        try {
          const tex = await buildEnvTextureFromImage(THREE, renderer, url);
          if (!live || !tex) return;
          if (envTex) envTex.dispose();
          envTex = tex;
          try { skyLum = await skyLumFromImage(file); } catch { skyLum = () => 0.5; }
          envVersion++;
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      // Alt+left-click-drag rotates all lights + the environment map around the vertical axis.
      // Registered before OrbitControls binds its own pointerdown below, so on the shared
      // canvas element this handler runs first and can stopImmediatePropagation() to keep
      // OrbitControls from also starting an orbit drag for the same gesture.
      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (!e.altKey || e.button !== 0) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        lightDrag = { x: e.clientX, yaw0: state.v3d.lightYaw };
        renderer.domElement.setPointerCapture(e.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (e) => {
        if (!lightDrag) return;
        let yaw = (lightDrag.yaw0 + (e.clientX - lightDrag.x) * 0.5) % 360;
        if (yaw > 180) yaw -= 360; else if (yaw < -180) yaw += 360;
        state.v3d.lightYaw = yaw;
        saveV3D();
      });
      renderer.domElement.addEventListener("pointerup", () => { lightDrag = null; });
      renderer.domElement.addEventListener("pointercancel", () => { lightDrag = null; });
    } else {
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(3,5,2); scene.add(dir);
    }

    // Ctrl+right-drag drives the explode amount (right / up = further apart, 400 px = full range)
    // instead of dollying. Bound before OrbitControls so stopImmediatePropagation() keeps it from
    // starting its own right-button drag for the same gesture.
    let explodeDrag = null;
    renderer.domElement.addEventListener("pointerdown", (e) => {
      if (e.button !== 2 || !(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (!explodeMap) return;
      explodeDrag = { x: e.clientX, y: e.clientY, v0: state.v3d.explode };
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!explodeDrag) return;
      const d = (e.clientX - explodeDrag.x) - (e.clientY - explodeDrag.y);
      const val = Math.min(1, Math.max(0, explodeDrag.v0 + d / 400));
      if (val === state.v3d.explode) return;
      state.v3d.explode = val;
      saveV3D();
      light?.explodeSlider?.set(val);
      flashV3DToast(`Explode ${Math.round(val * 100)}%`);
    });
    const endExplodeDrag = () => { explodeDrag = null; };
    renderer.domElement.addEventListener("pointerup", endExplodeDrag);
    renderer.domElement.addEventListener("pointercancel", endExplodeDrag);

    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
    // Match the pan/zoom convention every other viewer here uses (middle-drag pan, right-drag
    // + wheel zoom) — left stays orbit/rotate since 2D viewers have no equivalent for that.
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
    controls.zoomToCursor = true; // zoom toward the pointer, not the orbit target
    // Click picking (a left click that didn't move — a drag is an orbit / pan): Ctrl+click selects
    // the mesh under the cursor (same selection as the info panel's Meshes list, Ctrl+click it
    // again to deselect); a click on empty space clears whatever is selected (mesh, material or
    // texture). A plain click on the model does nothing.
    let pickDown = null;
    renderer.domElement.addEventListener("pointerdown", (e) => {
      pickDown = e.button === 0 && !e.altKey ? { x: e.clientX, y: e.clientY } : null;
    });
    renderer.domElement.addEventListener("pointerup", (e) => {
      const d = pickDown;
      pickDown = null;
      if (!d || e.button !== 0 || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 4) return;
      const ins = v3dInspect;
      if (!ins || !light || ins.aid !== light.id) return;
      const ctrl = (e.ctrlKey || e.metaKey) && !e.shiftKey; // exact modifiers (Alt is excluded above)
      if (!ctrl && !ins.sel) return;
      const r = renderer.domElement.getBoundingClientRect();
      const ray = new THREE.Raycaster();
      ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
      const hit = ray.intersectObjects(ins.meshes.map((m) => m.c).filter((c) => c.visible), false)[0];
      const i = hit ? ins.meshes.findIndex((m) => m.c === hit.object) : -1;
      if (i < 0) setInspectSel(null);
      else if (ctrl) setInspectSel(ins.sel && ins.sel.kind === "mesh" && ins.sel.i === i ? null : { kind: "mesh", i }, true);
    });

    let obj = null, origMats = null, rigRadius = 5;
    let explodeMap = null;
    let shadeApplied = { base: null, wire: null, xray: null, explode: null, solid: null };
    const D2R = Math.PI / 180;
    // Shadow frusta hug the model's bounding sphere (the old ±diagonal box wasted half the map's
    // texels, which showed as stair steps) and are refitted when explode moves parts around.
    const rigCenter = new THREE.Vector3(), rigDir = new THREE.Vector3(), skyDir = new THREE.Vector3();
    let rigR = 1, rigDist = 5, floorSpan = 3, fitVersion = 0, occKey = "", eInd = 0;
    let floorFade = 1, fadeTarget = 1, fadeRange = 1, lastSync = performance.now();
    function fitShadows(box){
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      rigCenter.copy(sphere.center);
      rigR = Math.max(sphere.radius, 1e-4);
      rigDist = Math.max(rigRadius, rigR * 3);
      rigLights.forEach((l) => {
        const sc = l.shadow.camera;
        sc.left = -rigR; sc.right = rigR; sc.top = rigR; sc.bottom = -rigR;
        // far reaches past the whole floor so long, low-light shadows are still inside the map
        sc.near = Math.max(1e-3, rigDist - rigR * 1.05); sc.far = rigDist + rigR + floorSpan * 1.5;
        sc.updateProjectionMatrix();
        l.shadow.bias = -0.0001;
        l.shadow.normalBias = rigR * 2 / l.shadow.mapSize.x * 1.5;
      });
      skyOcc.fit(sphere.center, rigR, floor.position.y, floorSpan, floor.position.x, floor.position.z);
      fitVersion++;
    }
    // Explode: parts pushed below the floor make its shadow meaningless — fade the floor (and grid,
    // shadows) out by how deep the lowest part has sunk, over ~15% of the model's size.
    function onExplodeMoved(){
      obj.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj);
      const below = floor.position.y - box.min.y;
      const t = Math.min(1, Math.max(0, below / fadeRange));
      fadeTarget = 1 - t * t * (3 - 2 * t);
      fitShadows(box);
    }
    function syncRig(){
      const v = state.v3d;
      const now = performance.now();
      floorFade += (fadeTarget - floorFade) * (1 - Math.exp(-(now - lastSync) / 120));
      if (Math.abs(fadeTarget - floorFade) < 0.002) floorFade = fadeTarget;
      lastSync = now;
      bgColor.set(v.bg);
      let eDir = 0; // direct irradiance on the (upward-facing) floor, for the shadow-only mix below
      for (let i = 0; i < 3; i++){
        const l = rigLights[i], n = i + 1;
        const on = v["l" + n + "on"];
        l.visible = on;
        if (!on) continue;
        l.intensity = v["l" + n + "i"];
        l.color.set(v["l" + n + "color"]);
        const az = (v["l" + n + "az"] + v.lightYaw) * D2R, el2 = v["l" + n + "el"] * D2R;
        const dir = rigDir.set(Math.cos(el2) * Math.sin(az), Math.sin(el2), Math.cos(el2) * Math.cos(az));
        if (v.anchor === "camera") dir.applyQuaternion(camera.quaternion);
        // A directional light only has a direction — anchoring it on the model (not the orbit
        // target) keeps the model inside its shadow frustum however far the view is panned.
        l.position.copy(rigCenter).addScaledVector(dir, rigDist);
        l.target.position.copy(rigCenter);
        const sizeDeg = v["l" + n + "size"] ?? 0;
        l.shadow.radius = softShadowsPatched ? pcssRadius(l.shadow.camera, sizeDeg) : 1 + sizeDeg / 3;
        eDir += l.intensity * Math.max(0, dir.y);
      }
      ambientLight.intensity = v.ambient;
      const envOn = !!(v.env && envTex);
      const showFloor = v.floor && floorFade > 0.003;
      floor.visible = showFloor;
      grid.visible = v.grid && floorFade > 0.003;
      grid.material.opacity = floorFade;
      floorMatSolid.opacity = floorFade;
      const wantMat = v.shadowOnly ? floorMatShadow : floorMatSolid;
      if (floor.material !== wantMat) floor.material = wantMat;
      // Floor shadow from the sky (ambient + environment), restarted when anything it depends on
      // changes. A custom env image isn't symmetric around Y, so its yaw matters too.
      if (showFloor && obj){
        const yaw = v.lightYaw * D2R, cy = Math.cos(yaw), sy = Math.sin(yaw);
        const key = [envOn, envVersion, v.envStrength, v.ambient, v.envPreset === "custom" ? v.lightYaw : 0, fitVersion].join("|");
        if (key !== occKey){
          occKey = key;
          const ambL = v.ambient / Math.PI;
          // the env lookup direction is Ry(−yaw)·dir (three's envMapRotation for PMREM maps)
          eInd = Math.PI * skyOcc.restart((d) => ambL + (envOn ? v.envStrength * skyLum(skyDir.set(d.x * cy - d.z * sy, d.y, d.x * sy + d.z * cy)) : 0));
        }
        skyOcc.step();
      }
      // Shadow-only floor: its darkness is the light that fails to reach it — direct shadows weigh
      // by the direct lights' share, the sky shadow by the ambient + environment share.
      const directShare = eDir / Math.max(1e-6, eDir + eInd);
      floorMatShadow.opacity = v.shadowStrength * directShare * floorFade;
      skyOcc.overlay.visible = showFloor && v.shadowOnly;
      skyOcc.overlay.material.uniforms.uAlpha.value = v.shadowStrength * (1 - directShare) * floorFade;
      scene.environment = envOn ? envTex : null;
      scene.environmentIntensity = v.envStrength;
      scene.environmentRotation.y = v.lightYaw * D2R;
      if (obj){
        if (shadeApplied.base !== v.shadeBase){
          applyBaseMaterial(THREE, obj, origMats, v.shadeBase);
          shadeApplied.base = v.shadeBase;
          shadeApplied.xray = null; // materials were just swapped — force xray to reapply onto them
          shadeApplied.solid = null;
        }
        // Solid material settings are live: retint the Solid materials in place when they change.
        const solidKey = v.shadeBase === "solid" ? v.solidColor + "|" + v.solidMetal + "|" + v.solidRough : null;
        if (solidKey && shadeApplied.solid !== solidKey){
          obj.traverse((c) => {
            const m = c.isMesh && c.material;
            if (!m || !m.userData._v3dSolid) return;
            m.color.set(v.solidColor);
            m.metalness = v.solidMetal;
            m.roughness = v.solidRough;
          });
          shadeApplied.solid = solidKey;
        }
        if (shadeApplied.xray !== v.xrayOn){
          applyXray(obj, v.xrayOn);
          shadeApplied.xray = v.xrayOn;
        }
        if (shadeApplied.wire !== v.wireOn){
          setWireOverlay(THREE, obj, v.wireOn);
          shadeApplied.wire = v.wireOn;
        }
        if (explodeMap && shadeApplied.explode !== v.explode){
          applyExplode(explodeMap, v.explode);
          shadeApplied.explode = v.explode;
          onExplodeMoved();
        }
      }
    }

    let live = true, camRig = null;
    const loop = () => {
      if (!live) return;
      requestAnimationFrame(loop);
      syncSize();
      if (isLightbox) syncRig();
      camRig?.step(performance.now());
      controls.update();
      renderer.render(scene, camera);
    };
    loop();
    threeCtls.set(elId, { renderer, stop(){ live = false; } });
    if (!MODEL_EXT_LOADERS.has(low)){
      el.innerHTML = `<div class="ph">${low.slice(1) || "3D"} — open in an external viewer</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    obj = await loadModelCached(THREE, url, ext, onModelProgress, aid);
    if (!live) return; // viewer was torn down (asset switched / lightbox closed) mid-load
    if (!obj){
      el.innerHTML = `<div class="ph">${low.slice(1) || "3D"} — open in an external viewer</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    const baseQuat = obj.quaternion.clone(), basePos = obj.position.clone();
    const qTurn = new THREE.Quaternion(), xAxis = new THREE.Vector3(1, 0, 0);
    const applyTurns = (n) => {
      qTurn.setFromAxisAngle(xAxis, -n * Math.PI / 2);
      obj.quaternion.copy(baseQuat).premultiply(qTurn);
      obj.position.copy(basePos).applyQuaternion(qTurn);
      obj.updateMatrixWorld(true);
    };
    applyTurns(getModelTurns(aid));
    frameObject3d(THREE, obj, scene, camera, controls.target);
    // Floor / grid / shadow frustum all depend on the model's bounds, so a turn re-runs this.
    const fitRig = () => {
      // The floor sits under the assembled model: measure with explode undone, then put it back.
      if (explodeMap){ applyExplode(explodeMap, 0); obj.updateMatrixWorld(true); }
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3()).length() || 1;
      const c = box.getCenter(new THREE.Vector3());
      rigRadius = size * 1.6;
      floorSpan = size * 3;
      fadeRange = size * 0.15;
      floor.geometry.dispose();
      floor.geometry = new THREE.PlaneGeometry(floorSpan, floorSpan);
      floor.position.set(c.x, box.min.y, c.z);
      scene.remove(grid);
      grid.geometry.dispose();
      grid.material.dispose();
      grid = new THREE.GridHelper(floorSpan, 20, 0x4a4a54, 0x26262c);
      grid.material.transparent = true;
      grid.visible = state.v3d.grid;
      grid.position.set(c.x, box.min.y + Math.max(0.001, size * 0.002), c.z);
      scene.add(grid);
      if (explodeMap){ applyExplode(explodeMap, state.v3d.explode); onExplodeMoved(); }
      else fitShadows(box);
      return { box, size };
    };
    if (isLightbox){
      const { box, size } = fitRig();
      // A turn re-frames the model, so it also moves the camera rig's "frame all" home. Saved
      // views that were taken at a different turn call this to put the model back that way first.
      const turnTo = (n) => {
        if (!live || !light) return;
        setModelTurns(aid, n);
        light.rotated = aid;
        applyTurns(n);
        camRig.setHome(frameObject3d(THREE, obj, scene, camera, controls.target));
        fitRig();
      };
      camRig = makeCameraRig(THREE, camera, controls, aid, { get: () => getModelTurns(aid), set: turnTo });
      camRig.setHome(size);
      v3dCam = camRig;
      onV3DRotate = () => turnTo((getModelTurns(aid) + 1) & 3);
      obj.traverse((c) => { if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; } });
      skyOcc.markCasters(obj);
      origMats = new Map();
      obj.traverse((c) => { if (c.isMesh) origMats.set(c, c.material); });
      // Explode rig (explosion graph per assembly level, see buildExplodeRig). Solved with the
      // model assembled; turns are applied above it, so they never invalidate it.
      explodeMap = buildExplodeRig(THREE, obj);
      // A single-mesh model has nothing to pull apart — hide the slider (and its separator) rather
      // than offer a control that does nothing.
      $("v3dExplode").hidden = !explodeMap;
      $("v3dExplodeSep").hidden = !explodeMap;
      shadeApplied = { base: null, wire: null, xray: null, explode: null, solid: null }; // force the next syncRig() to (re)apply everything
      syncRig();
      v3dInspect = makeModelInspector(THREE, renderer, scene, obj, origMats, aid);
      setSceneInfo(v3dInspect.summary);
      syncUvPane();
    }
    // Keep the thumbnail cover up until the model has actually been drawn. The first frame with the
    // model compiles its shaders and uploads its textures, which blocks the main thread; lifting the
    // cover before that showed an empty grey canvas for as long as it took. The render loop's rAF is
    // queued before ours, so it draws the model in the first of these frames, under the cover.
    // (Not renderer.compileAsync(): it never resolved here for a large model — the live loop swaps
    // material programs while it polls the old ones.)
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (!live) return;
    endLoading();
  } catch (err) {
    el.innerHTML = `<div class="ph">3D failed to load</div>`;
    if (el.isConnected) lightEl?.classList.remove("v3d-loading");
    console.warn(err);
  }
}

function previewSrc(a){
  if (a.ext === ".psd") return `/api/psd/${a.id}/preview`;
  if (a.kind === "image" || a.kind === "video") return `/api/file/${a.id}`;
  return "";
}

const TEXT_EXT = new Set([
  ".txt", ".md", ".markdown", ".csv", ".tsv", ".json", ".xml", ".yaml", ".yml",
  ".log", ".ini", ".cfg", ".toml",
]);

function fillStage(stage, a){
  dispose3d("light3d");
  const src = previewSrc(a);
  if (a.kind === "video" || a.kind === "image" || a.ext === ".psd"){
    attachViewer(stage, a, src);
  } else if (a.kind === "model3d"){
    stage.innerHTML = `<div class="view3d" id="light3d"></div>`;
    boot3d("light3d", a.id, `/api/file/${a.id}`, a.ext, thumbSrc(a), stage.firstElementChild);
  } else if (a.kind === "audio"){
    stage.innerHTML = `<div class="wave wave-light" id="waveLight"></div>`;
    mountWave("waveLight", a.id, `/api/file/${a.id}`, true);
  } else if (a.kind === "font"){
    mountFontStage(stage, a);
  } else if (a.kind === "document"){
    mountDocStage(stage, a);
  } else {
    stage.innerHTML = `<p>${esc(a.name)}</p>`;
  }
}

async function mountFontStage(stage, a){
  // A stage can be re-mounted for another asset while a font is still loading, so keep a direct
  // element reference (and check isConnected) rather than looking the host up by id.
  const family = "sight-font-" + a.id;
  stage.innerHTML = `<div class="font-view"><div class="font-loading">Loading font…</div></div>`;
  const host = stage.querySelector(".font-view");
  try {
    const face = new FontFace(family, `url("/api/file/${a.id}")`);
    await face.load();
    document.fonts.add(face);
    if (!host.isConnected) return; // this stage moved on to a different asset meanwhile
    host.innerHTML = `
      <div class="font-sample" style="font-family:'${family}';font-size:64px;">Aa Bb Cc</div>
      <div class="font-sample" style="font-family:'${family}';font-size:26px;">The quick brown fox jumps over the lazy dog — 0123456789</div>
      <div class="font-sample" style="font-family:'${family}';font-size:15px;">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789 !@#$%^&amp;*()</div>
      <div class="font-name">${esc(a.name)}</div>
    `;
  } catch (err) {
    if (host.isConnected) host.innerHTML = `<div class="ph">font failed to load</div>`;
    console.warn(err);
  }
}

async function mountDocStage(stage, a){
  if (a.ext === ".pdf"){
    stage.innerHTML = `<embed class="doc-pdf" src="/api/file/${a.id}" type="application/pdf" />`;
    return;
  }
  if (TEXT_EXT.has(a.ext)){
    // Same simultaneous inspector+lightbox mount concern as mountFontStage above — use a
    // direct element reference rather than an id lookup.
    stage.innerHTML = `<div class="doc-text-wrap"><pre class="doc-text">Loading…</pre><div class="view-hud"></div></div>`;
    const wrap = stage.querySelector(".doc-text-wrap");
    const pre = stage.querySelector(".doc-text");
    const hud = stage.querySelector(".view-hud");
    const BASE_FONT = 13; // matches the .doc-text default in the stylesheet — scale is relative to it
    const ts = { scale: 1, zoomD: null };
    function applyTextZoom(){
      pre.style.fontSize = (BASE_FONT * ts.scale) + "px";
      hud.textContent = Math.abs(ts.scale - 1) < 0.012 ? "100%" : Math.round(ts.scale * 100) + "%";
    }
    function setTextScale(n){
      ts.scale = Math.min(12, Math.max(0.2, n));
      applyTextZoom();
    }
    // Right-click-drag resizes the text the same way it zooms images/video (same axis/speed/invert
    // settings); middle-click-drag scrolls it, same as MMB pan there — both use pointer capture
    // instead of the browser's own middle-click autoscroll, so it's a held drag, not a click-toggle.
    // Left-button drag is untouched either way, so selecting text still works as normal, and the
    // wheel is left alone too — it scrolls the text natively, exactly as it did before this.
    let panD = null;
    wrap.addEventListener("pointerdown", (e) => {
      if (e.button === 1){
        e.preventDefault();
        wrap.setPointerCapture(e.pointerId);
        panD = { x: e.clientX, y: e.clientY, sl: pre.scrollLeft, st: pre.scrollTop };
        return;
      }
      if (e.button !== 2) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      ts.zoomD = { x: e.clientX, y: e.clientY, scale: ts.scale };
    });
    wrap.addEventListener("pointermove", (e) => {
      if (panD){
        pre.scrollLeft = panD.sl - (e.clientX - panD.x);
        pre.scrollTop = panD.st - (e.clientY - panD.y);
        return;
      }
      if (!ts.zoomD) return;
      const t = state.theme;
      const raw = t.zoomAxis === "x" ? (e.clientX - ts.zoomD.x) : (ts.zoomD.y - e.clientY);
      const d = (t.zoomInvert ? -raw : raw) * 0.012 * (t.zoomSpeed ?? 1);
      setTextScale(ts.zoomD.scale * Math.exp(d));
    });
    const endDrag = () => { ts.zoomD = null; panD = null; };
    wrap.addEventListener("pointerup", endDrag);
    wrap.addEventListener("pointercancel", endDrag);
    wrap.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
    wrap.addEventListener("contextmenu", (e) => e.preventDefault());
    applyTextZoom();
    // Only claim the lightbox's digit-key zoom if this mount IS the open lightbox (this function
    // also renders the Inspector sidebar's document preview independently of the lightbox).
    if (light && light.id === a.id) light.setZoom = (n) => setTextScale(n);
    try {
      const data = await api(`/api/text/${a.id}`);
      if (!pre.isConnected) return;
      pre.textContent = data.text + (data.truncated ? "\n\n… (truncated)" : "");
    } catch {
      if (pre.isConnected) pre.textContent = "Failed to load preview.";
    }
    return;
  }
  stage.innerHTML = `<div class="ph">${esc((a.ext || "").slice(1) || "document")} — open in an external viewer</div>`;
}

function fmtTime(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}

// Waveform audio player — a hidden <audio> for playback, bars for visualization + click/drag
// seek. Peaks come from /api/waveform/{id} (ffmpeg-decoded server-side, cached to disk).
async function mountWave(hostId, aid, src, autoplay){
  const host = document.getElementById(hostId);
  if (!host) return;
  const stale = host.querySelector(".wave-audio");
  if (stale){ try { stale.pause(); } catch {} } // a still-playing previous track would keep going in the background otherwise
  host.innerHTML = `
    <div class="wave-body">
      <div class="wave-bars"><span class="wave-loading">decoding…</span></div>
      <div class="wave-time"><span data-cur>0:00</span><span data-dur>0:00</span></div>
    </div>
    <button type="button" class="wave-play" aria-label="Play">▶</button>
    <audio class="wave-audio" src="${src}" preload="metadata"${autoplay ? " autoplay" : ""}></audio>
  `;
  const audio = host.querySelector(".wave-audio");
  const btn = host.querySelector(".wave-play");
  const barsEl = host.querySelector(".wave-bars");
  barsEl.classList.toggle("mode-vertical", state.theme.waveMode === "vertical");
  const curEl = host.querySelector("[data-cur]");
  const durEl = host.querySelector("[data-dur]");
  let peaks = null, duration = 0, dragging = false, rafId = 0;
  if (light) light.audio = audio;

  function isCurrent(){ return host.querySelector(".wave-audio") === audio; }
  function paint(){
    if (!peaks) return;
    const ratio = duration ? Math.min(1, audio.currentTime / duration) : 0;
    barsEl.querySelectorAll(".wb").forEach((el, i) => {
      el.classList.toggle("on", peaks.length > 1 ? i / (peaks.length - 1) <= ratio : ratio >= 1);
    });
    curEl.textContent = fmtTime(audio.currentTime);
  }
  // A plain "paint on timeupdate" was the cause of the reported jumpy playback — timeupdate
  // fires only a few times a second, so bars advanced in visible batches. Driving the same
  // paint() from requestAnimationFrame while playing sweeps through bars smoothly instead.
  function tick(){
    if (!isCurrent()){ rafId = 0; return; }
    paint();
    rafId = requestAnimationFrame(tick);
  }
  function startTick(){ if (!rafId) rafId = requestAnimationFrame(tick); }
  function stopTick(){ if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

  btn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
  audio.onplay = () => { btn.textContent = "⏸"; startTick(); };
  audio.onpause = () => { btn.textContent = "▶"; stopTick(); paint(); };
  audio.onended = () => { stopTick(); paint(); };
  audio.onloadedmetadata = () => { if (audio.duration) duration = audio.duration; durEl.textContent = fmtTime(duration); };
  audio.ontimeupdate = () => { if (audio.paused) paint(); };

  function seekFromEvent(e){
    if (!duration) return;
    const rect = barsEl.getBoundingClientRect();
    const ratio = rect.width ? Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) : 0;
    audio.currentTime = ratio * duration;
    curEl.textContent = fmtTime(audio.currentTime);
    paint();
  }
  barsEl.addEventListener("pointerdown", (e) => { dragging = true; barsEl.setPointerCapture(e.pointerId); seekFromEvent(e); });
  barsEl.addEventListener("pointermove", (e) => { if (dragging) seekFromEvent(e); });
  barsEl.addEventListener("pointerup", () => { dragging = false; });
  barsEl.addEventListener("pointercancel", () => { dragging = false; });

  try {
    const data = await api("/api/waveform/" + aid);
    if (host.querySelector(".wave-audio") !== audio) return; // host was re-mounted meanwhile
    peaks = data.peaks || [];
    if (data.durationMs) duration = data.durationMs / 1000;
    durEl.textContent = fmtTime(duration);
    barsEl.innerHTML = peaks.map((p) => `<i class="wb" style="height:${Math.max(6, Math.round(p / 255 * 100))}%"></i>`).join("");
    paint();
  } catch {
    barsEl.innerHTML = `<span class="wave-loading">no waveform</span>`;
  }
}
// The video's RAM cache lives on the server (SlidingVideoCache): the player tells it where the
// playhead is and how much RAM the settings allow, it keeps a window of the file filled around that
// spot (sliding with the playhead) and reports the window back — that is the green strip on the
// timeline. The <video> itself just streams /api/file/<id>, which is served through that window,
// so playback starts at once instead of after the whole file has been downloaded.
function applyCacheSnap(snap){
  if (!light || !snap) return;
  light.snap = snap;
  paintVBar();
}
function paintVBar(){
  if (!light?.bar) return;
  const el = light.video;
  const dur = el && Number.isFinite(el.duration) ? el.duration : 0;
  const cur = light.scrubT != null ? light.scrubT : (el ? el.currentTime : 0);
  light.bar.querySelector("[data-cur]").textContent = fmtTime(cur);
  light.bar.querySelector("[data-dur]").textContent = fmtTime(dur);
  const play = light.bar.querySelector(".vplay");
  play.style.left = (dur > 0 ? (cur / dur) * 100 : 0) + "%";
  const cache = light.bar.querySelector(".vcache");
  const snap = light.snap;
  if (snap && snap.size > 0 && (snap.end > snap.start)){
    const a = (snap.start / snap.size) * 100;
    const b = (snap.end / snap.size) * 100;
    cache.style.left = a + "%";
    cache.style.width = Math.max(0, b - a) + "%";
  } else {
    cache.style.left = "0%";
    cache.style.width = "0%";
  }
  light.bar.querySelector("[data-mem]").textContent = snap ? `RAM ${Math.round(snap.bytes / 1048576)} / ${snap.mb} MB` : "";
}
// Tell the server where the playhead is (throttled: minGap ms between posts, with a trailing post
// so the last position always gets through). Every post carries the RAM budget from the settings,
// so the saved value applies from the first video after a restart, not only after the slider moves.
function pushVideoFocus(el, a, minGap){
  if (!light || light.video !== el) return;
  clearTimeout(light.focusTimer);
  const wait = minGap - (performance.now() - light.focusAt);
  if (wait > 0){ light.focusTimer = setTimeout(() => pushVideoFocus(el, a, 0), wait); return; }
  light.focusAt = performance.now();
  const t = light.scrubT != null ? light.scrubT : el.currentTime;
  fetch("/api/video/focus", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: a.id, t: t || 0, duration: Number.isFinite(el.duration) ? el.duration : 0, mb: clampCache(state.theme.videoCache) }),
  }).then((r) => r.json()).then((snap) => { if (light && light.video === el) applyCacheSnap(snap); }).catch(() => {});
}
function startVideoCache(el, a){
  releaseMedia(false);
  el.src = `/api/file/${a.id}`;
  pushVideoFocus(el, a, 0);
  // The window keeps filling after the focus reply, so poll to keep the strip honest.
  light.cacheTimer = setInterval(() => {
    if (!light || light.video !== el) return;
    fetch(`/api/video/cache?aid=${a.id}`).then((r) => r.json()).then((snap) => { if (light && light.video === el) applyCacheSnap(snap); }).catch(() => {});
  }, 500);
}
// free: also drop the server-side window (player closed / moved to a non-video) so a big RAM budget
// doesn't stay resident with nothing playing.
function releaseMedia(free){
  if (!light) return;
  clearInterval(light.cacheTimer);
  clearTimeout(light.focusTimer);
  light.cacheTimer = light.focusTimer = 0;
  if (free) fetch("/api/video/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ release: true }) }).catch(() => {});
}

// opts.embedded: a picture that is not the lightbox asset itself (the 3D UV pane) — no thumbnail
// placeholder and no claim on light.video / light.setZoom. Returns { fit, zoom } for its owner.
function attachViewer(stage, a, src, opts = {}){
  const isVid = a.kind === "video";
  // Images open on their thumbnail (.view-ph), already framed, and the full file stays hidden
  // (.loading) until it is loaded and decoded — otherwise a big file paints top-down at native size
  // before the fit kicks in. A full image already in the memory cache (a probe Image reports it
  // complete synchronously) is drawn straight away, with no thumbnail and no fade.
  let cached = false;
  if (!isVid && src){
    const probe = new Image();
    probe.src = src;
    cached = probe.complete && probe.naturalWidth > 0;
  }
  const ph = isVid || cached || opts.embedded ? "" : thumbSrc(a);
  stage.innerHTML = `<div class="view" id="view">${ph ? `<img class="view-ph" alt="" decoding="sync" src="${ph}" draggable="false" />` : ""}<${isVid ? "video" : "img"} class="view-media${isVid || cached ? "" : " loading"}" ${isVid ? 'autoplay playsinline preload="auto"' : `alt="" ${cached ? 'decoding="sync" ' : ""}src="${src}"`} draggable="false" /><div class="view-hud" id="viewHud"></div></div>`;
  const wrap = stage.querySelector(".view");
  const el = stage.querySelector(".view-media");
  let phEl = stage.querySelector(".view-ph");
  const hud = stage.querySelector(".view-hud");
  const vs = { scale: 1, pan: { x: 0, y: 0 }, nat: { w: a.width || 0, h: a.height || 0 }, mode: "fit", panD: null, zoomD: null };
  if (light && !opts.embedded){ light.video = isVid ? el : null; light.setZoom = (n) => toScale(n); }
  // Scrubbing sets currentTime far faster than a long-GOP clip can decode. Firing a seek per
  // pointer event piles them up and the picture freezes until the pointer stops, so only the latest
  // wanted time is kept and the next seek goes out once the previous one has landed ("seeked").
  // The playhead (scrubT) still follows the pointer instantly.
  let seekWant = null;
  function pumpSeek(){
    if (seekWant == null || el.seeking) return;
    const t = seekWant;
    seekWant = null;
    if (Math.abs(t - el.currentTime) > 0.001) el.currentTime = t;
  }
  function seekVideo(t){
    const dur = el.duration || 0;
    if (!dur) return null;
    t = Math.min(dur, Math.max(0, t));
    if (light) light.scrubT = t;
    paintVBar();
    seekWant = t;
    pumpSeek();
    pushVideoFocus(el, a, 200); // keep the RAM window under the playhead while scrubbing
    return t;
  }
  // Hand the playhead back to the element once the last seek has landed.
  function settleScrub(){
    if (light && !light.scrubbing && seekWant == null && !el.seeking){ light.scrubT = null; paintVBar(); }
  }
  function beginScrub(){
    if (!light) return;
    light.scrubbing = true;
    el.pause();
  }
  function endScrub(){
    if (!light || !light.scrubbing) return;
    light.scrubbing = false;
    pushVideoFocus(el, a, 0);
    settleScrub();
  }
  function fitS(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!vs.nat.w || !w) return 1;
    return Math.min(w / vs.nat.w, h / vs.nat.h);
  }
  function apply(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const x = (w - vs.nat.w * vs.scale) / 2 + vs.pan.x;
    const y = (h - vs.nat.h * vs.scale) / 2 + vs.pan.y;
    el.style.width = vs.nat.w + "px";
    el.style.height = vs.nat.h + "px";
    el.style.transform = `translate(${x}px,${y}px) scale(${vs.scale})`;
    if (phEl){
      phEl.style.width = el.style.width;
      phEl.style.height = el.style.height;
      phEl.style.transform = el.style.transform;
    }
    // Same icon/pixel-art heuristic as thumbnails: only go crisp once we're actually magnifying
    // a small source past its native pixels, so ordinary photos keep smooth upscaling.
    if (!isVid) el.classList.toggle("pixelated", vs.scale > 1.001 && vs.nat.w > 0 && (vs.nat.w <= 768 || vs.nat.h <= 768));
    const f = fitS();
    hud.textContent = Math.abs(vs.scale - f) < 0.012 ? "Frame" : Math.abs(vs.scale - 1) < 0.012 ? "100%" : Math.round(vs.scale * 100) + "%";
  }
  // Zoom toward a screen point (mx,my, relative to `wrap`) instead of the viewport center —
  // keeps whatever content is under the cursor/anchor fixed in place as scale changes.
  function zoomAt(newScale, mx, my){
    newScale = Math.min(16, Math.max(0.05, newScale));
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const xOld = (w - vs.nat.w * vs.scale) / 2 + vs.pan.x;
    const yOld = (h - vs.nat.h * vs.scale) / 2 + vs.pan.y;
    const cx = (mx - xOld) / vs.scale, cy = (my - yOld) / vs.scale;
    vs.scale = newScale;
    vs.pan.x = mx - cx * newScale - (w - vs.nat.w * newScale) / 2;
    vs.pan.y = my - cy * newScale - (h - vs.nat.h * newScale) / 2;
    vs.mode = "free";
    apply();
  }
  function toFit(){
    vs.scale = fitS();
    vs.pan = { x: 0, y: 0 };
    vs.mode = "fit";
    apply();
  }
  function toOne(){
    toScale(1);
  }
  // Digit keys 1–9 in the lightbox jump straight to that multiple of native size (1 = 100%).
  function toScale(n){
    vs.scale = n;
    vs.pan = { x: 0, y: 0 };
    vs.mode = n === 1 ? "one" : "free";
    apply();
  }
  function openMode(){
    const f = fitS();
    if (f < 0.999) toFit();
    else toOne();
  }
  function onReady(){
    const nw = isVid ? el.videoWidth : el.naturalWidth;
    const nh = isVid ? el.videoHeight : el.naturalHeight;
    if (nw && nh) vs.nat = { w: nw, h: nh };
    openMode();
    if (isVid) paintVBar();
    else reveal();
  }
  // Fade the full image in over the thumbnail once it is decoded; the thumbnail stays fully opaque
  // underneath and is simply removed once the fade is over. (Cross-fading both dipped to the dark
  // backdrop mid-way, visible when flipping through images quickly.) Runs once; later loads (PSD
  // layer swaps) only re-fit.
  function reveal(){
    if (!el.classList.contains("loading")) return;
    const show = () => {
      if (!el.isConnected || !el.classList.contains("loading")) return;
      el.classList.add("reveal");
      el.classList.remove("loading");
      if (!phEl) return;
      const old = phEl;
      setTimeout(() => { old.remove(); if (phEl === old) phEl = null; }, 300);
    };
    (el.decode ? el.decode() : Promise.resolve()).then(show, show);
  }
  // Frame the placeholder right away. Without stored dimensions, borrow the thumbnail's aspect
  // until the full image reports its real size.
  if (!isVid){
    if (vs.nat.w && vs.nat.h){ if (wrap.clientWidth) openMode(); }
    else if (phEl) phEl.addEventListener("load", () => {
      if (!el.classList.contains("loading") || !phEl) return;
      vs.nat = { w: phEl.naturalWidth, h: phEl.naturalHeight };
      toFit();
    }, { once: true });
    // A file that fails to load keeps its thumbnail; with no thumbnail, show the broken image.
    el.addEventListener("error", () => { if (!phEl) el.classList.remove("loading"); });
  }
  el.addEventListener(isVid ? "loadedmetadata" : "load", onReady);
  if ((isVid && el.readyState >= 1) || (!isVid && el.complete && el.naturalWidth)) onReady();
  // Keep the picture framed when the viewport changes underneath it (window resize, or the
  // lightbox mask / corner-radius popover reshaping the frame). The first callback is just the
  // initial observation, so it is skipped.
  let sized = false;
  new ResizeObserver(() => {
    if (!sized){ sized = true; return; }
    if (vs.mode === "fit") toFit(); else apply();
  }).observe(wrap);
  if (isVid){
    // timeupdate alone (a few ticks/sec) is what made the playhead visibly jump — a rAF
    // loop while playing sweeps it smoothly instead, same fix as the audio waveform.
    let vRaf = 0;
    const vTick = () => {
      if (!light || light.video !== el){ vRaf = 0; return; }
      paintVBar();
      vRaf = requestAnimationFrame(vTick);
    };
    el.addEventListener("play", () => { if (!vRaf) vRaf = requestAnimationFrame(vTick); });
    const stopVTick = () => { if (vRaf) cancelAnimationFrame(vRaf); vRaf = 0; };
    el.addEventListener("pause", stopVTick);
    el.addEventListener("ended", stopVTick);
    el.addEventListener("timeupdate", () => {
      if (light?.scrubbing || el.seeking || seekWant != null) return;
      if (light) light.scrubT = null;
      paintVBar();
      pushVideoFocus(el, a, 1000); // playback: slide the RAM window about once a second
    });
    el.addEventListener("seeked", () => { pumpSeek(); settleScrub(); });
    bindVBar(el, seekVideo, beginScrub, endScrub);
    startVideoCache(el, a);
  }
  // A single click toggles play/pause; a double click still frames/100%s the picture. Both start
  // as "click" events, so the first one is held back briefly — long enough for a second to arrive
  // and cancel it as a dblclick, short enough not to feel laggy.
  let clickTimer = 0;
  let justScrubbed = false;
  wrap.addEventListener("click", (e) => {
    if (!isVid || e.button !== 0) return;
    if (justScrubbed){ justScrubbed = false; return; }
    if (e.detail > 1) return; // second click of a dblclick — let dblclick handle it
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { if (el.paused) el.play(); else el.pause(); }, 250);
  });
  wrap.addEventListener("dblclick", (e) => {
    e.preventDefault();
    e.stopPropagation();
    clearTimeout(clickTimer);
    if (vs.mode === "fit") toOne();
    else toFit();
  });
  wrap.addEventListener("pointerdown", (e) => {
    if (isVid && e.button === 0){
      // Click-drag on the picture scrubs the video, same as dragging the timeline. Nothing happens
      // until the pointer has moved a few px, so a plain click / double-click is untouched.
      wrap.setPointerCapture(e.pointerId);
      vs.scrubD = { x: e.clientX, t0: el.currentTime, t: el.currentTime, fine: e.shiftKey, on: false };
      return;
    }
    if (e.button === 1){
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      vs.panD = { x: e.clientX, y: e.clientY, px: vs.pan.x, py: vs.pan.y };
      return;
    }
    if (e.button === 2){
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      const r = wrap.getBoundingClientRect();
      vs.zoomD = { x: e.clientX, y: e.clientY, mx: e.clientX - r.left, my: e.clientY - r.top, scale: vs.scale };
    }
  });
  wrap.addEventListener("pointermove", (e) => {
    if (vs.panD){
      vs.pan = { x: vs.panD.px + (e.clientX - vs.panD.x), y: vs.panD.py + (e.clientY - vs.panD.y) };
      vs.mode = "free";
      apply();
      return;
    }
    if (vs.zoomD){
      // Right-drag zoom: axis/speed/invert are user-configurable (feedback: expose zoom speed,
      // a vertical/horizontal axis toggle, and an invert option), anchored to where the drag
      // started so that point stays under the cursor as the scale changes.
      const t = state.theme;
      const raw = t.zoomAxis === "x" ? (e.clientX - vs.zoomD.x) : (vs.zoomD.y - e.clientY);
      const d = (t.zoomInvert ? -raw : raw) * 0.012 * (t.zoomSpeed ?? 1);
      zoomAt(vs.zoomD.scale * Math.exp(d), vs.zoomD.mx, vs.zoomD.my);
      return;
    }
    if (vs.scrubD){
      const sd = vs.scrubD;
      if (!sd.on){
        if (Math.abs(e.clientX - sd.x) < 4) return;
        sd.on = true;
        sd.x = e.clientX; // rebase on the pointer's current spot so the picture doesn't jump
        sd.t0 = sd.t = el.currentTime;
        wrap.style.cursor = "ew-resize";
        beginScrub();
      }
      if (e.shiftKey !== sd.fine){ sd.fine = e.shiftKey; sd.x = e.clientX; sd.t0 = sd.t; } // Shift = fine, without a jump
      // Dragging across the whole window covers the whole clip (Shift: a tenth of it).
      const t = seekVideo(sd.t0 + ((e.clientX - sd.x) / Math.max(wrap.clientWidth, 1)) * (el.duration || 0) * (sd.fine ? 0.1 : 1));
      if (t != null) sd.t = t;
    }
  });
  const end = () => {
    const scrubbed = vs.scrubD && vs.scrubD.on;
    vs.panD = vs.zoomD = vs.scrubD = null;
    if (scrubbed){ wrap.style.cursor = ""; endScrub(); justScrubbed = true; }
  };
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
  wrap.addEventListener("contextmenu", (e) => e.preventDefault());
  wrap.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const t = state.theme;
    const r = wrap.getBoundingClientRect();
    const d = (t.zoomInvert ? e.deltaY : -e.deltaY) * 0.0016 * (t.zoomSpeed ?? 1);
    zoomAt(vs.scale * Math.exp(d), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  return { fit: toFit, zoom: toScale };
}

function bindVBar(el, seekVideo, beginScrub, endScrub){
  const bar = light?.bar;
  if (!bar) return;
  const track = bar.querySelector(".vtrack");
  const tAt = (e) => {
    const r = track.getBoundingClientRect();
    const dur = el.duration || 0;
    return Math.min(dur, Math.max(0, ((e.clientX - r.left) / Math.max(r.width, 1)) * dur));
  };
  const onMove = (e) => seekVideo(tAt(e));
  const onUp = (e) => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    if (e.type === "pointerup") seekVideo(tAt(e));
    endScrub();
  };
  track.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    beginScrub();
    seekVideo(tAt(e));
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };
}

function toggleLight(a){
  if (!a || a.status === "missing") return;
  if (light && light.id === a.id){ closeLight(); return; }
  if (light){ showInLight(a); return; }
  // A lightbox that was just closed keeps living in the DOM until its fade-out ends (closeLight),
  // ids and all. Opening again inside that window put a second #light3d / #v3dGear / #v3dPanel …
  // next to it, and every getElementById()/$() then resolved to the dying copy — boot3d() mounted
  // the new model's canvas into an element that was about to be removed, leaving the new lightbox
  // black. (Easy to hit by tapping Space twice.) Finish any pending fade-out first.
  document.querySelectorAll(".light").forEach((n) => (n._finishClose ? n._finishClose() : n.remove()));
  const wrap = document.createElement("div");
  wrap.className = "light";
  wrap.innerHTML = `
    <div class="light-bar">
      <span class="t"></span>
      <span class="light-hint" id="lightHint"></span>
      <button class="btn ghost" id="frameBtn" type="button" style="width:40px;padding:0" title="Mask &amp; corner radius" aria-label="Mask and corner radius">◱</button>
      <button class="btn ghost" id="lightClose" type="button" style="width:40px;padding:0" aria-label="Close">✕</button>
    </div>
    <div class="light-stage"><div class="light-frame"></div></div>
    <button class="info-fab" id="infoBtn" type="button" title="File info (I)" aria-label="File info">i</button>
    <div class="light-info" id="lightInfo" hidden></div>
    <div class="frame-pop" id="framePop" hidden>
      <div class="settings-sub">Mask</div>
      <div class="mask-grid">${MASKS.map(([id, label, ar]) => `<button type="button" class="mask-chip" data-mask="${id}" title="${label}"><i class="${id === "free" ? "free" : id === "circle" ? "circle" : ""}" style="${ar ? (ar >= 1 ? "" : "width:auto;height:22px;") + "aspect-ratio:" + (ar >= 1 ? Math.min(ar, 2.4) : ar) : ""}"></i>${label}</button>`).join("")}</div>
      ${sliderRow("Corner radius", "maskRadius", 0, 200, 1, "px")}
    </div>
    <!-- Per-type controls: every element tagged data-tools="<kind>" is shown only while an asset of
         that kind is open (see syncLightTools). New kinds add their own toolbar next to these. -->
    <button class="v3d-gear" id="v3dGear" data-tools="model3d" type="button" title="3D view settings (G)" hidden>⚙</button>
    <div class="v3d-shade" id="v3dShade" data-tools="model3d" hidden>
      <button type="button" data-act="uv" class="uv-btn" title="UV editor (U) — opens on the left">UV</button>
      <span class="v3d-sep"></span>
      <button type="button" data-base="solid" title="Solid (Shift+1)">●</button>
      <button type="button" data-base="vertex" title="Vertex Color (Shift+2)">◍</button>
      <button type="button" data-base="textured" title="Textured (Shift+3)">▦</button>
      <button type="button" data-base="normal" title="Normal (Shift+4)">◈</button>
      <span class="v3d-sep"></span>
      <button type="button" data-toggle="wireOn" title="Wireframe overlay (Shift+5)">▤</button>
      <button type="button" data-toggle="xrayOn" title="X-Ray overlay (Shift+6)">◌</button>
      <span class="v3d-sep"></span>
      <button type="button" data-act="rotate" title="Turn model 90° — fixes Z-up / sideways models (Shift+7)">↻</button>
      <button type="button" data-toggle="floor" title="Floor">${V3D_ICONS.floor}</button>
      <button type="button" data-toggle="grid" title="Grid">${V3D_ICONS.grid}</button>
      <button type="button" data-toggle="shadowOnly" title="Shadow only — invisible floor that still catches the shadow">${V3D_ICONS.shadow}</button>
      <button type="button" data-act="anchor"></button>
      <span class="v3d-sep" id="v3dExplodeSep"></span>
      <div class="v3d-explode" id="v3dExplode" title="Explode parts (Ctrl+right-drag)"><i></i></div>
    </div>
    <div class="v3d-panel" id="v3dPanel" hidden></div>
    <button class="v3d-gear" id="psdBtn" data-tools="psd" type="button" title="Layers (D)" hidden>☰</button>
    <div class="v3d-panel" id="psdPanel" hidden></div>
    <div class="v3d-toast" id="v3dToast"></div>
    <div class="vbar" hidden>
      <span class="vtime" data-cur>0:00</span>
      <div class="vtrack"><i class="vcache"></i><i class="vplay"></i></div>
      <span class="vtime dur" data-dur>0:00</span>
      <span class="vtime vmem" data-mem title="Video RAM cache: filled / limit (Settings → RAM cache)"></span>
    </div>`;
  wrap.querySelector("#lightClose").onclick = () => closeLight();
  document.body.append(wrap);
  light = { el: wrap, id: a.id, bar: wrap.querySelector(".vbar"), snap: null, scrubbing: false, scrubT: null, video: null, audio: null, cacheTimer: 0, focusTimer: 0, focusAt: 0, closing: false, setZoom: null };
  wrap.querySelector("#v3dGear").onclick = () => toggleV3DPanel();
  wrap.querySelector("#psdBtn").onclick = () => togglePsdPanel();
  wrap.querySelector("#infoBtn").onclick = () => toggleLightInfo();
  wrap.querySelector("#lightInfo").addEventListener("click", onLightInfoClick);
  attachPanScroll(wrap.querySelector("#lightInfo"));
  attachPanScroll(wrap.querySelector("#psdPanel"));
  wrap.querySelectorAll("#v3dShade [data-base]").forEach((b) => { b.onclick = () => setShadeBase(b.dataset.base); });
  wrap.querySelectorAll("#v3dShade [data-toggle]").forEach((b) => { b.onclick = () => toggleShadeFlag(b.dataset.toggle); });
  wrap.querySelector("#v3dShade [data-act=rotate]").onclick = () => onV3DRotate?.();
  wrap.querySelector("#v3dShade [data-act=anchor]").onclick = () => {
    state.v3d.anchor = state.v3d.anchor === "camera" ? "world" : "camera";
    saveV3D();
    paintShadeButtons();
  };
  wrap.querySelector("#v3dShade [data-act=uv]").onclick = () => toggleUV();
  light.explodeSlider = initThinSlider(wrap.querySelector("#v3dExplode"), {
    value: state.v3d.explode,
    onChange: (v) => { state.v3d.explode = v; saveV3D(); },
  });
  attachPanScroll(wrap.querySelector("#v3dPanel"));
  const framePop = wrap.querySelector("#framePop");
  const frameBtn = wrap.querySelector("#frameBtn");
  frameBtn.onclick = () => {
    framePop.hidden = !framePop.hidden;
    frameBtn.classList.toggle("on", !framePop.hidden);
  };
  registerAutoClose(framePop, () => { framePop.hidden = true; frameBtn.classList.remove("on"); }, frameBtn);
  framePop.querySelectorAll(".mask-chip").forEach((b) => {
    b.onclick = () => { state.theme.maskShape = b.dataset.mask; putSetting("sight.theme", JSON.stringify(state.theme)); applyLightFrame(); };
  });
  bindSliders(framePop, state.theme, RUNTIME_DEFAULT_THEME, () => { putSetting("sight.theme", JSON.stringify(state.theme)); applyLightFrame(); });
  attachPanScroll(framePop);
  applyLightFrame();
  showInLight(a);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("on")));
}

const LIGHT_HINT = "MMB pan · RMB zoom · 1–9 zoom · dbl Frame/100% · Esc";
const LIGHT_HINT_VIDEO = "Click/Space play/pause · Drag scrub (Shift fine) · MMB pan · RMB zoom · 1–9 zoom · dbl Frame/100% · Esc";
const LIGHT_HINT_3D = "Drag orbit · MMB pan · RMB zoom · WASD fly · F frame · Ctrl+click select · H / Ctrl+H / Alt+H hide · Ctrl+RMB drag explode · Alt+1–9 save view · 1–9 recall · Esc";

// Each asset kind has its own toolbar in the lightbox (data-tools="<kind>" elements). Only the
// one matching the open asset is shown, so a 3D model's shading bar never appears over an image
// or a font. Controls for other kinds get added the same way — tag the element with its kind.
function syncLightTools(kind){
  light.el.querySelectorAll("[data-tools]").forEach((el) => { el.hidden = el.dataset.tools !== kind; });
}

function showInLight(a){
  if (!light) return;
  flushRotatedThumb();
  releaseMedia(a.kind !== "video");
  light.id = a.id;
  light.snap = null;
  light.scrubT = null;
  light.scrubbing = false;
  light.video = null;
  light.audio = null;
  light.setZoom = null; // set by attachViewer/mountDocStage below if the new asset supports digit-key zoom
  // The preview is a peek at whatever was under the cursor — it leaves the thumbnail selection
  // alone. The inspector is hidden behind the lightbox, so just stop its media from running.
  insp.querySelectorAll("video, audio").forEach((m) => { try { m.pause(); } catch {} });
  light.el.querySelector(".t").textContent = a.name;
  const bar = light.bar;
  if (bar){
    bar.hidden = a.kind !== "video";
    bar.querySelector(".vcache").style.width = "0%";
    bar.querySelector(".vplay").style.left = "0%";
    bar.querySelector("[data-mem]").textContent = "";
  }
  const is3d = a.kind === "model3d";
  // A synchronous best guess from the extension alone — SPLAT_EXT is unambiguous, but a splat
  // .ply can't be told apart without sniffing its header, which boot3d() does asynchronously and
  // corrects this (and re-renders the panel) once it knows for sure.
  currentAssetIsSplat = SPLAT_EXT.has((a.ext || "").toLowerCase());
  // A PSD is a "design" asset, but only PSDs have layers — they get their own toolbar key.
  syncLightTools(a.ext === ".psd" ? "psd" : a.kind); // gear opens the settings panel — splats get their own panel content
  $("psdPanel").hidden = true;
  $("psdBtn").classList.remove("on");
  if (a.ext === ".psd") loadPsdLayers(a.id);
  if (currentAssetIsSplat) $("v3dShade").hidden = true; // wireframe/x-ray/base-material toggles are mesh-only
  state.v3dPanelOpen = false; // settings panel always starts closed on a fresh 3D asset (off by default)
  $("v3dGear").classList.remove("on");
  $("v3dPanel").hidden = true;
  $("lightHint").textContent = is3d ? LIGHT_HINT_3D : a.kind === "video" ? LIGHT_HINT_VIDEO : a.ext === ".psd" ? "D layers · " + LIGHT_HINT : LIGHT_HINT;
  light.el.classList.toggle("v3d-loading", is3d); // controls appear once boot3d() has the model up
  if (is3d){ paintShadeButtons(); renderV3DPanel(); }
  light.sceneInfo = null;
  renderLightInfo();
  fillStage(light.el.querySelector(".light-frame"), a);
  syncUvPane(); // the new stage has no UV pane yet; boot3d re-adds it once the model is up
}

// A manual turn (see getModelTurns) changes how the model should look on its card too — re-render
// that thumbnail once the user is done with the lightbox / moves to another asset.
function flushRotatedThumb(){
  if (!light || !light.rotated) return;
  const a = assetById(light.rotated);
  light.rotated = null;
  if (a) ensureModelThumb(a, true);
}

function closeLight(){
  if (!light || light.closing) return;
  flushRotatedThumb();
  light.closing = true;
  try { light.video && light.video.pause(); } catch {}
  try { light.audio && light.audio.pause(); } catch {}
  releaseMedia(true);
  // The lightbox fades out over the grid, so its canvas stays on screen for another ~220ms.
  // Losing the WebGL context (releaseRenderer) while it's still visible blanks the canvas to white —
  // the flash on closing a 3D preview. The render loop stops now (the last frame stays put), and the
  // context is released — like the inspector viewer's reboot — only once the fade has finished.
  const releaseGL = dispose3d("light3d", true);
  const el = light.el;
  const vid = light.video;
  light = null;
  // Fade out the same way it faded in (§.light.on transition) instead of vanishing instantly.
  el.classList.remove("on");
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    el.remove();
    releaseGL?.();
    // Once faded out, cut the stream too so the browser stops pulling the file through the cache.
    if (vid){ vid.removeAttribute("src"); vid.load(); }
  };
  el.addEventListener("transitionend", finish, { once: true });
  setTimeout(finish, 320);
  el._finishClose = finish; // toggleLight() cuts the fade short if a new lightbox opens meanwhile
}

// Lightbox 3D settings panel — off by default (requested: hidden by default), toggled
// by the gear button or D while a 3D model is open. Writes land on state.v3d; the render
// loop in boot3d() re-reads state.v3d every frame, so every change here is live immediately,
// the same way the theme's color pickers already are — no separate "apply" step needed.
// Base shading modes (solid/vertex/textured/normal) are mutually exclusive; wireframe and
// x-ray are independent overlays that can layer on top of any base (feedback: "wireframe and
// transparency should be able to stack on top of any other mode").
// Toolbar icons (stroke = currentColor, so they follow the button's muted / accent color).
const v3dSvg = (body) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const V3D_ICONS = {
  floor: v3dSvg(`<path d="M6 8h16l-4 12H2z" fill="currentColor" fill-opacity=".35"/>`),
  grid: v3dSvg(`<path d="M6 8h16l-4 12H2z"/><path d="M4 14h16"/><path d="m10 8-2 12"/><path d="m16 8-2 12"/>`),

// Lightbox file info overlay (I / the "i" button, top-left of the stage) — like Blender's viewport

// (EXIF, codecs, font tables, PDF metadata, 3D file headers — see app/fileinfo.py), then live data

// Materials / Textures / Meshes lists — collapsible (.sec headers like the sidebar, closed by
// default, remembered in sight.infoOpen), each list scrolls on its own (MMB via attachPanScroll).
// Clicking an entry highlights its polygons (and redraws the UV pane if it is open).
// Stays open across assets and sessions (sight.lightInfo); only fetched while it is visible,

const lightInfoCache = new Map();
const lightInfoErr = new Map();
function lightInfoOn(){

function infoSecState(){

function toggleLightInfo(){
  if (!light) return;

function infoRows(rows){
  return `<dl>${rows.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}
function inspectSection(ins, kind, title, open){
  const list = kind === "mat" ? ins.materials : kind === "tex" ? ins.textures : ins.meshes;
  if (!list.length) return "";
  const head = `<div class="sec toggle${open ? " open" : ""}" data-sec="${kind}"><span class="sec-title">${title} (${list.length})</span><span class="chev">›</span></div>`;
  if (!open) return head;
  return head + `<div class="li-list" data-list="${kind}"><div class="li-grid">` + list.map((it, i) => {
    const key = kind + ":" + i, src = ins.thumbs.get(key);
    const on = ins.sel && ins.sel.kind === kind && ins.sel.i === i;
    const media = kind === "mesh" ? "" : src ? `<img src="${src}" alt="">` : `<i data-thumb="${key}"></i>`;
    const hid = kind === "mesh" && !it.c.visible;
    return `<button type="button" class="li-item ${kind}${on ? " on" : ""}${hid ? " hid" : ""}" data-kind="${kind}" data-i="${i}" title="${esc(it.name)}">`

function renderLightInfo(){
  if (!light) return;
  const el = $("lightInfo"), on = lightInfoOn();
  $("infoBtn").classList.toggle("on", on);
  el.hidden = !on;
  if (!on) return;
  const a = assetById(light.id);
  if (!a){ el.innerHTML = ""; return; }
  const key = a.id + ":" + a.mtime + ":" + a.size;
  const cached = lightInfoCache.get(key);
  const folder = (a.path || "").replace(/[\\/][^\\/]*$/, "");
  let html = `<h4>File</h4>` + infoRows([
    ["Name", a.name],
    ["Type", `${KIND[a.kind] || a.kind} · ${(a.ext || "").slice(1).toUpperCase()}`],
    ["Size", `${bytes(a.size)} (${a.size.toLocaleString("en-US")} bytes)`],
    // For other kinds width/height hold the thumbnail's size; video frame size comes from the server.
    ["Dimensions", a.width && a.height && (a.kind === "image" || a.ext === ".psd") ? `${a.width} × ${a.height} · ${(a.width * a.height / 1e6).toFixed(1)} MP` : null],
    ["Modified", fmtDate(a.mtime)],
    ["Added", fmtDate(a.added_at)],
    ["Folder", folder],

  if (scene && scene.id === a.id) html += `<h4>${esc(scene.title)}</h4>` + infoRows(scene.rows);
  const ins = v3dInspect && v3dInspect.aid === a.id ? v3dInspect : null;
  if (ins){
    const open = infoSecState();
    html += inspectSection(ins, "mat", "Materials", !!open.mat)
      + inspectSection(ins, "tex", "Textures", !!open.tex)
      + inspectSection(ins, "mesh", "Meshes", !!open.mesh);

  }
  const scroll = el.scrollTop, lists = {};

  el.innerHTML = html;
  el.scrollTop = scroll;
  el.querySelectorAll(".li-list").forEach((l) => { attachPanScroll(l); l.scrollTop = lists[l.dataset.list] || 0; });
  if (ins) ins.makeThumbs((k, url) => {
    const slot = light && $("lightInfo").querySelector(`i[data-thumb="${k}"]`);

  }).catch((err) => {
    let msg = String(err && err.message || err);
    if (/Not Found/.test(msg)) msg = "restart Sight to load the new server code";
    lightInfoErr.set(key, msg.slice(0, 160));
    setTimeout(() => lightInfoErr.delete(key), 5000); // retried on the next render after that
  }).finally(() => {
    if (light && light.infoLoading === key) light.infoLoading = null;
    if (light && light.id === id) renderLightInfo();
  });
}
function onLightInfoClick(e){

// One entry point for the inspector selection (info panel list clicks, Ctrl+click in the 3D view):

// Lightbox UV editor (U / the "UV" toolbar button): the stage splits into a UV pane | divider |

// attachViewer image (same pan / zoom / double-click / 1–9 as images; F fits it while the cursor
// is over it — lightPane, same hover rule as activePane). The picture is v3dInspect.renderUV():

let uvMode = (() => { try { return localStorage.getItem("sight.uvMode") === "1"; } catch { return false; } })();

function syncUvPane(){

// Texture channel shown under the UVs (persisted); the UV set is per model (v3dInspect.uvSet).

// Lightbox 3D inspector (set by boot3d for meshes, cleared by dispose3d): the model's original
// materials, textures and meshes (from origMats, so the shading mode doesn't matter), their
// preview images, the polygon highlight and the UV picture.
//  - Materials are counted by identity (cloneModel keeps shared materials shared); instances that
//    still differ but carry the same name and type (FBX/OBJ loaders) are merged into one entry.
//  - Thumbnails and the UV picture are rendered with the viewer's own renderer into a render
//    target (the textures are already on that GPU context) and read back. Render targets come out
//    linear without tone mapping, so sRGB is encoded here by hand (skipped for non-color textures
//    such as normal maps, which are shown raw). Thumbnails go one per frame: a material in a new
//    light setup compiles a new shader program.
//  - Highlight: an overlay mesh per affected mesh, sharing its geometry, added to the *scene* (not
//    the model — applyBaseMaterial/wireframe/x-ray traverse the model and would restyle it). It
//    copies the source's world matrix every frame, so explode and turns carry it along; skinned
//    meshes bind to the same skeleton. Multi-material meshes hide the other groups.
//  - UVs: the geometry drawn with gl_Position = uv (wireframe + faint fill), over the texture on a
//    quad. glTF puts v = 0 at the image top (flipY false); other loaders at the bottom.
const TEX_SLOTS = {
  map: "Base color", normalMap: "Normal", roughnessMap: "Roughness", metalnessMap: "Metalness",
  aoMap: "AO", emissiveMap: "Emissive", alphaMap: "Alpha", bumpMap: "Bump", displacementMap: "Displacement",
  specularMap: "Specular", specularColorMap: "Specular color", specularIntensityMap: "Specular",
  clearcoatMap: "Clearcoat", clearcoatNormalMap: "Clearcoat normal", clearcoatRoughnessMap: "Clearcoat rough.",
  sheenColorMap: "Sheen", sheenRoughnessMap: "Sheen rough.", transmissionMap: "Transmission",
  thicknessMap: "Thickness", iridescenceMap: "Iridescence", anisotropyMap: "Anisotropy", lightMap: "Lightmap",

function makeModelInspector(THREE, renderer, scene, obj, origMats, aid){
  const n = (x) => x.toLocaleString("en-US");
  const matEntries = [], matByKey = new Map(), texIndex = new Map(), texList = [], meshList = [];

    e.mats.add(m);

    if (!c.isMesh) return;

    const total = g.index ? g.index.count : cnt;

    if (g.morphAttributes && g.morphAttributes.position) morphs += g.morphAttributes.position.length;
    if (g.attributes.color) vcol = true;
    if (g.attributes.uv) hasUV = true;
    if (g.attributes.uv1 || g.attributes.uv2) uv2 = true;
    const om = origMats.get(c) || c.material;
    const arr = (Array.isArray(om) ? om : [om]).filter(Boolean);
    const names = new Set();
    arr.forEach((m, gi) => {
      const e = matEntry(m);
      names.add(e.rep.name || "unnamed");
      e.meshes.add(c);
      const grp = Array.isArray(om) && g.groups.find((gr) => gr.materialIndex === gi);
      e.tris += grp ? Math.floor(Math.min(grp.count, total - grp.start) / 3) : ctris;
      for (const [k, v] of Object.entries(m)){
        if (!v || !v.isTexture || k === "envMap") continue;
        let t = texIndex.get(v);
        if (!t){ t = { tex: v, slots: new Set(), mats: new Set() }; texIndex.set(v, t); texList.push(t); }
