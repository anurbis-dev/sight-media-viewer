// True if `id` is `ancestorId` itself or nested (at any depth) under it — used to keep a
// collection drag from dropping a collection into itself or one of its own children, which
// would otherwise create a cycle in the parentId chain.
function isCollectionSelfOrDescendant(cols, id, ancestorId){
  let cur = cols.find(c => c.id === id);
  while (cur){
    if (cur.id === ancestorId) return true;
    cur = cols.find(c => c.id === cur.parentId);
  }
  return false;
}

// Reparents/reorders a collection dropped on another one. `zone` is "before"/"after" (drop
// lands as a sibling of `targetId`, taking its parent) or "into" (drop nests it as the last
// child of `targetId`). Collections share one flat sort_order sequence server-side; renderCollections
// groups siblings by filtering that sequence per parentId, so it's enough to place `draggingId`
// at the right spot in the full id list — no per-parent index bookkeeping needed.
async function moveCollection(draggingId, targetId, zone){
  const cols = state.meta.collections || [];
  const dragging = cols.find(c => c.id === draggingId);
  const target = cols.find(c => c.id === targetId);
  if (!dragging || !target) return;
  const newParentId = zone === "into" ? target.id : (target.parentId || null);
  const rest = cols.filter(c => c.id !== draggingId);
  const targetIdx = rest.findIndex(c => c.id === target.id);
  let insertIdx;
  if (zone === "before") insertIdx = targetIdx;
  else if (zone === "after") insertIdx = targetIdx + 1;
  else {
    insertIdx = targetIdx + 1;
    rest.forEach((c, i) => { if (c.parentId === target.id) insertIdx = i + 1; });
  }
  rest.splice(insertIdx, 0, dragging);
  if (newParentId !== (dragging.parentId || null)){
    await api("/api/collections/" + draggingId, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ parentId: newParentId }) });
  }
  await api("/api/collections/reorder", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ ids: rest.map(c => c.id) }) });
  await refreshMeta();
}

function renderCollections(set){
  const wrap = document.createElement("div");
  const head = sectionHeader("Collections", "collections", `<button type="button" aria-label="New collection">+</button>`, "layers");
  head.querySelector("button").onclick = async (e) => {
    e.stopPropagation();
    await api("/api/collections", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name: "Untitled" }) });
    await refreshMeta();
  };
  wrap.append(head);
  bindSectionDrag(wrap, "collections");
  const cols = state.meta.collections || [];
  // Dropping a dragged collection on the section header (rather than on a row) moves it back
  // to the root level, out of whatever collection it was nested under.
  head.addEventListener("dragover", (e) => {
    if (!e.dataTransfer.types.includes("application/x-sight-collection")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    head.classList.add("drop-into");
  });
  head.addEventListener("dragleave", () => head.classList.remove("drop-into"));
  head.addEventListener("drop", async (e) => {
    if (!e.dataTransfer.types.includes("application/x-sight-collection")) return;
    e.preventDefault();
    head.classList.remove("drop-into");
    const draggingId = e.dataTransfer.getData("application/x-sight-collection");
    const dragging = cols.find(c => c.id === draggingId);
    if (dragging && dragging.parentId){
      await api("/api/collections/" + draggingId, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ parentId: null }) });
      await refreshMeta();
    }
  });
  if (state.navCollapse.collections){ nav.append(wrap); return; }
  const roots = cols.filter(c => !c.parentId);
  if (!roots.length){
    const p = document.createElement("p");
    p.className = "sub";
    p.style.padding = "0 8px";
    p.textContent = "Drop files here to sort.";
    wrap.append(p);
  }
  const addRow = (col, depth) => {
    const b = document.createElement("div");
    b.className = "row col-row" + (state.filter.collection === col.id ? " on" : "");
    b.dataset.cid = col.id;
    b.style.paddingLeft = (8 + depth * 12) + "px";
    const iconHtml = state.showIcons ? iconSpan(col.icon || "folder", col.color || "var(--subtle)", 15) : "";
    b.innerHTML = `${iconHtml}<span>${esc(col.name)}</span><em class="badge">${col.count||0}</em><button class="tiny" data-act="add">+</button><button class="tiny" data-act="del">×</button>`;
    const startRename = () => {
      const span = b.querySelector("span:not(.row-icon)");
      const inp = document.createElement("input");
      inp.value = col.name;
      inp.style.cssText = "flex:1;min-width:0;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);padding:0 6px";
      inp.onclick = (ev) => ev.stopPropagation();
      span.replaceWith(inp);
      inp.focus();
      inp.select();
      const done = () => {
        api("/api/collections/" + col.id, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name: inp.value }) }).then(refreshMeta);
      };
      inp.onblur = done;
      inp.onkeydown = (ev) => {
        if (ev.key === "Enter") inp.blur();
        if (ev.key === "Escape") { inp.onblur = null; inp.blur(); refreshMeta(); }
      };
    };
    b.onclick = (e) => {
      const act = e.target.dataset?.act;
      if (act === "add"){
        e.stopPropagation();
        api("/api/collections", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name: "Untitled", parentId: col.id }) }).then(refreshMeta);
        return;
      }
      if (act === "del"){
        e.stopPropagation();
        api("/api/collections/" + col.id, { method:"DELETE" }).then(refreshMeta);
        return;
      }
      if (navDblClick("col:" + col.id)){ startRename(); return; }
      set({ collection: col.id });
    };
    // Two independent drags land on a collection row: files/assets (application/x-sight-ids,
    // dropped anywhere on the row to file them into this collection) and another collection
    // (application/x-sight-collection, for hierarchical reorder/reparent — top/bottom quarter of
    // the row inserts as a sibling before/after, the middle half nests it inside this collection).
    b.addEventListener("dragover", (e) => {
      if (e.dataTransfer.types.includes("application/x-sight-ids")){
        e.preventDefault();
        b.style.outline = "1px solid var(--accent)";
        return;
      }
      if (e.dataTransfer.types.includes("application/x-sight-collection")){
        const draggingEl = nav.querySelector(".col-row.dragging");
        const draggingId = draggingEl?.dataset.cid;
        b.classList.remove("drop-before", "drop-after", "drop-into");
        if (!draggingId || draggingId === col.id || isCollectionSelfOrDescendant(cols, col.id, draggingId)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const rect = b.getBoundingClientRect();
        const frac = (e.clientY - rect.top) / rect.height;
        b.classList.add(frac < 0.25 ? "drop-before" : frac > 0.75 ? "drop-after" : "drop-into");
      }
    });
    b.addEventListener("dragleave", () => { b.style.outline = ""; b.classList.remove("drop-before", "drop-after", "drop-into"); });
    b.addEventListener("drop", async (e) => {
      if (e.dataTransfer.types.includes("application/x-sight-ids")){
        e.preventDefault();
        b.style.outline = "";
        let ids = [];
        try { ids = JSON.parse(e.dataTransfer.getData("application/x-sight-ids") || "[]"); } catch { ids = []; }
        if (!ids.length) ids = state.selectedIds;
        if (ids.length){
          await api("/api/collections/" + col.id + "/assets", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ ids }) });
          await refreshMeta();
        }
        return;
      }
      if (e.dataTransfer.types.includes("application/x-sight-collection")){
        e.preventDefault();
        const zone = b.classList.contains("drop-before") ? "before" : b.classList.contains("drop-after") ? "after" : "into";
        b.classList.remove("drop-before", "drop-after", "drop-into");
        const draggingId = e.dataTransfer.getData("application/x-sight-collection");
        if (draggingId && draggingId !== col.id) await moveCollection(draggingId, col.id, zone);
      }
    });
    b.draggable = true;
    b.addEventListener("dragstart", (e) => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("application/x-sight-collection", col.id);
      b.classList.add("dragging");
    });
    b.addEventListener("dragend", () => { b.classList.remove("dragging", "drop-before", "drop-after", "drop-into"); });
    b.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      showCollectionCtx(e.clientX, e.clientY, col.id);
    });
    wrap.append(b);
    cols.filter(c => c.parentId === col.id).forEach(ch => addRow(ch, depth + 1));
  };
  roots.forEach(c => addRow(c, 0));
  nav.append(wrap);
}

function bindTagRename(el, name, selectTag){
  el.onclick = () => {
    if (navDblClick("tag:" + name)){ startTagRename(); return; }
    selectTag();
  };
  const startTagRename = () => {
    const span = el.querySelector("span:not(.row-icon):not(.row-dot)");
    const inp = document.createElement("input");
    inp.value = name;
    inp.style.cssText = "flex:1;min-width:0;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);padding:0 6px";
    inp.onclick = (ev) => ev.stopPropagation();
    span.replaceWith(inp);
    inp.focus();
    inp.select();
    const done = async () => {
      const next = inp.value.trim();
      if (next && next.toLowerCase() !== name.toLowerCase()){
        await api("/api/tags/rename", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ old: name, new: next }) });
        for (const a of state.items){
          if (Array.isArray(a.tags)) a.tags = a.tags.map((x) => x.toLowerCase() === name.toLowerCase() ? next : x);
        }
        if (state.filter.tag === name) applyFilter({ tag: next });
      }
      await refreshMeta();
      renderInsp();
    };
    inp.onblur = done;
    inp.onkeydown = (ev) => {
      if (ev.key === "Enter") inp.blur();
      if (ev.key === "Escape") { inp.onblur = null; inp.blur(); refreshMeta(); }
    };
  };
}

function bindTagHold(el, name){
  let timer = 0, held = false;
  const clear = () => { clearTimeout(timer); timer = 0; };
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    held = false;
    timer = window.setTimeout(async () => {
      held = true;
      await api("/api/tags/remove", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) });
      for (const a of state.items){
        if (Array.isArray(a.tags)) a.tags = a.tags.filter((x) => x.toLowerCase() !== name.toLowerCase());
      }
      if (state.filter.tag === name) applyFilter({ tag: "" });
      await refreshMeta();
      renderInsp();
    }, 560);
  });
  el.addEventListener("pointerup", clear);
  el.addEventListener("pointerleave", clear);
  el.addEventListener("pointercancel", clear);
  el.addEventListener("click", (e) => {
    // Suppress the click the browser synthesizes after a long-press-triggered
    // delete, so it doesn't also apply the (now-removed) tag as a filter.
    if (held){ e.preventDefault(); e.stopPropagation(); held = false; }
  });
}

function shared(vals){
  if (!vals.length) return { multi: true, value: "Multiple values" };
  const a = vals[0];
  return vals.every(v => v === a) ? { multi: false, value: a } : { multi: true, value: "Multiple values" };
}

// The server serves thumbnails as immutable, so a regenerated one only shows up under a new URL:
// thumb_v (the cached file's mtime, from the asset list / the "thumb" event) is the cache-buster.
function thumbUrl(a){
  return "/api/thumb/" + a.id + (a.thumb_v ? "?v=" + a.thumb_v : "");
}
function thumbSrc(a){
  if (a.has_thumb || seenThumb.has(a.id)) return thumbUrl(a);
  return "";
}

// Force-regenerates the thumbnails of the current selection (fixes stale ones — e.g. a black
// backdrop from before models were rendered transparent). Cards go back to their placeholder
// first, so a "thumb" event that races the request can't be wiped afterwards.
async function refreshThumbs(){
  const ids = state.selectedIds.slice();
  if (!ids.length) return;
  for (const id of ids){
    const a = assetById(id);
    seenThumb.delete(id);
    if (!a) continue;
    a.has_thumb = 0;
    delete a.thumb_v;
    const el = cardPool.get(id);
    if (el) fillThumb(el, a, false);
  }
  let done = [];
  try {
    const r = await api("/api/thumbs/refresh", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ids }),
    });
    done = r.ids || [];
  } catch (err) {
    console.warn("thumbnail refresh failed", err);
  }
  // The server can't render 3D models (no headless GL) — re-render those here.
  for (const id of done){
    const a = assetById(id);
    if (a && a.kind === "model3d") ensureModelThumb(a, true);
  }
}

// Collapsible "File" block (preview + name + facts) of the single-file inspector; the state is
// state.navCollapse.inspFile, saved with the layout. Collapsed, only the file name stays under the header.
insp.addEventListener("click", (e) => {
  const head = e.target.closest(".sec[data-insp-sec]");
  if (!head) return;
  const k = head.dataset.inspSec;
  state.navCollapse[k] = !state.navCollapse[k];
  saveLayout();
  renderInsp();
});
function renderInsp(){
  const sel = selectedAssets();
  if (!sel.length){
    insp.innerHTML = `<div class="sub" style="padding:24px 8px">Select a file</div>`;
    return;
  }
  if (sel.length > 1){
    renderInspMany(sel);
    return;
  }
  const a = sel[0];
  const thumb = thumbSrc(a);
  // The inspector preview is only the thumbnail, for every kind: players, waveforms, font/text
  // stages, PSD layers and the live 3D viewer (all full-file downloads) live in the lightbox alone.
  // applyThumb() fills the slot in place when a thumbnail that wasn't ready yet lands.

  if (a.status === "missing") preview = `<div style="color:var(--danger)">File not found</div>`;

    <label class="field">Rating
      <select id="rating">${[0,1,2,3,4,5].map(n => `<option value="${n}" ${a.rating===n?"selected":""}>${n ? n : "—"}</option>`).join("")}</select>
    </label>

  $("rating").onchange = () => patchMany(sel.map(x => x.id), { rating: Number($("rating").value) });

// A fanned pile of up to five thumbnails (the last one on top) with a "N files" note past that —
// the multi-selection preview in the inspector, and the ghost that follows the cursor while cards
// are dragged (see buildDragGhost), so both look alike.
function stackHtml(list){
  const show = list.slice(0, 5);
  const n = show.length;
  const tiles = show.map((a, i) => {
    const t = (n - 1) / 2;
    const rot = (i - t) * 8;
    const x = (i - t) * 12;
    const y = Math.abs(i - t) * 3;
    const src = thumbSrc(a);
    const inner = src ? `<img src="${src}" alt="">` : `<div class="ph">${(KIND[a.kind]||"?")[0]}</div>`;
    return `<i style="transform:translate(${x}px,${y}px) rotate(${rot}deg);z-index:${i}">${inner}</i>`;
  }).join("");
  return `${tiles}${list.length > 5 ? `<span class="more">${list.length} files</span>` : ""}`;
}

function renderInspMany(sel){
  const stack = stackHtml(sel);
  const type = shared(sel.map(a => (KIND[a.kind]||a.kind) + " " + a.ext));
  const size = shared(sel.map(a => bytes(a.size)));
  const frame = shared(sel.map(a => a.width && a.height ? a.width+"×"+a.height : "—"));
  const status = shared(sel.map(a => a.status === "missing" ? "missing" : "on disk"));
  const rating = shared(sel.map(a => String(a.rating || 0)));
  const note = shared(sel.map(a => a.note || ""));
  const dd = (s) => s.multi ? `<dd class="dd-multi">Multiple values</dd>` : `<dd>${esc(s.value)}</dd>`;
  insp.innerHTML = `
    <div class="preview"><div class="stack">${stack}</div></div>
    <h2 style="font-weight:600;font-size:calc(var(--text-size) + 2px);line-height:1.25;margin:10px 0 2px;overflow-wrap:anywhere">${sel.length} selected</h2>
    <dl>
      <dt>Type</dt>${dd(type)}
      <dt>Size</dt>${dd(size)}
      <dt>Frame</dt>${dd(frame)}
      <dt>Status</dt>${dd(status)}
    </dl>
    <label class="field">Rating
      <select id="rating">
        ${rating.multi ? `<option value="" selected>Multiple values</option>` : ""}
        ${[0,1,2,3,4,5].map(n => `<option value="${n}" ${!rating.multi && rating.value===String(n)?"selected":""}>${n ? n : "—"}</option>`).join("")}
      </select>
    </label>
    <label class="field">Tags
      <div class="chips" id="tagChips"></div>
      <input id="tags" value="" autocomplete="off" />
      <div class="suggest" id="tagSuggest" hidden></div>
    </label>
    <label class="field">Note
      <textarea id="note" placeholder="${note.multi ? "Multiple values" : ""}">${note.multi ? "" : esc(note.value)}</textarea>
    </label>
    ${actionButtons()}
  `;
  for (const img of insp.querySelectorAll(".stack i img")){
    const sync = () => { markSmallSrc(img); syncPixelation(img, img.parentElement); };
    if (img.complete && img.naturalWidth) sync();
    else img.addEventListener("load", sync, { once: true });
  }
  paintTagChips(sel);
  $("rating").onchange = () => {
    const v = $("rating").value;
    if (v === "") return;
    patchMany(sel.map(x => x.id), { rating: Number(v) });
  };
  bindTagInput(sel);
  $("note").onblur = () => {
    const v = $("note").value;
    if (note.multi && !v) return;
    patchMany(sel.map(x => x.id), { note: v });
  };
  bindActions(sel);
}

function canRemoveFromFolder(){
  const cid = state.filter.collection;
  if (!cid || !state.selectedIds.length) return false;
  const col = (state.meta.collections || []).find((c) => c.id === cid);
  return !!(col && col.count > 0);
}

function actionButtons(){
  let html = `<div class="actions">
      <button class="btn ghost" id="reveal" title="Reveal in File System">Reveal</button>
      <button class="btn ghost" id="open">Open</button>
      <button class="btn ghost" id="refreshThumbs" type="button" style="flex:none;width:40px;padding:0" title="Refresh thumbnails of the selection" aria-label="Refresh thumbnails">⟳</button>`;
  if (canRemoveFromFolder()) html += `<button class="btn ghost" id="unfolder">Remove From Folder</button>`;
  return html + `</div>`;
}

function bindActions(sel){
  $("open").onclick = () => api(`/api/assets/${sel[0].id}/open`, { method: "POST" });
  $("reveal").onclick = () => revealAssets(sel.map((a) => a.id));
  $("refreshThumbs").onclick = refreshThumbs;
  $("unfolder")?.addEventListener("click", removeFromFolder);
}

async function removeFromFolder(){
  const cid = state.filter.collection;
  const ids = state.selectedIds.slice();
  if (!cid || !ids.length) return;
  await api("/api/collections/" + cid + "/assets", {
    method: "DELETE",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ ids }),
  });
  hideCtx();
  await refreshMeta();
  resetList();
}

function paintTagChips(sel){
  const box = $("tagChips");
  if (!box) return;
  const counts = new Map();
  for (const a of sel) for (const t of a.tags || []) counts.set(t, (counts.get(t) || 0) + 1);
  const names = [...counts.keys()].sort((a, b) => a.localeCompare(b, "en"));
  box.innerHTML = names.map(t => {
    const partial = counts.get(t) < sel.length;
    return `<span class="chip${partial ? " partial" : ""}">${esc(t)}<button type="button" class="chip-x" data-tag="${esc(t)}" title="Remove tag from selection">×</button></span>`;
  }).join("");
  box.querySelectorAll(".chip-x").forEach((b) => {
    b.onclick = () => removeTagFromSelected(b.dataset.tag, sel);
  });
}

function bindTagInput(sel){
  const input = $("tags");
  const box = $("tagSuggest");
  if (!input) return;
  input.oninput = () => suggestTags(input, box, sel);
  input.onkeydown = (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      const t = input.value.trim().replace(/,$/, "");
      if (t) addTagToSelected(t, sel);
      input.value = "";
      box.hidden = true;
    }
  };
}

function suggestTags(input, box, sel){
  const cur = input.value.trim().toLowerCase();
  if (cur.length < 1){ box.hidden = true; return; }
  const have = new Set();
  for (const a of sel) for (const t of a.tags || []) have.add(t.toLowerCase());
  const hits = (state.meta.tags || []).filter(t => t.name.toLowerCase().includes(cur) && !have.has(t.name.toLowerCase())).slice(0, 8);
  if (!hits.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = hits.map(t => `<button type="button">${esc(t.name)}</button>`).join("");
  box.querySelectorAll("button").forEach((b) => {
    b.onmousedown = (e) => e.preventDefault();
    b.onclick = () => {
      addTagToSelected(b.textContent, sel);
      input.value = "";
      box.hidden = true;
      input.focus();
    };
  });
}

async function addTagToSelected(tag, sel){
  const t = tag.trim();
  if (!t) return;
  await Promise.all(sel.map((a) => {
    const tags = [...new Set([...(a.tags || []), t])];
    a.tags = tags;
    return patch(a.id, { tags }, true);
  }));
  renderInsp();
  scheduleMeta();
}

async function removeTagFromSelected(tag, sel){
  const low = tag.toLowerCase();
  await Promise.all(sel.filter((a) => (a.tags || []).some((x) => x.toLowerCase() === low)).map((a) => {
    const tags = a.tags.filter((x) => x.toLowerCase() !== low);
    a.tags = tags;
    return patch(a.id, { tags }, true);
  }));
  renderInsp();
  scheduleMeta();
}

async function patch(id, body, silent){
  const a = await api("/api/assets/"+id, { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  const i = state.items.findIndex(x => x.id === id);
  if (i >= 0) state.items[i] = { ...state.items[i], ...a };
  if (!silent){
    renderInsp();
    scheduleMeta();
  }
}

async function patchMany(ids, body){
  await Promise.all(ids.map((id) => patch(id, body, true)));
  renderInsp();
  scheduleMeta();
}

let metaT = 0;
function scheduleMeta(){
  clearTimeout(metaT);
  metaT = setTimeout(refreshMeta, 200);
}

// With `defer`, the render loop stops now but the GL context is kept alive and a release function
// is returned for the caller to run later — closeLight() uses it so the canvas isn't torn down
// while it's still visible during the fade-out.
function dispose3d(elId, defer){
  // onV3DEnvPresetChange/onV3DEnvFile are lightbox-only (the settings panel's environment
  // picker) — only clear them when it's the lightbox's own viewer being torn down, not the
  // inspector's, or closing the inspector preview would break the still-open lightbox's picker.
  if (elId === "light3d"){ onV3DEnvPresetChange = null; onV3DEnvFile = null; onV3DRotate = null; v3dCam = null; camKeys.clear(); v3dInspect?.dispose(); v3dInspect = null; v3dAnim?.a.dispose(); v3dAnim = null; paintAnimBar(); }
  const ctl = threeCtls.get(elId);
  if (!ctl) return null;
  try { ctl.stop(); } catch {}
  threeCtls.delete(elId);
  if (defer) return () => releaseRenderer(ctl.renderer);
  releaseRenderer(ctl.renderer);
  return null;
}

// renderer.dispose() only frees three.js's own bookkeeping — the canvas keeps its WebGL context
// until the garbage collector gets to it. Browsers cap live contexts (~16) and, past that, silently
// kill the *oldest* ones, so opening/closing 3D previews in quick succession could take the context
// out from under a viewer that was still on screen (it just goes black). Release it explicitly.
function releaseRenderer(renderer){
  try { renderer.dispose(); } catch {}
  try { renderer.forceContextLoss(); } catch {}
}

const MODEL_EXT_LOADERS = new Set([".glb", ".gltf", ".obj", ".fbx", ".stl", ".ply", ".usdz", ".usd", ".usda", ".usdc", ".splat", ".spz", ".ksplat", ".sog"]);
// Formats that are unambiguously Gaussian splats. .ply is NOT here — it's also the standard mesh
// PLY extension, so splat .ply files are told apart by sniffing the header (see isSplatAsset()).
const SPLAT_EXT = new Set(SPLAT_EXT_LIST);
// (Our file URLs carry no extension: Spark is told the file type — SPLAT_FILE_TYPE_BY_EXT, model3d-core.js.)

// Shared by the interactive viewer (boot3d) and the offscreen thumbnailer (ensureModelThumb) —
// dispatches by extension, returns an Object3D, or null for a format three.js has no loader for
// (the caller shows an honest "not supported" placeholder instead of faking a shape).
let _gltfDraco = null, _gltfMeshopt = null;
// Some glTF exporters (e.g. Tripo3D) compress geometry with EXT_meshopt_compression or
// Draco; without wiring a decoder, GLTFLoader throws instead of just skipping the extension.
async function gltfLoaderWithDecoders(manager){
  const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
  const loader = new GLTFLoader(manager);
  if (!_gltfDraco){
    const { DRACOLoader } = await import("three/addons/loaders/DRACOLoader.js");
    _gltfDraco = new DRACOLoader();
    _gltfDraco.setDecoderPath("/static/vendor/jsm/libs/draco/gltf/");
  }
  if (!_gltfMeshopt){
    const mod = await import("three/addons/libs/meshopt_decoder.module.js");
    _gltfMeshopt = mod.MeshoptDecoder;
  }
  loader.setDRACOLoader(_gltfDraco);
  loader.setMeshoptDecoder(_gltfMeshopt);
  return loader;
}

// Relative files a model asks for (an FBX's textures, a .gltf's .bin) resolve against our
// extension-less /api/file/{id} URL and would all 404 — reroute them to the server, which looks
// beside the model, in the usual texture folders and among the indexed images. `idle` settles
// once every sub-resource the loaders kicked off has loaded or failed.
const FILE_URL_RE = /^(?:https?:\/\/[^/]+)?\/api\/file\/([^?#]+)$/;
function makeModelManager(THREE, aid){
  const manager = new THREE.LoadingManager();
  const modify = (u) => {
    const m = FILE_URL_RE.exec(u);
    if (!m) return u;
    let rest = m[1];
    try { rest = decodeURIComponent(rest); } catch {}
    return /^[0-9a-f]{16}$/.test(rest) ? u : `/api/model-res/${aid}?name=${encodeURIComponent(rest)}`;
  };
  manager.setURLModifier(modify);
  const idle = new Promise((resolve) => { manager.onLoad = resolve; });
  return { manager, idle, modify };
}

// fetch() with byte-count progress, for the responses no three.js loader is in charge of.
async function fetchBufferWithProgress(url, onProgress){
  const res = await fetch(url);
  if (!res.ok){
    // The server says why in its 404 detail (e.g. the USD library is not installed): the viewer shows it.
    let why = "";
    try { why = (await res.json()).detail || ""; } catch {}
    const err = new Error(why || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  const total = Number(res.headers.get("Content-Length")) || 0;
  if (!res.body || !total || !onProgress) return await res.arrayBuffer();
  const reader = res.body.getReader();
  const buf = new Uint8Array(total);
  let loaded = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    if (loaded + value.length > total) return await (await fetch(url)).arrayBuffer(); // length lied
    buf.set(value, loaded);
    loaded += value.length;
    onProgress({ lengthComputable: true, loaded, total });
  }
  return buf.buffer;
}

// A USD file read in the browser (model3d-core.js parseUsd — the phone app's reading, so views agree): a
// .usd / .usda / .usdc, or a .usdz the server did not convert. A standalone layer's textures are asked for by
// base name; the manager sends those to /api/model-res (beside the model, the usual texture folders).
async function loadUsd(THREE, url, aid, onProgress){
  const { USDLoader } = await import("three/addons/loaders/USDLoader.js");
  const { manager, idle, modify } = makeModelManager(THREE, aid);
  manager.setURLModifier((u) => (/^(?:blob:|data:|https?:|\/)/i.test(u) ? modify(u) : `/api/model-res/${aid}?name=${encodeURIComponent(u)}`));
  let started = false;
  manager.onStart = () => { started = true; };
  const buf = await fetchBufferWithProgress(url, onProgress);
  return await parseUsd(THREE, USDLoader, buf, manager,
    () => (started ? Promise.race([idle, new Promise((r) => setTimeout(r, FBX_TEXTURE_WAIT_MS))]) : null));
}

async function loadModel(THREE, url, ext, onProgress, aid){
  const low = (ext || "").toLowerCase();
  if (low === ".glb" || low === ".gltf"){
    const { manager } = makeModelManager(THREE, aid);
    const loader = await gltfLoaderWithDecoders(manager);
    const g = await loader.loadAsync(url, onProgress);
    g.scene.animations = g.animations || [];  // the clips go with the model (cache clones keep them)
    return g.scene;
  }
  if (low === ".usdz"){
    // The server converts a .usdz once (via the optional `pxr` USD library, app/usdz_convert.py) into a plain
    // .glb, which GLTFLoader renders like any glTF. It does not when usd-core is missing, the file does not
    // convert, or the stage is animated (the conversion keeps no animation; HTTP 409) — then the file is read
    // here with three's USDLoader, as the phone app reads it (loadUsd). Its error wins only when both fail.
    let why = null;
    try {
      const data = await fetchBufferWithProgress(`/api/model-glb/${aid}`, onProgress);
      const loader = await gltfLoaderWithDecoders();
      const g = await loader.parseAsync(data, "");
      g.scene.animations = g.animations || [];
      return g.scene;
    } catch (e){ why = e; }
    try { return await loadUsd(THREE, url, aid, onProgress); }
    // (409: animated, read here on purpose — this read's own error says what went wrong)
    catch (e){ console.warn("USD", e); throw why && why.status !== 409 ? why : e; }
  }
  if (low === ".usd" || low === ".usda" || low === ".usdc") return await loadUsd(THREE, url, aid, onProgress);
  if (low === ".obj"){
    const { OBJLoader } = await import("three/addons/loaders/OBJLoader.js");
    return await new OBJLoader().loadAsync(url, onProgress);
  }
  if (low === ".fbx"){
    const { FBXLoader } = await import("three/addons/loaders/FBXLoader.js");
    const { manager, idle } = makeModelManager(THREE, aid);
    const obj = await new FBXLoader(manager).loadAsync(url, onProgress);
    // Textures load after the mesh parses; wait for them (bounded) so a thumbnail — or the first
    // frame — isn't taken untextured, then discard the ones that never arrived.
    await Promise.race([idle, new Promise((r) => setTimeout(r, FBX_TEXTURE_WAIT_MS))]);
    dropDeadTextures(obj);
    return obj;
  }
  if (low === ".stl"){
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    return stlMesh(THREE, await new STLLoader().loadAsync(url, onProgress));
  }
  if (low === ".ply"){
    const { PLYLoader } = await import("three/addons/loaders/PLYLoader.js");
    return plyMesh(THREE, await new PLYLoader().loadAsync(url, onProgress));
  }
  return null;
}

// ---- In-memory cache of parsed models -------------------------------------------------------------
// Re-opening the same model (Space, close, Space …) used to re-download and re-parse it every time.
// Parsed models are kept here up to the same RAM budget as the video cache (Settings → RAM cache),
// least recently used out first. The cache keeps a pristine copy that no viewer ever touches; each
// viewer gets a clone that shares geometry and textures (the heavy parts) but owns its materials,
// because the shading / x-ray modes mutate materials in place. Splats are not cached (Spark owns them).
const modelCache = new Map(); // key -> { obj, bytes }; Map order is recency, oldest first
const modelPending = new Map(); // key -> Promise<Object3D|null>, so concurrent opens share one load
let modelCacheBytes = 0;

function estimateObjBytes(obj){
  const seen = new Set();
  let n = 0;
  obj.traverse((c) => {
    const g = c.geometry;
    if (g && !seen.has(g)){
      seen.add(g);
      for (const at of Object.values(g.attributes)) n += at.array ? at.array.byteLength : 0;
      if (g.index && g.index.array) n += g.index.array.byteLength;
    }
    const mats = Array.isArray(c.material) ? c.material : (c.material ? [c.material] : []);
    for (const m of mats){
      for (const k in m){
        const t = m[k];
        if (!t || !t.isTexture || seen.has(t)) continue;
        seen.add(t);
        const im = t.image;
        if (im && im.width && im.height) n += im.width * im.height * 4 * 1.33; // RGBA + mip chain
      }
    }
  });
  return n;
}

function trimModelCache(){
  const limit = clampCache(state.theme.videoCache) * 1048576;
  for (const [k, e] of modelCache){
    if (modelCacheBytes <= limit) break;
    modelCache.delete(k);
    modelCacheBytes -= e.bytes;
  }
}

async function cloneModel(obj){
  const { clone } = await import("three/addons/utils/SkeletonUtils.js");
  const c = clone(obj); // also rebinds skinned meshes to the cloned skeleton
  // One clone per material, not per mesh: meshes that shared a material must keep sharing it
  // (the info overlay counts materials by identity, and N copies also cost N shader programs).
  const copies = new Map();
  const dup = (x) => { let y = copies.get(x); if (!y){ y = x.clone(); copies.set(x, y); } return y; };
  c.traverse((m) => {
    if (m.material) m.material = Array.isArray(m.material) ? m.material.map(dup) : dup(m.material);
    // A USD stage's one skeleton sits on its root, for the mixer to find bones before same-named prims
    // (model3d-core.js usdAsSight); a clone does not copy it — the cloned meshes' skeleton is that one.
    if (obj.skeleton && !c.skeleton && m.isSkinnedMesh) c.skeleton = m.skeleton;
  });
  return c;
}

// loadModel() + applyCompanions() through the cache — for the interactive viewer. (Thumbnail
// rendering stays uncached: it sweeps many models once and would only evict the ones being viewed.)
function modelCacheKey(aid){
  const a = assetById(aid);
  return aid + ":" + (a ? a.mtime : "");
}

async function loadModelCached(THREE, url, ext, onProgress, aid){
  const prefix = aid + ":", key = modelCacheKey(aid);
  const hit = modelCache.get(key);
  if (hit){
    modelCache.delete(key);
    modelCache.set(key, hit); // most recently used
    return await cloneModel(hit.obj);
  }
  let p = modelPending.get(key);
  if (!p){
    p = (async () => {
      const obj = await loadModel(THREE, url, ext, onProgress, aid);
      if (!obj) return null;
      await applyCompanions(THREE, obj, aid);
      const bytes = estimateObjBytes(obj);
      if (bytes <= clampCache(state.theme.videoCache) * 1048576){
        for (const [k, e] of modelCache){ // drop an older version of the same file
          if (k.startsWith(prefix)){ modelCache.delete(k); modelCacheBytes -= e.bytes; }
        }
        modelCache.set(key, { obj, bytes });
        modelCacheBytes += bytes;
        trimModelCache();
      }
      return obj;
    })().finally(() => modelPending.delete(key));
    modelPending.set(key, p);
  }
  const obj = await p;
  return obj ? await cloneModel(obj) : null;
}

// A splat .ply's header carries per-splat opacity + spherical-harmonic/scale/rotation properties
// that a mesh PLY never has — sniff just the header (a Range request) instead of guessing from
// the extension alone, since .ply is shared between the two file families.
const PLY_SNIFF_BYTES = 8192;
async function sniffPlyIsSplat(url){
  try {
    const res = await fetch(url, { headers: { Range: `bytes=0-${PLY_SNIFF_BYTES - 1}` } });
    // Read only the first PLY_SNIFF_BYTES off the stream and stop — a mesh PLY can be small, but
    // a splat PLY is routinely hundreds of MB, and not every static file server honors Range
    // (in which case res.body still starts with the same header bytes; reading .arrayBuffer()
    // instead would pull the whole file into memory just to look at its header).
    const reader = res.body.getReader();
    const chunks = [];
    let total = 0;
    while (total < PLY_SNIFF_BYTES){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      total += value.length;
    }
    reader.cancel().catch(() => {});
    const buf = new Uint8Array(total);
    let off = 0;
    for (const c of chunks){ buf.set(c, off); off += c.length; }
    return plyHeaderIsSplat(new TextDecoder("ascii").decode(buf));
  } catch {
    return false;
  }
}

const _plySplatCache = new Map(); // asset id -> Promise<boolean>, sniffed at most once per session
async function isSplatAsset(aid, ext){
  const low = (ext || "").toLowerCase();
  if (SPLAT_EXT.has(low)) return true;
  if (low !== ".ply") return false;
  if (!_plySplatCache.has(aid)) _plySplatCache.set(aid, sniffPlyIsSplat(`/api/file/${aid}`));
  return await _plySplatCache.get(aid);
}

// Manual "which way is up" for formats that don't say (STL/OBJ/FBX from Z-up tools lie on their
// side): each click turns the model a quarter turn about X (first click = Z-up -> Y-up). Remembered
// per asset; thumbnails follow it too (see flushRotatedThumb). USDZ declares its up axis and is
// already corrected server-side, so this is just the fallback there.
function getModelTurns(aid){
  try { return (Number(JSON.parse(localStorage.getItem("sight.v3dRot") || "{}")[aid]) || 0) & 3; } catch { return 0; }
}
function setModelTurns(aid, n){
  try {
    const m = JSON.parse(localStorage.getItem("sight.v3dRot") || "{}");
    if (n) m[aid] = n; else delete m[aid];
    putSetting("sight.v3dRot", JSON.stringify(m));
  } catch {}
}

// Saved camera views, per model: { [assetId]: { "1": { p, t, turns }, … } } — Alt+1…9 stores the
// current view under that digit (overwriting), plain 1…9 recalls it. `p`/`t` are the camera
// position and orbit target; `turns` is the model's manual 90° turn count at save time, since a
// turn re-frames the model and a view saved before it would otherwise point at the wrong place.
const V3D_CAMS_KEY = "sight.v3dCams";
function readAllCams(){
  try { return JSON.parse(localStorage.getItem(V3D_CAMS_KEY) || "{}") || {}; } catch { return {}; }
}
function getModelCam(aid, slot){ return (readAllCams()[aid] || {})[slot] || null; }
function setModelCam(aid, slot, cam){
  try {
    const all = readAllCams();
    (all[aid] ||= {})[slot] = cam;
    putSetting(V3D_CAMS_KEY, JSON.stringify(all));
  } catch {}
}

let v3dToastTimer = 0;
function flashV3DToast(text){
  const el = $("v3dToast");
  if (!el) return;
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(v3dToastTimer);
  v3dToastTimer = setTimeout(() => el.classList.remove("on"), 1400);
}

// Camera behaviour that's the same for meshes and splats in the lightbox: WASD fly (moves the
// camera and the orbit target together, so orbiting keeps working from the new spot), frame-all
// (F) back to the framing the model opened with, and the Alt+1…9 / 1…9 saved views. The caller
// calls setHome() after every (re)framing and step() once per frame. `turns` is only passed by
// the mesh viewer, which can be turned in 90° steps.
function makeCameraRig(THREE, camera, controls, aid, turns){
  const home = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
  const fwd = new THREE.Vector3(), right = new THREE.Vector3();
  let extent = 1, last = 0;
  const view = (pos, target) => { camera.position.copy(pos); controls.target.copy(target); controls.update(); };
  return {
    setHome(size){
      extent = size || 1;
      home.pos.copy(camera.position);
      home.target.copy(controls.target);
    },
    frame(){ view(home.pos, home.target); flashV3DToast("Frame all"); },
    // Fit a world-space box (the inspector's selection) keeping the current viewing direction.
    frameBox(box, label){
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const r = Math.max(sphere.radius, 1e-4);
      const dist = r / Math.sin(camera.fov * Math.PI / 360) * 1.1;
      const dir = camera.position.clone().sub(controls.target);
      if (dir.lengthSq() < 1e-12) dir.set(0.7, 0.45, 0.7);
      view(sphere.center.clone().addScaledVector(dir.normalize(), dist), sphere.center);
      flashV3DToast(label);
    },
    step(now){
      // Field of view is live from the Camera settings (mesh and splat viewers both call step()).
      const fov = Number(state.v3d.camFov) || 50;
      if (camera.fov !== fov){ camera.fov = fov; camera.updateProjectionMatrix(); }
      const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      if (!dt || !camKeys.size) return;
      camera.getWorldDirection(fwd);
      right.setFromMatrixColumn(camera.matrixWorld, 0);
      let f = 0, r = 0;
      if (camKeys.has("KeyW")) f++;
      if (camKeys.has("KeyS")) f--;
      if (camKeys.has("KeyD")) r++;
      if (camKeys.has("KeyA")) r--;
      if (!f && !r) return;
      fwd.multiplyScalar(f).addScaledVector(right, r).normalize().multiplyScalar(extent * 0.6 * state.v3d.camSpeed * dt);
      camera.position.add(fwd);
      controls.target.add(fwd);
    },
    // Annotations: the camera as plain data, and back (damping is cut so the restored view holds).
    getView(){
      return { p: camera.position.toArray(), t: controls.target.toArray(), fov: camera.fov, turns: turns ? turns.get() : 0 };
    },
    setView(v){
      if (turns && (v.turns || 0) !== turns.get()) turns.set(v.turns || 0);
      if (v.fov && Number(state.v3d.camFov) !== v.fov){ state.v3d.camFov = v.fov; camera.fov = v.fov; camera.updateProjectionMatrix(); }
      const damp = controls.enableDamping;
      controls.enableDamping = false;
      controls.update();
      view(new THREE.Vector3().fromArray(v.p), new THREE.Vector3().fromArray(v.t));
      controls.enableDamping = damp;
    },
    save(slot){
      const t = turns ? turns.get() : 0;
      setModelCam(aid, slot, { p: camera.position.toArray(), t: controls.target.toArray(), turns: t });
      flashV3DToast(`View ${slot} saved`);
    },
    recall(slot){
      const cam = getModelCam(aid, slot);
      if (!cam){ flashV3DToast(`View ${slot} is empty — Alt+${slot} saves the current view`); return; }
      if (turns && (cam.turns || 0) !== turns.get()) turns.set(cam.turns || 0); // re-frames → resets `home` too
      view(new THREE.Vector3().fromArray(cam.p), new THREE.Vector3().fromArray(cam.t));
      flashV3DToast(`View ${slot}`);
    },
  };
}

// A few built-in procedural "sky" presets (no bundled HDRI, so nothing to fetch) plus support
// for loading any image from disk as an equirectangular environment map.
// ENV_PRESETS (the environment gradients) come from model3d-core.js, shared with the phone app.
// buildEnvTexture (model3d-core.js) bakes one of them into the env map of the lightbox 3D panel's
// "Environment light" (null on failure: the env toggle becomes a no-op).
// "Load any [image] from disk" — a regular equirectangular photo/render works fine through
// PMREMGenerator's fromEquirectangular; no .hdr-specific loader needed.
async function buildEnvTextureFromImage(THREE, renderer, url){
  try {
    const loader = new THREE.TextureLoader();
    const tex = await new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const rt = pmrem.fromEquirectangular(tex);
    pmrem.dispose();
    tex.dispose();
    return rt.texture;
  } catch (err) {
    console.warn("environment image load failed", err);
    return null;
  }
}

// Base shading (applyBaseMaterial), x-ray (applyXray) and the wireframe overlay (setWireOverlay) live in
// model3d-core.js, shared with the phone app.
// ---- Soft shadows for the lightbox 3D viewer ----------------------------------------------------
// three's own filters blur by a fixed number of shadow-map texels, so a low-res map shows stair
// steps and there is no notion of a light's size. The viewer runs BasicShadowMap (raw depth) and
// this replaces that mode's getShadow() with PCSS: a blocker search finds the average occluder
// depth, the penumbra grows with the receiver-to-blocker distance (contact-hardening), and a
// rotated Vogel disk filters it. A minimum radius of 1.5 texels anti-aliases even a point light.
// light.shadow.radius carries the penumbra radius in shadow-map UV per unit of shadow depth
// (see pcssRadius). A receiver-plane depth bias keeps wide kernels from self-shadowing slopes.
const PCSS_GLSL = `
		float sightIGN( vec2 p ) { return fract( 52.9829189 * fract( dot( p, vec2( 0.06711056, 0.00583715 ) ) ) ); }
		vec2 sightVogel( int i, int n, float phi ) {
			float r = sqrt( ( float( i ) + 0.5 ) / float( n ) );
			float t = float( i ) * 2.399963229728653 + phi;
			return vec2( cos( t ), sin( t ) ) * r;
		}
		float getShadow( sampler2D shadowMap, vec2 shadowMapSize, float shadowIntensity, float shadowBias, float shadowRadius, vec4 shadowCoord ) {
			float shadow = 1.0;
			shadowCoord.xyz /= shadowCoord.w;
			shadowCoord.z += shadowBias;
			vec3 ddx = dFdx( shadowCoord.xyz ), ddy = dFdy( shadowCoord.xyz );
			float det = ddx.x * ddy.y - ddx.y * ddy.x;
			vec2 dzduv = abs( det ) > 1e-12 ? vec2( ddy.y * ddx.z - ddx.y * ddy.z, ddx.x * ddy.z - ddy.x * ddx.z ) / det : vec2( 0.0 );
			dzduv = clamp( dzduv, vec2( -2.0 ), vec2( 2.0 ) );
			bool inFrustum = shadowCoord.x >= 0.0 && shadowCoord.x <= 1.0 && shadowCoord.y >= 0.0 && shadowCoord.y <= 1.0;
			if ( inFrustum && shadowCoord.z <= 1.0 ) {
				float texel = 1.0 / shadowMapSize.x;
				float phi = sightIGN( gl_FragCoord.xy ) * PI2;
				float searchR = clamp( shadowRadius * shadowCoord.z, 3.0 * texel, 0.2 );
				float zSum = 0.0, nBlk = 0.0;
				for ( int i = 0; i < 16; i ++ ) {
					vec2 o = sightVogel( i, 16, phi ) * searchR;
					float d = texture2D( shadowMap, shadowCoord.xy + o ).r;
					if ( d < shadowCoord.z + dot( dzduv, o ) - texel * 0.5 ) { zSum += d; nBlk += 1.0; }
				}
				if ( nBlk > 0.0 ) {
					float pen = clamp( shadowRadius * ( shadowCoord.z - zSum / nBlk ), 1.5 * texel, 0.2 );
					float lit = 0.0;
					for ( int i = 0; i < 32; i ++ ) {
						vec2 o = sightVogel( i, 32, phi ) * pen;
						lit += step( shadowCoord.z + dot( dzduv, o ) - texel * 0.5, texture2D( shadowMap, shadowCoord.xy + o ).r );
					}
					shadow = lit / 32.0;
				}
			}
			return mix( 1.0, shadow, shadowIntensity );
		}`;
let softShadowsPatched = null;
function patchSoftShadows(THREE){
  if (softShadowsPatched !== null) return softShadowsPatched;
  softShadowsPatched = false;
  const src = THREE.ShaderChunk.shadowmap_pars_fragment;
  const start = src.indexOf("#else\n\t\tfloat getShadow( sampler2D shadowMap");
  const end = start < 0 ? -1 : src.indexOf("\n\t#endif\n\t#if NUM_POINT_LIGHT_SHADOWS > 0", start);
  if (start < 0 || end < 0){ console.warn("soft shadows: three.js shadow chunk changed, using PCF"); return false; }
  THREE.ShaderChunk.shadowmap_pars_fragment = src.slice(0, start) + "#else" + PCSS_GLSL + src.slice(end);
  return (softShadowsPatched = true);
}
// Penumbra radius (shadow UV per unit shadow depth) for a directional light of angular diameter
// `deg`: a receiver Δ behind its blocker sits in a penumbra of radius Δ·tan(deg/2).
function pcssRadius(cam, deg){
  return (cam.far - cam.near) * Math.tan(Math.max(0, deg) * Math.PI / 360) / Math.max(1e-6, cam.right - cam.left);
}

// Sky brightness (linear luminance) seen along a world direction — what the floor's environment
// shadow is weighted by. Presets mirror buildEnvTexture's gradient; a custom image is read back
// at low resolution in the equirect layout three uses (u = atan2(z, x), v = asin(y)).
function skyLumFromPreset(THREE, colors){
  const top = new THREE.Color(colors.top), hor = new THREE.Color(colors.horizon), bot = new THREE.Color(colors.bottom);
  const tmp = new THREE.Color();
  return (d) => {
    tmp.copy(hor).lerp(d.y >= 0 ? top : bot, Math.min(1, Math.abs(d.y) * 1.6));
    return 0.2126 * tmp.r + 0.7152 * tmp.g + 0.0722 * tmp.b;
  };
}
async function skyLumFromImage(file){
  const W = 128, H = 64;
  const bmp = await createImageBitmap(file);
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d");
  cx.drawImage(bmp, 0, 0, W, H);
  bmp.close?.();
  const px = cx.getImageData(0, 0, W, H).data;
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const lum = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) lum[i] = 0.2126 * lin(px[i * 4]) + 0.7152 * lin(px[i * 4 + 1]) + 0.0722 * lin(px[i * 4 + 2]);
  return (d) => {
    const u = Math.atan2(d.z, d.x) / (2 * Math.PI) + 0.5;
    const v = Math.asin(Math.max(-1, Math.min(1, d.y))) / Math.PI + 0.5;
    const col = Math.min(W - 1, Math.max(0, Math.floor(u * W)));
    const row = Math.min(H - 1, Math.max(0, Math.floor((1 - v) * H)));
    return lum[row * W + col];
  };
}

// Floor shadow from the environment and ambient light. three.js lights meshes with them but never
// shadows them, so the floor's share is integrated here: N directions over the upper hemisphere
// (cosine-distributed), each weighted by the sky's radiance there, each rendered as one soft
// shadow map onto a floor-sized texture and summed over a few frames. The result is camera
// independent — it only restarts when the model, explode, sky or its strength changes.
// `vis.texture` holds visibility in .r (1 = open sky): the solid floor uses it as its aoMap
// (which scales exactly the ambient + environment part of its lighting); `overlay` draws it as a
// darkening layer for the shadow-only floor.
// Layers: three picks shadow casters by the *rendering* camera's layers, so each sample is two
// renders — `castCam` (layers LAYER + CASTER_LAYER, an empty frustum so nothing is drawn) only
// refreshes the sample light's shadow map from the casters marked by markCasters(); `cam` (LAYER
// only) then draws the receiver plane with that map. The rig lights sit on layer 0, so neither
// pass re-renders their shadow maps.
function makeSkyOcclusion(THREE, renderer, scene){
  const LAYER = 5, CASTER_LAYER = 6, N = 64, PER_FRAME = 8, RES = 512;
  const accum = new THREE.WebGLRenderTarget(RES, RES, { type: THREE.HalfFloatType, depthBuffer: false });
  const vis = new THREE.WebGLRenderTarget(RES, RES, { depthBuffer: false });
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 10);
  cam.layers.set(LAYER);
  const castCam = new THREE.OrthographicCamera(-1, -1 + 1e-6, 1, 1 - 1e-6, 1e9, 1e9 + 1);
  castCam.layers.set(LAYER);
  castCam.layers.enable(CASTER_LAYER);
  const dummy = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false });
  cam.up.set(0, 0, -1); // image top = world −Z, matching PlaneGeometry's uv after rotation.x = −π/2
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.layers.set(LAYER); // only the occlusion passes see it (lights are layer-filtered like meshes)
  light.castShadow = true;
  light.shadow.mapSize.set(1024, 1024);
  scene.add(light, light.target);
  const recvMat = new THREE.ShadowMaterial({
    color: 0xffffff, premultipliedAlpha: true, transparent: true, depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor,
  });
  const recv = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), recvMat);
  recv.rotation.x = -Math.PI / 2;
  recv.receiveShadow = true;
  recv.layers.set(LAYER);
  scene.add(recv);
  // accum.r = Σ wᵢ·occludedᵢ  →  vis.r = 1 − accum.r / Σ wᵢ (so a partial pass is already a fair estimate)
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const resolveMat = new THREE.ShaderMaterial({
    uniforms: { tAcc: { value: accum.texture }, uInv: { value: 0 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
    fragmentShader: "uniform sampler2D tAcc; uniform float uInv; varying vec2 vUv; void main(){ gl_FragColor = vec4(vec3(1.0 - clamp(texture2D(tAcc, vUv).r * uInv, 0.0, 1.0)), 1.0); }",
    depthTest: false, depthWrite: false,
  });
  const resolveScene = new THREE.Scene();
  resolveScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), resolveMat));
  const overlayMat = new THREE.ShaderMaterial({
    uniforms: { tVis: { value: vis.texture }, uAlpha: { value: 0 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: "uniform sampler2D tVis; uniform float uAlpha; varying vec2 vUv; void main(){ gl_FragColor = vec4(0.0, 0.0, 0.0, (1.0 - texture2D(tVis, vUv).r) * uAlpha); }",
    transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
  const overlay = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), overlayMat);
  overlay.rotation.x = -Math.PI / 2;
  overlay.visible = false;
  scene.add(overlay);
  // Cosine-distributed directions, visited in a strided order so every partial batch already
  // covers the whole sky. Near-horizon directions are lifted to 6° (their shadows run off the floor).
  const dirs = [];
  for (let k = 0; k < N; k++){
    const i = (k * 23) % N, u = (i + 0.5) / N, phi = i * 2.399963229728653;
    const r = Math.sqrt(u), y = Math.max(Math.sqrt(1 - u), Math.sin(6 * Math.PI / 180));
    dirs.push(new THREE.Vector3(r * Math.cos(phi), y, r * Math.sin(phi)).normalize());
  }
  // Each direction stands for a patch of sky ~sqrt(2π/N) rad wide — rendering it as a light of
  // that size blends the discrete shadows into one smooth one.
  const sampleDeg = Math.sqrt(2 * Math.PI / N) * 180 / Math.PI;
  const weights = new Float32Array(N);
  const center = new THREE.Vector3(), tmpDir = new THREE.Vector3(), prevClear = new THREE.Color();
  let radius = 1, floorY = 0, floorSize = 1, done = N, wDone = 0, wAll = 0;

  function clearVis(){
    const prev = renderer.getRenderTarget();
    renderer.getClearColor(prevClear);
    const prevAlpha = renderer.getClearAlpha();
    renderer.setRenderTarget(vis);
    renderer.setClearColor(0xffffff, 1);
    renderer.clear(true, false, false);
    renderer.setRenderTarget(prev);
    renderer.setClearColor(prevClear, prevAlpha);
  }
  clearVis();
  return {
    texture: vis.texture,
    overlay,
    markCasters(root){ root.traverse((c) => c.layers.enable(CASTER_LAYER)); },
    // Model bounds (sphere) and the floor square the texture maps onto.
    fit(c, r, fy, fsize, fx, fz){
      center.copy(c); radius = Math.max(r, 1e-4); floorY = fy; floorSize = fsize;
      recv.position.set(fx, fy, fz); recv.scale.set(fsize, fsize, 1);
      overlay.position.set(fx, fy, fz); overlay.scale.set(fsize, fsize, 1);
      const h = radius * 4 + 1;
      cam.position.set(fx, fy + h, fz);
      cam.lookAt(fx, fy, fz);
      cam.left = -fsize / 2; cam.right = fsize / 2; cam.top = fsize / 2; cam.bottom = -fsize / 2;
      cam.near = h * 0.5; cam.far = h * 1.5;
      cam.updateProjectionMatrix();
    },
    // skyL(dir) = radiance weight of that direction (ambient/π + env). All ~0 → nothing to shadow.
    restart(skyL){
      wAll = 0;
      for (let i = 0; i < N; i++){ weights[i] = Math.max(0, skyL(dirs[i])); wAll += weights[i]; }
      done = 0; wDone = 0;
      if (wAll <= 1e-6){ done = N; clearVis(); }
      return wAll / N; // mean radiance weight → the caller's sky irradiance estimate (× π)
    },
    busy(){ return done < N; },
    step(){
      if (done >= N) return;
      const prevTarget = renderer.getRenderTarget(), prevAuto = renderer.autoClear, prevBg = scene.background;
      renderer.getClearColor(prevClear);
      const prevAlpha = renderer.getClearAlpha();
      const prevShadowAuto = renderer.shadowMap.autoUpdate;
      scene.background = null;
      renderer.autoClear = false;
      if (done === 0){
        renderer.setRenderTarget(accum);
        renderer.setClearColor(0x000000, 0);
        renderer.clear(true, false, false);
      }
      const dist = radius * 3;
      const sc = light.shadow.camera;
      sc.left = -radius; sc.right = radius; sc.top = radius; sc.bottom = -radius;
      sc.near = dist - radius; sc.far = dist + radius + floorSize * 2;
      sc.updateProjectionMatrix();
      light.shadow.radius = softShadowsPatched ? pcssRadius(sc, sampleDeg) : 4;
      light.shadow.bias = -0.0005;
      light.shadow.normalBias = 0;
      for (let n = 0; n < PER_FRAME && done < N; n++, done++){
        const w = weights[done];
        if (w <= 0) continue;
        tmpDir.copy(dirs[done]);
        light.position.copy(center).addScaledVector(tmpDir, dist);
        light.target.position.copy(center);
        light.updateMatrixWorld(); light.target.updateMatrixWorld();
        recvMat.opacity = w;
        renderer.shadowMap.autoUpdate = true;
        renderer.setRenderTarget(dummy);
        renderer.render(scene, castCam);
        renderer.shadowMap.autoUpdate = false;
        renderer.shadowMap.needsUpdate = false;
        renderer.setRenderTarget(accum);
        renderer.render(scene, cam);
        wDone += w;
      }
      renderer.shadowMap.autoUpdate = prevShadowAuto;
      resolveMat.uniforms.uInv.value = wDone > 0 ? 1 / wDone : 0;
      renderer.setRenderTarget(vis);
      renderer.render(resolveScene, quadCam);
      renderer.setRenderTarget(prevTarget);
      renderer.autoClear = prevAuto;
      renderer.setClearColor(prevClear, prevAlpha);
      scene.background = prevBg;
    },
    dispose(){
      accum.dispose(); vis.dispose(); dummy.dispose(); recvMat.dispose(); resolveMat.dispose(); overlayMat.dispose();
      recv.geometry.dispose(); overlay.geometry.dispose(); light.shadow.map?.dispose();
    },
  };
}

// Applies filename-heuristic companion textures (§4) to materials that loaded without a map —
// mainly OBJ/FBX files that reference external textures three.js can't resolve on its own here.
async function applyCompanions(THREE, obj, aid){
  let list = [];
  try { list = await api(`/api/assets/${aid}/companions`); } catch { return; }
  if (!list.length) return;
  const loader = new THREE.TextureLoader();
  // Awaited (bounded), so a thumbnail rendered right after isn't taken before these arrive.
  const pending = [];
  obj.traverse((child) => {
    const mats = Array.isArray(child.material) ? child.material : (child.material ? [child.material] : []);
    for (const mat of mats){
      for (const c of list){
        if (mat[c.slot]) continue;
        pending.push(loader.loadAsync(`/api/file/${c.id}`).then((tex) => {
          if (c.slot === "map" || c.slot === "emissiveMap") tex.colorSpace = THREE.SRGBColorSpace;
          mat[c.slot] = tex;
          mat.needsUpdate = true;
        }, () => {}));
      }
    }
  });
  if (pending.length) await Promise.race([Promise.all(pending), new Promise((r) => setTimeout(r, 15000))]);
}

async function boot3d(elId, aid, url, ext, thumbUrl, hostEl){
  dispose3d(elId);
  const el = hostEl || document.getElementById(elId);
  if (!el) return;
  let explodeMap = null; // the model's explode rig once it loads; read by the annotator's stills (renderStill)
  // Paint the loading state — the asset's existing 2D thumbnail as a backdrop, a loading plate
  // on top — and yield a real frame *before* touching THREE/the model parser. Large models
  // parse synchronously on the main thread; without this yield the lightbox's own fade-in and
  // this placeholder both stay queued behind that parse instead of appearing first (the freeze
  // reported in feedback: the whole window hangs, then the lightbox pops in already loaded).
  el.replaceChildren();
  // A model already parsed in the RAM cache (see loadModelCached) has nothing to download, so it
  // gets the thumbnail backdrop without the progress plate. The backdrop itself stays: cloning,
  // shader compilation and texture upload of a mid-size or large model still take a visible moment.
  const cached = modelCache.has(modelCacheKey(aid));
  const loadingEl = document.createElement("div");
  loadingEl.className = "model-loading" + (elId === "light3d" ? " in-bar" : "");
  // Lightbox: the toolbar/gear stay hidden (CSS, .v3d-loading) until endLoading() — see showInLight.
  const lightEl = elId === "light3d" ? el.closest(".light") : null;
  // Cross-fades to the live canvas underneath instead of cutting to it.
  const endLoading = () => {
    lightEl?.classList.remove("v3d-loading");
    loadingEl.classList.add("done");
    setTimeout(() => loadingEl.remove(), 250);
  };
  // The thumbnail is rendered on a transparent background; paint the viewer's own background
  // behind it so the backdrop matches what the canvas will show once the model is up.
  loadingEl.style.backgroundColor = elId === "light3d" ? state.v3d.bg : "#0a0a0b";
  if (thumbUrl) loadingEl.style.backgroundImage = `url("${thumbUrl}")`;
  if (!cached) loadingEl.innerHTML = `<div class="plate"><div class="mprog-label">Loading model…</div><div class="mprog indeterminate"><i></i></div></div>`;
  el.appendChild(loadingEl);
  // Real download progress where the loader reports it (byte counts — our own /api/file/ always
  // sends Content-Length, so this is almost always computable) instead of a plate that just sits
  // there with no way to tell "still working" from "hung" on a large model or a slow disk.
  function onModelProgress(evt){
    if (!el.isConnected || !el.contains(loadingEl)) return; // stage moved on
    const bar = loadingEl.querySelector(".mprog"), fill = bar && bar.querySelector("i");
    const lbl = loadingEl.querySelector(".mprog-label");
    if (!bar || !fill) return;
    if (evt && evt.lengthComputable && evt.total){
      bar.classList.remove("indeterminate");
      const pct = Math.round(Math.min(1, evt.loaded / evt.total) * 100);
      fill.style.width = pct + "%";
      if (lbl) lbl.textContent = `Loading model… ${pct}%`;
    } else {
      bar.classList.add("indeterminate");
      if (lbl) lbl.textContent = "Loading model…";
    }
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (!el.isConnected || !el.contains(loadingEl)) return; // stage moved on while we yielded
  const isLightbox = elId === "light3d"; // the inspector's small preview keeps the old fixed lighting

    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const scene = new THREE.Scene();
    const bgColor = new THREE.Color(isLightbox ? state.v3d.bg : 0x0a0a0b);
    scene.background = bgColor;
    const w = Math.max(el.clientWidth, 16), h = Math.max(el.clientHeight, 16);
    const camera = new THREE.PerspectiveCamera(50, w / h, 0.01, 2000);
    camera.position.set(2, 1.4, 2.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h);
    // The viewport can change under a live viewer (window resize, a lightbox mask/aspect change) —
    // both render loops call this each frame; it only does work when the host's size actually changed.
    let sizeW = w, sizeH = h;
    const syncSize = () => {
      const cw = el.clientWidth, ch = el.clientHeight;
      if (cw < 16 || ch < 16 || (cw === sizeW && ch === sizeH)) return;

      renderer.setSize(cw, ch);
      camera.aspect = cw / ch;
      camera.updateProjectionMatrix();
    };
    el.insertBefore(renderer.domElement, loadingEl);
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

    const low = (ext || "").toLowerCase();
    const splat = MODEL_EXT_LOADERS.has(low) ? await isSplatAsset(aid, low) : false;
    if (!el.isConnected || !el.contains(loadingEl)){ // stage moved on during the (possible) header sniff

    }

    // meshes — splats are pre-lit, baked spherical-harmonic color with no such controls. The
    // gear/settings panel stays available for both, with different content (see renderV3DPanel).

      $("v3dShade").hidden = splat;
      if (currentAssetIsSplat !== splat){

        renderV3DPanel();
      }
    }

      const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
      controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
      controls.zoomToCursor = true;

      const loop = () => {
        if (!live) return;
        requestAnimationFrame(loop);
        syncSize();
        camRig?.step(performance.now());
        controls.update();
        // Live-applied from the Splat settings panel (tint/opacity are shader uniforms — free to
        // update every frame) — lightbox only, same convention the mesh rig uses for state.v3d.
        if (mesh && isLightbox){
          const v = state.v3d;
          bgColor.set(v.bg);
          mesh.recolor.r = v.splatR; mesh.recolor.g = v.splatG; mesh.recolor.b = v.splatB;
          mesh.opacity = v.splatOpacity;

        const dims = box.getSize(new THREE.Vector3());

          ["Splats", (mesh.packedSplats?.numSplats ?? mesh.numSplats ?? 0).toLocaleString("en-US")],

    let skyOcc = null, skyLum = null, envVersion = 0; // floor shadow from ambient + environment (makeSkyOcclusion)
    let lightDrag = null; // Shift+right-drag on the canvas — rotates all lights + the env map (see below)

      renderer.shadowMap.type = patchSoftShadows(THREE) ? THREE.BasicShadowMap : THREE.PCFShadowMap;
      ambientLight = new THREE.AmbientLight(0xffffff, state.v3d.ambient);
      scene.add(ambientLight);
      for (let i = 0; i < 3; i++){
        const l = new THREE.DirectionalLight(0xffffff, 1);
        l.castShadow = true;
        l.shadow.mapSize.set(2048, 2048);
        scene.add(l, l.target);
        rigLights.push(l);
      }
      // transparent: the floor fades out while explode pushes parts below it (see syncRig)
      floorMatSolid = new THREE.MeshStandardMaterial({ color: 0x17171b, roughness: 1, transparent: true });
      floorMatShadow = new THREE.ShadowMaterial({ opacity: state.v3d.shadowStrength });
      floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), floorMatSolid);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      floor.visible = false;
      scene.add(floor);
      grid = new THREE.GridHelper(1, 20, 0x4a4a54, 0x26262c);
      grid.visible = false;
      scene.add(grid);
      envTex = buildEnvTexture(THREE, renderer, ENV_PRESETS[state.v3d.envPreset] || ENV_PRESETS.studio);
      skyLum = skyLumFromPreset(THREE, ENV_PRESETS[state.v3d.envPreset] || ENV_PRESETS.studio);
      skyOcc = makeSkyOcclusion(THREE, renderer, scene);
      floorMatSolid.aoMap = skyOcc.texture; // scales only the floor's ambient + environment light
      // The settings panel's environment picker (renderV3DPanel) calls through these — it has
      // no direct access to the renderer/scene living in this closure.

        if (!live) return;

        envTex = tex;
        skyLum = skyLumFromPreset(THREE, ENV_PRESETS[name] || ENV_PRESETS.studio);
        envVersion++;
      };
      onV3DEnvFile = async (file) => {
        const url = URL.createObjectURL(file);

          const tex = await buildEnvTextureFromImage(THREE, renderer, url);
          if (!live || !tex) return;
          if (envTex) envTex.dispose();

      };
      // Shift+right-click-drag rotates all lights + the environment map around the vertical axis.

        e.preventDefault();

        lightDrag = { x: e.clientX, yaw0: state.v3d.lightYaw };

      });
      renderer.domElement.addEventListener("pointermove", (e) => {
        if (!lightDrag) return;

        if (yaw > 180) yaw -= 360; else if (yaw < -180) yaw += 360;

      });

      renderer.domElement.addEventListener("pointercancel", () => { lightDrag = null; });

    renderer.domElement.addEventListener("pointercancel", endExplodeDrag);

    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
    // Match the pan/zoom convention every other viewer here uses (middle-drag pan, right-drag
    // + wheel zoom) — left stays orbit/rotate since 2D viewers have no equivalent for that.
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
    controls.zoomToCursor = true; // zoom toward the pointer, not the orbit target
    bind3dZoom(renderer.domElement, controls);

    // the mesh under the cursor (same selection as the info panel's Meshes list, Ctrl+click it
    // again to deselect); a click on empty space clears whatever is selected (mesh, material or
    // texture). A plain click on the model does nothing.
    let pickDown = null;
    renderer.domElement.addEventListener("pointerdown", (e) => {
      pickDown = e.button === 0 && !e.altKey ? { x: e.clientX, y: e.clientY } : null;
    });

    });
    // Also the annotator's: with its select tool a Ctrl-press is its box-select, so a Ctrl-click that did
    // not become a box on empty drawing space is handed back here (bindAnnot3d pickMesh).
    function pickMeshAt(cx, cy, ctrl){
      const ins = v3dInspect;
      if (!ins || !light || ins.aid !== light.id) return;
      if (!ctrl && !ins.sel) return;

      const ray = new THREE.Raycaster();
      ray.setFromCamera(new THREE.Vector2((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), camera);
      const hit = ray.intersectObjects(ins.meshes.map((m) => m.c).filter((c) => c.visible), false)[0];
      const i = hit ? ins.meshes.findIndex((m) => m.c === hit.object) : -1;
      if (i < 0) setInspectSel(null);
      else if (ctrl) setInspectSel(ins.sel && ins.sel.kind === "mesh" && ins.sel.i === i ? null : { kind: "mesh", i }, true);
    }

    let obj = null, origMats = null, rigRadius = 5;
    let shadeApplied = { base: null, wire: null, xray: null, explode: null, solid: null };

    // Shadow frusta hug the model's bounding sphere (the old ±diagonal box wasted half the map's
    // texels, which showed as stair steps) and are refitted when explode moves parts around.
    const rigCenter = new THREE.Vector3(), rigDir = new THREE.Vector3(), skyDir = new THREE.Vector3();
    let rigR = 1, rigDist = 5, floorSpan = 3, fitVersion = 0, occKey = "", eInd = 0;
    let floorFade = 1, fadeTarget = 1, fadeRange = 1, lastSync = performance.now();

      rigCenter.copy(sphere.center);

        const sc = l.shadow.camera;
        sc.left = -rigR; sc.right = rigR; sc.top = rigR; sc.bottom = -rigR;

    }

      const now = performance.now();

        // target) keeps the model inside its shadow frustum however far the view is panned.
        l.position.copy(rigCenter).addScaledVector(dir, rigDist);
        l.target.position.copy(rigCenter);
        const sizeDeg = v["l" + n + "size"] ?? 0;
        l.shadow.radius = softShadowsPatched ? pcssRadius(l.shadow.camera, sizeDeg) : 1 + sizeDeg / 3;

      // by the direct lights' share, the sky shadow by the ambient + environment share.
      const directShare = eDir / Math.max(1e-6, eDir + eInd);
      floorMatShadow.opacity = v.shadowStrength * directShare * floorFade;
      skyOcc.overlay.visible = showFloor && v.shadowOnly;
      skyOcc.overlay.material.uniforms.uAlpha.value = v.shadowStrength * (1 - directShare) * floorFade;

      scene.environmentIntensity = v.envStrength;
      scene.environmentRotation.y = v.lightYaw * D2R;

        if (shadeApplied.base !== v.shadeBase){
          applyBaseMaterial(THREE, obj, origMats, v.shadeBase, { color: v.solidColor, rough: v.solidRough, metal: v.solidMetal });
          shadeApplied.base = v.shadeBase;
          shadeApplied.xray = null; // materials were just swapped — force xray to reapply onto them
          shadeApplied.solid = null;
        }
        // Solid material settings are live: retint the Solid materials in place when they change.
        const solidKey = v.shadeBase === "solid" ? v.solidColor + "|" + v.solidMetal + "|" + v.solidRough : null;
        if (solidKey && shadeApplied.solid !== solidKey){
          obj.traverse((c) => {
            // (an array: a multi-material mesh with a cut-out part has one Solid material per group)
            for (const m of [].concat((c.isMesh && c.material) || [])){
              if (!m || !m.userData._v3dSolid) continue;
              m.color.set(v.solidColor);
              m.metalness = v.solidMetal;
              m.roughness = v.solidRough;
            }
          });
          shadeApplied.solid = solidKey;
        }
        if (shadeApplied.xray !== v.xrayOn){
          applyXray(obj, v.xrayOn);
          shadeApplied.xray = v.xrayOn;
        }
        if (shadeApplied.wire !== v.wireOn){
          setWireOverlay(THREE, obj, v.wireOn);
          shadeApplied.wire = v.wireOn;
        }
        if (explodeMap && shadeApplied.explode !== v.explode){
