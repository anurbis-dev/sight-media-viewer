  bindAnnoReset(wrap.querySelector("#annoBtn"), [annot, boardAnnot, cmpAnnot]);
  wrap.querySelector("#cmpBtn").onclick = () => compareFromContext();
  wrap.querySelector("#mirBtn").onclick = () => light?.mirror?.();
  wrap.querySelector("#v3dGear").onclick = () => toggleV3DPanel();
  wrap.querySelector("#psdBtn").onclick = () => togglePsdPanel();
  wrap.querySelector("#infoBtn").onclick = () => toggleLightInfo();
  wrap.querySelector("#lightInfo").addEventListener("click", onLightInfoClick);
  attachPanScroll(wrap.querySelector("#lightInfo"));
  attachPanScroll(wrap.querySelector("#psdPanel"));
  wrap.querySelectorAll("#v3dShade [data-base]").forEach((b) => { b.onclick = () => setShadeBase(b.dataset.base); });
  wrap.querySelectorAll("#v3dShade [data-toggle]").forEach((b) => { b.onclick = () => toggleShadeFlag(b.dataset.toggle); });
  wrap.querySelector("#v3dShade [data-act=rotate]").onclick = () => onV3DRotate?.();
  wrap.querySelector("#v3dShade [data-act=anchor]").onclick = () => {
    state.v3d.anchor = state.v3d.anchor === "camera" ? "world" : "camera";
    saveV3D();
    paintShadeButtons();
  };
  wrap.querySelector("#v3dShade [data-act=uv]").onclick = () => toggleUV();
  light.explodeSlider = initThinSlider(wrap.querySelector("#v3dExplode"), {
    value: state.v3d.explode,
    onChange: (v) => { state.v3d.explode = v; saveV3D(); annot.explodeChanged(v); },
  });
  attachPanScroll(wrap.querySelector("#v3dPanel"));
  // The animation bar (shared animator, model3d-core.js createAnimator): play / pause, scrub, clip.
  const animNow = () => (v3dAnim && light && v3dAnim.aid === light.id ? v3dAnim.a : null);
  wrap.querySelector("#v3dAnim [data-act=play]").onclick = () => animNow()?.toggle();
  light.animSlider = initThinSlider(wrap.querySelector("#v3dAnimTrack"), {
    value: 0,
    onChange: (v) => { const A = animNow(); if (A){ A.pause(); A.seek(v * A.duration); } },
  });
  wrap.querySelector("#v3dAnimClip").onchange = (e) => {
    animNow()?.setClip(Number(e.target.value));
    e.target.blur(); // a focused <select> would swallow WASD / F in the 3D view
  };
  const framePop = wrap.querySelector("#framePop");
  const frameBtn = wrap.querySelector("#frameBtn");
  frameBtn.onclick = () => {
    framePop.hidden = !framePop.hidden;
    frameBtn.classList.toggle("on", !framePop.hidden);
  };
  registerAutoClose(framePop, () => { framePop.hidden = true; frameBtn.classList.remove("on"); }, frameBtn);
  framePop.querySelectorAll(".mask-chip").forEach((b) => {
    b.onclick = () => { state.theme.maskShape = b.dataset.mask; putSetting("sight.theme", JSON.stringify(state.theme)); applyLightFrame(); };
  });
  bindSliders(framePop, state.theme, RUNTIME_DEFAULT_THEME, () => { putSetting("sight.theme", JSON.stringify(state.theme)); applyLightFrame(); });
  attachPanScroll(framePop);
  applyLightFrame();
  showInLight(a);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("on")));
}

const LIGHT_HINT = "A annotate · Shift+R turn · Shift+M mirror · MMB pan · RMB zoom · 1–9 zoom · dbl Frame/100% · Esc";
const LIGHT_HINT_VIDEO = "A annotate · Shift+R turn · Shift+M mirror · Click/Space play/pause · Drag scrub (Shift fine) · , . frame · MMB pan · RMB zoom · 1–9 zoom · dbl Frame/100% · Esc";
const ANNOT_HINT = "Annotating · ? = shortcuts · Esc leaves";
function syncLightHint(){
  const el = $("lightHint");
  if (!el || !light) return;
  const a = light.asset;
  if (annot.isOn()){ el.textContent = ANNOT_HINT; return; }
  if (!a) return;
  el.textContent = a.kind === "model3d" ? LIGHT_HINT_3D : a.kind === "video" ? LIGHT_HINT_VIDEO : a.ext === ".psd" ? "D layers · " + LIGHT_HINT : LIGHT_HINT;
}
const LIGHT_HINT_3D = "Shift+A annotate · Drag orbit · MMB pan · RMB zoom · WASD fly · F frame · Ctrl+click select · H / Ctrl+H / Alt+H hide · Ctrl+RMB drag explode · Alt+1–9 save view · 1–9 recall · Esc";

// Each asset kind has its own toolbar in the lightbox (data-tools="<kind>" elements). Only the
// one matching the open asset is shown, so a 3D model's shading bar never appears over an image
// or a font. Controls for other kinds get added the same way — tag the element with its kind.
function syncLightTools(kind){
  light.el.querySelectorAll("[data-tools]").forEach((el) => { el.hidden = el.dataset.tools !== kind; });
}

function showInLight(a, opts = {}){
  if (!light) return;
  flushRotatedThumb();
  // Sequence: follow the clip being shown; any other file (versions, compare's "open") ends the sequence.
  if (light.seq){
    const k = light.seq.list.findIndex((x) => x.id === a.id);
    // (A clip left keeps the marks annotate last reported for it — exact, and newer than a re-read racing its save.)
    // A clip left before annotate had its rows never reported marks: fetch them (no edit to race with yet).
    if (k !== light.seq.i && annot.loading()) seqLoadMarks(light.seq.i);
    if (k < 0) endSequence(); else { light.seq.i = k; seqConvertAhead(light.seq); }
    if (light.seq && !opts.seqPend) light.seq.pendT = light.seq.pendPlay = null; // a jump's landing is only for seqGo's own clip
  }
  releaseMedia(a.kind !== "video");
  // The files dropped to compare stay together while the viewer moves between them (compare's ⤢); another file
  // starts afresh.
  if (light.cmpStack?.length){
    const set = [light.id, ...light.cmpStack];
    light.cmpStack = set.includes(a.id) ? set.filter((id) => id !== a.id) : [];
  }
  light.id = a.id;
  light.snap = null;
  light.scrubT = null;
  light.scrubbing = false;
  light.video = null;
  scrubAudioStop();
  light.vctl = null;
  light.audio = null;
  light.setZoom = null; light.fit = null; // set by attachViewer/mountDocStage below if the new asset supports digit-key zoom
  light.turn = light.mirror = null; // set by attachViewer (pictures, PSD, video)
  const flat = a.kind === "image" || a.kind === "video" || a.ext === ".psd";
  // Icons follow what the file can do: mirror and turn need a flat picture (image, PSD, video); annotation
  // works on those and on 3D models (annotate.js `supported`), so documents and audio hide the A button.
  light.el.querySelector("#mirBtn").hidden = !flat;
  light.el.querySelector("#annoBtn").hidden = !(flat || a.kind === "model3d");
  // The preview is a peek at whatever was under the cursor — it leaves the thumbnail selection
  // alone. The inspector is hidden behind the lightbox, so just stop its media from running.
  insp.querySelectorAll("video, audio").forEach((m) => { try { m.pause(); } catch {} });
  light.el.querySelector(".t").textContent = light.seq ? `Clip ${light.seq.i + 1}/${light.seq.list.length} · ${a.name}` : a.name;
  const bar = light.bar;
  if (bar){
    bar.hidden = a.kind !== "video";
    bar.querySelector(".vcache").style.width = "0%";
    bar.querySelector(".vplay").style.left = "0%";
    bar.querySelector("[data-mem]").textContent = "";
  }
  const is3d = a.kind === "model3d";
  // A synchronous best guess from the extension alone — SPLAT_EXT is unambiguous, but a splat
  // .ply can't be told apart without sniffing its header, which boot3d() does asynchronously and
  // corrects this (and re-renders the panel) once it knows for sure.
  currentAssetIsSplat = SPLAT_EXT.has((a.ext || "").toLowerCase());
  // A PSD is a "design" asset, but only PSDs have layers — they get their own toolbar key.
  syncLightTools(a.ext === ".psd" ? "psd" : a.kind); // gear opens the settings panel — splats get their own panel content
  paintAnimBar(); // (its own rule: only a model with animation clips)
  $("psdPanel").hidden = true;
  $("psdBtn").classList.remove("on");
  if (a.ext === ".psd") loadPsdLayers(a.id);
  if (currentAssetIsSplat) $("v3dShade").hidden = true; // wireframe/x-ray/base-material toggles are mesh-only
  state.v3dPanelOpen = false; // settings panel always starts closed on a fresh 3D asset (off by default)
  $("v3dGear").classList.remove("on");
  $("v3dPanel").hidden = true;
  light.asset = a;
  light.cmpVers = 0; // (annotate reports the new file's versions: onVersions)
  paintCmpBtn();
  syncLightHint();
  light.el.classList.toggle("v3d-loading", is3d); // controls appear once boot3d() has the model up
  if (is3d){ paintShadeButtons(); renderV3DPanel(); }
  light.sceneInfo = null;
  renderLightInfo();
  annot.setAsset(a); // before fillStage: the viewer it mounts binds itself to this asset
  fillStage(light.el.querySelector(".light-frame"), a, opts);
  if (light.seq) paintSeqBar(true);
  syncUvPane(); // the new stage has no UV pane yet; boot3d re-adds it once the model is up
}

// A manual turn (see getModelTurns) changes how the model should look on its card too — re-render
// that thumbnail once the user is done with the lightbox / moves to another asset.
function flushRotatedThumb(){
  if (!light || !light.rotated) return;
  const a = assetById(light.rotated);
  light.rotated = null;
  if (a) ensureModelThumb(a, true);
}

function closeLight(){
  if (!light || light.closing) return;
  flushRotatedThumb();
  vMenuClose();
  light.closing = true;
  try { light.video && light.video.pause(); } catch {}
  try { light.audio && light.audio.pause(); } catch {}
  scrubAudioStop();
  releaseMedia(true);
  // The lightbox fades out over the grid, so its canvas stays on screen for another ~220ms.
  // Losing the WebGL context (releaseRenderer) while it's still visible blanks the canvas to white —
  // the flash on closing a 3D preview. The render loop stops now (the last frame stays put), and the
  // context is released — like the inspector viewer's reboot — only once the fade has finished.
  const releaseGL = dispose3d("light3d", true);
  annot.unmount();
  seqDropBuf();
  seqDropHold();
  const el = light.el;
  const vid = light.video;
  light = null;
  if (state.lightSplit) applyViewDom();  // the library split goes with the lightbox (the board / full grid come back)
  // Fade out the same way it faded in (§.light.on transition) instead of vanishing instantly.
  el.classList.remove("on");
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    el.remove();
    releaseGL?.();
    // Once faded out, cut the stream too so the browser stops pulling the file through the cache.
    if (vid){ vid.removeAttribute("src"); vid.load(); }
  };
  el.addEventListener("transitionend", finish, { once: true });
  setTimeout(finish, 320);
  el._finishClose = finish; // toggleLight() cuts the fade short if a new lightbox opens meanwhile
}

// Lightbox 3D settings panel — off by default (requested: hidden by default), toggled
// by the gear button or D while a 3D model is open. Writes land on state.v3d; the render
// loop in boot3d() re-reads state.v3d every frame, so every change here is live immediately,
// the same way the theme's color pickers already are — no separate "apply" step needed.
// Base shading modes (solid/vertex/textured/normal) are mutually exclusive; wireframe and
// x-ray are independent overlays that can layer on top of any base (feedback: "wireframe and
// transparency should be able to stack on top of any other mode").
// Toolbar icons (stroke = currentColor, so they follow the button's muted / accent color).
const v3dSvg = (body) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const V3D_ICONS = {
  floor: v3dSvg(`<path d="M6 8h16l-4 12H2z" fill="currentColor" fill-opacity=".35"/>`),
  grid: v3dSvg(`<path d="M6 8h16l-4 12H2z"/><path d="M4 14h16"/><path d="m10 8-2 12"/><path d="m16 8-2 12"/>`),
  shadow: v3dSvg(`<circle cx="12" cy="8" r="5"/><ellipse cx="12" cy="19" rx="7" ry="2" fill="currentColor" stroke="none" opacity=".7"/>`),
  world: v3dSvg(`<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>`),
  camera: v3dSvg(`<path d="M14.5 5h-5L8 7H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>`),
};
function paintShadeButtons(){
  const v = state.v3d;
  const el = $("v3dShade");
  el?.querySelectorAll("[data-base]").forEach((b) => b.classList.toggle("on", b.dataset.base === v.shadeBase));
  el?.querySelectorAll("[data-toggle]").forEach((b) => b.classList.toggle("on", !!v[b.dataset.toggle]));
  const anchor = el?.querySelector("[data-act=anchor]");
  if (anchor){
    const cam = v.anchor === "camera";
    anchor.innerHTML = cam ? V3D_ICONS.camera : V3D_ICONS.world;
    anchor.title = cam ? "Lights follow the camera (click: fixed to the world)" : "Lights fixed to the world (click: follow the camera)";
  }
}
function setShadeBase(mode){
  state.v3d.shadeBase = mode;
  saveV3D();
  paintShadeButtons();
}
function toggleShadeFlag(key){
  state.v3d[key] = !state.v3d[key];
  // Shadow-only is a mode of the floor: turning it on shows the floor, turning the floor off ends it.
  if (key === "shadowOnly" && state.v3d.shadowOnly) state.v3d.floor = true;
  if (key === "floor" && !state.v3d.floor) state.v3d.shadowOnly = false;
  saveV3D();
  paintShadeButtons();
}
function toggleV3DPanel(){
  if ($("v3dGear").hidden) return; // not a 3D asset right now
  state.v3dPanelOpen = !state.v3dPanelOpen;
  $("v3dGear").classList.toggle("on", state.v3dPanelOpen);
  $("v3dPanel").hidden = !state.v3dPanelOpen;
}
// Lightbox file info overlay (I / the "i" button, top-left of the stage) — like Blender's viewport
// text info: general facts from the asset row, then per-type sections from /api/assets/{id}/info
// (EXIF, codecs, font tables, PDF metadata, 3D file headers — see app/fileinfo.py), then live data
// from the open viewer: light.sceneInfo (counts, set by boot3d) and, for meshes, v3dInspect's
// Materials / Textures / Meshes lists — collapsible (.sec headers like the sidebar, closed by
// default, remembered in sight.infoOpen), each list scrolls on its own (MMB via attachPanScroll).
// Clicking an entry highlights its polygons (and redraws the UV pane if it is open).
// Stays open across assets and sessions (sight.lightInfo); only fetched while it is visible,
// cached per file version. A failed request is shown, not cached (e.g. a server not restarted yet).
const lightInfoCache = new Map();
const lightInfoErr = new Map();
function lightInfoOn(){
  try { return localStorage.getItem("sight.lightInfo") === "1"; } catch { return false; }
}
function infoSecState(){
  try { return JSON.parse(localStorage.getItem("sight.infoOpen") || "{}") || {}; } catch { return {}; }
}
function toggleLightInfo(){
  if (!light) return;
  const on = !lightInfoOn();
  putSetting("sight.lightInfo", on ? "1" : "0");
  if (!on && v3dInspect?.sel){ v3dInspect.select(null); refreshUv(); }
  renderLightInfo();
}
function infoRows(rows){
  return `<dl>${rows.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}
function inspectSection(ins, kind, title, open){
  const list = kind === "mat" ? ins.materials : kind === "tex" ? ins.textures : ins.meshes;
  if (!list.length) return "";
  const head = `<div class="sec toggle${open ? " open" : ""}" data-sec="${kind}"><span class="sec-title">${title} (${list.length})</span><span class="chev">›</span></div>`;
  if (!open) return head;
  return head + `<div class="li-list" data-list="${kind}"><div class="li-grid">` + list.map((it, i) => {
    const key = kind + ":" + i, src = ins.thumbs.get(key);
    const on = ins.sel && ins.sel.kind === kind && ins.sel.i === i;
    const media = kind === "mesh" ? "" : src ? `<img src="${src}" alt="">` : `<i data-thumb="${key}"></i>`;
    const hid = kind === "mesh" && !it.c.visible;
    return `<button type="button" class="li-item ${kind}${on ? " on" : ""}${hid ? " hid" : ""}" data-kind="${kind}" data-i="${i}" title="${esc(it.name)}">`
      + media + `<span><b>${esc(it.name)}</b><em>${esc(it.sub)}</em></span></button>`;
  }).join("") + `</div></div>`;
}
function renderLightInfo(){
  if (!light) return;
  const el = $("lightInfo"), on = lightInfoOn();
  $("infoBtn").classList.toggle("on", on);
  el.hidden = !on;
  if (!on) return;
  const a = assetById(light.id);
  if (!a){ el.innerHTML = ""; return; }
  const key = a.id + ":" + a.mtime + ":" + a.size;
  const cached = lightInfoCache.get(key);
  const folder = (a.path || "").replace(/[\\/][^\\/]*$/, "");
  let html = `<h4>File</h4>` + infoRows([
    ["Name", a.name],
    ["Type", `${KIND[a.kind] || a.kind} · ${(a.ext || "").slice(1).toUpperCase()}`],
    ["Size", `${bytes(a.size)} (${a.size.toLocaleString("en-US")} bytes)`],
    // For other kinds width/height hold the thumbnail's size; video frame size comes from the server.
    ["Dimensions", a.width && a.height && (a.kind === "image" || a.ext === ".psd") ? `${a.width} × ${a.height} · ${(a.width * a.height / 1e6).toFixed(1)} MP` : null],
    ["Modified", fmtDate(a.mtime)],
    ["Added", fmtDate(a.added_at)],
    ["Folder", folder],
  ]);
  if (cached) html += cached.map((sec) => `<h4>${esc(sec.title)}</h4>` + infoRows(sec.rows)).join("");
  else if (lightInfoErr.has(key)) html += `<div class="err">Details unavailable: ${esc(lightInfoErr.get(key))}</div>`;
  else html += `<div class="wait">Reading file…</div>`;
  const scene = light.sceneInfo;
  if (scene && scene.id === a.id) html += `<h4>${esc(scene.title)}</h4>` + infoRows(scene.rows);
  const ins = v3dInspect && v3dInspect.aid === a.id ? v3dInspect : null;
  if (ins){
    const open = infoSecState();
    html += inspectSection(ins, "mat", "Materials", !!open.mat)
      + inspectSection(ins, "tex", "Textures", !!open.tex)
      + inspectSection(ins, "mesh", "Meshes", !!open.mesh);
    if (ins.materials.length) html += `<div class="li-hint">Click an entry to highlight its polygons · U for UVs</div>`;
  }
  const scroll = el.scrollTop, lists = {};
  el.querySelectorAll(".li-list").forEach((l) => { lists[l.dataset.list] = l.scrollTop; });
  el.innerHTML = html;
  el.scrollTop = scroll;
  el.querySelectorAll(".li-list").forEach((l) => { attachPanScroll(l); l.scrollTop = lists[l.dataset.list] || 0; });
  if (ins) ins.makeThumbs((k, url) => {
    const slot = light && $("lightInfo").querySelector(`i[data-thumb="${k}"]`);
    if (!slot) return;
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    slot.replaceWith(img);
  });
  if (cached || lightInfoErr.has(key) || light.infoLoading === key) return;
  const id = a.id;
  light.infoLoading = key;
  api("/api/assets/" + id + "/info").then((r) => {
    lightInfoCache.set(key, (r && r.sections) || []);
    if (lightInfoCache.size > 200) lightInfoCache.delete(lightInfoCache.keys().next().value);
  }).catch((err) => {
    let msg = String(err && err.message || err);
    if (/Not Found/.test(msg)) msg = "restart Sight to load the new server code";
    lightInfoErr.set(key, msg.slice(0, 160));
    setTimeout(() => lightInfoErr.delete(key), 5000); // retried on the next render after that
  }).finally(() => {
    if (light && light.infoLoading === key) light.infoLoading = null;
    if (light && light.id === id) renderLightInfo();
  });
}
function onLightInfoClick(e){
  const head = e.target.closest(".sec[data-sec]");
  if (head){
    const st = infoSecState();
    st[head.dataset.sec] = !st[head.dataset.sec];
    putSetting("sight.infoOpen", JSON.stringify(st));
    renderLightInfo();
    return;
  }
  const b = e.target.closest(".li-item");
  if (!b || !v3dInspect) return;
  const kind = b.dataset.kind, i = Number(b.dataset.i);
  const cur = v3dInspect.sel;
  setInspectSel(cur && cur.kind === kind && cur.i === i ? null : { kind, i });
}
// The lightbox's animation bar for the model on screen (hidden when it has no clips).
function paintAnimBar(){
  const bar = document.getElementById("v3dAnim");
  if (!bar) return;
  const A = v3dAnim && light && v3dAnim.aid === light.id ? v3dAnim.a : null;
  bar.hidden = !A;
  if (!A) return;
  const play = bar.querySelector("[data-act=play]");
  play.textContent = A.playing ? "❚❚" : "▶";
  play.classList.toggle("on", A.playing);
  const sel = bar.querySelector("#v3dAnimClip");
  if (sel._anim !== A){  // another model: its own clip names
    sel._anim = A;
    sel.innerHTML = A.clips.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join("");
  }
  sel.hidden = A.clips.length < 2;
  sel.value = String(A.clip);
  light?.animSlider?.set(A.duration ? A.time / A.duration : 0);
  bar.querySelector("#v3dAnimTime").textContent = `${A.time.toFixed(2)} / ${A.duration.toFixed(2)} s`;
}
// One entry point for the inspector selection (info panel list clicks, Ctrl+click in the 3D view):
// highlight, list marks, UV pane. `reveal`: open the entry's section in the info panel (if the panel
// is showing) and scroll it into view — used when the pick came from the viewport.
function setInspectSel(sel, reveal){
  const ins = v3dInspect;
  if (!ins) return;
  const cur = ins.sel;
  if (!sel && !cur) return;
  ins.select(sel);
  const el = $("lightInfo");
  if (reveal && sel && lightInfoOn() && !infoSecState()[sel.kind]){
    putSetting("sight.infoOpen", JSON.stringify({ ...infoSecState(), [sel.kind]: true }));
    renderLightInfo();
  }
  el.querySelectorAll(".li-item").forEach((x) => {
    x.classList.toggle("on", !!sel && sel.kind === x.dataset.kind && sel.i === Number(x.dataset.i));
  });
  if (reveal && sel) el.querySelector(`.li-item[data-kind="${sel.kind}"][data-i="${sel.i}"]`)?.scrollIntoView({ block: "nearest" });
  refreshUv();
}
function setSceneInfo(info){
  if (!light || light.id !== info.id) return;
  light.sceneInfo = info;
  renderLightInfo();
}

// Lightbox UV editor (U / the "UV" toolbar button): the stage splits into a UV pane | divider |
// 3D view. The divider is bindSplitDrag (same as the library/board split), the pane is an
// attachViewer image (same pan / zoom / double-click / 1–9 as images; F fits it while the cursor
// is over it — lightPane, same hover rule as activePane). The picture is v3dInspect.renderUV():
// the current selection's UVs (or all) over its base-color texture, redrawn on selection change.
let uvMode = (() => { try { return localStorage.getItem("sight.uvMode") === "1"; } catch { return false; } })();
let uvRatio = (() => { try { return Number(localStorage.getItem("sight.uvSplit")) || 0.5; } catch { return 0.5; } })();
let uvView = null;
function toggleUV(){
  uvMode = !uvMode;
  putSetting("sight.uvMode", uvMode ? "1" : "0");
  syncUvPane();
}
function syncUvPane(){
  if (!light) return;
  light.el.querySelector("#v3dShade [data-act=uv]")?.classList.toggle("on", uvMode);
  const frame = light.el.querySelector(".light-frame");
  const host = frame.querySelector("#light3d");
  const want = uvMode && !!host && !!v3dInspect && v3dInspect.aid === light.id;
  let pane = frame.querySelector("#uvPane");
  if (!want){
    if (pane){
      if (pane._url) URL.revokeObjectURL(pane._url);
      pane.remove();
      frame.querySelector("#uvHandle")?.remove();
    }
    frame.classList.remove("uv-on");
    light.el.style.removeProperty("--uv-left");
    uvView = null;
    return;
  }
  if (!pane){
    pane = document.createElement("div");
    pane.className = "uv-pane";
    pane.id = "uvPane";
    const h = document.createElement("div");
    h.className = "split-handle";
    h.id = "uvHandle";
    h.title = "Drag to resize";
    host.before(pane, h);
    // The info button/panel move into the 3D half so they don't cover the UVs.
    new ResizeObserver(() => {
      if (!light || !pane.isConnected) return;
      light.el.style.setProperty("--uv-left", Math.round(h.getBoundingClientRect().right - light.el.getBoundingClientRect().left) + "px");
    }).observe(pane);
    bindSplitDrag(h, {
      box: () => frame,
      set: (r) => { uvRatio = r; pane.style.flex = `0 0 ${r * 100}%`; },
      end: () => putSetting("sight.uvSplit", String(uvRatio)),
    });
  }
  pane.style.flex = `0 0 ${uvRatio * 100}%`;
  frame.classList.add("uv-on");
  refreshUv();
}
let uvToken = 0;
// Texture channel shown under the UVs (persisted); the UV set is per model (v3dInspect.uvSet).
let uvChan = (() => { try { return localStorage.getItem("sight.uvChan") || "rgb"; } catch { return "rgb"; } })();
const UV_CHANNELS = [["rgb", "RGB"], ["rgba", "RGBA"], ["r", "R"], ["g", "G"], ["b", "B"], ["a", "A"]];
async function refreshUv(){
  const pane = $("uvPane");
  if (!pane || !v3dInspect) return;
  const ins = v3dInspect, token = ++uvToken;
  if (!pane.querySelector(".view")) pane.innerHTML = `<div class="uv-wait">Rendering UVs…</div>`;
  await new Promise((r) => requestAnimationFrame(r));
  if (token !== uvToken || v3dInspect !== ins) return;
  let res = null;
  try { res = await ins.renderUV(ins.sel, uvChan); } catch (err) { console.warn("UV render failed", err); }
  if (token !== uvToken || $("uvPane") !== pane){ if (res) URL.revokeObjectURL(res.url); return; }
  if (!res){ pane.innerHTML = `<div class="uv-wait">No UVs</div>`; uvView = null; return; }
  if (pane._url) URL.revokeObjectURL(pane._url);
  pane._url = res.url;
  uvView = attachViewer(pane, { kind: "image", width: res.w, height: res.h }, res.url, { embedded: true });
  // Bottom toolbar (same look as the 3D shading bar): UV set buttons when the shown meshes have
  // more than one set, and the texture channel picker when there is a texture under the UVs.
  if (res.sets < 2 && !res.hasBg) return;
  const bar = document.createElement("div");
  bar.className = "v3d-shade uv-bar";
  bar.innerHTML = (res.sets > 1 ? Array.from({ length: res.sets }, (_, i) =>
      `<button type="button" class="uv-btn${i === res.set ? " on" : ""}" data-uvset="${i}" title="UV set ${i + 1} (TEXCOORD_${i})">UV${i + 1}</button>`).join("") : "")
    + (res.sets > 1 && res.hasBg ? `<span class="v3d-sep"></span>` : "")
    + (res.hasBg ? `<select title="Texture channel">${UV_CHANNELS.map(([v, l]) => `<option value="${v}"${v === uvChan ? " selected" : ""}>${l}</option>`).join("")}</select>` : "");
  bar.querySelectorAll("[data-uvset]").forEach((b) => {
    b.onclick = () => { ins.uvSet = Number(b.dataset.uvset); refreshUv(); };
  });
  const chan = bar.querySelector("select");
  if (chan) chan.onchange = () => {
    uvChan = chan.value;
    putSetting("sight.uvChan", uvChan);
    chan.blur(); // a focused <select> would swallow WASD / F in the 3D view
    refreshUv();
  };
  pane.append(bar);
}

// Lightbox 3D inspector (set by boot3d for meshes, cleared by dispose3d): the model's original
// materials, textures and meshes (from origMats, so the shading mode doesn't matter), their
// preview images, the polygon highlight and the UV picture.
//  - Materials are counted by identity (cloneModel keeps shared materials shared); instances that
//    still differ but carry the same name and type (FBX/OBJ loaders) are merged into one entry.
//  - Thumbnails and the UV picture are rendered with the viewer's own renderer into a render
//    target (the textures are already on that GPU context) and read back. Render targets come out
//    linear without tone mapping, so sRGB is encoded here by hand (skipped for non-color textures
//    such as normal maps, which are shown raw). Thumbnails go one per frame: a material in a new
//    light setup compiles a new shader program.
//  - Highlight: an overlay mesh per affected mesh, sharing its geometry, added to the *scene* (not
//    the model — applyBaseMaterial/wireframe/x-ray traverse the model and would restyle it). It
//    copies the source's world matrix every frame, so explode and turns carry it along; skinned
//    meshes bind to the same skeleton. Multi-material meshes hide the other groups.
//  - UVs: the geometry drawn with gl_Position = uv (wireframe + faint fill), over the texture on a
//    quad. glTF puts v = 0 at the image top (flipY false); other loaders at the bottom.
const TEX_SLOTS = {
  map: "Base color", normalMap: "Normal", roughnessMap: "Roughness", metalnessMap: "Metalness",
  aoMap: "AO", emissiveMap: "Emissive", alphaMap: "Alpha", bumpMap: "Bump", displacementMap: "Displacement",
  specularMap: "Specular", specularColorMap: "Specular color", specularIntensityMap: "Specular",
  clearcoatMap: "Clearcoat", clearcoatNormalMap: "Clearcoat normal", clearcoatRoughnessMap: "Clearcoat rough.",
  sheenColorMap: "Sheen", sheenRoughnessMap: "Sheen rough.", transmissionMap: "Transmission",
  thicknessMap: "Thickness", iridescenceMap: "Iridescence", anisotropyMap: "Anisotropy", lightMap: "Lightmap",
};
function makeModelInspector(THREE, renderer, scene, obj, origMats, aid){
  const n = (x) => x.toLocaleString("en-US");
  const matEntries = [], matByKey = new Map(), texIndex = new Map(), texList = [], meshList = [];
  let verts = 0, tris = 0, points = 0, skinned = 0, morphs = 0, vcol = false, uv2 = false, hasUV = false;
  const matEntry = (m) => {
    const key = m.name ? m.type + "|" + m.name : m;
    let e = matByKey.get(key);
    if (!e){ e = { rep: m, mats: new Set(), meshes: new Set(), tris: 0 }; matByKey.set(key, e); matEntries.push(e); }
    e.mats.add(m);
    return e;
  };
  obj.traverse((c) => {
    const g = c.geometry;
    if (!g || !g.attributes || !g.attributes.position) return;
    const cnt = g.attributes.position.count;
    if (c.isPoints){ points += cnt; return; }
    if (!c.isMesh) return;
    verts += cnt;
    const total = g.index ? g.index.count : cnt;
    const ctris = Math.floor(total / 3);
    tris += ctris;
    if (c.isSkinnedMesh) skinned++;
    if (g.morphAttributes && g.morphAttributes.position) morphs += g.morphAttributes.position.length;
    if (g.attributes.color) vcol = true;
    if (g.attributes.uv) hasUV = true;
    if (g.attributes.uv1 || g.attributes.uv2) uv2 = true;
    const om = origMats.get(c) || c.material;
    const arr = (Array.isArray(om) ? om : [om]).filter(Boolean);
    const names = new Set();
    arr.forEach((m, gi) => {
      const e = matEntry(m);
      names.add(e.rep.name || "unnamed");
      e.meshes.add(c);
      const grp = Array.isArray(om) && g.groups.find((gr) => gr.materialIndex === gi);
      e.tris += grp ? Math.floor(Math.min(grp.count, total - grp.start) / 3) : ctris;
      for (const [k, v] of Object.entries(m)){
        if (!v || !v.isTexture || k === "envMap") continue;
        let t = texIndex.get(v);
        if (!t){ t = { tex: v, slots: new Set(), mats: new Set() }; texIndex.set(v, t); texList.push(t); }
        t.slots.add(TEX_SLOTS[k] || k.replace(/Map$/, ""));
        t.mats.add(m);
      }
    });
    meshList.push({ c, om, arr, name: c.name || c.parent?.name || `Mesh ${meshList.length + 1}`,
      sub: `${n(ctris)} tris · ${[...names].join(", ")}` });
  });
  const materials = matEntries.map((e, i) => {
    const texCount = texList.filter((t) => [...e.mats].some((m) => t.mats.has(m))).length;
    return { rep: e.rep, mats: e.mats, name: e.rep.name || `Material ${i + 1}`,
      sub: `${n(e.tris)} tris` + (e.meshes.size > 1 ? ` · ${e.meshes.size} meshes` : "") + (texCount ? ` · ${texCount} tex` : "") };
  });
  const textures = texList.map((t, i) => {
    const img = t.tex.image || {};
    const w = img.width || img.videoWidth || 0, h = img.height || img.videoHeight || 0;
    const src = typeof img.src === "string" && !img.src.startsWith("blob:") && !img.src.startsWith("data:") ? decodeURIComponent(img.src.split(/[?#]/)[0].split("/").pop()) : "";
    const slots = [...t.slots].join(", ");
    return { tex: t.tex, mats: t.mats, name: t.tex.name || src || `${slots} ${i + 1}`, w, h,
      sub: (w && h ? `${w}×${h} · ` : "") + slots };
  });
  const meshes = meshList;
  let maxTex = 0;
  for (const t of textures) maxTex = Math.max(maxTex, t.w, t.h);
  const box = new THREE.Box3().setFromObject(obj);
  const d = box.isEmpty() ? null : box.getSize(new THREE.Vector3());
  const f = (x) => Number(x.toPrecision(4)).toString();
  const summary = { id: aid, title: "Scene", rows: [
    ["Meshes", n(meshes.length)],
    ["Vertices", n(verts)],
    ["Triangles", n(tris)],
    ["Points", points ? n(points) : null],
    ["Materials", n(materials.length)],
    ["Textures", textures.length ? `${textures.length}` + (maxTex ? ` (largest ${maxTex}px)` : "") : "None"],
    ["UVs", hasUV ? (uv2 ? "Yes (2 sets)" : "Yes") : "None"],
    ["Vertex colors", vcol ? "Yes" : null],
    ["Skinned meshes", skinned || null],
    ["Morph targets", morphs || null],
    ["Animations", (obj.animations || []).length || null],
    ["Bounds", d ? `${f(d.x)} × ${f(d.y)} × ${f(d.z)}` : null],
  ] };

  // --- render-target readback (thumbnails, UV picture): model3d-core.js ---
  const renderToCanvas = (sc, cam, target, W, H, encode) => readbackCanvas(THREE, renderer, sc, cam, target, W, H, encode);
  const quadFor = (tex, W, H) => textureQuad(THREE, tex, W, H);
  const camQ = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
  camQ.position.z = 1;

  // --- thumbnails ---
  const SIZE = 72;
  const thumbs = new Map();
  let queue = null, disposed = false, rt = null, env = null, ballScene = null, ball = null;
  const cam3 = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
  cam3.position.set(0, 0, 4.1);
  function setup(){
    rt = new THREE.WebGLRenderTarget(SIZE, SIZE, { samples: 4 });
    env = buildEnvTexture(THREE, renderer, ENV_PRESETS.studio);
    ballScene = new THREE.Scene();
    ballScene.environment = env;
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(-2, 2.5, 3);
    ballScene.add(key, new THREE.AmbientLight(0xffffff, env ? 0.15 : 0.8));
    ball = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24));
    ballScene.add(ball);
  }
  function renderOne(kind, i){
    if (kind === "mat"){
      const m = materials[i].rep;
      const use = m.vertexColors ? Object.assign(m.clone(), { vertexColors: false }) : m;
      ball.material = use;
      const url = renderToCanvas(ballScene, cam3, rt, SIZE, SIZE, true).toDataURL("image/png");
      if (use !== m) use.dispose();
      return url;
    }
    const t = textures[i].tex;
    const sc = new THREE.Scene(), q = quadFor(t, SIZE, SIZE);
    sc.add(q);
    const url = renderToCanvas(sc, camQ, rt, SIZE, SIZE, t.colorSpace === THREE.SRGBColorSpace).toDataURL("image/png");
    q.geometry.dispose();
    q.material.dispose();
    return url;
  }
  function makeThumbs(onEach){
    ins.onThumb = onEach;
    if (queue) return;
    queue = [...materials.map((_, i) => ["mat", i]), ...textures.map((_, i) => ["tex", i])].slice(0, 200);
    const step = () => {
      if (disposed || !queue.length) return;
      const [kind, i] = queue.shift();
      try {
        if (!rt) setup();
        const url = renderOne(kind, i);
        thumbs.set(kind + ":" + i, url);
        ins.onThumb?.(kind + ":" + i, url);
      } catch (err) { console.warn("inspector thumbnail failed", err); }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // --- selection -> affected meshes ---
  // [{ c, mats }]: mats = the material instances whose groups count, null = the whole mesh.
  function targets(sel){
    if (!sel) return meshes.map((m) => ({ c: m.c, om: m.om, mats: null }));
    if (sel.kind === "mesh"){ const m = meshes[sel.i]; return m ? [{ c: m.c, om: m.om, mats: null }] : []; }
    const set = sel.kind === "mat" ? materials[sel.i]?.mats : textures[sel.i]?.mats;
    if (!set) return [];
    return meshes.filter((m) => m.arr.some((x) => set.has(x))).map((m) => ({ c: m.c, om: m.om, mats: set }));
  }
  // World-space bounds as the model is right now (explode, turns and hidden meshes included),
  // null if empty. selBox: the selection's visible meshes; modelBox: every visible mesh. Either
  // falls back to all of its meshes when they are all hidden.
  function boxOf(list){
    const box = new THREE.Box3();
    for (const c of list) box.union(new THREE.Box3().setFromObject(c));
    return box.isEmpty() ? null : box;
  }
  const shown = (list) => (list.some((c) => c.visible) ? list.filter((c) => c.visible) : list);
  function selBox(){ return ins.sel ? boxOf(shown(targets(ins.sel).map((t) => t.c))) : null; }
  function modelBox(){ return boxOf(shown(meshes.map((m) => m.c))); }
  // Mesh visibility (H / Ctrl+H / Alt+H): "sel" hides the selected meshes, "others" hides every
  // mesh but the selected ones (and shows those), "none" shows everything. Whole meshes only — a
  // material selected on a multi-material mesh hides the mesh. Returns how many changed.
  function hide(mode){
    const sel = ins.sel ? new Set(targets(ins.sel).map((t) => t.c)) : null;
    if (mode !== "none" && !sel) return 0;
    let n = 0;
    for (const m of meshes){
      const vis = mode === "none" ? true : mode === "sel" ? m.c.visible && !sel.has(m.c) : sel.has(m.c);
      if (m.c.visible !== vis){ m.c.visible = vis; n++; }
    }
    return n;
  }
  const pick = (om, mats, layer, hiddenMat) => Array.isArray(om) ? om.map((m) => (!mats || mats.has(m) ? layer : hiddenMat)) : layer;

  // --- highlight ---
  // The selection's look (model3d-core.js, shared with the phone's mesh pick).
  const accent = HIGHLIGHT_COLOR;
  const [hlMat, hlWire] = highlightMaterials(THREE);
  const hidden = new THREE.MeshBasicMaterial({ visible: false });
  let overlays = [];
  function clearHighlight(){
    for (const h of overlays) h.removeFromParent();
    overlays = [];
  }
  function select(sel){
    ins.sel = sel;
    clearHighlight();
    if (!sel || disposed) return;
    for (const { c, om, mats } of targets(sel)){
      for (const layer of [hlMat, hlWire]){
        const h = meshHighlight(THREE, c, pick(om, mats, layer, hidden));
        scene.add(h);
        overlays.push(h);
      }
    }
  }

  // --- UV picture (model3d-core.js createUvPainter, shared with the phone) ---
  const uvPainter = createUvPainter(THREE, renderer);
  const gltf = [".glb", ".gltf"].includes((assetById(aid)?.ext || "").toLowerCase());
  async function renderUV(sel, chan){
    if (disposed || !hasUV) return null;
    const list = targets(sel).filter((t) => t.c.geometry.attributes.uv);
    if (!list.length) return null;
    // Background: the selection's base color (or the texture itself); with nothing selected, the
    // model's base color only if it has exactly one material.
    let bg = null;
    if (sel?.kind === "tex") bg = textures[sel.i]?.tex;
    else if (sel?.kind === "mat") bg = materials[sel.i]?.rep.map;
    else if (sel?.kind === "mesh") bg = meshes[sel.i]?.arr.find((m) => m.map)?.map;
    else if (materials.length === 1) bg = materials[0].rep.map;
    bg = bg || null;
    const r = uvPainter.paint(list, { bg, set: ins.uvSet || 0, chan, gltf, color: sel ? accent : 0xffffff, fillA: sel ? 0.14 : 0.06, wireA: sel ? 0.9 : 0.55 });
    if (!r) return null;
    const blob = await new Promise((res) => r.canvas.toBlob(res, "image/png"));
    if (!blob || disposed) return null;
    return { url: URL.createObjectURL(blob), w: r.w, h: r.h, sets: r.sets, set: r.set, hasBg: !!bg };
  }

  function dispose(){
    disposed = true;
    clearHighlight();
    hlMat.dispose(); hlWire.dispose(); hidden.dispose();
    rt?.dispose(); env?.dispose();
    ball?.geometry.dispose();
  }
  const ins = { aid, summary, materials, textures, meshes, thumbs, sel: null, uvSet: 0, onThumb: null, makeThumbs, select, selBox, modelBox, hide, renderUV, dispose };
  return ins;
}

// Lightbox PSD layers panel — the button (D) shows the layer list; clicking a layer swaps the

function togglePsdPanel(){

async function loadPsdLayers(id){

    <label class="opt">Preset
      <select id="v3dEnvPreset">
        ${Object.keys(ENV_PRESETS).map((k) => `<option value="${k}" ${v.envPreset === k ? "selected" : ""}>${k[0].toUpperCase()}${k.slice(1)}</option>`).join("")}

// ---- Base auto-close for every popup / menu / widget -----------------------------------------------
// ONE rule for all of them: a popup closes when the cursor moves more than AUTO_CLOSE_MARGIN px away
// from every edge of it. Any new menu or popover gets it by calling registerAutoClose() once — no
// per-widget listeners. Details:
//  - `anchor` (optional): the button that opened it. The cursor over the anchor counts as "near", so
//    a popup that opens beside its button doesn't vanish before the cursor gets to it.
//  - The rule arms once the cursor has been near the popup (or its anchor) and only then can close
//    it, so a popup opened from the keyboard, or away from the cursor, is left alone.
//  - Nothing closes while a mouse button is held: dragging a slider or colour handle inside a popup
//    can wander far outside it.
//  - Entries whose element has been removed from the page are dropped automatically.
//  - Nesting: a popup opened from a control inside another popup (the color picker from the icon
//    picker) keeps its parent open while the cursor is near it, and closes itself once its anchor
//    is no longer on screen (the parent closed).
const AUTO_CLOSE_MARGIN = 25;
const autoCloseEntries = [];
let autoClosePaused = false;  // set while the screen eyedropper is picking, when the cursor is expected far away
function registerAutoClose(el, close, anchor){
  let entry = autoCloseEntries.find((r) => r.el === el);
  if (!entry) autoCloseEntries.push(entry = { el, close, anchor: anchor || null, armed: false });
  return entry;
}
const nearRect = (r, x, y, m) => x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m;
const autoCloseVisible = (r) => r.el.isConnected && !r.el.hidden && r.el.getClientRects().length > 0;
const nearAutoClose = (r, x, y) => nearRect(r.el.getBoundingClientRect(), x, y, AUTO_CLOSE_MARGIN)
  || (r.anchor && r.anchor.isConnected && nearRect(r.anchor.getBoundingClientRect(), x, y, 0));
document.addEventListener("pointermove", (e) => {
  if (e.buttons || autoClosePaused) return;
  const x = e.clientX, y = e.clientY;
  for (let i = autoCloseEntries.length - 1; i >= 0; i--){
    const r = autoCloseEntries[i];
    if (!r.el.isConnected){ autoCloseEntries.splice(i, 1); continue; }
    if (!autoCloseVisible(r)){ r.armed = false; continue; }
    if (r.anchor && !r.anchor.getClientRects().length){ r.armed = false; r.close(); continue; }
    const near = nearAutoClose(r, x, y) || autoCloseEntries.some((o) => o !== r && o.anchor
      && r.el.contains(o.anchor) && autoCloseVisible(o) && nearAutoClose(o, x, y));
    if (near) r.armed = true;
    else if (r.armed){ r.armed = false; r.close(); }
  }
}, { passive: true });

// ---- Color picker ---------------------------------------------------------------------------------
// Every <input type="color"> in the app opens this in-page picker instead of the browser's native
// popup: the native one lives outside the page, so it can't obey the auto-close rule above and
// stayed open after the cursor left it. The input stays the source of truth — the picker writes
// its value and fires "input" while it changes and one "change" when the picker closes (like the
// native dialog), so existing oninput/onchange handlers work unchanged.
const colorPop = $("colorPop");
let cpInput = null, cpStart = "", cpH = 0, cpS = 0, cpV = 0;
const cpEntry = registerAutoClose(colorPop, () => closeColorPop());
function hsvToHex(h, s, v){
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return "#" + [f(5), f(3), f(1)].map((c) => Math.round(c * 255).toString(16).padStart(2, "0")).join("");
}
function hexToHsv(hex){
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  let h = 0;
  if (d) h = 60 * (mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4);
  return [h, mx ? d / mx : 0, mx];
}
function cpRender(){
  const hex = hsvToHex(cpH, cpS, cpV);
  colorPop.querySelector(".cp-sv").style.backgroundColor = `hsl(${cpH} 100% 50%)`;
  colorPop.querySelector(".cp-sv-dot").style.cssText = `left:${cpS * 100}%;top:${(1 - cpV) * 100}%;background:${hex}`;
  colorPop.querySelector(".cp-hue-dot").style.left = (cpH / 360 * 100) + "%";
  colorPop.querySelector(".cp-swatch").style.background = hex;
  const hexInp = colorPop.querySelector(".cp-hex");
  if (document.activeElement !== hexInp) hexInp.value = hex;
}
function cpApply(hex){
  if (!cpInput || cpInput.value === hex) return;
  cpInput.value = hex;
  cpInput.dispatchEvent(new Event("input", { bubbles: true }));
}
function openColorPicker(inp){
  cpInput = inp;
  cpStart = inp.value;
  [cpH, cpS, cpV] = hexToHsv(/^#[0-9a-f]{6}$/i.test(inp.value) ? inp.value : "#000000");
  cpEntry.anchor = inp;
  cpEntry.armed = false;
  colorPop.hidden = false;
  cpRender();
  // Beside the swatch (the swatch counts as "near", so the rule arms as soon as the cursor moves).
  const a = inp.getBoundingClientRect(), w = colorPop.offsetWidth, h = colorPop.offsetHeight;
  let left = a.right + 6;
  if (left + w > window.innerWidth - 8) left = Math.max(8, a.left - w - 6);
  colorPop.style.left = left + "px";
  colorPop.style.top = Math.max(8, Math.min(a.top, window.innerHeight - h - 8)) + "px";
}
function closeColorPop(){
  if (colorPop.hidden) return;
  colorPop.hidden = true;
  const inp = cpInput;
  cpInput = null;
  cpEntry.anchor = null;
  if (inp && inp.value !== cpStart) inp.dispatchEvent(new Event("change", { bubbles: true }));
}
colorPop.innerHTML = `
  <div class="cp-sv"><div class="cp-sv-dot"></div></div>
  <div class="cp-hue"><div class="cp-hue-dot"></div></div>
  <div class="cp-row">
    <span class="cp-swatch"></span>
    <input class="cp-hex" maxlength="7" spellcheck="false">
    ${window.EyeDropper ? `<button type="button" class="btn ghost cp-eye" title="Pick a color from the screen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>` : ""}
  </div>`;
function cpDrag(el, onPos){
  const at = (e) => { const r = el.getBoundingClientRect(); onPos(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))); cpRender(); cpApply(hsvToHex(cpH, cpS, cpV)); };
  el.addEventListener("pointerdown", (e) => { if (e.button) return; e.preventDefault(); el.setPointerCapture(e.pointerId); at(e); });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) at(e); });
}
cpDrag(colorPop.querySelector(".cp-sv"), (x, y) => { cpS = x; cpV = 1 - y; });
cpDrag(colorPop.querySelector(".cp-hue"), (x) => { cpH = x * 360; });
colorPop.querySelector(".cp-hex").addEventListener("input", (e) => {
  let v = e.target.value.trim();
  if (!v.startsWith("#")) v = "#" + v;
  if (!/^#[0-9a-f]{6}$/i.test(v)) return;
  [cpH, cpS, cpV] = hexToHsv(v.toLowerCase());
  cpRender();
  cpApply(v.toLowerCase());
});
colorPop.querySelector(".cp-hex").addEventListener("keydown", (e) => {
  if (hotkey(e, "Enter")){ e.preventDefault(); closeColorPop(); }
});
colorPop.querySelector(".cp-eye")?.addEventListener("click", async () => {
  autoClosePaused = true;
  try {
    const { sRGBHex } = await new EyeDropper().open();
    [cpH, cpS, cpV] = hexToHsv(sRGBHex.toLowerCase());
    cpRender();
    cpApply(sRGBHex.toLowerCase());
  } catch {} finally { autoClosePaused = false; }
});
// Capture phase: runs before the input's own activation, so the native popup never opens.
document.addEventListener("click", (e) => {
  const inp = e.target.closest?.('input[type="color"]');
  if (!inp) return;
  e.preventDefault();
  if (cpInput === inp) closeColorPop();
  else { closeColorPop(); openColorPicker(inp); }
}, true);
document.addEventListener("pointerdown", (e) => {
  if (!colorPop.hidden && !colorPop.contains(e.target) && e.target !== cpInput) closeColorPop();
}, true);

// ---- Select dropdowns --------------------------------------------------------------------------------
// Every <select> opens this in-page list instead of the browser's native one: the native list is an
// OS popup that opens below the control even when that runs past the bottom of the window (the UV
// channel picker sits at the window's bottom edge). This one always stays inside the window — below
// the control when it fits, above it otherwise, scrolling when neither side has room. The <select>
// stays the source of truth: picking sets its value and fires "input" + "change", so existing
// handlers work unchanged. Keyboard use of a focused <select> (arrows) is left native.
const selPop = $("selPop");
let spSelect = null;
const spEntry = registerAutoClose(selPop, () => closeSelectPop());
function closeSelectPop(){
  if (selPop.hidden) return;
  selPop.hidden = true;
  spEntry.anchor = null;
  const sel = spSelect;
  spSelect = null;
  sel?.blur(); // a focused <select> would swallow single-key shortcuts (WASD / F in the 3D view)
}
function openSelectPop(sel){
  spSelect = sel;
  spEntry.anchor = sel;
  spEntry.armed = false;
  selPop.innerHTML = [...sel.options].map((o, i) =>
    `<button type="button" data-i="${i}"${o.selected ? ' class="on"' : ""}${o.disabled ? " disabled" : ""}>${esc(o.textContent)}</button>`).join("");
  selPop.style.maxHeight = "";
  selPop.style.minWidth = "";
  selPop.hidden = false;
  const a = sel.getBoundingClientRect(), M = 8, GAP = 4;
  selPop.style.minWidth = a.width + "px";
  const below = window.innerHeight - a.bottom - GAP - M, above = a.top - GAP - M;
  const h = selPop.offsetHeight, w = selPop.offsetWidth;
  let top;
  if (h <= below) top = a.bottom + GAP;
  else if (h <= above) top = a.top - GAP - h;
  else if (below >= above){ top = a.bottom + GAP; selPop.style.maxHeight = below + "px"; }
  else { top = M; selPop.style.maxHeight = above + "px"; }
  selPop.style.top = top + "px";
  selPop.style.left = Math.max(M, Math.min(a.left, window.innerWidth - w - M)) + "px";
  selPop.querySelector("button.on")?.scrollIntoView({ block: "nearest" });
}
selPop.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b || !spSelect) return;
  const sel = spSelect, i = Number(b.dataset.i);
  closeSelectPop();
  if (sel.selectedIndex === i) return;
  sel.selectedIndex = i;
  sel.dispatchEvent(new Event("input", { bubbles: true }));
  sel.dispatchEvent(new Event("change", { bubbles: true }));
});
// Capture phase + preventDefault on mousedown: that is what opens the native list.
document.addEventListener("mousedown", (e) => {
  const sel = e.target.closest?.("select");
  if (!sel || sel.multiple || sel.size > 1 || sel.disabled || e.button !== 0) return;
  e.preventDefault();
  if (spSelect === sel){ closeSelectPop(); return; }
  closeSelectPop();
  openSelectPop(sel);
}, true);
document.addEventListener("pointerdown", (e) => {
  if (!selPop.hidden && !selPop.contains(e.target) && e.target !== spSelect) closeSelectPop();
}, true);
window.addEventListener("resize", closeSelectPop);
document.addEventListener("scroll", (e) => { if (!selPop.contains(e.target)) closeSelectPop(); }, true);

const pathParts = (p) => p.replace(/[\\/]+$/, "").split(/[\\/]/);
const pathSep = (p) => (p.match(/[\\/]/) || ["/"])[0];
const parentDir = (p) => { const parts = pathParts(p); parts.pop(); return parts.join(pathSep(p)); };
// Deepest folder containing every path in `dirs` ("" if they share nothing, e.g. two drives).
function commonDir(dirs){
  let parts = pathParts(dirs[0]);
  for (const d of dirs.slice(1)){
    const q = pathParts(d);
    let i = 0;
    while (i < parts.length && i < q.length && parts[i] === q[i]) i++;
    parts = parts.slice(0, i);
  }
  return parts.join(pathSep(dirs[0]));
}

// Opens the source's folder tree in the sidebar down to `dir` so its row shows (highlighted).
// Returns the tree's own spelling of `dir` — the row's "on" check compares it to state.filter.folder.
async function expandTreeTo(src, dir){
  const want = pathParts(dir);
  let cur = src.path;
  state.sourceTree.expandedSources.add(src.id);
  for (let depth = pathParts(src.path).length; depth < want.length; depth++){
    await loadFolderTree(src.id, cur);
    const next = (state.sourceTree.dirsCache.get(src.id + "|" + cur) || []).find((d) => pathParts(d.path)[depth] === want[depth]);
    if (!next) return dir;
    if (depth < want.length - 1) state.sourceTree.expandedPaths.add(src.id + "|" + next.path);
    cur = next.path;
  }
  return cur;
}

// Waits until the grid has loaded every wanted item (pull() pages in 400 at a time) or the list ended.
async function waitForItems(want, ms = 10000){
  const t0 = performance.now();
  while (performance.now() - t0 < ms){
    const have = state.items.reduce((n, a) => n + (want.has(a.id) ? 1 : 0), 0);
    if (have === want.size) return;
    if (!state.pulling && !wantReset && state.total != null && state.items.length >= state.total) return;
    await new Promise((r) => setTimeout(r, 50));
  }
}

function scrollGridToIndex(i){
  const L = layout();
  let top, h;
  if (L.mode === "masonry"){
    const p = computeMasonry(L).positions[i];
    if (!p) return;
    top = p.y; h = p.h;
  } else {
    top = Math.floor(i / L.cols) * L.rowH; h = L.rowH;
  }
  grid.scrollTop = Math.max(0, L.pad + top + h / 2 - grid.clientHeight / 2);
  scheduleRender();
}

// Jumps the library grid to where the given assets live and selects them. They can come from
// different folders, depths and sources (a board mixes anything), so the view narrows to the
// deepest folder holding all of them — the folder filter is recursive: one folder -> that folder;
// several under one source -> their common ancestor (the source row if that is the source root);
// several sources -> All. Search and type filters are cleared so nothing hides the files.
async function findInFolder(assetIds){
  const recs = (await Promise.all(assetIds.map((id) => api("/api/assets/" + id).catch(() => null)))).filter(Boolean);
  const found = recs.filter((a) => a.status !== "excluded");
  if (!found.length){
    alert(recs.length ? "These files are in folders excluded from the library." : "These files are no longer in the library.");
    return;
  }
  let patch = {};
  const sids = [...new Set(found.map((a) => a.source_id))];
  const src = sids.length === 1 ? (state.meta.sources || []).find((s) => s.id === sids[0]) : null;
  if (src){
    const dir = commonDir(found.map((a) => parentDir(a.path)));
    if (pathParts(dir).length <= pathParts(src.path).length) patch = { source: src.id };
    else patch = { folder: await expandTreeTo(src, dir) };
  }
  $("q").value = "";
  state.filter.q = "";
  if (state.view === "canvas" && !state.canvasSplit) toggleCanvasSplit();
  applyFilter(patch);
  nav.querySelector(".src-folder.on, .src-row.on")?.scrollIntoView({ block: "nearest" });
  const want = new Set(found.map((a) => a.id));
  await waitForItems(want);
  const hits = state.items.filter((a) => want.has(a.id)).map((a) => a.id);
  if (!hits.length) return;
  selectSet(hits, hits[0]);
  scrollGridToIndex(state.items.findIndex((a) => a.id === hits[0]));
}

// Icon shapes are drawn with `stroke="currentColor"` (see ICONS/renderIconSvg), so they're
// masks in the sense the feature was asked for: pick any tint via the color input, no separate
// "colored version" of each icon needed. `mode: "tag"` adds a "Color only" action, since a tag's
// default look is just a colored dot (see tagColor()) — no icon shape required.
//
// Closes itself one extra way, on top of the usual click-away and the base cursor-distance rule
// (registerAutoClose): letting go of the native color dialog (its "change" event fires once, on
// release — "input" fires continuously while still dragging inside it, which must NOT close this).
function showIconPicker(x, y, { icon, color, mode = "collection", onPick, onColorOnly, onClear }){
  const menu = $("ctx");
  menu.className = "ctx icon-picker";
  const curColor = /^#[0-9a-f]{6}$/i.test(color || "") ? color : "#8b8b8b";
  let selectedIcon = icon || (mode === "collection" ? "folder" : mode === "board" ? "pin" : "");
  menu.innerHTML = `
    <div class="ip-color">
      <input type="color" id="ipColor" value="${curColor}">
      ${mode === "tag" ? `<button type="button" class="btn ghost" data-act="coloronly">Color only</button>` : ""}
      <button type="button" class="btn ghost" data-act="clear">Reset</button>
    </div>
    <div class="ip-body">
      ${ICON_CATEGORIES.map((cat) => `
        <div class="sub">${esc(cat.label)}</div>
        <div class="ip-grid">
          ${cat.ids.map((id) => `<button type="button" class="ip-btn${id === icon ? " on" : ""}" data-icon="${id}" title="${id}">${renderIconSvg(id, "currentColor", 18)}</button>`).join("")}
        </div>
      `).join("")}
    </div>
  `;
  menu.hidden = false;
  menu.style.left = "0px";
  menu.style.top = "0px";
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
  const colorInp = $("ipColor");
  menu.onclick = (e) => {
    if (e.target.closest('[data-act="clear"]')){ hideCtx(); onClear(); return; }
    if (e.target.closest('[data-act="coloronly"]')){ hideCtx(); onColorOnly(colorInp.value); return; }
    const iconBtn = e.target.closest(".ip-btn");
    if (iconBtn){ selectedIcon = iconBtn.dataset.icon; hideCtx(); onPick(selectedIcon, colorInp.value); return; }
  };
  colorInp.addEventListener("change", () => {
    if (selectedIcon){ hideCtx(); onPick(selectedIcon, colorInp.value); }
    else if (mode === "tag"){ hideCtx(); onColorOnly(colorInp.value); }
  });
}

function lightStep(dir, e){
  if (!light) return;
  const i = state.items.findIndex(x => x.id === light.id);
  if (i < 0) return;
  const next = state.items[i + dir];
  if (next && !heavyKeyBlocked(e, next)) showInLight(next);
}

// Up/Down in the lightbox move one row of the thumbnail grid, keeping the column — so the
// preview follows the grid the user is looking at behind it. Off the end of a shorter last row
// it lands on the last item; already on the last row it stays put.
function lightStepRow(dir, e){
  if (!light) return;
  const n = state.items.length;
  const i = state.items.findIndex(x => x.id === light.id);
  if (i < 0) return;
  const cols = layout().cols;
  let j = i + dir * cols;
  if (j < 0) return;
  if (j >= n){
    if (Math.floor(i / cols) >= Math.floor((n - 1) / cols)) return;
    j = n - 1;
  }
  if (!heavyKeyBlocked(e, state.items[j])) showInLight(state.items[j]);
}

function isFilterEmpty(f){
  return !f.q && !f.kind && !f.source && !f.tag && !f.collection && !f.folder && !f.review;
}

function filterParams(f){
  const p = new URLSearchParams();
  if (f.q) p.set("q", f.q);
  if (f.kind) p.set("kind", f.kind);
  if (f.source) p.set("source", f.source);
  if (f.tag) p.set("tag", f.tag);
  if (f.collection) p.set("collection", f.collection);
  if (f.folder) p.set("folder", f.folder);
  if (f.review) p.set("review", f.review);
  return p;
}

// Drops the library entries of files that were moved or deleted (the "Missing" list). Only the
// index is cleaned — nothing on disk is touched — but their tags/ratings/notes go with them.
// `scoped`: limit the drop to missing files matching the current view's filter (kind/source/tag/
// collection/folder/search) instead of the whole library — used by the grid's right-click menu,
// which works even with nothing selected, unlike the sidebar/palette's library-wide clean-up.
async function purgeMissing(scoped){
  const f = scoped ? state.filter : {};
  const narrowed = scoped && !isFilterEmpty(f);
  let n;
  if (narrowed){
    const p = filterParams(f);
    p.set("missing", "1");
    p.set("limit", "0");
    try {
      n = (await api("/api/assets?" + p)).total || 0;
    } catch (err){
      alert("Could not check missing files: " + err.message);
      return;
    }
  } else {
    n = (state.meta.counts || {}).missing || 0;
  }
  if (!n){ alert("No missing files" + (narrowed ? " in the current view." : ".")); return; }
  const scopeNote = narrowed ? " matching the current view" : "";
  if (!confirm(`Remove ${n} missing file${n === 1 ? "" : "s"}${scopeNote} from the library?\n\nOnly the library entries are removed — their tags, ratings, notes and collection membership are lost. Nothing on disk is touched.`)) return;
  let r;
  try {
    r = await api("/api/missing/purge", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(scoped ? { q: f.q, kind: f.kind, source: f.source, tag: f.tag, collection: f.collection, folder: f.folder } : {}),
    });
  } catch (err){
    alert("Could not clean up missing files: " + err.message);
    return;
  }
  const gone = new Set(r.ids || []);
  state.selectedIds = state.selectedIds.filter((id) => !gone.has(id));
  syncTouchSel();
  await refreshMeta();
  if (state.filter.missing && !(state.meta.counts || {}).missing) state.filter.missing = false;
  renderNav();
  resetList();
  renderInsp();
  const notes = [];
  if (r.moved) notes.push(`${r.moved} moved file${r.moved === 1 ? "" : "s"} matched to their new location — tags/rating/thumbnail carried over.`);
  if (r.skipped) notes.push(`${r.skipped} missing file${r.skipped === 1 ? " was" : "s were"} kept: their source folder can't be reached right now (offline drive?).`);
  if (notes.length) alert(notes.join("\n"));
}

// After the source list changed — a folder removed here or in another window, or taken over by an
// added folder that contains it: a filter on a source / folder that is gone falls back to All, and
// cards and selected ids of files that left the library go (pull(false) only appends, so the grid
// would keep showing them).
function syncSourcesView(){
  const srcs = state.meta.sources || [];
  const ids = new Set(srcs.map((s) => s.id));
  const f = state.filter;
  const goneFilter = (f.source && !ids.has(f.source))
    || (f.folder && !srcs.some((s) => f.folder === s.path || isUnder(f.folder, s.path)
      || (/[\\/]$/.test(s.path) && f.folder.startsWith(s.path)))); // a drive root ends with the separator
  const stale = state.items.some((a) => a.source_id && !ids.has(a.source_id));
  if (!goneFilter && !stale) return;
  const byId = new Map(state.items.map((a) => [a.id, a])); // Ctrl+A may select tens of thousands
  const keep = state.selectedIds.filter((id) => { const a = byId.get(id); return !a || ids.has(a.source_id); });
  if (keep.length !== state.selectedIds.length) selectSet(keep, keep.includes(state.selected) ? state.selected : null);
  for (const sid of [...state.sourceTree.expandedSources]) if (!ids.has(sid)) state.sourceTree.expandedSources.delete(sid);
  if (goneFilter) applyFilter({});
  else resetList();
}

function params(){
  const f = state.filter;
  const p = new URLSearchParams();
  if (f.q) p.set("q", f.q);
  if (f.kind) p.set("kind", f.kind);
  if (f.source) p.set("source", f.source);
  if (f.tag) p.set("tag", f.tag);
  if (f.missing) p.set("missing", "1");
  if (f.collection) p.set("collection", f.collection);
  if (f.folder) p.set("folder", f.folder);
  if (f.review) p.set("review", f.review);
  if (state.sort.key){ p.set("sort", state.sort.key); p.set("order", state.sort.dir); }
  return p;
}

let wantReset = false;
async function pull(fromStart){
  if (fromStart) wantReset = true;
  if (state.pulling) return;
  state.pulling = true;
  try {
    while (true){
      const reset = wantReset;
      wantReset = false;
      if (reset){ state.items = []; loadedIds = new Set(); }
      const p = params();
      p.set("offset", String(state.items.length));
      p.set("limit", "400");
      const data = await api("/api/assets?" + p);
      const items = data.items || [];
      if (data.total != null) state.total = data.total;
      if (reset){ state.items = items; loadedIds = new Set(items.map(x => x.id)); staleIds.clear(); }
      else {
        // A row already loaded (the order shifted under a scan) is skipped here and keeps its
        // stale mark, so it is re-read by id when it shows.
        for (const a of items) if (!loadedIds.has(a.id)){ state.items.push(a); loadedIds.add(a.id); staleIds.delete(a.id); }
      }
      scheduleRender();
      renderStatus();
      if (wantReset) continue;
      if (items.length === 400){
        clearTimeout(pullTimer);
        pullTimer = setTimeout(() => pull(false), 16);
      }
      break;
    }
  } finally {
    state.pulling = false;
    if (wantReset) pull(true);
  }
}

function resetList(){
  grid.scrollTop = 0;
  pull(true);
}

// pull(false) only ever fetches PAST the end of what's already loaded (offset=state.items.length)
// — it grows the list but never refreshes items already in it. So a status flip on an already-
// loaded asset (a live-watched file going missing, a reconciled move, a tag edit from elsewhere)
// would not reach the grid on its own. refreshItems() re-reads the cards on screen plus the
// selection by id (/api/assets/by-ids) and marks every other loaded item stale; a stale item is
// re-read when its card comes on screen (refreshStaleVisible from renderGrid). Fields are updated
// in place — same array, same objects — so cardPool / scroll position aren't disturbed.
// (It used to re-read offset 0 … items.length, which the server caps at 800 rows: anything past
// #800 never refreshed.)
let refreshItemsT = 0;
const staleIds = new Set();
let loadedIds = new Set();  // ids in state.items (pull() is the only writer of the list)
function scheduleRefreshItems(){
  clearTimeout(refreshItemsT);
  refreshItemsT = setTimeout(refreshItems, 150);
}
async function refreshItems(){
  if (!state.items.length) return;
  for (const x of state.items) staleIds.add(x.id);
  const p = params();
  p.set("offset", "0");
  p.set("limit", "1");
  const total = api("/api/assets?" + p).then((d) => { if (d.total != null){ state.total = d.total; renderStatus(); } }).catch(() => {});
  // What is on screen now: the cards, the inspector's item and the lightbox's. The rest of the
  // selection (Ctrl+A can select tens of thousands) stays stale until its cards show.
  const now = [...cardPool.keys(), state.selected, light?.id].filter(Boolean);
  await Promise.all([refreshIds([...new Set(now)]), total]);
}
async function refreshIds(ids){
  // At most 2000 per request (the server reads 5000); the rest stays stale for a later pass.
  ids = ids.filter((id) => staleIds.has(id)).slice(0, 2000);
  if (!ids.length) return;
  for (const id of ids) staleIds.delete(id);
  let data;
  try {
    data = await api("/api/assets/by-ids", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ids }) });
  } catch {
    for (const id of ids) staleIds.add(id);
    return;
  }
  const byId = new Map((data.items || []).map(a => [a.id, a]));
  let resized = false;
  for (const x of state.items){
    const fresh = byId.get(x.id);
    if (!fresh) continue;
    // The server only sends thumb_v when has_thumb is true, so a plain Object.assign below
    // would leave a stale thumb_v (and seenThumb entry) in place when a thumbnail is dropped —
    // e.g. a watched file going missing then reappearing with different content, which resets
    // has_thumb server-side but not these client caches. thumbUrl() would then keep pointing at
    // the OLD ?v= URL, which the browser's immutable HTTP cache happily keeps serving forever.
    // Clearing them here lets the placeholder show and the normal "thumb needed" pickup
    // (reportVisible) request a fresh one under a new, uncached URL.
    if (!fresh.has_thumb && (x.has_thumb || x.thumb_v)){
      seenThumb.delete(x.id);
      delete x.thumb_v;
    }
    if (fresh.width !== x.width || fresh.height !== x.height) resized = true;
    Object.assign(x, fresh);
  }
  if (resized) masonryCache = null; // the masonry signature alone won't catch a size change
  scheduleRender();
  renderStatus();
}
let staleT = 0;
function refreshStaleVisible(visItems){
  if (!staleIds.size || !visItems.some((a) => staleIds.has(a.id))) return;
  clearTimeout(staleT);
  staleT = setTimeout(() => refreshIds([...cardPool.keys()]), 120);
}

function applyThumb(id, hasThumb, animated, v, width, height){
  const a = assetById(id);
  if (hasThumb){
    seenThumb.add(id);
    if (a){ a.has_thumb = 1; if (v) a.thumb_v = v; }
  }
  if (animated != null && a) a.animated = animated ? 1 : 0;
  // Dimensions are usually still unknown when this asset first landed in state.items (they're
  // only discovered by thumbnailing) — masonry sizes every card off them, so learning them now
  // can shift this card and everything below it in its column, not just its own thumbnail.
  let resized = false;
  if (a && width && height && (a.width !== width || a.height !== height)){
    a.width = width;
    a.height = height;
    resized = true;
  }
  const el = cardPool.get(id);
  if (el) fillThumb(el, a || { id, has_thumb: hasThumb ? 1 : 0, thumb_v: v, kind: "image" }, true);
  // The inspector preview is the thumbnail — refresh it in place when a new one lands.
  const slot = hasThumb && a ? insp.querySelector(`[data-thumb="${id}"]`) : null;
  if (slot){
    slot.innerHTML = `<img src="${thumbSrc(a)}" alt="" />`;
    watchPixelation(slot.firstElementChild);
  }
  if (resized){ masonryCache = null; scheduleRender(); }
}

async function renderPalette(q){
  const query = q.trim().toLowerCase();
  const reqId = ++paletteReq;
  const filterLocal = (items) => query ? items.filter((i) => i.label.toLowerCase().includes(query)) : items;
  const sections = [];
  const actions = filterLocal(paletteActions());
  if (actions.length) sections.push(["Actions", actions]);
  const kinds = filterLocal(paletteKinds());
  if (kinds.length) sections.push(["Show", kinds]);
  const cols = filterLocal(paletteCollections());
  if (cols.length) sections.push(["Collections", cols]);
  const boards = filterLocal(paletteBoards());
  if (boards.length) sections.push(["Canvas", boards]);

  let files = [];
  if (query){
    try {
      const data = await api("/api/assets?q=" + encodeURIComponent(query) + "&limit=50");
      files = (data.items || []).map((a) => ({
        label: a.name, hint: KIND[a.kind] || a.kind, run: () => { selectOnly(a.id); toggleLight(a); },
      }));
    } catch {}
  } else {

      label: a.name, hint: KIND[a.kind] || a.kind, run: () => { selectOnly(a.id); toggleLight(a); },
    }));

}

  if (!paletteItems.length){
    list.innerHTML = `<div class="palette-empty">No matches</div>`;

  }
  paletteSel = Math.min(paletteSel, paletteItems.length - 1);

// The event stream is one long-lived connection per window, and a browser allows only 6 per host
// for all its windows together (video streams and thumbnail fetches share them): a hidden window
// gives its stream up and catches up when it shows again (every "hello" after the first one —
// also after an automatic reconnect — re-reads the state and the cards on screen).
let eventSrc = null, eventHellos = 0, eventHideT = 0;
function connectEvents(){
  if (eventSrc) return;
  const es = eventSrc = new EventSource("/api/events");
  es.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === "hello"){
      if (eventHellos++){ scheduleMeta(); scheduleRefreshItems(); pull(false); canvasCtl?.refreshMissing({ sweep: "all" }); }
      return;
    }
    if (ev.type === "thumb" && ev.id) applyThumb(ev.id, ev.hasThumb !== false, ev.animated, ev.v, ev.width, ev.height);
    // A board's placeholder / picture-less cards re-check their files (debounced in canvas.js).
    if (ev.type === "thumb" && ev.id) canvasCtl?.refreshMissing({ id: ev.id });
    else if (ev.type === "source") canvasCtl?.refreshMissing({ sweep: "all" });
    else if (ev.type === "scan" && !ev.scanning) canvasCtl?.refreshMissing({ sweep: "bad" });
    if (ev.type === "batch"){ scheduleRefreshItems(); scheduleMeta(); pull(false); renderStatus(); }
    if (ev.type === "scan" || ev.type === "source"){
      scheduleMeta();
      if (ev.scanning || ev.type === "source") pull(false);
    }
  };
}
document.addEventListener("visibilitychange", () => {
  clearTimeout(eventHideT);
  if (!document.hidden){ connectEvents(); return; }
  eventHideT = setTimeout(() => {  // not on a quick switch away and back
    if (!document.hidden || !eventSrc) return;
    eventSrc.close();
    eventSrc = null;
  }, 10000);
});

// A Blender-style number slider (see interface_handlers.c's UI_BTYPE_NUM_SLIDER, and
// https://cladd.io/react/components/number-scrubber/ for a web recreation of the same
// interaction): a click that doesn't move the pointer opens text-edit (not a double-click);
// dragging scrubs at a fixed px→value rate rather than mapping the container's width to the
// range, so there is no artificial "drag this far and you've hit the limit" — you can keep
// dragging (or just type) past the visible fill to reach any value up to `max`. Shift
// re-locks the drag anchor at the current pointer position when toggled mid-drag, so
// switching to fine precision never jumps the value. The 16px edge zones nudge by one step;
// right-click resets to the control's default.
// Hovered slider's reset callback — Backspace resets it, mirroring Blender's "hover a field,
// press Backspace to clear it" shortcut (in addition to the existing right-click reset).
let hoveredSliderReset = null;
function initSlider(container, { min, max, step = 1, value, unit = "", onChange, resetValue }){
  container.innerHTML = `<button type="button" class="arr l" tabindex="-1">‹</button><div class="fill"></div><div class="lbl"></div><button type="button" class="arr r" tabindex="-1">›</button>`;
  const fill = container.querySelector(".fill");
  const lbl = container.querySelector(".lbl");
  const arrL = container.querySelector(".arr.l");
  const arrR = container.querySelector(".arr.r");
  const places = step < 1 ? 2 : 0;
  const range = Math.max(1e-6, max - min);
  const rate = range / 300; // px → value at normal speed; Shift drops this ×~8 for precision
  function clamp(v){ return Math.min(max, Math.max(min, v)); }
  function paint(){
    const frac = (value - min) / range;
    fill.style.width = Math.min(100, Math.max(0, frac * 100)) + "%";
    lbl.textContent = value.toFixed(places) + unit;
  }
  function setValue(v, commit){
    value = clamp(Math.round(v / step) * step);
    paint();
    if (commit) onChange(value);
  }
  paint();

  const nudge = (dir) => (e) => { e.stopPropagation(); setValue(value + dir * step, true); };
  arrL.onclick = nudge(-1);
  arrR.onclick = nudge(1);
  [arrL, arrR].forEach((b) => b.addEventListener("pointerdown", (e) => e.stopPropagation()));

  let dragging = false, moved = false, startX = 0, anchorX = 0, anchorV = 0, wasShift = false;
  container.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.tagName === "INPUT" || e.target === arrL || e.target === arrR) return;
    dragging = true;
    moved = false;
    startX = anchorX = e.clientX;
    anchorV = value;
    wasShift = e.shiftKey;
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    if (Math.abs(e.clientX - startX) > 3) moved = true;
    if (!moved) return;
    const shift = e.shiftKey;
    if (shift !== wasShift){ anchorX = e.clientX; anchorV = value; wasShift = shift; }
    setValue(anchorV + (e.clientX - anchorX) * rate * (shift ? 0.12 : 1), true);
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    if (!moved) beginEdit();
  }
  container.addEventListener("pointerup", endDrag);
  container.addEventListener("pointercancel", () => { dragging = false; });
  container.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    if (resetValue != null) setValue(resetValue, true);
  });
  const myReset = () => { if (resetValue != null) setValue(resetValue, true); };
  container.addEventListener("pointerenter", () => { hoveredSliderReset = myReset; });
  container.addEventListener("pointerleave", () => { if (hoveredSliderReset === myReset) hoveredSliderReset = null; });

  function beginEdit(){
    const inp = document.createElement("input");
    inp.type = "number";
    inp.step = String(step);
    inp.value = String(value);
    container.appendChild(inp);
    inp.focus();
    inp.select();
    const done = (commit) => {
      if (commit){
        const v = Number(inp.value);
        if (Number.isFinite(v)) setValue(v, true);
      }
      inp.remove();
    };
    inp.onblur = () => done(true);
    inp.onkeydown = (ev) => {
      ev.stopPropagation();
      if (ev.key === "Enter") done(true);
      if (ev.key === "Escape") done(false);
    };
  }
}

// Generic: binds every [data-slider] under `root` to a field on `store`, resetting (on
// right-click) to the same field on `defaults`. `onSet(key, value)` persists + reacts.
// A thin strip with no draggable "dot" — click/drag anywhere along it sets the value
// proportionally to position, like a compact progress scrubber (used for the lightbox's
// explode-parts control, which lives in the tight bottom-center button row).
function initThinSlider(container, { min = 0, max = 1, value = 0, onChange }){
  const fill = container.querySelector("i");
  function clamp(v){ return Math.min(max, Math.max(min, v)); }
  function paint(){ fill.style.width = (Math.min(1, Math.max(0, (value - min) / (max - min))) * 100) + "%"; }
  function setValue(v, commit){
    value = clamp(v);
    paint();
    if (commit) onChange(value);
  }
  paint();
  function valueAt(e){
    const r = container.getBoundingClientRect();
    const pad = 6;
    const t = (e.clientX - r.left - pad) / Math.max(1, r.width - pad * 2);
    return min + Math.min(1, Math.max(0, t)) * (max - min);
  }
  let dragging = false;
  container.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    dragging = true;
    container.setPointerCapture(e.pointerId);
    setValue(valueAt(e), true);
  });
  container.addEventListener("pointermove", (e) => { if (dragging) setValue(valueAt(e), true); });
  const end = () => { dragging = false; };
  container.addEventListener("pointerup", end);
  container.addEventListener("pointercancel", end);
  container.addEventListener("contextmenu", (e) => { e.preventDefault(); setValue(min, true); });
  return { set: (v) => setValue(v, false) };
}

function bindSliders(root, store, defaults, onSet){
  root.querySelectorAll("[data-slider]").forEach((el) => {
    const key = el.dataset.slider;
    initSlider(el, {
      min: Number(el.dataset.min), max: Number(el.dataset.max), step: Number(el.dataset.step) || 1,
      value: Number(store[key]), unit: el.dataset.unit || "",
      resetValue: defaults ? defaults[key] : undefined,
      onChange: (v) => { store[key] = v; onSet(key, v); },
    });
  });
}

const sideScrollEl = $("sideScroll");
// Shared middle-click-drag-to-scroll behavior — every scrollable menu/panel gets it, not just
// the sidebar (feedback: "any menu should work like the base one").
function attachPanScroll(el){
  if (!el) return;
  let drag = null;
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 1 || e._panScroll) return; // a nested scroller (list inside a panel) already took it
    e._panScroll = true;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, sl: el.scrollLeft, st: el.scrollTop };
    el.classList.add("panning");
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!drag) return;
    el.scrollTop = drag.st - (e.clientY - drag.y);
    el.scrollLeft = drag.sl - (e.clientX - drag.x);
  });
  const end = () => { drag = null; el.classList.remove("panning"); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
}
attachPanScroll(sideScrollEl);
