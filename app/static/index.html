    }

    let live = true, camRig = null, lastT = performance.now();
    const loop = () => {
      if (!live) return;
      requestAnimationFrame(loop);
      syncSize();
      const now = performance.now(), dt = (now - lastT) / 1000;
      lastT = now;
      if (isLightbox && v3dAnim && v3dAnim.aid === aid && v3dAnim.a.tick(dt)) paintAnimBar();
      if (isLightbox) syncRig();
      camRig?.step(performance.now());
      controls.update();
      renderer.render(scene, camera);
    };
    loop();
    threeCtls.set(elId, { renderer, stop(){ live = false; } });
    if (!MODEL_EXT_LOADERS.has(low)){
      el.innerHTML = `<div class="ph">${low.slice(1) || "3D"} — open in an external viewer</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    try {
      obj = await loadModelCached(THREE, url, ext, onModelProgress, aid);
    } catch (err){
      // Said on the plate: left alone, a failed load would keep the loading state for ever, with no reason.
      console.warn("3D viewer", err);
      live = false; // stops the render loop: a canvas that will not show a model needs no frames
      el.innerHTML = `<div class="ph">${esc(low.slice(1) || "3D")} — could not open: ${esc(String(err?.message || err))}</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    if (!live) return; // viewer was torn down (asset switched / lightbox closed) mid-load
    if (!obj){
      el.innerHTML = `<div class="ph">${low.slice(1) || "3D"} — open in an external viewer</div>`;
      lightEl?.classList.remove("v3d-loading");
      return;
    }
    const basePose = { q: obj.quaternion.clone(), p: obj.position.clone() };
    const applyTurns = (n) => applyModelTurns(THREE, obj, basePose, n);
    applyTurns(getModelTurns(aid));
    frameObject3d(THREE, obj, scene, camera, controls.target);
    // Floor / grid / shadow frustum all depend on the model's bounds, so a turn re-runs this.
    const fitRig = () => {
      // The floor sits under the assembled model: measure with explode undone, then put it back.
      if (explodeMap){ applyExplode(explodeMap, 0); obj.updateMatrixWorld(true); }
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3()).length() || 1;
      const c = box.getCenter(new THREE.Vector3());
      rigRadius = size * 1.6;
      floorSpan = size * 3;
      fadeRange = size * 0.15;
      floor.geometry.dispose();
      floor.geometry = new THREE.PlaneGeometry(floorSpan, floorSpan);
      floor.position.set(c.x, box.min.y, c.z);
      scene.remove(grid);
      grid.geometry.dispose();
      grid.material.dispose();
      grid = new THREE.GridHelper(floorSpan, 20, 0x4a4a54, 0x26262c);
      grid.material.transparent = true;
      grid.visible = state.v3d.grid;
      grid.position.set(c.x, box.min.y + Math.max(0.001, size * 0.002), c.z);
      scene.add(grid);
      if (explodeMap){ applyExplode(explodeMap, state.v3d.explode); onExplodeMoved(); }
      else fitShadows(box);
      return { box, size };
    };
    if (isLightbox){
      const { box, size } = fitRig();
      // A turn re-frames the model, so it also moves the camera rig's "frame all" home. Saved
      // views that were taken at a different turn call this to put the model back that way first.
      const turnTo = (n) => {
        if (!live || !light) return;
        setModelTurns(aid, n);
        light.rotated = aid;
        applyTurns(n);
        camRig.setHome(frameObject3d(THREE, obj, scene, camera, controls.target));
        fitRig();
      };
      camRig = makeCameraRig(THREE, camera, controls, aid, { get: () => getModelTurns(aid), set: turnTo });
      camRig.setHome(size);
      v3dCam = camRig;
      bindAnnot3d(el, aid, camRig, controls, (ex) => renderStill(renderer, scene, camera, explodeMap, ex, onExplodeMoved), pickMeshAt);
      onV3DRotate = () => turnTo((getModelTurns(aid) + 1) & 3);
      obj.traverse((c) => { if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; } });
      skyOcc.markCasters(obj);
      origMats = new Map();
      obj.traverse((c) => { if (c.isMesh) origMats.set(c, c.material); });
      // Explode rig (explosion graph per assembly level, see buildExplodeRig). Solved with the
      // model assembled; turns are applied above it, so they never invalidate it.
      explodeMap = buildExplodeRig(THREE, obj);
      // A single-mesh model has nothing to pull apart — hide the slider (and its separator) rather
      // than offer a control that does nothing.
      $("v3dExplode").hidden = !explodeMap;
      $("v3dExplodeSep").hidden = !explodeMap;
      // Animation clips (glTF / FBX): played by the shared animator, which keeps the explode rig on the pose.
      v3dAnim?.a.dispose();
      const anim = createAnimator(THREE, obj, { rig: () => explodeMap, explode: () => state.v3d.explode, onChange: () => paintAnimBar() });
      v3dAnim = anim ? { aid, a: anim } : null;
      paintAnimBar();
      shadeApplied = { base: null, wire: null, xray: null, explode: null, solid: null }; // force the next syncRig() to (re)apply everything
      syncRig();
      v3dInspect = makeModelInspector(THREE, renderer, scene, obj, origMats, aid);
      setSceneInfo(v3dInspect.summary);
      syncUvPane();
    }
    // Keep the thumbnail cover up until the model has actually been drawn. The first frame with the
    // model compiles its shaders and uploads its textures, which blocks the main thread; lifting the
    // cover before that showed an empty grey canvas for as long as it took. The render loop's rAF is
    // queued before ours, so it draws the model in the first of these frames, under the cover.
    // (Not renderer.compileAsync(): it never resolved here for a large model — the live loop swaps
    // material programs while it polls the old ones.)
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (!live) return;
    endLoading();
  } catch (err) {
    el.innerHTML = `<div class="ph">3D failed to load</div>`;
    if (el.isConnected) lightEl?.classList.remove("v3d-loading");
    console.warn(err);
  }
}

// The lightbox 3D viewer hands its camera and a synchronous frame grab to the annotator.
// Zoom in the 3D viewer follows the viewer-wide zoom settings (Speed, Drag axis, Invert) like the 2D viewers.
// OrbitControls' own wheel / right-drag / pinch dolly is switched off (enableZoom); the wheel and a plain
// right-drag call dollyOut with the same factor the 2D viewers compute (exp of the same delta), so one setting
// changes every zoom. A two-finger pinch is handled here too (speed only: its direction is the finger gap).
// The Ctrl / Shift right-drags are taken by their own handlers, which are bound before this one and stop the
// event; any other right-drag (Alt included) zooms here, as OrbitControls' right-drag did.
// Zoom toward the pointer for the splat viewer (controls.zoomToCursor), as OrbitControls did.
function bind3dZoom(el, controls){
  controls.enableZoom = false;
  let rdrag = null;
  const touches = new Map(); // touch pointers: id -> {x, y}; two of them are a pinch
  let pinch = 0;             // finger gap at the last pinch step
  const dolly = (d) => controls.dollyOut(Math.exp(d)); // d > 0 zooms in, as in the 2D viewers
  const anchor = (x, y) => { if (controls.zoomToCursor) controls._updateZoomParameters?.(x, y); };
  const gap = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  el.addEventListener("wheel", (e) => {
    e.preventDefault();
    const t = state.theme;
    anchor(e.clientX, e.clientY);
    dolly((t.zoomInvert ? e.deltaY : -e.deltaY) * 0.0016 * (t.zoomSpeed ?? 1));
  }, { passive: false });
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch"){
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 2) pinch = gap();
      return;
    }
    if (e.button !== 2) return;
    e.preventDefault();
    rdrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" && touches.has(e.pointerId)){
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 2){
        const g = gap();
        if (pinch > 0 && g > 0){
          const [a, b] = [...touches.values()];
          anchor((a.x + b.x) / 2, (a.y + b.y) / 2);
          dolly(Math.log(g / pinch) * (state.theme.zoomSpeed ?? 1));
        }
        pinch = g;
      }
      return;
    }
    if (!rdrag || e.pointerId !== rdrag.id) return;
    const t = state.theme;
    const raw = t.zoomAxis === "x" ? (e.clientX - rdrag.x) : (rdrag.y - e.clientY);
    rdrag.x = e.clientX; rdrag.y = e.clientY;
    anchor(e.clientX, e.clientY);
    dolly((t.zoomInvert ? -raw : raw) * 0.012 * (t.zoomSpeed ?? 1));
  });
  const endPointer = (e) => {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinch = 0;
    if (rdrag && rdrag.id === e.pointerId) rdrag = null;
  };
  el.addEventListener("pointerup", endPointer);
  el.addEventListener("pointercancel", endPointer);
}

// The frame an annotator still is taken from. `ex` is a view's explode (null / undefined: the live amount).
// When it differs, the parts are moved there and `refit` (the floor fade and shadow fit of boot3d) is run,
// and both are put back in `finally`, so an exception cannot leave the viewer at the view's explode.
function renderStill(renderer, scene, camera, rig, ex, refit){
  const live = state.v3d.explode;
  const alt = !!rig && ex != null && ex !== live;
  if (!alt){ renderer.render(scene, camera); return renderer.domElement; }
  try {
    applyExplode(rig, ex);
    refit?.();
    renderer.render(scene, camera);
  } finally {
    applyExplode(rig, live);
    refit?.();
  }
  return renderer.domElement;
}

function bindAnnot3d(host, aid, rig, controls, capture, pick){
  const damp = controls.enableDamping;
  annot.bind3d({
    aid, host, capture,
    getCam: () => rig.getView(),
    setCam: (v) => rig.setView(v),
    // The meshes hidden by H / Ctrl+H / Alt+H, as their indices in the inspector's list (null: no inspector
    // for this model). A view records them; setHidden shows a view's meshes again.
    getHidden: () => {
      if (!v3dInspect || v3dInspect.aid !== aid) return null;
      return v3dInspect.meshes.flatMap((m, i) => (m.c.visible ? [] : [i]));
    },
    setHidden: (list) => {
      if (!v3dInspect || v3dInspect.aid !== aid) return;
      v3dInspect.meshes.forEach((m, i) => { m.c.visible = !list.includes(i); });
      renderLightInfo();
    },
    // While annotating, orbit damping is off: the camera must stop exactly where the drawing was made.
    annotating: (on) => { controls.enableDamping = on ? false : damp; },
    // The viewer's click pick at a client point: (cx, cy, ctrl) — ctrl picks, otherwise only clears (absent for splats).
    pickMesh: pick || undefined,
    // The animation pose ({clip, t}; null: no clips) — a view keeps the one it was made at (FORMAT.md ctx.anim).
    getAnim: () => (v3dAnim && v3dAnim.aid === aid ? v3dAnim.a.state() : null),
    setAnim: (s) => { if (v3dAnim && v3dAnim.aid === aid) v3dAnim.a.set(s); },
    // fn() with the model at pose s, then the live pose back (playing again if it was).
    withAnim: (s, fn) => {
      const A = v3dAnim && v3dAnim.aid === aid ? v3dAnim.a : null;
      if (!A || !s) return fn();
      const keep = { clip: A.clip, t: A.time, playing: A.playing };
      A.set(s);
      try { return fn(); } finally { A.set(keep); if (keep.playing) A.play(); }
    },
    getAnimState: () => { const A = v3dAnim && v3dAnim.aid === aid ? v3dAnim.a : null; return A ? { clip: A.clip, t: A.time, playing: A.playing } : null; },
    pauseAnim: () => { if (v3dAnim && v3dAnim.aid === aid) v3dAnim.a.pause(); },
    setAnimState: (k) => { const A = v3dAnim && v3dAnim.aid === aid ? v3dAnim.a : null; if (A && k){ A.set(k); if (k.playing) A.play(); } },
  });
}

// Where a library file's picture comes from when it becomes a reference image (annotate.js storeRef): the file
// itself when the browser decodes it, the PSD's composite, else its thumbnail (video, TIFF, 3D…).
const REF_FULL_EXT = new Set([".jpg", ".jpeg", ".png", ".gif", ".webp", ".bmp", ".avif", ".svg"]);
function pictureSource(a){
  if (!a || a.status === "missing") return null;
  if (a.ext === ".psd") return { src: `/api/psd/${a.id}/preview`, alpha: true };
  if (a.kind === "image" && REF_FULL_EXT.has(a.ext)) return { src: `/api/file/${a.id}`, alpha: /png|gif|webp|svg|avif/.test(a.ext) };
  if (a.has_thumb || seenThumb.has(a.id)) return { src: thumbUrl(a), alpha: false };
  return null;
}
function previewSrc(a){
  if (a.ext === ".psd") return `/api/psd/${a.id}/preview`;
  if (a.kind === "image" || a.kind === "video") return `/api/file/${a.id}`;
  return "";
}

const TEXT_EXT = new Set([
  ".txt", ".md", ".markdown", ".csv", ".tsv", ".json", ".xml", ".yaml", ".yml",
  ".log", ".ini", ".cfg", ".toml",
]);

function fillStage(stage, a, opts = {}){
  dispose3d("light3d");
  const src = previewSrc(a);
  if (a.kind === "video" || a.kind === "image" || a.ext === ".psd"){
    attachViewer(stage, a, src, opts.adopt ? { adopt: opts.adopt } : {});
  } else if (a.kind === "model3d"){
    stage.innerHTML = `<div class="view3d" id="light3d"></div>`;
    boot3d("light3d", a.id, `/api/file/${a.id}`, a.ext, thumbSrc(a), stage.firstElementChild);
  } else if (a.kind === "audio"){
    stage.innerHTML = `<div class="wave wave-light" id="waveLight"></div>`;
    mountWave("waveLight", a.id, `/api/file/${a.id}`, true);
  } else if (a.kind === "font"){
    mountFontStage(stage, a);
  } else if (a.kind === "document"){
    mountDocStage(stage, a);
  } else {
    stage.innerHTML = `<p>${esc(a.name)}</p>`;
  }
}

async function mountFontStage(stage, a){
  // A stage can be re-mounted for another asset while a font is still loading, so keep a direct
  // element reference (and check isConnected) rather than looking the host up by id.
  const family = "sight-font-" + a.id;
  stage.innerHTML = `<div class="font-view"><div class="font-loading">Loading font…</div></div>`;
  const host = stage.querySelector(".font-view");
  try {
    const face = new FontFace(family, `url("/api/file/${a.id}")`);
    await face.load();
    document.fonts.add(face);
    if (!host.isConnected) return; // this stage moved on to a different asset meanwhile
    host.innerHTML = `
      <div class="font-sample" style="font-family:'${family}';font-size:64px;">Aa Bb Cc</div>
      <div class="font-sample" style="font-family:'${family}';font-size:26px;">The quick brown fox jumps over the lazy dog — 0123456789</div>
      <div class="font-sample" style="font-family:'${family}';font-size:15px;">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789 !@#$%^&amp;*()</div>
      <div class="font-name">${esc(a.name)}</div>
    `;
  } catch (err) {
    if (host.isConnected) host.innerHTML = `<div class="ph">font failed to load</div>`;
    console.warn(err);
  }
}

async function mountDocStage(stage, a){
  if (a.ext === ".pdf"){
    stage.innerHTML = `<embed class="doc-pdf" src="/api/file/${a.id}" type="application/pdf" />`;
    return;
  }
  if (TEXT_EXT.has(a.ext)){
    // Same simultaneous inspector+lightbox mount concern as mountFontStage above — use a
    // direct element reference rather than an id lookup.
    stage.innerHTML = `<div class="doc-text-wrap"><pre class="doc-text">Loading…</pre><div class="view-hud"></div></div>`;
    const wrap = stage.querySelector(".doc-text-wrap");
    const pre = stage.querySelector(".doc-text");
    const hud = stage.querySelector(".view-hud");
    const BASE_FONT = 13; // matches the .doc-text default in the stylesheet — scale is relative to it
    const ts = { scale: 1, zoomD: null };
    function applyTextZoom(){
      pre.style.fontSize = (BASE_FONT * ts.scale) + "px";
      hud.textContent = Math.abs(ts.scale - 1) < 0.012 ? "100%" : Math.round(ts.scale * 100) + "%";
    }
    function setTextScale(n){
      ts.scale = Math.min(12, Math.max(0.2, n));
      applyTextZoom();
    }
    // Right-click-drag resizes the text the same way it zooms images/video (same axis/speed/invert
    // settings); middle-click-drag scrolls it, same as MMB pan there — both use pointer capture
    // instead of the browser's own middle-click autoscroll, so it's a held drag, not a click-toggle.
    // Left-button drag is untouched either way, so selecting text still works as normal, and the
    // wheel is left alone too — it scrolls the text natively, exactly as it did before this.
    let panD = null;
    wrap.addEventListener("pointerdown", (e) => {
      if (e.button === 1){
        e.preventDefault();
        wrap.setPointerCapture(e.pointerId);
        panD = { x: e.clientX, y: e.clientY, sl: pre.scrollLeft, st: pre.scrollTop };
        return;
      }
      if (e.button !== 2) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      ts.zoomD = { x: e.clientX, y: e.clientY, scale: ts.scale };
    });
    wrap.addEventListener("pointermove", (e) => {
      if (panD){
        pre.scrollLeft = panD.sl - (e.clientX - panD.x);
        pre.scrollTop = panD.st - (e.clientY - panD.y);
        return;
      }
      if (!ts.zoomD) return;
      const t = state.theme;
      const raw = t.zoomAxis === "x" ? (e.clientX - ts.zoomD.x) : (ts.zoomD.y - e.clientY);
      const d = (t.zoomInvert ? -raw : raw) * 0.012 * (t.zoomSpeed ?? 1);
      setTextScale(ts.zoomD.scale * Math.exp(d));
    });
    const endDrag = () => { ts.zoomD = null; panD = null; };
    wrap.addEventListener("pointerup", endDrag);
    wrap.addEventListener("pointercancel", endDrag);
    wrap.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
    wrap.addEventListener("contextmenu", (e) => e.preventDefault());
    applyTextZoom();
    // Only claim the lightbox's digit-key zoom if this mount IS the open lightbox (this function
    // also renders the Inspector sidebar's document preview independently of the lightbox).
    if (light && light.id === a.id) light.setZoom = (n) => setTextScale(n);
    try {
      const data = await api(`/api/text/${a.id}`);
      if (!pre.isConnected) return;
      pre.textContent = data.text + (data.truncated ? "\n\n… (truncated)" : "");
    } catch {
      if (pre.isConnected) pre.textContent = "Failed to load preview.";
    }
    return;
  }
  stage.innerHTML = `<div class="ph">${esc((a.ext || "").slice(1) || "document")} — open in an external viewer</div>`;
}

function fmtTime(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}

// Waveform audio player — a hidden <audio> for playback, bars for visualization + click/drag
// seek. Peaks come from /api/waveform/{id} (ffmpeg-decoded server-side, cached to disk).
async function mountWave(hostId, aid, src, autoplay){
  const host = document.getElementById(hostId);
  if (!host) return;
  const stale = host.querySelector(".wave-audio");
  if (stale){ try { stale.pause(); } catch {} } // a still-playing previous track would keep going in the background otherwise
  host.innerHTML = `
    <div class="wave-body">
      <div class="wave-bars"><span class="wave-loading">decoding…</span></div>
      <div class="wave-time"><span data-cur>0:00</span><span data-dur>0:00</span></div>
    </div>
    <button type="button" class="wave-play" aria-label="Play">▶</button>
    <audio class="wave-audio" src="${src}" preload="metadata"${autoplay ? " autoplay" : ""}></audio>
  `;
  const audio = host.querySelector(".wave-audio");
  const btn = host.querySelector(".wave-play");
  const barsEl = host.querySelector(".wave-bars");
  barsEl.classList.toggle("mode-vertical", state.theme.waveMode === "vertical");
  const curEl = host.querySelector("[data-cur]");
  const durEl = host.querySelector("[data-dur]");
  let peaks = null, duration = 0, dragging = false, rafId = 0;
  if (light) light.audio = audio;

  function isCurrent(){ return host.querySelector(".wave-audio") === audio; }
  function paint(){
    if (!peaks) return;
    const ratio = duration ? Math.min(1, audio.currentTime / duration) : 0;
    barsEl.querySelectorAll(".wb").forEach((el, i) => {
      el.classList.toggle("on", peaks.length > 1 ? i / (peaks.length - 1) <= ratio : ratio >= 1);
    });
    curEl.textContent = fmtTime(audio.currentTime);
  }
  // A plain "paint on timeupdate" was the cause of the reported jumpy playback — timeupdate
  // fires only a few times a second, so bars advanced in visible batches. Driving the same
  // paint() from requestAnimationFrame while playing sweeps through bars smoothly instead.
  function tick(){
    if (!isCurrent()){ rafId = 0; return; }
    paint();
    rafId = requestAnimationFrame(tick);
  }
  function startTick(){ if (!rafId) rafId = requestAnimationFrame(tick); }
  function stopTick(){ if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

  btn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
  audio.onplay = () => { btn.textContent = "⏸"; startTick(); };
  audio.onpause = () => { btn.textContent = "▶"; stopTick(); paint(); };
  audio.onended = () => { stopTick(); paint(); };
  audio.onloadedmetadata = () => { if (audio.duration) duration = audio.duration; durEl.textContent = fmtTime(duration); };
  audio.ontimeupdate = () => { if (audio.paused) paint(); };

  function seekFromEvent(e){
    if (!duration) return;
    const rect = barsEl.getBoundingClientRect();
    const ratio = rect.width ? Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) : 0;
    audio.currentTime = ratio * duration;
    curEl.textContent = fmtTime(audio.currentTime);
    paint();
  }
  barsEl.addEventListener("pointerdown", (e) => { dragging = true; barsEl.setPointerCapture(e.pointerId); seekFromEvent(e); });
  barsEl.addEventListener("pointermove", (e) => { if (dragging) seekFromEvent(e); });
  barsEl.addEventListener("pointerup", () => { dragging = false; });
  barsEl.addEventListener("pointercancel", () => { dragging = false; });

  try {
    const data = await api("/api/waveform/" + aid);
    if (host.querySelector(".wave-audio") !== audio) return; // host was re-mounted meanwhile
    peaks = data.peaks || [];
    if (data.durationMs) duration = data.durationMs / 1000;
    durEl.textContent = fmtTime(duration);
    barsEl.innerHTML = peaks.map((p) => `<i class="wb" style="height:${Math.max(6, Math.round(p / 255 * 100))}%"></i>`).join("");
    paint();
  } catch {
    barsEl.innerHTML = `<span class="wave-loading">no waveform</span>`;
  }
}
// The video's RAM cache lives on the server (SlidingVideoCache): the player tells it where the
// playhead is and how much RAM the settings allow, it keeps a window of the file filled around that
// spot (sliding with the playhead) and reports the window back — that is the green strip on the
// timeline. The <video> itself just streams /api/file/<id>, which is served through that window,
// so playback starts at once instead of after the whole file has been downloaded.
function applyCacheSnap(snap){
  if (!light || !snap) return;
  light.snap = snap;
  paintVBar();
}
function paintVBar(){
  if (!light?.bar) return;
  const el = light.video;
  const dur = el && Number.isFinite(el.duration) ? el.duration : 0;
  const cur = light.scrubT != null ? light.scrubT : (el ? el.currentTime : 0);
  vposPaint(cur, dur);
  const play = light.bar.querySelector(".vplay");
  play.style.left = (dur > 0 ? (cur / dur) * 100 : 0) + "%";
  const cache = light.bar.querySelector(".vcache");
  const snap = light.snap;
  if (snap && snap.size > 0 && (snap.end > snap.start)){

const vCurAsset = () => (light.seq ? light.seq.list[light.seq.i] : (assetById(light.id) || canvasCtl?.assetOf?.(light.id)));
// The sequence's clips: { d: seconds, fps, known } (known: both its duration and its frame rate are).
function vClips(){
  const s = light.seq, durs = seqDurs();
  return durs.map((d, k) => { const f = vClipFps(s.list[k], k === s.i); return { d, fps: f.fps, known: f.known && s.durs[k] > 0 }; });
}
// Where the playhead is, in this clip or (global) in the whole sequence: seconds t of d, frame f of df.
function vPos(cur, dur){
  if (!vGlobal()){
    const c = vClipFps(vCurAsset(), true);
    return { t: cur, d: dur, f: Math.floor(cur * c.fps + 1e-6), df: Math.round(dur * c.fps), known: c.known };
  }
  const cl = vClips(), i = light.seq.i, cc = Math.min(cur, cl[i].d);
  let t = 0, f = 0, d = 0, df = 0, known = true;
  cl.forEach((c, k) => {
    const n = Math.round(c.d * c.fps);
    if (k < i){ t += c.d; f += n; }
    d += c.d; df += n; known = known && c.known;
  });
  return { t: t + cc, d, f: f + Math.floor(cc * cl[i].fps + 1e-6), df, known };
}
function vposText(t, f, known){
  const fs = `${known ? "" : "≈"}f ${f}`;
  return vpos.disp === "frame" ? fs : vpos.disp === "both" ? `${fmtTime(t)} · ${fs}` : fmtTime(t);
}
function vposPaint(cur, dur){
  const bar = light.bar, p = vPos(cur, dur);
  const ce = bar.querySelector("[data-cur]");
  if (!light.posEdit){
    const s = vposText(p.t, p.f, p.known);
    if (ce.textContent !== s) ce.textContent = s;
    ce.style.minWidth = vpos.disp === "time" ? "" : vpos.disp === "frame" ? "56px" : "104px";
  }
  const de = bar.querySelector("[data-dur]"), ds = vposText(p.d, p.df, p.known);
  if (de.textContent !== ds) de.textContent = ds;
  vLoopPaint();
}
// Jump to what was typed: "f120", or a bare number (a frame; seconds when the display is plain time), or "1:05" /
// "1:05.5" / "12s" (a time). With the sequence's time base it is the sequence's frame / time.
function vposJump(txt){
  const el = light?.video;
  if (!el || !(el.duration > 0)) return false;
  const s = txt.trim().replace(",", ".");
  let frame = null, sec = null, m;
  if ((m = /^f\s*(\d+)$/i.exec(s))) frame = Number(m[1]);
  else if ((m = /^(\d+(?:\.\d+)?)\s*s$/i.exec(s))) sec = Number(m[1]);
  else if (/^\d+(:\d{1,2}){1,2}(\.\d+)?$/.test(s)) sec = s.split(":").reduce((a, x) => a * 60 + Number(x), 0);
  else if (/^\d+(\.\d+)?$/.test(s)){ if (vpos.disp === "time") sec = Number(s); else frame = Math.round(Number(s)); }
  else return false;
  if (vGlobal()){
    let k, t;
    if (sec != null) ({ k, t } = seqLocate(sec));
    else {
      const cl = vClips();
      for (k = 0; k < cl.length - 1; k++){ const nf = Math.round(cl[k].d * cl[k].fps); if (frame < nf) break; frame -= nf; }
      t = Math.min((frame + 0.01) / cl[k].fps, Math.max(0, cl[k].d - 0.5 / cl[k].fps));
    }
    seqGo(k, t, !el.paused);
    return true;
  }
  const fps = vClipFps(vCurAsset(), true).fps;
  if (sec == null) sec = (frame + 0.01) / fps;
  light.vctl.seek(Math.min(sec, Math.max(0, el.duration - 0.5 / fps)));
  return true;
}
function vposEdit(){
  const bar = light?.bar, el = light?.video;
  if (!bar || !el || light.posEdit || !(el.duration > 0)) return;
  const ce = bar.querySelector("[data-cur]");
  const p = vPos(light.scrubT != null ? light.scrubT : el.currentTime, el.duration);
  const inp = document.createElement("input");
  inp.className = "vtime-in"; inp.type = "text"; inp.spellcheck = false; inp.autocomplete = "off";
  inp.setAttribute("aria-label", "Jump to frame");
  inp.value = vpos.disp === "time" ? fmtTime(p.t) : String(p.f);
  inp.title = "Enter: jump · Esc: cancel — a frame number, or a time such as 1:05 or 12s";
  let done = false;
  // A press anywhere else ends the edit (a press on the track / stage never moves the focus: it is prevented).
  const away = (e) => { if (e.target !== inp) close(); };
  const close = () => {
    if (done) return;
    done = true;
    document.removeEventListener("pointerdown", away, true);
    inp.remove(); ce.hidden = false;
    if (light?.posEdit === inp){ light.posEdit = null; paintVBar(); }
  };
  inp.addEventListener("keydown", (e) => {
    e.stopPropagation();   // Esc / arrows / Space are this field's, not the lightbox's
    if (e.key === "Enter"){ e.preventDefault(); if (vposJump(inp.value)) close(); else inp.style.borderColor = "#d9534f"; }
    else if (e.key === "Escape"){ e.preventDefault(); close(); }
  });
  inp.addEventListener("input", () => { inp.style.borderColor = ""; });
  inp.addEventListener("blur", close);
  ["pointerdown", "click", "dblclick"].forEach((n) => inp.addEventListener(n, (e) => e.stopPropagation()));
  light.posEdit = inp;
  ce.hidden = true;
  ce.after(inp);
  document.addEventListener("pointerdown", away, true);
  inp.focus(); inp.select();
}
let vMenuOff = null;

function vMenuClose(){ if (vMenuOff) vMenuOff(); }
function bindVBarUi(bar){
  const snd = bar.querySelector("[data-snd]"), loop = bar.querySelector("[data-loop]"), cur = bar.querySelector("[data-cur]");
  let v0 = 1;
  vgesture(snd, {
    begin: () => { v0 = vIsMuted() ? 0 : vsnd.vol; },
    move: (dy) => vSetVol(v0 - dy / 110),
    tap: () => vToggleMute(),
    ctx: () => vToggleScrubSnd(),

function bindVBar(el, seekVideo, beginScrub, endScrub){
  const bar = light?.bar;
  if (!bar) return;
  const track = bar.querySelector(".vtrack");
  const tAt = (e) => {
    const r = track.getBoundingClientRect();
    const dur = el.duration || 0;
    return Math.min(dur, Math.max(0, ((e.clientX - r.left) / Math.max(r.width, 1)) * dur));
  };
  const onMove = (e) => seekVideo(tAt(e));
  const onUp = (e) => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    if (e.type === "pointerup") seekVideo(tAt(e));
    endScrub();
  };
  track.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    beginScrub();
    seekVideo(tAt(e));
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };
}

// ---- Sequence: selected videos played back to back (docs/PLAN-viewer.md) ---------------------------
// light.seq = { list: [asset], i, durs: [s], loop, buf, pendT, pendPlay }. Each clip is shown by the normal
// showInLight path, so its own notes / drawings / fps come with it (annotate.js setAsset). The next clip is
// preloaded in a hidden muted <video> (seqPreload) and adopted by attachViewer at the cut (seqAdvance).
// pendT / pendPlay: where a clip opened by seqGo lands once its metadata is in (pendT < 0 = from the end).
// One pass over the items (assetById is a linear find; paintSelection runs on every marquee move).
function seqCandidates(ids){
  if (!ids.length) return [];
  const byId = new Map(state.items.map((a) => [a.id, a]));
  return ids.map((id) => byId.get(id)).filter((a) => a && a.kind === "video" && a.status !== "missing");
}
function seqSelection(){ return seqCandidates(state.selectedIds); }
function openSequence(list){
  if (!list || list.length < 2){ flash("Sequence: select 2 or more videos"); return; }
  if (light) closeLight();
  toggleLight(list[0]);
  if (!light) return;
  light.seq = { list, i: 0, durs: list.map((a) => Number(a.duration) || 0), loop: false, buf: null, pendT: null, pendPlay: null, marks: list.map(() => []) };
  list.forEach((a, k) => { if (k) seqLoadMarks(k); }); // clip 0 is on screen: annotate reports its marks
  seqProbe(light.seq);
  light.el.querySelector(".seqbar").hidden = false;
  light.el.querySelector(".t").textContent = `Clip 1/${list.length} · ${list[0].name}`;
  paintSeqBar(true);
  seqPreload();
}
function endSequence(){
  if (!light?.seq) return;
  seqDropBuf();
  seqDropHold();
  light.seqStill = null;
  light.seq = null;
  light.el.querySelector(".seqbar").hidden = true;
}
// Known durations; an unknown one (not probed yet) borrows the average so the bar still splits sensibly.
// Marker times of clip k from its rows: a mark per frame with a drawing or a note's picture text on it — the
// timeline's rule (annotate.js marks()), approximated: drawings' `ctx.t` (a note mark when the drawing belongs
// to a note, `data.note`) and notes' caption frames ("t:<s>" keys). note: drawn taller.
async function seqLoadMarks(k){
  const s = light?.seq, a = s?.list[k];
  if (!a) return;
  let rows = [];
  try { rows = await api(`/api/annotations?asset_id=${encodeURIComponent(a.id)}`); } catch { return; }
  if (light?.seq !== s || s.i === k) return; // the clip on screen reports its own marks
  const out = [];
  const add = (t, note) => {
    if (!(t >= 0)) return;
    const m = out.find((x) => Math.abs(x.t - t) < 0.0015);
    if (m) m.note = m.note || note; else out.push({ t, note });
  };
  for (const r of rows || []){
    if (r.kind === "status" || r.data?.deleted) continue;
    const isNote = r.kind === "note";
    if (!isNote) add(Number(r.data?.ctx?.t), !!r.data?.note); // a drawing of a note marks a note frame
    else for (const key of Object.keys(r.data?.captions || {})) if (key.startsWith("t:")) add(Number(key.slice(2)), true);
  }
  s.marks[k] = out;
  seqRepaintSoon();
}
function seqReviewChanged(aid){
  const s = light?.seq;
  if (s) s.list.forEach((a, k) => { if (a.id === aid && k !== s.i) seqLoadMarks(k); });
}
function seqMarksFromAnnot(){
  const s = light?.seq;
  if (!s || !light.video || annot.loading()) return; // still loading: keep the fetched estimate meanwhile
  s.marks[s.i] = annot.marks();
  seqRepaintSoon();
}
let seqRepaintRaf = 0;
function seqRepaintSoon(){
  if (seqRepaintRaf) return;
  seqRepaintRaf = requestAnimationFrame(() => { seqRepaintRaf = 0; paintSeqBar(true); });
}
// Shift+, / . found no marker left in this clip: the nearest one in the clips after / before it.
function seqMarker(dir){
  const s = light?.seq;
  if (!s) return false;
  // The last jump has not landed, or this clip's marks are not loaded yet: stay rather than skip over them.
  if (s.pendT != null || annot.loading()) return true;
  for (let k = s.i + dir; k >= 0 && k < s.list.length; k += dir){
    const ts = (s.marks[k] || []).map((m) => m.t).filter((t) => !(s.durs[k] > 0) || t <= s.durs[k]).sort((x, y) => x - y);
    if (!ts.length) continue;
    seqGo(k, (dir > 0 ? ts[0] : ts[ts.length - 1]) + 0.001, false);
    return true;
  }
  return false;
}
// Which clips the browser cannot play, found up front (the server has no such check: POST /api/video/transcode
// converts any file without a copy, so it is asked only for these). A conversion takes about the clip's length,
// so the next clips' start early (seqConvertAhead); a clip reached before its copy is ready waits on
// "Converting…" through the player's own fallback (watchPlayable, which joins the same job). The clip on screen
// is the player's.
function seqProbePlayable(src){
  return new Promise((res) => {
    const v = document.createElement("video");
    v.muted = true; v.preload = "metadata";
    let done = false;
    const end = (ok) => { if (done) return; done = true; v.removeAttribute("src"); try { v.load(); } catch {} res(ok); };
    v.addEventListener("loadedmetadata", () => end(!!v.videoWidth));
    v.addEventListener("error", () => end(false));
    setTimeout(() => end(true), 8000); // no answer: leave it to the player
    v.src = src;
  });
}
async function seqProbe(s){
  s.unplayable = new Set();
  s.converted = new Set();
  const i0 = s.i;
  for (let d = 1; d < s.list.length; d++){
    if (light?.seq !== s) return;
    const k = (i0 + d) % s.list.length; // the clips ahead first: their conversions start soonest
    if (k === s.i) continue;
    if (await seqProbePlayable(`/api/file/${s.list[k].id}`)) continue;
    if (light?.seq !== s) return;
    s.unplayable.add(k);
    seqConvertAhead(s);
  }
}
// One conversion at a time, and only for the next two clips: the server encodes one job at a time, so a queue
// of every clip would hold back the clip the user jumps to, and keep the CPU busy after the sequence is closed.
async function seqConvertAhead(s){
  if (!s?.unplayable || s.converting || light?.seq !== s) return;
  const n = s.list.length;
  let k = -1;
  for (const d of [1, 2]){
    const j = s.i + d;
    const c = j < n ? j : s.loop ? j % n : -1;
    if (c >= 0 && c !== s.i && s.unplayable.has(c) && !s.converted.has(c)){ k = c; break; }
  }
  if (k < 0) return;
  s.converting = true;
  const res = await convertForPlayback(s.list[k].id, null, () => light?.seq === s);
  s.converting = false;
  s.converted.add(k);
  if (light?.seq !== s) return;
  // A preload of this clip made before the copy existed failed: load it again (now from the copy).
  if (res.ok && s.buf?.k === k && s.buf.bad){ seqDropBuf(); seqPreload(); }
  seqConvertAhead(s);

function seqDurs(){
  const d = light.seq.durs, known = d.filter((x) => x > 0);
  const avg = known.length ? known.reduce((s, x) => s + x, 0) / known.length : 10;
  return d.map((x) => (x > 0 ? x : avg));
}
function seqSetDur(k, d){
  const s = light?.seq;
  if (!s || !(d > 0) || !Number.isFinite(d) || Math.abs((s.durs[k] || 0) - d) < 0.005) return;
  s.durs[k] = d;
  paintSeqBar(true);
}
function seqLocate(T){
  const d = seqDurs();
  let acc = 0;
  for (let k = 0; k < d.length; k++){
    // Never exactly at the end: a seek there fires "ended".
    if (T < acc + d[k] || k === d.length - 1) return { k, t: Math.max(0, Math.min(d[k] - 0.001, T - acc)) };
    acc += d[k];
  }
  return { k: 0, t: 0 };
}
function paintSeqBar(segs){
  const s = light?.seq;
  if (!s) return;
  const bar = light.el.querySelector(".seqbar");
  const d = seqDurs(), total = d.reduce((a, x) => a + x, 0) || 1;
  if (segs){
    bar.querySelector(".seq-segs").innerHTML = s.list.map((a, k) =>
      `<div class="seq-seg${k === s.i ? " cur" : ""}" style="width:${(d[k] / total * 100).toFixed(4)}%" title="${esc(`${k + 1}. ${a.name}`)}">${esc(a.name)}</div>`).join("");
    bar.querySelector("[data-seq=loop]").classList.toggle("on", s.loop);
    let acc = 0, mk = "";
    s.list.forEach((a, k) => {
      for (const m of s.marks?.[k] || []) if (m.t <= d[k]) mk += `<i class="seq-mk${m.note ? " note" : ""}" style="left:${((acc + m.t) / total * 100).toFixed(4)}%"></i>`;
      acc += d[k];
    });
    bar.querySelector(".seq-marks").innerHTML = mk;
  }
  const el = light.video;
  const cur = light.scrubT != null ? light.scrubT : (el ? el.currentTime || 0 : 0);
  const T = d.slice(0, s.i).reduce((a, x) => a + x, 0) + Math.min(cur, d[s.i]);
  bar.querySelector(".seq-head").style.left = (T / total * 100) + "%";
  bar.querySelector("[data-gt]").textContent = `${fmtTime(T)} / ${fmtTime(total)}`;
}
// Open clip k at local time t (t < 0: that far before its end), playing or paused. Not seamless: the
// cut by playback goes through seqAdvance, which adopts the preloaded clip instead.
// Export → "…, all clips": the review of every clip in the sequence that has notes. The PDF and the ZIP are one
// file each (the server joins the clips' reports); the web page and the .srev are per file by design (FORMAT.md),
// so they come one per clip. The pictures need each clip on screen (annotate.js gatherReport seeks and draws it):
// the clips are visited one by one, then the sequence goes back to where it was.
let seqExporting = false;
// A toast written as HTML (annotate.js) for a plain-text toast.
function htmlToText(t){
  return String(t).replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
}
function reviewerName(){ try { return localStorage.getItem("sight.reviewer") || ""; } catch { return ""; } }
async function seqWaitClip(s, k, ms){
  const a = s.list[k], t0 = Date.now();
  const ok = () => light?.seq === s && s.i === k && s.pendT == null && light.video?.videoWidth > 0
    && annot.assetId() === a.id && annot.ready();
  while (!ok()){
    if (light?.seq !== s || Date.now() - t0 > ms) return false;
    await new Promise((r) => setTimeout(r, 60));
  }
  // The frame rate titles the pictures ("f 52"): give its probe a moment.
  const t1 = Date.now();
  while (!annot.fpsKnown() && Date.now() - t1 < 3000) await new Promise((r) => setTimeout(r, 60));
  return true;
}
async function seqExportAll(kind){
  const s = light?.seq;
  if (!s) return;
  // The lightbox's toast (HTML); once the lightbox is gone, the page's own (plain text).
  const say = (t, ms) => { if (light) annot.toast(t, ms); else flash(htmlToText(t), ms); };
  if (seqExporting || annot.busy()){ say("An export is already running", 2500); return; }
  seqExporting = true;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  let back = null, moved = false;
  try {
    await annot.flush();
    if (kind === "pkg"){   // one bundle, straight from the stored rows; the server picks the clips (notes or tombstones)
      say("Saving the review file…", 60000);
      const r = await api("/api/review/export/package-all", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ asset_ids: s.list.map((a) => a.id), author: reviewerName(), reveal: true }) });
      say(r?.clips ? `Saved <b>${esc(r.name || "")}</b> · ${plural(r.clips, "clip")}` : "No clip in the sequence has notes", r?.clips ? 4500 : 2500);
      return;
    }
    say("Looking for clips with notes…", 60000);
    const has = await Promise.all(s.list.map((a) => api(`/api/annotations?asset_id=${encodeURIComponent(a.id)}`)
      .then((rows) => (rows || []).some((r) => r.kind === "note" && !r.data?.deleted)).catch(() => false)));
    if (light?.seq !== s) throw new Error("the sequence was closed");
    // Where to come back to: taken now (a playing clip may have moved on during the scan).
    back = { k: s.i, t: light.video?.currentTime || 0, play: !!light.video && !light.video.paused };
    const ks = s.list.map((_, k) => k).filter((k) => has[k]);
    if (!ks.length){ say("No clip in the sequence has notes", 2500); return; }
    const post = (url, body) => api(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    light.video?.pause();
    const reports = [], skipped = [];
    for (const [j, k] of ks.entries()){
      if (light?.seq !== s) throw new Error("the sequence was closed");
      say(`Clip ${j + 1} of ${ks.length}: ${esc(s.list[k].name)}…`, 120000);
      if (s.i !== k || !light.video){ moved = true; seqGo(k, 0, false); }
      if (!(await seqWaitClip(s, k, 45000))){ skipped.push(s.list[k].name); continue; }
      const rep = await annot.report(kind);
      if (light?.seq !== s) throw new Error("the sequence was closed");
      // Another clip came on screen meanwhile (a click on the sequence bar, a frame step across a cut): its pictures
      // would sit under this clip's notes — leave the clip out rather than mix them.
      if (s.i !== k || annot.assetId() !== s.list[k].id || rep?.asset_id !== s.list[k].id){ skipped.push(s.list[k].name); continue; }
      reports.push(rep);
    }
    let msg = "";
    if (reports.length){
      say({ html: "Building the web page…", pdf: "Building the PDF…" }[kind] || "Building the ZIP…", 120000);
      // One web page for all the clips (multi-clip page; one clip → a plain one-clip page).
